rencias/passo-2.webp","semPrint":false},{"titulo":"Para quem","texto":"Escolhe se é pra um funcionário, um fornecedor ou outros, como a imobiliária ou a companhia de energia.","dica":"","atencao":"","img":"img-web/recorrencias/passo-3.webp","semPrint":false},{"titulo":"Valor e dia do vencimento","texto":"Coloca o valor por mês e o dia que vence. O quadro azul mostra quantas contas vão ser lançadas.","dica":"","atencao":"","img":"img-web/recorrencias/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Criar e lançar\"","texto":"Agora é só clicar em Criar e lançar. Pronto: o sistema já deixa as contas dos próximos meses lançadas.","dica":"","atencao":"","img":"img-web/recorrencias/passo-5.webp","semPrint":false},{"titulo":"A recorrência está na lista","texto":"Pronto, o aluguel já está na lista, com o dia e a próxima conta. Do lado tem: Ver contas, Alterar, que vale de hoje pra frente sem mexer no que já foi pago, e Encerrar, quando parar de pagar.","dica":"","atencao":"","img":"img-web/recorrencias/passo-6.webp","semPrint":false},{"titulo":"Recebe todo mês? A receber","texto":"Agora uma que eu recebo. Clica em A receber e dá o nome, aqui Mensalidade de manutenção. Se o plano de contas não vier sozinho, clica nele e escolhe, aqui Serviços.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Cliente, valor e dia","texto":"Em Para quem, busca o cliente. Coloca o valor por mês e o dia que vence, e clica em Criar e lançar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"As mensalidades no Contas a receber","texto":"E no Contas a receber as mensalidades já estão lançadas, uma por mês, com a etiqueta Recorrência. Quando a cliente pagar, é só dar baixa no caixa.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"As contas já estão lançadas","texto":"E em Contas a Pagar, o aluguel também: uma conta pra cada mês, com o vencimento certinho. Quando pagar, é só clicar em Pagar.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"central-de-cobranca","grupo":"Financeiro","titulo":"Cobrar clientes atrasados (Central de cobrança)","resumo":"Veja quem está devendo, anote a conversa com o cliente e mande cobrança pelo WhatsApp para vários de uma vez.","antes":"Ter contas a receber vencidas. Na Demonstração, a Joana Exemplo tem um parcelado com a primeira parcela vencida (vídeo Contas a receber).","destaque":false,"video":"videos-web/central-de-cobranca.mp4","capa":"videos-web/central-de-cobranca.jpg","passos":[{"titulo":"Abra a Central de cobrança","texto":"No menu, clica em Financeiro, Cobrança, Central de cobrança. Lá em cima aparece o total vencido e quantos clientes estão atrasados.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-1.webp","semPrint":false},{"titulo":"Faixas de atraso","texto":"Embaixo vêm as faixas: a vencer, de um a quinze dias, de dezesseis a trinta, e assim por diante. Clicou numa faixa, aparecem só esses clientes.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-2.webp","semPrint":false},{"titulo":"Busque o cliente","texto":"Pra achar alguém, é só digitar o nome aqui. Na linha do cliente aparece quanto ele deve e há quantos dias. O botão verde manda a cobrança no WhatsApp com as parcelas.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-3.webp","semPrint":false},{"titulo":"A ficha do cliente","texto":"Clicando em Ver, abre a ficha: as parcelas em aberto, com o valor do dia já com juros. Daqui dá pra marcar as parcelas e clicar em Cobrar agora.","dica":"Com o Pix do banco ligado, aparece também \"Gerar Pix (QR)\": o cliente paga e a conta baixa sozinha.","atencao":"","img":"img-web/central-de-cobranca/passo-4.webp","semPrint":false},{"titulo":"Anote o que o cliente falou","texto":"Falou com o cliente? Na Anotação, escolhe Prometeu pagar, coloca a data que ele prometeu e escreve o que ele disse. Assim você não cobra de novo antes da hora.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Salve a anotação","texto":"Clica em Salvar anotação.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Filtre quem prometeu pagar","texto":"Na lista, a Joana já aparece com Prometeu pagar e a data. E no filtro de situação dá pra ver só quem prometeu, quem está negociando ou quem nunca foi cobrado.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Cobrar vários de uma vez","texto":"Pra cobrar vários de uma vez, marca os clientes, ou Marcar todos aqui em cima, e clica em Enviar cobrança. Confere a mensagem, deixa o link de pagamento marcado, e envia. O cliente paga pelo link e a conta baixa sozinha.","dica":"","atencao":"Cliente sem WhatsApp no cadastro fica de fora do envio. Clique em \"Cadastrar\" embaixo do nome para colocar o número.","img":"","semPrint":false}]},{"id":"cashback","grupo":"Financeiro","titulo":"Cashback: parte da compra volta para o cliente","resumo":"Parte de cada compra paga volta para o cliente como haver, para usar na próxima compra.","antes":"","destaque":false,"video":"videos-web/cashback.mp4","capa":"","passos":[{"titulo":"Abra o Cashback","texto":"No menu, clica em Clientes, Cashback. Aqui em cima você vê se ele está ligado ou desligado.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Monte a regra","texto":"Primeiro a regra: quanto volta, aqui cinco por cento. A compra mínima, o máximo por venda e em quantos dias o cliente pode usar. Embaixo ele já mostra um exemplo da conta.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Salve a regra","texto":"Clica em Salvar regra.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Ligue o cashback","texto":"Agora clica em Ligar cashback. Pronto: a partir de agora, toda venda paga, com cliente, já gera o cashback dele.","dica":"","atencao":"Só contam as vendas feitas depois de ligar. Troca, devolução e o que foi pago com haver não contam.","img":"","semPrint":false},{"titulo":"Está ligado","texto":"Olha aqui em cima: Ligado, cinco por cento.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A mensagem do WhatsApp","texto":"Do lado fica a mensagem que o cliente recebe contando quanto ganhou e até quando pode usar. Dá pra mudar o texto do seu jeito.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Confira as vendas","texto":"O sistema confere as vendas sozinho a cada quinze minutos. Se quiser na hora, clica em Conferir vendas agora.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Quem tem cashback","texto":"Embaixo aparece quanto foi gerado, quanto está disponível e quanto já foi usado, e a lista de cada cliente. Pra avisar todo mundo de uma vez, é o botão Avisar no WhatsApp. E na hora da venda, o caixa já mostra o cashback do cliente como haver.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"contas-e-caixas","grupo":"Financeiro","titulo":"Saldo das contas e conferência dos caixas","resumo":"Veja o saldo de cada banco e caixa, transfira entre contas e confira os caixas fechados.","antes":"Para conferir caixa, ter um caixa fechado e a conferência ligada em Configurações › PDV › Fechamento de caixa.","destaque":false,"video":"videos-web/contas-e-caixas.mp4","capa":"videos-web/contas-e-caixas.jpg","passos":[{"titulo":"Saldo de cada conta","texto":"No menu, clica em Financeiro, Banco e organização, Contas. Cada cartão é uma conta, banco, cofre, com o saldo, as entradas e as saídas do período.","dica":"","atencao":"","img":"img-web/contas-e-caixas/passo-1.webp","semPrint":false},{"titulo":"Movimentar: transferir ou ajustar","texto":"Clica em Movimentar. Aqui tem três jeitos: Transferir, de uma conta pra outra, Ajustar mais, e Ajustar menos, pra corrigir o saldo. Vamos transferir.","dica":"","atencao":"","img":"img-web/contas-e-caixas/passo-2.webp","semPrint":false},{"titulo":"De onde, para onde e quanto","texto":"Escolhe a conta de origem, a de destino e o valor, aqui duzentos reais. Coloca o motivo, Depósito, e uma observação.","dica":"","atencao":"","img":"img-web/contas-e-caixas/passo-3.webp","semPrint":false},{"titulo":"Confirme","texto":"Clica em Confirmar. A transferência fica no extrato das duas contas e não entra no DRE, porque o dinheiro só mudou de lugar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O movimento no extrato","texto":"Clicando em Ver detalhes da conta, aparece cada movimento, com a entrada, a saída e o saldo. Olha a transferência aqui.","dica":"Lançou errado? Clique no olhinho do movimento e em \"Estornar movimentação\".","atencao":"","img":"","semPrint":false},{"titulo":"Caixas a conferir","texto":"Agora os caixas. No menu, clica em Financeiro, Caixas e conferência. Tem os abertos, os que faltam conferir e os fechados. Clica em A conferir e depois no caixa.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Confira forma por forma","texto":"Aparece, pra cada forma de pagamento, o que o sistema esperava e o que o caixa contou. Se um Pix foi lançado como dinheiro, clica em Ajustar, coloca o valor certo e o motivo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Marque como conferido","texto":"Bateu tudo? Clica em Conferido. Fica gravado quem conferiu e quando.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Caixa conferido","texto":"E nos Fechados o caixa já aparece com Conferido, e embaixo tem as diferenças de cada operador no período.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"boletos-remessa-retorno","grupo":"Financeiro","titulo":"Boletos: remessa e retorno do banco","resumo":"Gere o arquivo de remessa para o banco e leia o retorno para baixar os boletos pagos.","antes":"Só para bancos \"por arquivo\". Ative antes em Configurações › Boletos.","destaque":false,"video":"videos-web/boletos-remessa-retorno.mp4","capa":"videos-web/boletos-remessa-retorno.jpg","passos":[{"titulo":"Gere a remessa","texto":"Em Financeiro › Boletos (remessa e retorno), clique em \"Gerar remessa\" e envie o arquivo no internet banking da empresa.","dica":"","atencao":"","img":"img-web/boletos-remessa-retorno/passo-1.webp","semPrint":false},{"titulo":"Leia o retorno","texto":"Baixe o arquivo de retorno no banco e clique em \"Ler retorno do banco\". Confira a lista (pagos, confirmados, rejeitados) e clique em \"Confirmar e dar baixa\".","dica":"","atencao":"Nada é gravado antes de você confirmar. Confira os pagos antes.","img":"img-web/boletos-remessa-retorno/passo-2.webp","semPrint":false}]},{"id":"conciliacao-bancaria","grupo":"Financeiro","titulo":"Conciliação bancária (extrato × sistema)","resumo":"Confira se o extrato do banco bate com o que foi lançado no sistema.","antes":"A conta do banco precisa estar cadastrada em Financeiro › Contas, com o saldo inicial conferido.","destaque":false,"video":"videos-web/conciliacao-bancaria.mp4","capa":"videos-web/conciliacao-bancaria.jpg","passos":[{"titulo":"Escolha a conta","texto":"No menu, clica em Financeiro, Banco e organização, Conciliação bancária. Em cima ficam as suas contas: clica na conta do banco que você quer conferir.","dica":"","atencao":"","img":"img-web/conciliacao-bancaria/passo-1.webp","semPrint":false},{"titulo":"Saldo do banco × saldo do sistema","texto":"Aqui aparecem três cartões: o saldo no banco, o saldo no sistema, e a Diferença. Quando os dois ficam iguais, a diferença mostra Bateu.","dica":"","atencao":"","img":"img-web/conciliacao-bancaria/passo-2.webp","semPrint":false},{"titulo":"Envie o extrato","texto":"Clica em Enviar extrato e escolhe o arquivo do banco: pode ser OFX, CSV, PDF, ou até a foto do extrato. Se a conta é Sicoob ligada ao sistema, aparece o botão Puxar do Sicoob, e ele busca sozinho.","dica":"","atencao":"O botão abre a escolha de arquivo do seu computador: baixe o extrato no site ou app do banco antes.","img":"img-web/conciliacao-bancaria/passo-3.webp","semPrint":false},{"titulo":"Confirme o que é igual","texto":"O sistema junta sozinho o que é igual nos dois lados. Em Confirme, ele sugere: é esse lançamento? Clica em Confirmar, ou em Não é.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O que só está no banco","texto":"Em Só no banco ficam as coisas que caíram no banco e não estão no sistema, como uma tarifa. Clica em Lançar, escolhe o plano de contas, e pronto. Ou em Ignorar, se não precisa lançar.","dica":"O que você confirmou fica em \"🟢 Conferidos\". Fechou o mês e bateu? Use \"Fechar\" no quadro do contador.","atencao":"","img":"","semPrint":false},{"titulo":"Maquininhas: caiu certo?","texto":"E clicando em Cartões, você vê por dia quanto a maquininha devia depositar, já sem a taxa, e quanto caiu de verdade no banco.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"funcionarios-salario","grupo":"Funcionários","titulo":"Funcionários: cadastrar salário e bonificação","resumo":"Marque quem é funcionário, coloque salário, dia de pagamento e bonificação: o sistema lança tudo no Contas a pagar.","antes":"","destaque":false,"video":"videos-web/funcionarios-salario.mp4","capa":"videos-web/funcionarios-salario.jpg","passos":[{"titulo":"Abra Usuários e edite o funcionário","texto":"Vai em Cadastros, Usuários, e clica no lápis de editar do funcionário. Aqui eu vou usar a Mayara.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-1.webp","semPrint":false},{"titulo":"Aba \"💼 Funcionário\"","texto":"Clica na aba Funcionário e marca: É funcionário. Pronto, ele já aparece no menu Funcionários.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-2.webp","semPrint":false},{"titulo":"Salário e dia de pagamento","texto":"Coloca o salário da carteira, o valor bruto, e o dia de pagamento. Se deixar o dia em branco, vale o padrão da empresa, que é dia cinco.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-3.webp","semPrint":false},{"titulo":"Desconto de INSS","texto":"Logo abaixo vem o desconto de INSS: no automático ele segue a tabela oficial, mas dá pra pôr um percentual, um valor fixo ou não descontar. O que for descontado vira a guia do INSS no Contas a pagar.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-4.webp","semPrint":false},{"titulo":"Como recebe a comissão","texto":"E aqui você escolhe como recebe a comissão: se ela soma no salário, ou se o salário é o mínimo garantido e a comissão só entra no que passar dele.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-5.webp","semPrint":false},{"titulo":"Bonificação do mês","texto":"Na bonificação você escolhe: o padrão da empresa, um valor só dele, ou não tem. A bonificação cai conforme as advertências do mês.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-6.webp","semPrint":false},{"titulo":"Salve: vira conta a pagar todo mês","texto":"Clica em Salvar, lá embaixo. O salário e a bonificação viram conta no Contas a pagar, sempre doze meses pra frente, e entram no DRE do mês em que vencem. Mudou o valor ou o dia? Vale só daqui pra frente; o que já foi pago não muda.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-7.webp","semPrint":false},{"titulo":"O padrão da empresa","texto":"E em Funcionários, Configurações, fica o padrão da empresa: o dia de pagamento e as regras da bonificação. Só o administrador mexe aqui.","dica":"","atencao":"","img":"img-web/funcionarios-salario/passo-8.webp","semPrint":false}]},{"id":"funcionarios-vale-acerto","grupo":"Funcionários","titulo":"Funcionários: lançar vale e fazer o acerto do mês","resumo":"Lance os vales do mês, veja quanto falta pagar e faça o acerto com recibo.","antes":"","destaque":false,"video":"videos-web/funcionarios-vale-acerto.mp4","capa":"videos-web/funcionarios-vale-acerto.jpg","passos":[{"titulo":"O Painel dos funcionários","texto":"Em Funcionários, o Painel já abre no próximo pagamento. Aqui em cima mostra o total do mês, o que já foi pago, os vales e o que falta pagar.","dica":"","atencao":"","img":"img-web/funcionarios-vale-acerto/passo-1.webp","semPrint":false},{"titulo":"O cartão de cada funcionário","texto":"Cada funcionário tem um cartão: salário, mais bonificação, mais comissão, menos os vales. Embaixo aparece quanto falta pagar pra ele.","dica":"","atencao":"","img":"img-web/funcionarios-vale-acerto/passo-2.webp","semPrint":false},{"titulo":"Lance o vale","texto":"Clica em Lançar vale, coloca o valor, a forma e de qual conta saiu o dinheiro. O sistema mostra como vai abater: primeiro do salário, depois da bonificação e depois da comissão.","dica":"","atencao":"","img":"img-web/funcionarios-vale-acerto/passo-3.webp","semPrint":false},{"titulo":"Fazer o acerto","texto":"No dia do pagamento, clica em Fazer o acerto: ele já vem com o valor que falta, e é só clicar em Pagar. É a mesma baixa do Contas a pagar: sai do caixa no dia e aparece no Fluxo de caixa.","dica":"","atencao":"","img":"img-web/funcionarios-vale-acerto/passo-4.webp","semPrint":false},{"titulo":"Recibo","texto":"Em Ver tudo e recibo aparece cada conta do mês e a linha do tempo, com vales, pagamentos e advertências. Dá pra imprimir o recibo, mandar um link pro funcionário assinar pelo celular, ou mandar no WhatsApp dele com o recibo pra assinar.","dica":"","atencao":"","img":"img-web/funcionarios-vale-acerto/passo-5.webp","semPrint":false},{"titulo":"Tela de Pagamentos","texto":"E em Funcionários, Pagamentos, você filtra por funcionário, tipo e situação, vê os totais e a lista dos vales. Ainda dá pra exportar pro Excel.","dica":"","atencao":"","img":"img-web/funcionarios-vale-acerto/passo-6.webp","semPrint":false}]},{"id":"funcionarios-comissao","grupo":"Funcionários","titulo":"Funcionários: comissão automática","resumo":"Coloque a comissão no cadastro do funcionário: ela soma sozinha pelas vendas e OS e cai no Contas a pagar.","antes":"","destaque":false,"video":"videos-web/funcionarios-comissao.mp4","capa":"videos-web/funcionarios-comissao.jpg","passos":[{"titulo":"Abra o cadastro do funcionário","texto":"No menu, clica em Cadastros, Pessoas, Usuários. Busca o funcionário e clica no lápis de editar. Aqui eu vou usar a Mayara.","dica":"","atencao":"","img":"img-web/funcionarios-comissao/passo-1.webp","semPrint":false},{"titulo":"Aba Funcionário: Comissão dele","texto":"Clica na aba Funcionário e desce até Comissão dele. Primeiro escolhe como ele recebe: Salário mais comissão, ou o Salário é o mínimo, e a comissão só entra no que passar do salário.","dica":"","atencao":"","img":"img-web/funcionarios-comissao/passo-2.webp","semPrint":false},{"titulo":"Quando a comissão conta","texto":"Depois, quando a comissão conta: quando vende, quando a OS é entregue, ou só quando o cliente paga. Aqui eu deixei Quando vende.","dica":"","atencao":"","img":"img-web/funcionarios-comissao/passo-3.webp","semPrint":false},{"titulo":"A porcentagem","texto":"Agora a porcentagem: sobre os serviços, aqui dez por cento, e sobre os produtos, três por cento. Se quiser, coloca uma meta: passou de tanto, ganha mais.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Só ganha se bater a meta","texto":"E tem a opção: Só ganha comissão se bater a meta. Marcou, quem não bater a meta do mês recebe só o salário.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Salve","texto":"Clica em Salvar. Pronto, a comissão dele já está valendo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Comissão do mês até agora","texto":"Agora no menu, Funcionários, Painel. No cartão de cada um, esse quadro verde é a comissão do mês até agora. Ela soma sozinha pelas vendas e pelas ordens de serviço.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Fecha sozinha no fim do mês","texto":"No fim do mês ela fecha sozinha e cai no Contas a pagar, no plano Comissões, vencendo no dia do pagamento. Se uma venda for cancelada depois, vira um ajuste no mês seguinte.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"funcionarios-advertencias","grupo":"Funcionários","titulo":"Funcionários: advertências e faltas","resumo":"Registre advertências e faltas: a bonificação do mês cai sozinha, direto no Contas a pagar.","antes":"","destaque":false,"video":"videos-web/funcionarios-advertencias.mp4","capa":"videos-web/funcionarios-advertencias.jpg","passos":[{"titulo":"Advertências e faltas","texto":"Em Funcionários, Advertências, cada cartão mostra as bolinhas das advertências do mês e quanto a bonificação já caiu.","dica":"","atencao":"","img":"img-web/funcionarios-advertencias/passo-1.webp","semPrint":false},{"titulo":"Lance a advertência","texto":"Clica em Nova advertência ou falta, escolhe o funcionário, o tipo, como atraso, uso de celular ou falta, a data e escreve o que aconteceu. Aí é só clicar em Lançar.","dica":"","atencao":"","img":"img-web/funcionarios-advertencias/passo-2.webp","semPrint":false},{"titulo":"A bonificação cai sozinha","texto":"No padrão é assim: até uma advertência, quatrocentos reais; com duas, trezentos; três, duzentos; quatro, cem; cinco ou mais, zera. Falta sem atestado também zera. A advertência de novembro desconta na bonificação paga em dezembro, direto no Contas a pagar.","dica":"","atencao":"","img":"img-web/funcionarios-advertencias/passo-3.webp","semPrint":false},{"titulo":"Imprimir, WhatsApp e ciente","texto":"Dá pra imprimir pro funcionário assinar, mandar no WhatsApp e marcar que ele ficou ciente. Advertência não se apaga: só o administrador cancela, dizendo o motivo.","dica":"","atencao":"","img":"img-web/funcionarios-advertencias/passo-4.webp","semPrint":false},{"titulo":"As regras são suas","texto":"Em Configurações você muda as regras: a tabela da bonificação, a falta, o limite e os tipos de advertência com o peso de cada um. Só o administrador mexe aqui.","dica":"","atencao":"","img":"img-web/funcionarios-advertencias/passo-5.webp","semPrint":false}]},{"id":"funcionarios-relatorios-13-ferias","grupo":"Funcionários","titulo":"Funcionários: relatórios, 13º e férias","resumo":"Veja quanto a equipe custa mês a mês e lance o 13º e as férias com a conta pronta.","antes":"","destaque":false,"video":"videos-web/funcionarios-relatorios-13-ferias.mp4","capa":"videos-web/funcionarios-relatorios-13-ferias.jpg","passos":[{"titulo":"Relatórios dos funcionários","texto":"Em Funcionários, Relatórios, os gráficos mostram o custo da equipe mês a mês, por funcionário, e as advertências de cada mês.","dica":"","atencao":"","img":"img-web/funcionarios-relatorios-13-ferias/passo-1.webp","semPrint":false},{"titulo":"Conferência com o DRE","texto":"E tem a conferência com o DRE: o que está aqui bate certinho com o DRE, porque é tudo a mesma conta do Contas a pagar.","dica":"","atencao":"","img":"img-web/funcionarios-relatorios-13-ferias/passo-2.webp","semPrint":false},{"titulo":"13º salário","texto":"No Painel, perto da busca, o botão Lançar décimo terceiro salário já traz a sugestão das duas parcelas: dia trinta de novembro e dia vinte de dezembro. Dá pra mudar o valor antes de lançar no Contas a pagar.","dica":"","atencao":"","img":"img-web/funcionarios-relatorios-13-ferias/passo-3.webp","semPrint":false},{"titulo":"Férias","texto":"E no cartão do funcionário tem Lançar férias: você coloca o início e os dias, e o valor já vem calculado, salário mais um terço, vencendo dois dias antes das férias.","dica":"","atencao":"","img":"img-web/funcionarios-relatorios-13-ferias/passo-4.webp","semPrint":false}]},{"id":"emitir-nota","grupo":"Fiscal","titulo":"Emitir nota fiscal (NFC-e e NF-e)","resumo":"Os 3 jeitos de emitir a nota: no fim da venda no PDV, depois pelo F4 do PDV, ou em Vendas.","antes":"A empresa precisa estar com o fiscal configurado (certificado digital) e os produtos com NCM.","destaque":false,"video":"videos-web/emitir-nota.mp4","capa":"videos-web/emitir-nota.jpg","passos":[{"titulo":"Abra o PDV","texto":"No menu, clica em Comercial, PDV. Vou fazer uma venda com nota. Clica em Nova venda.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente (F10)","texto":"Aperta F10 e escolhe o cliente. Pra nota fiscal, o cadastro dele tem que estar completo, com CPF e endereço.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-2.webp","semPrint":false},{"titulo":"Lance o produto","texto":"Bipa o produto, ou digita o código e aperta Enter.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-3.webp","semPrint":false},{"titulo":"Receba (F9)","texto":"Aperta F9, escolhe a forma de pagamento e confirma.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-4.webp","semPrint":false},{"titulo":"Escolha a nota: 1, 2 ou 3","texto":"Agora ele pergunta o documento. Um, cupom fiscal, a NFC-e. Dois, nota fiscal, a NF-e. Ou três, venda sem nota. Apertou um ou dois, a nota é emitida na hora. Aqui eu vou apertar três, pra te mostrar como emitir depois.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-5.webp","semPrint":false},{"titulo":"Emitir depois: F4 no PDV","texto":"Ficou sem nota, ou a nota não foi? No próprio PDV, aperta F4, Vendas, e procura a venda. Na linha dela, clica em NFC-e ou em NF-e, e em alguns segundos a nota é autorizada.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-6.webp","semPrint":false},{"titulo":"Ou em Vendas","texto":"E dá também fora do caixa, em Comercial, Vendas. Na linha da venda tem os botões NF-e e NFC-e.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-7.webp","semPrint":false},{"titulo":"Clique e continue","texto":"Clicou, aparece a venda: é só clicar em Continuar emissão e pronto.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-8.webp","semPrint":false},{"titulo":"Notas emitidas","texto":"As notas autorizadas ficam em Fiscal, Notas emitidas: lá você imprime, baixa o XML ou manda pro cliente. E se der algum erro, a nota vai pra Corrigir pendências.","dica":"","atencao":"Nota emitida vale para a Receita. Confira o cliente e os valores antes de continuar.","img":"img-web/emitir-nota/passo-9.webp","semPrint":false}]},{"id":"corrigir-pendencias","grupo":"Fiscal","titulo":"Corrigir nota com erro (rejeitada)","resumo":"A nota voltou com erro? Veja o motivo, corrija e transmita de novo.","antes":"","destaque":false,"video":"videos-web/corrigir-pendencias.mp4","capa":"videos-web/corrigir-pendencias.jpg","passos":[{"titulo":"Abra \"Corrigir pendências\"","texto":"No menu, clique em Fiscal › Corrigir pendências. Cada cartão é uma venda cuja nota não foi autorizada.","dica":"","atencao":"","img":"img-web/corrigir-pendencias/passo-1.webp","semPrint":false},{"titulo":"Leia o motivo do erro","texto":"Clique em \"Detalhes da pendência\" para ver o que a Receita (SEFAZ) recusou. Normalmente é um dado do cliente ou do produto (CPF, endereço, NCM).","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Corrija o cadastro","texto":"Clique no botão de cadastro do cartão (por exemplo \"Conferir cadastro\") e arrume o dado que estava errado.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Clique em \"Corrigir e transmitir novamente\"","texto":"Depois de corrigir, clique em \"Corrigir e transmitir novamente\". Escolha se é cupom (NFC-e) ou nota (NF-e) e clique em \"Emitir nota\".","dica":"Use \"Conferir dados sem emitir\" para checar se ainda tem algum erro antes de enviar.","atencao":"","img":"","semPrint":true}]},{"id":"arquivos-contador","grupo":"Fiscal","titulo":"Mandar os arquivos do mês para o contador","resumo":"Baixe o pacote com todos os XMLs do mês ou envie o acesso ao contador.","antes":"","destaque":false,"video":"videos-web/arquivos-contador.mp4","capa":"videos-web/arquivos-contador.jpg","passos":[{"titulo":"Abra \"Arquivos para contador\"","texto":"No menu, clique em Fiscal › Arquivos para contador.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-1.webp","semPrint":false},{"titulo":"Escolha o mês","texto":"Clique em \"Mês passado\" (o mais comum: o contador fecha o mês anterior) ou escolha as datas em Início e Fim.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-2.webp","semPrint":false},{"titulo":"Baixe o pacote ZIP","texto":"Confira os totais e clique em \"Baixar pacote contábil ZIP\". Depois é só mandar esse arquivo para o contador.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-3.webp","semPrint":false},{"titulo":"Ou envie o acesso pelo WhatsApp","texto":"Prefere que o contador baixe sozinho? Clique em \"Enviar acesso ao contador pelo WhatsApp\". Ele entra no Portal do Contador e pega os arquivos.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-4.webp","semPrint":false}]},{"id":"inutilizar-numeros","grupo":"Fiscal","titulo":"Inutilizar números de nota","resumo":"Avise a SEFAZ que um número de NF-e ou NFC-e com erro (ou pulado) não será usado.","antes":"Só o administrador da empresa pode inutilizar. Na dúvida, fale com o contador.","destaque":false,"video":"videos-web/inutilizar-numeros.mp4","capa":"videos-web/inutilizar-numeros.jpg","passos":[{"titulo":"Escreva o motivo","texto":"Em Fiscal › Inutilizar números, escreva o motivo com pelo menos 15 letras (ex.: \"Nota rejeitada por erro de cadastro\").","dica":"","atencao":"","img":"img-web/inutilizar-numeros/passo-1.webp","semPrint":false},{"titulo":"Escolha as notas e inutilize","texto":"Em \"Notas e cupons com erro\", marque as notas e clique em \"Inutilizar selecionados\". Para um número que não está na lista, use \"Inutilizar outro número\" com a série e o número.","dica":"","atencao":"Número inutilizado não pode mais ser usado. Confira antes de confirmar.","img":"img-web/inutilizar-numeros/passo-2.webp","semPrint":false}]},{"id":"devolucao-fornecedor","grupo":"Fiscal","titulo":"Devolver mercadoria ao fornecedor (NF-e de devolução)","resumo":"Escolha a nota de compra, marque o que vai voltar, confira os impostos e emita a nota de devolução.","antes":"A empresa precisa estar com o fiscal configurado (certificado digital). Tenha em mãos a nota de compra (número e chave) ou o XML dela.","destaque":false,"video":"videos-web/devolucao-fornecedor.mp4","capa":"videos-web/devolucao-fornecedor.jpg","passos":[{"titulo":"Abra a Devolução ao fornecedor","texto":"No menu, clica em Fiscal, Emitir, Devolução ao fornecedor. Dá pra começar pela nota de entrada, buscando o fornecedor, o número ou a chave, ou pelo Importar XML. Aqui eu vou montar do zero, em Nova devolução.","dica":"","atencao":"","img":"img-web/devolucao-fornecedor/passo-1.webp","semPrint":false},{"titulo":"1. Fornecedor","texto":"Clicou em Nova devolução, o primeiro passo é o fornecedor: clica no campo, digita o nome e escolhe. O endereço dele já vem do cadastro.","dica":"","atencao":"","img":"img-web/devolucao-fornecedor/passo-2.webp","semPrint":false},{"titulo":"Número e chave da nota de compra","texto":"Agora o número da nota de compra e a chave de acesso, os quarenta e quatro números. Tem o XML da compra? Clica em Anexar XML original, que ele preenche tudo sozinho.","dica":"","atencao":"","img":"img-web/devolucao-fornecedor/passo-3.webp","semPrint":false},{"titulo":"2. Produtos que vão voltar","texto":"No passo dois, busca o produto que vai voltar e clica em Adicionar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Quantidade e valor","texto":"Coloca quantos vieram na nota, quantos vão voltar, aqui dois de dez, e o valor de cada um, o mesmo da nota de compra. O total da devolução aparece embaixo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"3. Conferência fiscal","texto":"No passo três, abre o produto e confere o CFOP de devolução, aqui cinco dois zero dois, de comercialização, e os impostos. Essa parte é bom conferir com o seu contador.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Marque a conferência e salve","texto":"Marca que você conferiu tudo e clica em Salvar rascunho. Fica guardado, pra emitir depois, com calma.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Conferir e emitir","texto":"Quando estiver tudo certo, clica em Conferir devolução: o sistema mostra se falta alguma coisa. Aí é só clicar em Emitir NF-e de devolução.","dica":"","atencao":"A nota de devolução vale para a Receita. Na dúvida, deixe em rascunho e confirme com o contador antes de emitir.","img":"","semPrint":false},{"titulo":"O rascunho fica na lista","texto":"Na Lista de devoluções aparece o rascunho, com o fornecedor, a nota e o total. Pra continuar depois, é no botão Abrir.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"agente-fiscal-ia","grupo":"Fiscal","titulo":"Agente Fiscal IA (tirar dúvidas fiscais)","resumo":"Pergunte sobre CFOP, NCM, impostos e NF-e, e converta o CFOP das notas de compra.","antes":"","destaque":false,"video":"videos-web/agente-fiscal-ia.mp4","capa":"videos-web/agente-fiscal-ia.jpg","passos":[{"titulo":"Converter o CFOP de entrada","texto":"Em Fiscal › Agente Fiscal IA, digite o CFOP que veio na nota do fornecedor (ex.: 5102) e escolha a finalidade. O sistema mostra o CFOP de entrada certo.","dica":"","atencao":"","img":"img-web/agente-fiscal-ia/passo-1.webp","semPrint":false},{"titulo":"Pergunte o que quiser","texto":"Escreva sua dúvida (ex.: \"Qual CFOP uso para venda para outro estado?\") e aperte Enter. A resposta mostra as fontes.","dica":"","atencao":"A IA orienta, mas confirme com o seu contador antes de aplicar.","img":"img-web/agente-fiscal-ia/passo-2.webp","semPrint":false}]},{"id":"entrada-nfe","grupo":"Estoque","titulo":"Dar entrada na nota do fornecedor (NF-e)","resumo":"As notas de compra chegam sozinhas da SEFAZ: importe, ligue ou cadastre os produtos, confira o financeiro e confirme a entrada.","antes":"Precisa do certificado digital cadastrado. Sem ele, use o botão \"Importar XML\" com o arquivo que o fornecedor mandou.","destaque":false,"video":"videos-web/entrada-nfe.mp4","capa":"videos-web/entrada-nfe.jpg","passos":[{"titulo":"Abra a Entrada de NF-e","texto":"No menu, clica em Estoque, Entrada de NF-e. Aqui aparecem as notas que os fornecedores emitiram pro CNPJ da sua loja. Pra buscar as mais novas na SEFAZ, é em Atualizar agora.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-1.webp","semPrint":false},{"titulo":"Ache a nota","texto":"Busca pelo fornecedor, CNPJ, número ou chave, ou filtra pela situação: aqui, Pronta para importar. O olhinho, Visualizar, mostra a nota antes.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-2.webp","semPrint":false},{"titulo":"Clique em Importar","texto":"Na linha da nota, clica em Importar. Se a nota ainda está aguardando o XML, ele pede pra confirmar: é só a Ciência da Operação, que libera o arquivo da nota.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-3.webp","semPrint":false},{"titulo":"1. Fornecedor","texto":"Abre a importação em etapas. Primeiro o fornecedor: o sistema acha pelo CNPJ. Se ainda não tem cadastro, ele é cadastrado com os dados da nota.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-4.webp","semPrint":false},{"titulo":"2. Produtos: vincular","texto":"Agora os produtos. O que você já comprou antes vem ligado sozinho, em verde. Produto que já tem no estoque com outro nome? Clica em Vincular e escolhe o seu produto: das próximas vezes ele já vem ligado.","dica":"Veio em caixa? Em \"Conv. ×\" diga quantas unidades vêm em cada caixa, e o estoque entra certinho.","atencao":"","img":"img-web/entrada-nfe/passo-5.webp","semPrint":false},{"titulo":"Cadastrar o que não tem","texto":"Produto que ainda não tem cadastro aparece em vermelho. Dá pra cadastrar um por um no botão Cadastrar, ou marcar todos e clicar em Cadastrar marcados, de uma vez.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Grupo e unidade de todos","texto":"Escolhe o grupo e a unidade, que vão pra todos os marcados. Os nomes ficam os da nota. Clica em Cadastrar todos: eles são gravados quando você confirmar a entrada.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"3. Cobranças","texto":"Tudo ligado ou cadastrado? Clica em Conferir financeiro. Aparecem as parcelas que vieram na nota, que vão pro contas a pagar. Dá pra mudar a data e o valor.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Parcelas da nota","texto":"Confere as parcelas e clica em Gerência de custos.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"4. Gerência de custos","texto":"Aqui aparece o custo real de cada produto, já com frete e impostos. Você pode aplicar um markup pra todos, ou manter os preços atuais.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Confirme a entrada","texto":"Tudo conferido? Clica em Confirmar entrada da nota. O estoque sobe, o custo é atualizado e as parcelas vão pro contas a pagar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Entrada confirmada","texto":"Pronto! A nota aparece no histórico como confirmada. Recebeu o XML por e-mail? Também dá pra dar entrada pelo arquivo, em Importar XML.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Errou? Reabrir","texto":"Lançou errado? Clica em Reabrir na linha da nota: o estoque e as contas a pagar são estornados, e você escolhe se edita a nota ou exclui.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Editar ou excluir","texto":"Nota reaberta. Em Editar nota, você corrige e confirma de novo. Em Excluir nota, a importação é apagada, e a nota volta pra lista, pronta pra importar.","dica":"","atencao":"Reabrir estorna o estoque e o financeiro dessa nota. Se alguma parcela já foi paga, o sistema avisa antes.","img":"","semPrint":false}]},{"id":"entrada-manual","grupo":"Estoque","titulo":"Entrada manual de mercadoria, passo a passo","resumo":"Lance uma compra sem nota do começo ao fim: fornecedor, produto novo com tributação, quantidades, pagamento e custos.","antes":"Ter o fornecedor em mãos. O produto e o fornecedor podem ser cadastrados na hora, dentro da própria entrada.","destaque":false,"video":"videos-web/entrada-manual.mp4","capa":"videos-web/entrada-manual.jpg","passos":[{"titulo":"Abra a Entrada manual","texto":"No menu, clica em Estoque, Entrada manual. Aqui fica o histórico das suas compras. Pra lançar uma compra nova, é no botão Nova entrada.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-1.webp","semPrint":false},{"titulo":"As três etapas","texto":"Clicou em Nova entrada, a tela tem três etapas: um, os itens; dois, o pagamento; e três, os custos. A gente começa pelos itens.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-2.webp","semPrint":false},{"titulo":"Escolha o fornecedor","texto":"Primeiro o fornecedor. Digita o nome de quem vendeu e aperta Enter pra escolher. Se ele ainda não tem cadastro, é só clicar em Cadastrar, aqui do lado, e cadastrar na hora.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-3.webp","semPrint":false},{"titulo":"Produto que ainda não tem cadastro","texto":"Agora os produtos. Digita o nome, o código, ou bipa o código de barras. Se o produto já tem cadastro, ele aparece na lista e é só dar Enter. Esse carregador ainda não tem: então clica em Cadastrar novo produto.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-4.webp","semPrint":false},{"titulo":"Nome, custo e preço de venda","texto":"Abre o cadastro do produto, já com o nome que você digitou. Coloca o preço de custo, quanto você pagou, e o preço de venda. A margem é calculada sozinha.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-5.webp","semPrint":false},{"titulo":"Busque a tributação","texto":"Agora a tributação. Clica em Tributação IA: o sistema pesquisa pelo nome do produto, ou pela foto, e sugere o NCM, o CEST, o CSOSN e o CFOP. Lê com calma e, se estiver certo, clica em Aplicar no produto.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-6.webp","semPrint":false},{"titulo":"Confira na aba Fiscal","texto":"Depois, sempre confere na aba Fiscal. Veja se o NCM, o CEST e os CFOPs foram preenchidos.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-7.webp","semPrint":false},{"titulo":"Não achou? Preencha à mão","texto":"E se a busca não achar, você preenche à mão: digita o NCM de oito números, que vem na nota do fornecedor, ou clica na lupa do lado pra pesquisar. Na dúvida, confirma com o seu contador antes de emitir nota.","dica":"O NCM certo está na nota fiscal de compra do fornecedor: copie de lá.","atencao":"","img":"img-web/entrada-manual/passo-8.webp","semPrint":false},{"titulo":"Salve o produto","texto":"Tudo certo? Clica em Cadastrar. O produto fica salvo e já entra na sua entrada.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-9.webp","semPrint":false},{"titulo":"Quantidade e Lançar","texto":"O produto já volta escolhido, e o cursor vai pro campo de quantidade, do lado. Digita quantos chegaram, aqui foram dez, e clica em Lançar. Ele entra na lista de Produtos lançados.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-10.webp","semPrint":false},{"titulo":"Confira na lista","texto":"Na lista, confere o custo de cada um. Se o produto vem em caixa, em Unidades por pacote você diz quantas vêm em cada caixa, e o estoque sobe certinho.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-11.webp","semPrint":false},{"titulo":"Produto que já tem cadastro: só no teclado","texto":"Produto que já tem cadastro é mais rápido, sem mouse: bipa ou digita o código, Enter, a quantidade, e Enter de novo. Ele lança e já volta pro produto, pronto pro próximo.","dica":"Atalho: produto → Enter → quantidade → Enter. Repita para cada produto da compra.","atencao":"","img":"img-web/entrada-manual/passo-12.webp","semPrint":false},{"titulo":"Pagamento","texto":"Clica em Próximo, pagamento. Escolhe como pagou: Pix, dinheiro, boleto ou a prazo. No boleto e no a prazo, você informa as parcelas, e elas já vão para o contas a pagar.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-13.webp","semPrint":false},{"titulo":"Custos e preço de venda","texto":"Clica em Conferir e avançar. Aqui aparece o custo novo de cada produto e o preço de venda. Pode aplicar uma margem pra todos, ou manter os preços que já estão.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-14.webp","semPrint":false},{"titulo":"Gere a entrada","texto":"Tudo conferido? Clica em Gerar entrada. O estoque sobe na hora, o custo médio é atualizado, e o pagamento vai para o contas a pagar.","dica":"Não terminou? Use \"Salvar em aberto\" e continue depois.","atencao":"","img":"","semPrint":false},{"titulo":"Pronto, entrada concluída","texto":"Pronto! A entrada já aparece aqui no histórico, concluída. Clicando nela, dá pra imprimir as etiquetas dos produtos que chegaram.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"ajuste-estoque","grupo":"Estoque","titulo":"Corrigir estoque e preços (ajuste)","resumo":"Acerte a quantidade em estoque e os preços de vários produtos de uma vez, com histórico do que era antes.","antes":"","destaque":false,"video":"videos-web/ajuste-estoque.mp4","capa":"videos-web/ajuste-estoque.jpg","passos":[{"titulo":"Abra o Ajuste de Estoque","texto":"No menu, clica em Estoque, Ajuste de Estoque. Aqui você muda a quantidade, o custo e o preço de venda, e o valor antigo fica guardado no histórico.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-1.webp","semPrint":false},{"titulo":"Veja o que está com problema","texto":"Clica em Estoque negativo, ou em Estoque zerado, e aparecem só os produtos com problema. Pra ver tudo de novo, é em Todos.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-2.webp","semPrint":false},{"titulo":"Busque o produto","texto":"Digita o nome ou o código do produto. Dá pra filtrar também por grupo, subgrupo e fornecedor.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-3.webp","semPrint":false},{"titulo":"Digite o novo estoque","texto":"Na coluna Novo estoque, digita a quantidade certa, a que você contou na prateleira. Aqui são trinta. A linha fica azul, mostrando que mudou.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-4.webp","semPrint":false},{"titulo":"Custo, margem e venda","texto":"Na mesma linha você muda o custo, a margem ou o preço de venda, se precisar. Mudou a margem, o preço de venda é recalculado.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Margem pra vários de uma vez","texto":"E pra mudar o preço de vários de uma vez: filtra os produtos, digita a margem e clica em Aplicar margem aos filtrados. Errou alguma coisa? Desfazer alterações não salvas volta tudo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Clique em Salvar alterações","texto":"Agora clica em Salvar alterações. O número do lado mostra quantos produtos você mudou. Ele pergunta se quer salvar: é só confirmar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Pronto, estoque corrigido","texto":"Pronto! O estoque atual já mostra trinta. E o que era antes fica guardado no histórico de ajustes, pra você conferir depois.","dica":"Contou o estoque todo? Use o Balanço: ele ajusta tudo de uma vez no final.","atencao":"","img":"","semPrint":false}]},{"id":"etiquetas","grupo":"Estoque","titulo":"Imprimir etiquetas de preço","resumo":"Escolha o modelo, adicione os produtos, diga quantas etiquetas de cada e confira a prévia antes de imprimir.","antes":"Ter a impressora de etiquetas instalada no computador.","destaque":false,"video":"videos-web/etiquetas.mp4","capa":"videos-web/etiquetas.jpg","passos":[{"titulo":"Abra as Etiquetas","texto":"No menu, clica em Estoque, Etiquetas. Escolhe o tipo: etiqueta de código, de produto, ou de gôndola, pra prateleira.","dica":"","atencao":"","img":"img-web/etiquetas/passo-1.webp","semPrint":false},{"titulo":"Escolha o modelo","texto":"Clicou em Etiquetas de produto, aparecem os modelos. Clica no do papel que você usa: o tamanho aparece em milímetros.","dica":"","atencao":"","img":"img-web/etiquetas/passo-2.webp","semPrint":false},{"titulo":"Bipe ou digite o código","texto":"Agora os produtos. Bipa a etiqueta, ou digita o código e aperta Enter: o produto já entra na seleção com uma etiqueta.","dica":"","atencao":"","img":"img-web/etiquetas/passo-3.webp","semPrint":false},{"titulo":"Ou marque a caixinha","texto":"Ou digita o nome e marca a caixinha do produto. Pode buscar outro depois, que a seleção fica guardada.","dica":"","atencao":"","img":"img-web/etiquetas/passo-4.webp","semPrint":false},{"titulo":"Quantas etiquetas de cada","texto":"Na coluna Quantidade de etiquetas, digita quantas quer de cada produto. Clicando em Limpar busca, a lista mostra tudo que você já marcou.","dica":"","atencao":"","img":"img-web/etiquetas/passo-5.webp","semPrint":false},{"titulo":"Só o que mudou de preço","texto":"Dica boa: pra etiquetar só o que mudou de preço, clica em Preço alterado por data, escolhe o período e clica em Aplicar filtros. Ou Estoque movimentado por data, pra etiquetar o que chegou.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Confira a prévia","texto":"Clica em Conferir etiquetas. Aparece a prévia da folha, com quantas etiquetas e quantas folhas. Já usou parte da folha? Em Pular posições você diz quantas já foram.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Imprima","texto":"Na primeira vez, clica em Imprimir uma de teste, pra ver se ficou alinhado. Ficou bom? Clica em Imprimir etiquetas. Se precisar acertar, é em Ajustar impressão.","dica":"Imprima em tamanho real (100%), sem \"ajustar à página\". Depois de uma entrada de mercadoria, o botão Etiquetas já traz os produtos que chegaram.","atencao":"","img":"","semPrint":false}]},{"id":"perdas-e-consumo","grupo":"Estoque","titulo":"Perdas e uso/consumo (baixa de estoque)","resumo":"Dê baixa em produto quebrado, vencido ou sumido (perda) e no que foi usado na própria loja (uso e consumo).","antes":"","destaque":false,"video":"videos-web/perdas-e-consumo.mp4","capa":"videos-web/perdas-e-consumo.jpg","passos":[{"titulo":"Abra Perdas e Uso/Consumo","texto":"No menu, clica em Estoque, Perdas e Uso/Consumo. Aqui ficam todas as baixas, com o motivo, quem fez e o custo. Pra lançar uma, é em Nova movimentação.","dica":"","atencao":"","img":"img-web/perdas-e-consumo/passo-1.webp","semPrint":false},{"titulo":"Perda: tipo e motivo","texto":"Em Tipo, escolhe Perda: quando quebrou, venceu ou sumiu. Escreve o motivo, aqui o fone caiu no chão e quebrou. A data já vem com hoje.","dica":"","atencao":"","img":"img-web/perdas-e-consumo/passo-2.webp","semPrint":false},{"titulo":"Produto e quantidade","texto":"Busca o produto pelo nome ou pelo código, clica nele e coloca a quantidade. Aparece quanto tem disponível e o custo da baixa.","dica":"","atencao":"","img":"img-web/perdas-e-consumo/passo-3.webp","semPrint":false},{"titulo":"Confira e confirme","texto":"Clica em Conferir movimentação: aparece o resumo, com o custo de cada item. Tá certo? Clica em Confirmar baixa pelo custo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A perda já está na lista","texto":"Pronto! A perda aparece na lista, confirmada. O estoque baixou e o custo entra no relatório.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Uso e consumo","texto":"Agora o outro tipo. Nova movimentação de novo e, em Tipo, escolhe Uso e consumo: é o que a própria loja usou. Aqui, emendas pra rede da loja.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Produto, conferir e confirmar","texto":"Busca o produto, coloca a quantidade, duas, e clica em Conferir movimentação. Depois, Confirmar baixa pelo custo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"As duas baixas lançadas","texto":"E as duas estão aqui: a perda e o uso e consumo, com o custo total lá em cima. Dá pra filtrar pelo tipo e pela data.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Lançou errado? Excluir","texto":"Lançou errado? Clica em Excluir na linha, escreve o motivo e confirma. O produto volta pro estoque e o custo sai do relatório.","dica":"","atencao":"O lançamento excluído continua no histórico como Estornado, com o motivo e quem fez.","img":"","semPrint":false}]},{"id":"lista-a-comprar","grupo":"Estoque","titulo":"Lista \"A comprar\"","resumo":"A equipe anota o que está faltando; quem compra marca o que comprou e, quando chega, marca que chegou ou dá entrada.","antes":"","destaque":false,"video":"videos-web/lista-a-comprar.mp4","capa":"videos-web/lista-a-comprar.jpg","passos":[{"titulo":"Abra A comprar","texto":"No menu, clica em Estoque, A comprar. Aqui a equipe anota o que está faltando, e quem compra vai marcando o que comprou e o que chegou.","dica":"","atencao":"","img":"img-web/lista-a-comprar/passo-1.webp","semPrint":false},{"titulo":"Produto do cadastro","texto":"Digita o produto e escolhe na lista: aparece até o estoque dele. Coloca a quantidade, uma observação e, se for urgente, clica em Urgente. Depois, Lançar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Item novo, sem cadastro","texto":"Não tem no cadastro? Escreve o nome mesmo assim e clica em Lançar. Ele entra na lista como item novo, e dá pra cadastrar depois, em Cadastrar agora.","dica":"","atencao":"","img":"img-web/lista-a-comprar/passo-3.webp","semPrint":false},{"titulo":"Errou? Clique no lápis","texto":"Pra corrigir, clica no lápis, Editar, na linha do item. Muda o que precisa, aqui a quantidade pra doze e uma observação, e clica em Salvar.","dica":"","atencao":"","img":"img-web/lista-a-comprar/passo-4.webp","semPrint":false},{"titulo":"Comprou? Marque Comprei","texto":"Comprou? Clica em Comprei na linha do item. Ou marca vários itens na caixinha e clica em Comprei estes, tudo de uma vez.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Fornecedor, quantidade e preços","texto":"Escolhe o fornecedor, confere a quantidade comprada, o preço de custo e o de venda. A margem aparece sozinha. Clica em Confirmar compra.","dica":"Isto é só o controle da compra: o estoque e o preço do cadastro mudam pela entrada de nota ou pela entrada manual.","atencao":"","img":"","semPrint":false},{"titulo":"Chegou? Aba Comprados","texto":"Na aba Comprados fica o que está esperando chegar. Chegou? Marca o item e clica em Chegaram, dar entrada.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Chegou tudo e como dar entrada","texto":"Clica em Chegou tudo, ou muda a quantidade se veio menos. Aí escolhe: dar entrada sem nota, tenho a nota fiscal, ou só marcar que chegou. Como a película ainda não tem cadastro, é Só marcar que chegou.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Aba Chegou","texto":"Pronto! Na aba Chegou está a película, com a etiqueta de como chegou. E o fone urgente continua em Falta comprar, esperando alguém comprar.","dica":"Quando você lança a nota (XML) ou a entrada manual do produto, ele passa para \"Chegou\" sozinho.","atencao":"","img":"","semPrint":false}]},{"id":"preco-e-compra-inteligente","grupo":"Estoque","titulo":"Preço inteligente e compra inteligente","resumo":"Ache produtos vendidos no prejuízo e saiba o que comprar antes que acabe.","antes":"Ligue os recursos em Configurações › Recursos inteligentes.","destaque":false,"video":"videos-web/preco-e-compra-inteligente.mp4","capa":"videos-web/preco-e-compra-inteligente.jpg","passos":[{"titulo":"Preço inteligente: corrija o prejuízo","texto":"Em Estoque › Preço inteligente aparecem os produtos vendidos com prejuízo ou margem baixa. Confira o \"Preço novo\" sugerido, marque os produtos e clique em \"Aplicar\".","dica":"","atencao":"","img":"img-web/preco-e-compra-inteligente/passo-1.webp","semPrint":false},{"titulo":"Compra inteligente: o que vai faltar","texto":"Em Estoque › Compra inteligente, informe em quantos dias o fornecedor entrega e para quantos dias quer comprar. Clique em \"Calcular\".","dica":"","atencao":"","img":"img-web/preco-e-compra-inteligente/passo-2.webp","semPrint":false},{"titulo":"Mande o pedido ao fornecedor","texto":"O sistema separa os produtos por fornecedor, com a quantidade sugerida. Ajuste o que quiser e clique em \"Pedir no WhatsApp\" (ou \"Copiar\").","dica":"A conta usa o ritmo de vendas dos últimos 90 dias.","atencao":"","img":"img-web/preco-e-compra-inteligente/passo-3.webp","semPrint":false}]},{"id":"relatorio-caixas-dre","grupo":"Relatórios","titulo":"Ver o lucro do mês (DRE) e o relatório de caixas","resumo":"Descubra se a loja deu lucro e confira o dinheiro de cada caixa.","antes":"","destaque":false,"video":"videos-web/relatorio-caixas-dre.mp4","capa":"videos-web/relatorio-caixas-dre.jpg","passos":[{"titulo":"Abra o DRE","texto":"No menu, clique em Relatórios › Financeiro › DRE. Ele mostra vendas, custo das mercadorias, despesas e o lucro líquido.","dica":"","atencao":"","img":"img-web/relatorio-caixas-dre/passo-1.webp","semPrint":false},{"titulo":"Escolha o mês","texto":"Clique em \"Mês atual\" ou \"Mês anterior\". O quadro \"Lucro líquido\" diz quanto sobrou de verdade.","dica":"Para o DRE ficar certo, os produtos precisam ter preço de custo e as despesas precisam estar com o plano de contas preenchido.","atencao":"","img":"img-web/relatorio-caixas-dre/passo-2.webp","semPrint":false},{"titulo":"Relatório de Caixas","texto":"Em Relatórios › Caixas › Relatório de Caixa você vê o que entrou, saiu e o dinheiro que deveria estar na gaveta. Clique num caixa para ver os detalhes.","dica":"","atencao":"","img":"img-web/relatorio-caixas-dre/passo-3.webp","semPrint":false}]},{"id":"relatorios-de-vendas","grupo":"Relatórios","titulo":"Relatórios de vendas: BI, faturamento, comparativo e Curva ABC","resumo":"Veja quanto vendeu, quanto sobrou de verdade, se cresceu e quais produtos mais vendem.","antes":"","destaque":false,"video":"videos-web/relatorios-de-vendas.mp4","capa":"videos-web/relatorios-de-vendas.jpg","passos":[{"titulo":"BI Vendas: quanto vendeu e como pagaram","texto":"Em Relatórios › Vendas › BI Vendas escolha o período nos filtros do alto. Os gráficos mostram as vendas por forma de pagamento e por situação. Clique numa fatia para filtrar.","dica":"O botão \"Imprimir\" gera o relatório para guardar em PDF.","atencao":"","img":"img-web/relatorios-de-vendas/passo-1.webp","semPrint":false},{"titulo":"Faturamento: do bruto ao líquido","texto":"Em Relatórios › Vendas › Faturamento você vê o que vendeu, os descontos e taxas, e quanto ficou de verdade. Escolha o período nos botões do alto; ele compara sozinho com o período anterior.","dica":"","atencao":"","img":"img-web/relatorios-de-vendas/passo-2.webp","semPrint":false},{"titulo":"Comparativo: vendeu mais ou menos?","texto":"Em Comparativo de Vendas, clique em \"Mês × anterior\" (ou \"Semana × anterior\", \"Ano × anterior\"). Os cartões mostram faturamento, quantidade de vendas, ticket médio e o crescimento.","dica":"Use \"Personalizado\" para comparar quaisquer datas, por exemplo a Black Friday deste ano com a do ano passado.","atencao":"","img":"img-web/relatorios-de-vendas/passo-3.webp","semPrint":false},{"titulo":"Curva ABC: os produtos que mais trazem dinheiro","texto":"Em Curva ABC, os produtos \"A\" são os poucos que trazem a maior parte do faturamento; os \"C\" quase não vendem. Classifique por faturamento, quantidade ou lucro.","dica":"Nunca deixe faltar os produtos da classe A. Os da classe C são bons para promoção.","atencao":"","img":"img-web/relatorios-de-vendas/passo-4.webp","semPrint":false}]},{"id":"metas-por-vendedor","grupo":"Relatórios","titulo":"Metas do mês por vendedor","resumo":"Defina a meta de cada vendedor e acompanhe quanto falta por dia para bater.","antes":"Os vendedores precisam estar cadastrados em Cadastros › Pessoas › Usuários.","destaque":false,"video":"videos-web/metas-por-vendedor.mp4","capa":"videos-web/metas-por-vendedor.jpg","passos":[{"titulo":"Abra \"Metas por vendedor\"","texto":"No menu, clique em Relatórios › Vendas › Metas por vendedor. Aparece quanto cada um já vendeu no mês e o ritmo.","dica":"","atencao":"","img":"img-web/metas-por-vendedor/passo-1.webp","semPrint":false},{"titulo":"Digite a meta de cada vendedor","texto":"Na coluna \"Meta do mês\", digite o valor da meta do vendedor e aperte Enter para salvar.","dica":"No mês seguinte, use \"Copiar do mês anterior\" para repetir as metas sem digitar tudo de novo.","atencao":"","img":"img-web/metas-por-vendedor/passo-2.webp","semPrint":false},{"titulo":"Acompanhe a projeção e o \"falta por dia\"","texto":"\"Projeção do mês\" mostra quanto a loja vai vender se continuar no ritmo de hoje. \"Falta por dia\" diz quanto precisa vender por dia para bater a meta.","dica":"","atencao":"","img":"img-web/metas-por-vendedor/passo-3.webp","semPrint":false}]},{"id":"relatorios-financeiros","grupo":"Relatórios","titulo":"Relatórios financeiros: fluxo de caixa, gastos e comparativo","resumo":"Veja o dinheiro que entrou e saiu, o que pagou e se o mês foi melhor que o anterior.","antes":"","destaque":false,"video":"videos-web/relatorios-financeiros.mp4","capa":"videos-web/relatorios-financeiros.jpg","passos":[{"titulo":"Fluxo de Caixa: o que entrou e saiu de verdade","texto":"Em Relatórios › Financeiro › Fluxo de Caixa escolha as datas. Crediário e boleto só entram quando o cliente paga. Troque entre \"Detalhado\" e \"Resumo\".","dica":"O botão \"PDF\" gera o relatório para mandar ao contador.","atencao":"","img":"img-web/relatorios-financeiros/passo-1.webp","semPrint":false},{"titulo":"Relatório de Contas a Pagar: para onde foi o dinheiro","texto":"Veja os gastos pagos e a pagar por plano de contas, fornecedor ou funcionário. O botão \"Fixas\" mostra só as despesas que se repetem todo mês.","dica":"","atencao":"","img":"img-web/relatorios-financeiros/passo-2.webp","semPrint":false},{"titulo":"Comparativo Financeiro: este mês × mês passado","texto":"Clique em \"Este mês × mês passado\" (ou outro atalho). O sistema mostra se faturamento e entradas melhoraram ou pioraram.","dica":"","atencao":"","img":"img-web/relatorios-financeiros/passo-3.webp","semPrint":false}]},{"id":"relatorios-de-clientes","grupo":"Relatórios","titulo":"Conhecer seus clientes: resumo, CRM e aniversariantes","resumo":"Descubra os melhores clientes, quem sumiu, quem faz aniversário e chame pelo WhatsApp.","antes":"","destaque":false,"video":"videos-web/relatorios-de-clientes.mp4","capa":"videos-web/relatorios-de-clientes.jpg","passos":[{"titulo":"Resumo de Clientes","texto":"Em Relatórios › Clientes › Resumo de Clientes escolha o período (\"Mês\", \"Ano\"...). Aparecem os melhores clientes, os que compram pouco e os que mais atrasam pagamento.","dica":"","atencao":"","img":"img-web/relatorios-de-clientes/passo-1.webp","semPrint":false},{"titulo":"CRM: clientes para chamar de volta","texto":"No CRM de Clientes, a aba \"Oportunidades\" mostra quem já devia ter voltado a comprar e quanto isso vale. Marque os clientes e clique em \"Enviar WhatsApp\".","dica":"O link \"Personalizar mensagens\" deixa você mudar o texto que vai para o cliente.","atencao":"","img":"img-web/relatorios-de-clientes/passo-2.webp","semPrint":false},{"titulo":"Aniversariantes: mande os parabéns","texto":"Escolha \"Hoje\", \"Semana\" ou \"Mês\". Marque os clientes (ou \"Marcar todos\") e clique em \"Enviar para marcados\" para mandar os parabéns pelo WhatsApp.","dica":"","atencao":"","img":"img-web/relatorios-de-clientes/passo-3.webp","semPrint":false},{"titulo":"Mensagens enviadas: chegou ou não?","texto":"Em WhatsApp › Mensagens enviadas você vê cada mensagem que o sistema mandou (venda, cobrança, aniversário...) e se foi entregue ou lida.","dica":"","atencao":"","img":"img-web/relatorios-de-clientes/passo-4.webp","semPrint":false}]},{"id":"analise-clientes","grupo":"Relatórios","titulo":"Análise de clientes: nota A, B, C ou D","resumo":"Cada cliente ganha uma nota pelo que compra e como paga: você vê na hora quem é bom pagador e quem sumiu.","antes":"","destaque":false,"video":"videos-web/analise-clientes.mp4","capa":"","passos":[{"titulo":"Abra a Análise de clientes","texto":"Em Relatórios, Clientes, Análise de clientes. Aqui em cima mostra quantos clientes tem em cada nota: A é o melhor, D é quem mais atrasa.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Filtre do jeito que precisar","texto":"Dá pra buscar o cliente pelo nome, ver só uma nota, só quem está devendo, ou quem está parado há mais de noventa dias, pra chamar de volta.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A análise de cada cliente","texto":"Clicando no cliente, abre a análise dele: as compras dos últimos doze meses, as parcelas pagas, o que ele mais compra e o histórico, que também conta na nota.","dica":"A nota também aparece no cadastro do cliente e no caixa, na hora da venda.","atencao":"","img":"","semPrint":false}]},{"id":"pos-venda-agradecer","grupo":"Relatórios","titulo":"Agradecer cada compra (Pós-Venda)","resumo":"Mande o \"obrigado pela compra\" no WhatsApp e veja quem ainda falta.","antes":"","destaque":false,"video":"videos-web/pos-venda-agradecer.mp4","capa":"videos-web/pos-venda-agradecer.jpg","passos":[{"titulo":"Escolha o período","texto":"Em Relatórios › Clientes › Pós-Venda, clique em \"Hoje\", \"Ontem\", \"7 dias\" ou \"30 dias\". Os cartões mostram quantas vendas já foram agradecidas e quantas faltam.","dica":"","atencao":"","img":"img-web/pos-venda-agradecer/passo-1.webp","semPrint":false},{"titulo":"Envie o agradecimento","texto":"Marque \"Só pendentes\" e clique no botão de WhatsApp em cada venda. A mensagem já vai pronta; depois ela aparece como \"Enviado\".","dica":"Para o sistema mandar sozinho, ligue a régua em WhatsApp › Pós-venda.","atencao":"","img":"img-web/pos-venda-agradecer/passo-2.webp","semPrint":false}]},{"id":"relatorios-de-estoque","grupo":"Relatórios","titulo":"Relatórios de estoque: movimentação e alertas","resumo":"Veja toda entrada e saída de um produto e o que precisa de atenção no estoque.","antes":"","destaque":false,"video":"videos-web/relatorios-de-estoque.mp4","capa":"videos-web/relatorios-de-estoque.jpg","passos":[{"titulo":"Movimentação: por que o estoque mudou?","texto":"Em Relatórios › Estoque › Movimentação, digite o produto e clique em \"Pesquisar\". Aparece cada entrada e saída, com a data e o documento (venda, nota, ajuste...).","dica":"","atencao":"","img":"img-web/relatorios-de-estoque/passo-1.webp","semPrint":false},{"titulo":"Alertas de estoque","texto":"Os cartões mostram produtos com estoque negativo, no mínimo, vendidos abaixo do custo ou com margem baixa. Clique em \"Ver produtos\" num cartão para ver a lista.","dica":"","atencao":"","img":"img-web/relatorios-de-estoque/passo-2.webp","semPrint":false},{"titulo":"Corrija na hora","texto":"Na lista \"Produtos que precisam de atenção\", clique em \"Ajustar\" no produto: abre o Ajuste de Estoque para você acertar a quantidade ou o preço.","dica":"","atencao":"","img":"img-web/relatorios-de-estoque/passo-3.webp","semPrint":false}]},{"id":"comissoes","grupo":"Relatórios","titulo":"Comissões dos funcionários","resumo":"Veja quanto cada vendedor e técnico vendeu e quanto ganhou de comissão.","antes":"A porcentagem de comissão é definida no cadastro de cada funcionário (Cadastros › Pessoas › Usuários).","destaque":false,"video":"videos-web/comissoes.mp4","capa":"videos-web/comissoes.jpg","passos":[{"titulo":"Escolha o período","texto":"Em Relatórios › Funcionários › Comissões, clique em \"Este mês\" ou \"Mês passado\" (o mais comum para pagar a comissão).","dica":"","atencao":"","img":"img-web/comissoes/passo-1.webp","semPrint":false},{"titulo":"Veja quanto cada um ganhou","texto":"Os blocos \"Vendedores\" e \"Técnicos/Mecânicos\" mostram o total de cada pessoa. Clique na pessoa para ver venda por venda.","dica":"O selo \"Bate com o Dashboard\" confirma que os números estão certos.","atencao":"","img":"img-web/comissoes/passo-2.webp","semPrint":false}]},{"id":"vendedor-compensa","grupo":"Relatórios","titulo":"O vendedor compensa?","resumo":"Compare o lucro que cada vendedor trouxe com o que ele custa: salário, comissão, INSS, 13º, férias e FGTS.","antes":"","destaque":false,"video":"videos-web/vendedor-compensa.mp4","capa":"","passos":[{"titulo":"Abra o relatório","texto":"Em Relatórios, Funcionários, O vendedor compensa. Ele pega o lucro das vendas de cada vendedor, já tirando o custo dos produtos, os descontos e as devoluções.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O custo de verdade","texto":"E coloca do outro lado tudo o que ele custa: salário, INSS, bonificação, comissão, e se você quiser, a provisão do décimo terceiro e das férias, e o FGTS.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Mês a mês","texto":"O gráfico mostra mês a mês o lucro das vendas contra o que ele custou. Embaixo aparecem os produtos que mais deram lucro e os de margem baixa.","dica":"Tem também o \"O técnico compensa?\", com a mesma conta para quem faz as ordens de serviço.","atencao":"","img":"","semPrint":false}]},{"id":"relatorios-de-servicos","grupo":"Relatórios","titulo":"Relatórios de serviços: OS por técnico, BI OS e comparativo","resumo":"Veja quanto cada técnico produziu e se a oficina está fazendo mais ou menos serviços.","antes":"","destaque":false,"video":"videos-web/relatorios-de-servicos.mp4","capa":"videos-web/relatorios-de-servicos.jpg","passos":[{"titulo":"OS por técnico","texto":"Em Relatórios › Serviços › OS por técnico, escolha o período e o técnico. Aparecem quantas OS, serviços e peças cada um fez.","dica":"","atencao":"","img":"img-web/relatorios-de-servicos/passo-1.webp","semPrint":false},{"titulo":"BI OS: a visão do gerente","texto":"O BI OS mostra o resultado das ordens de serviço: total, quanto foi peça e quanto foi serviço, e quanto cada profissional produziu. Escolha o período e clique em \"Aplicar filtros\".","dica":"\"Imprimir BI\" gera o relatório para guardar.","atencao":"","img":"img-web/relatorios-de-servicos/passo-2.webp","semPrint":false},{"titulo":"Comparativo de serviços","texto":"Clique em \"Este mês × mês passado\". O sistema compara os dois períodos por serviço, por técnico e por peça. Clique numa linha para ver o detalhe no BI OS.","dica":"","atencao":"","img":"img-web/relatorios-de-servicos/passo-3.webp","semPrint":false}]},{"id":"trocas-e-devolucoes","grupo":"Relatórios","titulo":"Trocas e devoluções","resumo":"Faça a troca e a devolução no caixa (com haver, dinheiro, Pix ou cartão) e veja no relatório o que mais volta.","antes":"O caixa precisa estar aberto. Para devolver pela venda, a venda tem que ter sido feita no sistema.","destaque":false,"video":"videos-web/trocas-e-devolucoes.mp4","capa":"videos-web/trocas-e-devolucoes.jpg","passos":[{"titulo":"Troca e devolução são no caixa","texto":"No menu, clica em Comercial, PDV. A troca e a devolução são feitas aqui no caixa. Clica em Nova venda.","dica":"","atencao":"","img":"img-web/trocas-e-devolucoes/passo-1.webp","semPrint":false},{"titulo":"Devoluções (F8): ache o cliente","texto":"Clica em Devoluções, ou aperta F8. Procura o cliente pelo nome, telefone, CPF, ou pelo número da venda.","dica":"","atencao":"","img":"img-web/trocas-e-devolucoes/passo-2.webp","semPrint":false},{"titulo":"Escolha a venda","texto":"Clica no cliente e aparecem as compras dele. Escolhe a venda que ele está trazendo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O que volta","texto":"Agora diz o que está voltando: no mais e no menos de cada item, ou em Devolver tudo. Depois clica em Continuar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Lance no caixa","texto":"Confere o resumo, com o total a devolver, e clica em Lançar no caixa. Os itens entram na venda em vermelho.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Troca: passe o produto novo","texto":"É troca? Passa os produtos que ele vai levar no lugar. Aqui ele trocou por duas emendas de rede. O caixa já mostra a diferença.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Sobrou? Fica de haver","texto":"Aperta F9. Sobrou dinheiro pro cliente, então escolhe como devolver: Haver no cliente, que fica de crédito pra próxima compra, ou dinheiro, Pix ou cartão. E Confirmar devolução.","dica":"Se o produto novo for mais caro, o cliente paga só a diferença, em qualquer forma de pagamento.","atencao":"","img":"","semPrint":false},{"titulo":"Devolução sem a venda","texto":"E quando o cliente não tem a venda? Clica em Devoluções e em Devolver só o produto. Busca o produto e clica nele. Depois, Continuar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Devolva em dinheiro","texto":"Clica em Lançar no caixa, aperta F9 e escolhe Dinheiro, que sai do caixa. Confirmar devolução, e pronto.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Relatório de trocas e devoluções","texto":"E pra ver tudo isso, em Relatórios, Vendas, Trocas e devoluções: quantas teve, quanto voltou, como a loja devolveu, e os produtos que mais voltam.","dica":"Produto que volta muito pode ter defeito de fábrica: fale com o fornecedor.","atencao":"","img":"","semPrint":false}]},{"id":"dados-da-empresa","grupo":"Configurações","titulo":"Dados da empresa e logo","resumo":"Preencha CNPJ, endereço, contatos e o logo que saem nos comprovantes.","antes":"","destaque":false,"video":"videos-web/dados-da-empresa.mp4","capa":"videos-web/dados-da-empresa.jpg","passos":[{"titulo":"Abra \"Dados da Empresa\"","texto":"No menu, clique em Configurações › Dados da Empresa.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Digite o CNPJ e clique em \"Buscar CNPJ\": razão social e endereço são preenchidos sozinhos.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-2.webp","semPrint":false},{"titulo":"Coloque o logo","texto":"Em \"Logo da empresa\", envie a imagem do seu logo. Ele aparece nos comprovantes, orçamentos e PDFs.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar configurações\"","texto":"Confira telefone, WhatsApp e e-mail e clique em \"Salvar configurações\".","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-4.webp","semPrint":false}]},{"id":"impressoras","grupo":"Configurações","titulo":"Configurar a impressora de cupom","resumo":"Cadastre a impressora (cupom 80mm ou A4) e escolha se imprime sozinho.","antes":"A impressora precisa estar instalada e compartilhada no Windows.","destaque":false,"video":"videos-web/impressoras.mp4","capa":"videos-web/impressoras.jpg","passos":[{"titulo":"Clique em \"Nova impressora\"","texto":"No menu, clique em Configurações › Impressoras e depois em \"Nova impressora\".","dica":"","atencao":"","img":"img-web/impressoras/passo-1.webp","semPrint":false},{"titulo":"Apelido e impressora","texto":"Dê um apelido (ex.: Cupom Balcão) e escolha a impressora. No aplicativo TH Gestor, o botão \"Listar\" mostra as impressoras do computador.","dica":"","atencao":"","img":"img-web/impressoras/passo-2.webp","semPrint":false},{"titulo":"Formato e comportamento","texto":"Escolha \"Bobina (cupom 80mm)\" ou \"Folha A4\", e se nas vendas o sistema deve perguntar, imprimir direto ou não imprimir.","dica":"","atencao":"","img":"img-web/impressoras/passo-3.webp","semPrint":false},{"titulo":"Salve e teste","texto":"Ligue \"Impressora padrão\" e clique em \"Salvar\". Depois use o botão \"Imprimir teste\" na lista para conferir.","dica":"","atencao":"","img":"img-web/impressoras/passo-4.webp","semPrint":false}]},{"id":"whatsapp-mensagens-excecoes","grupo":"WhatsApp","titulo":"WhatsApp: mensagens e exceções","resumo":"Edite as mensagens vendo como o cliente recebe, escolha quem não recebe mensagem automática e veja o relatório do que chegou.","antes":"","destaque":false,"video":"videos-web/whatsapp-mensagens-excecoes.mp4","capa":"","passos":[{"titulo":"Abra Configurações e mensagens","texto":"No menu, clica em WhatsApp, Configurações e mensagens. Aqui em cima tem sete cartões: Conexão e envio, Vendas, Cobranças, Relacionamento, Pós-venda e avaliação, Fiscal e contador, e Exceções.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-1.webp","semPrint":false},{"titulo":"Cada mensagem com a prévia","texto":"Clica em Vendas. Cada mensagem tem o texto aqui na esquerda e, do lado direito, o celular mostrando como o cliente recebe.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-2.webp","semPrint":false},{"titulo":"Toque num campo azul","texto":"Pra colocar um dado automático, clica no texto onde você quer e toca num campo azul, por exemplo o total. Ele entra no texto, e o celular do lado já atualiza na hora.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-3.webp","semPrint":false},{"titulo":"Salvar ou voltar ao padrão","texto":"Gostou, é só clicar em Salvar. Se quiser o texto original de volta, clica em Restaurar padrão.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-4.webp","semPrint":false},{"titulo":"Exceções: procure o cliente","texto":"Agora a aba Exceções. Aqui você escolhe quem não recebe mensagem automática. Procura o cliente pelo nome.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-5.webp","semPrint":false},{"titulo":"Marque o que ele não recebe","texto":"Clica no cliente e marca o que ele não deve receber: cobrança, aniversário, pós-venda, ou nenhuma mensagem. Depois, Salvar exceção.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-6.webp","semPrint":false},{"titulo":"Clientes em exceção","texto":"Pronto, ela aparece em Clientes em exceção. Tocando no selo, liga ou desliga cada mensagem. Isso vale pro envio automático, pro envio em lote e pra Central de cobrança, onde ela aparece com o selo Exceção e fica fora do lote.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-7.webp","semPrint":false},{"titulo":"Lixeira: volta a receber tudo","texto":"E se ela puder receber tudo de novo, é só clicar na lixeira.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-8.webp","semPrint":false},{"titulo":"Relatório das mensagens","texto":"Agora em WhatsApp, Cobranças, aqui embaixo tem o Relatório das mensagens. Os números Todas, Chegaram, Lidas, Na fila e Falharam filtram a lista.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-9.webp","semPrint":false},{"titulo":"Ver a mensagem e o motivo da falha","texto":"Clicando em Falharam, aparece só o que não chegou, com o motivo do lado. E em Ver mensagem você lê o texto que foi.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-10.webp","semPrint":false},{"titulo":"Números com falha","texto":"E aqui o aviso dos números com falha mostra quem tem telefone sem WhatsApp. Depois de duas falhas, a régua para de tentar aquele número até você corrigir o cadastro.","dica":"","atencao":"","img":"img-web/whatsapp-mensagens-excecoes/passo-11.webp","semPrint":false}]},{"id":"temas","grupo":"Configurações","titulo":"Mudar as cores do sistema (temas)","resumo":"Escolha a paleta de cores do painel da sua empresa.","antes":"","destaque":false,"video":"videos-web/temas.mp4","capa":"videos-web/temas.jpg","passos":[{"titulo":"Escolha um tema","texto":"Em Configurações › Temas, clique no cartão do tema que preferir (Azul, Premium Slim, Thiago Elite ou Vermelho). Ele já é aplicado e salvo na hora; o tema ativo fica com o ✓.","dica":"O PDV mantém o visual dele. Para a tela escura, use o botão \"Modo escuro\" no rodapé do menu.","atencao":"","img":"img-web/temas/passo-1.webp","semPrint":false}]},{"id":"whatsapp","grupo":"WhatsApp","titulo":"Conectar o WhatsApp e editar as mensagens","resumo":"Ligue o WhatsApp da loja ao sistema e personalize as mensagens enviadas.","antes":"Tenha em mãos o celular com o WhatsApp da empresa.","destaque":false,"video":"videos-web/whatsapp.mp4","capa":"videos-web/whatsapp.jpg","passos":[{"titulo":"Abra as configurações do WhatsApp","texto":"No menu, clique em WhatsApp › Configurações e mensagens.","dica":"","atencao":"","img":"img-web/whatsapp/passo-1.webp","semPrint":false},{"titulo":"Conecte pelo QR Code","texto":"Clique em \"Conectar WhatsApp\". No celular, abra o WhatsApp › Aparelhos conectados › Conectar aparelho e aponte a câmera para o QR Code.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Escolha o que sai automático","texto":"Em \"Envio automático\", diga se o comprovante da venda e o orçamento vão sozinhos pro cliente ou só quando você clicar. O aviso da OS fica em WhatsApp › Ordem de serviço.","dica":"","atencao":"","img":"img-web/whatsapp/passo-3.webp","semPrint":false},{"titulo":"Edite as mensagens","texto":"Clique na aba do assunto (Fiscal e contador, Comercial e vendas, Cobranças, Relacionamento ou Pós-venda e avaliação), mude o texto e clique em \"Salvar mensagens\".","dica":"Abra \"Campos disponíveis\" para colocar o nome do cliente, valor e outros dados automáticos na mensagem.","atencao":"","img":"img-web/whatsapp/passo-4.webp","semPrint":false}]},{"id":"whatsapp-automatico","grupo":"WhatsApp","titulo":"Mensagens automáticas: cobrança, pós-venda e aniversário","resumo":"Ligue a régua e o sistema avisa vencimentos, agradece compras e manda parabéns sozinho.","antes":"Para enviar sozinho, conecte o WhatsApp da loja (veja \"Conectar o WhatsApp\").","destaque":false,"video":"videos-web/whatsapp-automatico.mp4","capa":"videos-web/whatsapp-automatico.jpg","passos":[{"titulo":"Cobranças: lembra antes e cobra depois","texto":"Em WhatsApp › Cobranças, ligue \"Régua ligada\" e escolha \"Enviar sozinho\". Aparece a lista \"Para hoje\" com quem vai receber mensagem.","dica":"Use \"Desta semana\" ou \"Tudo em atraso\" para cobrar mais gente de uma vez.","atencao":"","img":"img-web/whatsapp-automatico/passo-1.webp","semPrint":false},{"titulo":"Configure os dias e o texto","texto":"Clique em \"Configurar\" para escolher a hora do envio, quantos dias antes e depois do vencimento a mensagem sai e o texto de cada etapa.","dica":"","atencao":"","img":"img-web/whatsapp-automatico/passo-2.webp","semPrint":false},{"titulo":"Pós-venda: agradecer e pedir avaliação","texto":"Em WhatsApp › Pós-venda, ligue a régua. Alguns dias depois da compra
