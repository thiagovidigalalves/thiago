<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Ajuda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: faixa clara com a logo no canto, busca grande; menu lateral por grupo + conteúdo.
   Cores tiradas da logo da Thiago Informática (azul-marinho e vermelho). */
:root{
  --marinho:#0c1f5c; --marinho-2:#1c3a96; --vermelho:#d7262e; --vermelho-suave:#fde8e8;
  --fundo:#f3f5fa; --card:#ffffff; --texto:#1b2235; --suave:#5d6680; --borda:#e1e6f0;
  --tinta-icone:#e8edfa; --hover:#eef2fb; --dica:#e9f8f1; --dica-b:#14986a; --aten:#fff3e6; --aten-b:#e0730d;
  --antes:#edf3ff; --antes-b:#3d6fe0; --faixa:#ffffff; --sombra:0 10px 30px rgba(12,31,92,.08);
  --f-titulo:"Sora","Segoe UI",system-ui,sans-serif; --f-texto:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --marinho:#9db4ff; --marinho-2:#7d9bff; --vermelho:#ff5a61; --vermelho-suave:#3a1719;
  --fundo:#0b1020; --card:#141b30; --texto:#e6e9f2; --suave:#99a3bd; --borda:#26304b;
  --tinta-icone:#1d2847; --hover:#1b2440; --dica:#0d2a22; --dica-b:#33c793; --aten:#2e1e0d; --aten-b:#f5a04d;
  --antes:#14213f; --antes-b:#7d9bff; --faixa:#121a2e; --sombra:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --marinho:#9db4ff; --marinho-2:#7d9bff; --vermelho:#ff5a61; --vermelho-suave:#3a1719;
  --fundo:#0b1020; --card:#141b30; --texto:#e6e9f2; --suave:#99a3bd; --borda:#26304b;
  --tinta-icone:#1d2847; --hover:#1b2440; --dica:#0d2a22; --dica-b:#33c793; --aten:#2e1e0d; --aten-b:#f5a04d;
  --antes:#14213f; --antes-b:#7d9bff; --faixa:#121a2e; --sombra:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;font-family:var(--f-texto);background:var(--fundo);color:var(--texto);font-size:17px;line-height:1.6}
a{color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}

/* Faixa do topo: logo no canto esquerdo */
header{background:var(--faixa);border-bottom:1px solid var(--borda);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--marinho) 0 70%,var(--vermelho) 70% 100%)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:68px;width:auto;display:block;background:#fff;border-radius:12px;padding:4px 8px}
.logo span{font:600 13px/1.2 var(--f-texto);color:var(--suave);border-left:1px solid var(--borda);padding-left:12px}
.topo .suporte{font-size:14px;color:var(--suave)}
.hero{padding-block:18px 30px}
.hero h1{font:800 clamp(28px,4.2vw,44px)/1.1 var(--f-titulo);margin:0 0 6px;color:var(--marinho);text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0 0 18px;color:var(--suave);max-width:60ch}
.busca{position:relative;max-width:640px}
.busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--suave)}
#busca{width:100%;padding:16px 18px 16px 50px;border-radius:14px;border:2px solid var(--borda);background:var(--card);color:var(--texto);font:500 17px var(--f-texto);outline:none;box-shadow:var(--sombra)}
#busca:focus{border-color:var(--marinho-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--borda);background:var(--card);color:var(--texto);border-radius:999px;padding:6px 12px;font:500 14px var(--f-texto);cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--marinho-2);outline:none}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-block:26px 64px}
nav{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:10px;max-height:calc(100vh - 32px);overflow:auto}
nav h3{display:flex;align-items:center;gap:8px;font:700 12px var(--f-texto);text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:14px 8px 4px}
nav h3 svg{width:16px;height:16px}
nav a{display:block;text-decoration:none;padding:7px 10px 7px 32px;border-radius:9px;font-size:15px;line-height:1.35}
nav a.inicio{padding-left:10px;font-weight:600}
nav a:hover,nav a:focus-visible{background:var(--hover);outline:none}
nav a.ativo{background:var(--marinho);color:var(--card);font-weight:600}
main{min-width:0}

/* Início */
.secao{display:grid;gap:14px;margin-bottom:34px}
.secao-titulo{display:flex;align-items:center;gap:10px;font:700 22px var(--f-titulo);margin:0;color:var(--texto)}
.secao-titulo .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--tinta-icone);color:var(--marinho)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cartao{display:grid;grid-template-rows:auto 1fr auto;gap:6px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.cartao:hover,.cartao:focus-visible{transform:translateY(-2px);box-shadow:var(--sombra);border-color:var(--marinho-2);outline:none}
.cartao b{font:700 17px/1.3 var(--f-titulo)}
.cartao span{color:var(--suave);font-size:15px;line-height:1.45}
.cartao em{font-style:normal;font-size:13px;font-weight:600;color:var(--marinho-2);display:flex;align-items:center;gap:6px}
.cartao em i{font-style:normal;background:var(--vermelho-suave);color:var(--vermelho);border-radius:999px;padding:1px 8px}
.destaques .cartao{border-top:4px solid var(--vermelho)}
.destaques .cartao .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tinta-icone);color:var(--marinho);margin-bottom:6px}
.vazio{color:var(--suave)}

/* Tutorial */
.voltar{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-size:15px;font-weight:600;color:var(--marinho-2);text-decoration:none}
.cab-tut{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.cab-tut .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--marinho);color:var(--card)}
.cab-tut .ic svg{width:26px;height:26px}
.cab-tut small{font:700 12px var(--f-texto);text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.tutorial h2{font:800 clamp(24px,3vw,32px)/1.2 var(--f-titulo);margin:2px 0 4px;text-wrap:balance}
.tutorial .resumo{color:var(--suave);margin:0}
.antes{background:var(--antes);border-left:5px solid var(--antes-b);padding:12px 16px;border-radius:12px;margin-bottom:18px}
.indice{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.indice ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:p}
.indice li{counter-increment:p;display:flex;gap:10px;align-items:baseline}
.indice li::before{content:counter(p);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--vermelho);color:#fff;font:700 13px/24px var(--f-texto);text-align:center}
.indice a{text-decoration:none;color:var(--marinho-2);font-weight:500}
.passo{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:20px;margin-bottom:18px;scroll-margin-top:16px;display:grid;gap:14px}
.passo-topo{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--vermelho);color:#fff;font:800 20px var(--f-titulo);display:grid;place-items:center;border:3px solid var(--card);box-shadow:0 3px 10px rgba(215,38,46,.4)}
.passo h3{margin:6px 0 4px;font:700 20px/1.3 var(--f-titulo)}
.passo p{margin:0;max-width:70ch}
.passo img{display:block;width:100%;border-radius:12px;border:1px solid var(--borda);cursor:zoom-in;box-shadow:var(--sombra)}
.caixa{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:16px}
.caixa svg{margin-top:2px;width:20px;height:20px}
.caixa.dica{background:var(--dica);border-left:5px solid var(--dica-b)} .caixa.dica svg{color:var(--dica-b)}
.caixa.aten{background:var(--aten);border-left:5px solid var(--aten-b)} .caixa.aten svg{color:var(--aten-b)}
.sem-img{padding:22px;border:2px dashed var(--borda);border-radius:12px;color:var(--suave);text-align:center;font-size:15px}
.fim{display:grid;justify-items:center;gap:4px;text-align:center;background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:24px}
.fim b{font:800 22px var(--f-titulo);color:var(--marinho)}
.fim .ok{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--dica);color:var(--dica-b)}
.nav-tut{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:16px}
.nav-tut a{background:var(--marinho);color:var(--card);text-decoration:none;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px}
.nav-tut a:focus-visible{outline:3px solid var(--vermelho);outline-offset:2px}
#zoom{position:fixed;inset:0;background:rgba(5,10,25,.88);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
footer{border-top:1px solid var(--borda);padding-block:20px;color:var(--suave);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
footer img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;padding-block:18px 48px}
  nav{position:static;max-height:none} body.lendo nav{display:none}
  .passo{padding:14px} .topo .suporte{display:none} .logo img{height:52px}
}
</style>
</head>
<body>
<header>
  <div class="wrap gutter">
    <div class="topo">
      <a class="logo" href="#"><img src="logo.webp" alt="Thiago Informática Sistemas"><span>Central de Ajuda<br>THGestor</span></a>
      <div class="suporte">Dúvida? Fale com o suporte da Thiago Informática.</div>
    </div>
    <div class="hero">
      <h1>Como podemos ajudar?</h1>
      <p>Tutoriais passo a passo, com a imagem de cada tela. É só seguir as bolinhas vermelhas numeradas.</p>
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" aria-label="Buscar tutorial" placeholder="O que você quer fazer? Ex.: fazer venda, emitir nota...">
      </div>
      <div class="chips" aria-label="Buscas rápidas">
        <button type="button" data-q="venda">Fazer venda</button><button type="button" data-q="cliente">Cadastrar cliente</button><button type="button" data-q="nota">Nota fiscal</button><button type="button" data-q="caixa">Caixa</button><button type="button" data-q="estoque">Estoque</button>
      </div>
    </div>
  </div>
</header>
<div class="wrap gutter">
  <div class="layout">
    <nav id="menu" aria-label="Tutoriais por assunto"></nav>
    <main id="conteudo"></main>
  </div>
</div>
<footer><div class="wrap gutter"><img src="logo.webp" alt=""><span>Central de Ajuda do THGestor · Thiago Informática Sistemas</span></div></footer>
<div id="zoom" role="dialog" aria-label="Imagem ampliada"><img alt=""></div>
<script>
const TUTORIAIS = [{"id":"entrar-no-sistema","grupo":"Primeiros passos","titulo":"Como entrar no sistema","resumo":"Acesse o sistema com seu e-mail e senha, ou com sua conta Google/Microsoft.","antes":"","destaque":false,"passos":[{"titulo":"Digite seu e-mail","texto":"Abra o endereço do sistema no navegador. Na tela \"Bem-vindo!\", clique no campo E-mail e digite o e-mail que você usa no sistema.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-1.webp","semPrint":false},{"titulo":"Digite sua senha","texto":"Clique no campo Senha e digite a sua senha. Ela aparece com bolinhas para ninguém ver.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-2.webp","semPrint":false},{"titulo":"Clique em Entrar","texto":"Confira o e-mail e clique no botão Entrar. Pronto: o sistema abre no Dashboard.","dica":"Se o sistema pedir um código de verificação, abra o aplicativo autenticador ou o seu e-mail e digite o código que chegou.","atencao":"","img":"img-web/entrar-no-sistema/passo-3.webp","semPrint":false},{"titulo":"Ou entre com Google ou Microsoft","texto":"Se o seu e-mail é Gmail ou Hotmail/Outlook, você pode clicar em \"Continuar com Google\" ou \"Continuar com Microsoft\" e entrar sem digitar senha.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-4.webp","semPrint":false}]},{"id":"esqueci-a-senha","grupo":"Primeiros passos","titulo":"Esqueci minha senha","resumo":"Receba no seu e-mail um link para criar uma senha nova.","antes":"","destaque":false,"passos":[{"titulo":"Clique em \"Esqueceu a senha?\"","texto":"Na tela de entrada, clique no link \"Esqueceu a senha?\", que fica ao lado do campo Senha.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-1.webp","semPrint":false},{"titulo":"Digite seu e-mail","texto":"Na tela \"Recuperar senha\", digite o mesmo e-mail que você usa para entrar no sistema.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Enviar link de recuperação\"","texto":"Clique no botão. Em alguns minutos chega um e-mail com o link para criar sua senha nova. Abra o e-mail, clique no link e cadastre a nova senha.","dica":"Não chegou? Olhe a caixa de Spam/Lixo eletrônico. Se mesmo assim não aparecer, fale com o suporte.","atencao":"","img":"img-web/esqueci-a-senha/passo-3.webp","semPrint":false}]},{"id":"criar-conta","grupo":"Primeiros passos","titulo":"Criar minha conta (primeiro acesso)","resumo":"Recebeu um convite? Crie sua senha e comece a usar.","antes":"","destaque":false,"passos":[{"titulo":"Clique em \"Criar conta\"","texto":"Na tela de entrada, desça até o final e clique em \"Criar conta\".","dica":"","atencao":"","img":"img-web/criar-conta/passo-1.webp","semPrint":false},{"titulo":"Preencha seus dados","texto":"Use o MESMO e-mail que recebeu o convite. Depois digite seu nome, crie uma senha e repita a senha no último campo.","dica":"","atencao":"","img":"img-web/criar-conta/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Criar conta\"","texto":"Clique no botão \"Criar conta\". Pronto! Agora é só entrar com seu e-mail e a senha que você criou.","dica":"Só funciona com e-mails autorizados pela sua empresa. Se aparecer aviso de e-mail não autorizado, peça ao responsável da empresa para liberar seu e-mail.","atencao":"","img":"img-web/criar-conta/passo-3.webp","semPrint":false}]},{"id":"entrar-funcionario","grupo":"Primeiros passos","titulo":"Entrar como funcionário (sem e-mail)","resumo":"Funcionário entra com o código da empresa, usuário e senha.","antes":"O administrador da empresa precisa ter cadastrado o seu usuário e senha.","destaque":false,"passos":[{"titulo":"Clique em \"Sou funcionário\"","texto":"Na tela de entrada, desça até o final e clique em \"Sou funcionário · entrar com usuário e senha\".","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Preencha empresa, usuário e senha","texto":"Digite o código ou o CNPJ da empresa, o seu usuário (ex.: joao.silva) e a sua senha. Quem passa esses dados é o administrador da empresa.","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Entrar\"","texto":"Clique em \"Entrar\". Você verá só as telas que o administrador liberou para você.","dica":"Esqueceu a senha de funcionário? Peça ao administrador da empresa para criar uma nova em Cadastros › Usuários.","atencao":"","img":"img-web/entrar-funcionario/passo-3.webp","semPrint":false}]},{"id":"portal-do-contador","grupo":"Primeiros passos","titulo":"Acesso do contador","resumo":"Seu contador entra no Portal do Contador para pegar as notas e os arquivos fiscais.","antes":"A empresa precisa ter cadastrado o e-mail do contador no sistema.","destaque":false,"passos":[{"titulo":"Clique em \"Sou contador\"","texto":"Na tela de entrada, desça até o final e clique em \"Sou contador · entrar com usuário e senha\".","dica":"","atencao":"","img":"img-web/portal-do-contador/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Entrar com e-mail\"","texto":"No Portal do Contador, clique em \"Entrar com e-mail\" e use o e-mail que a empresa cadastrou para você. Dá para entrar com Google, Microsoft ou e-mail e senha.","dica":"Se aparecer que o e-mail não está cadastrado, peça para a empresa (ou para o suporte) incluir o seu e-mail.","atencao":"","img":"img-web/portal-do-contador/passo-2.webp","semPrint":false}]},{"id":"conhecendo-o-menu","grupo":"Primeiros passos","titulo":"Conhecendo o menu","resumo":"Ache qualquer tela rápido: menu lateral, busca e favoritos.","antes":"","destaque":false,"passos":[{"titulo":"O menu fica do lado esquerdo","texto":"Todas as telas do sistema estão no menu azul à esquerda, separadas por assunto: Comercial, Cadastros, Estoque, Financeiro, Fiscal, Relatórios e Configurações.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-1.webp","semPrint":false},{"titulo":"Clique num grupo para abrir","texto":"Clique no nome do grupo (por exemplo \"Cadastros\") para ver as telas dele. Clique de novo para fechar.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-2.webp","semPrint":false},{"titulo":"Marque suas telas favoritas","texto":"Clique na estrelinha ao lado de uma tela que você usa muito. Ela vai aparecer lá em cima, em \"Favoritos\".","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-3.webp","semPrint":false},{"titulo":"Não achou? Pesquise","texto":"Digite o que procura no campo \"Buscar no sistema...\" (por exemplo \"contas\") e clique no resultado.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-4.webp","semPrint":false},{"titulo":"Clique no resultado","texto":"Aparece a lista das telas encontradas. É só clicar na que você quer.","dica":"Aperte Enter para abrir o primeiro resultado da lista.","atencao":"","img":"img-web/conhecendo-o-menu/passo-5.webp","semPrint":false}]},{"id":"cadastrar-cliente","grupo":"Cadastros","titulo":"Cadastrar um cliente","resumo":"Cadastre clientes com nome, CPF/CNPJ, WhatsApp e endereço.","antes":"","destaque":false,"passos":[{"titulo":"Abra a tela de Clientes","texto":"No menu, clique em Cadastros › Clientes. Aqui ficam todos os seus clientes.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo cliente\"","texto":"Clique no botão \"Novo cliente\", no alto da tela.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-2.webp","semPrint":false},{"titulo":"Digite o nome (obrigatório)","texto":"O único campo obrigatório é o Nome. O Código é criado sozinho quando você salva.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-3.webp","semPrint":false},{"titulo":"CPF ou CNPJ","texto":"Digite o CPF ou CNPJ. Se for CNPJ, clique na lupa ao lado: o sistema busca e preenche os dados da empresa sozinho.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-4.webp","semPrint":false},{"titulo":"WhatsApp e e-mail","texto":"Preencha o WhatsApp do cliente. Ele é usado para enviar comprovantes, cobranças e mensagens de aniversário.","dica":"Preencha também o Aniversário: o sistema avisa quando chegar o dia.","atencao":"","img":"img-web/cadastrar-cliente/passo-5.webp","semPrint":false},{"titulo":"Endereço pelo CEP","texto":"Digite o CEP e clique no botão de consultar: rua, bairro, cidade e estado são preenchidos sozinhos. Depois complete o número.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-6.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira os dados e clique em \"Cadastrar\". Pronto: o cliente já aparece na lista e pode ser usado nas vendas.","dica":"Para alterar depois, clique no lápis (Editar) na linha do cliente.","atencao":"","img":"img-web/cadastrar-cliente/passo-7.webp","semPrint":false}]},{"id":"cadastrar-produto","grupo":"Cadastros","titulo":"Cadastrar um produto","resumo":"Cadastre produtos com código, preço, estoque e código de barras.","antes":"","destaque":false,"passos":[{"titulo":"Abra a tela de Produtos","texto":"No menu, clique em Cadastros › Produtos.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo produto\"","texto":"Clique no botão \"Novo produto\".","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-2.webp","semPrint":false},{"titulo":"Código interno e nome","texto":"Preencha o Código interno e o Nome do produto. Esses dois são obrigatórios.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-3.webp","semPrint":false},{"titulo":"Código de barras","texto":"Passe o leitor no código de barras do produto ou digite o número. Se o produto não tiver, clique em \"Gerar EAN\".","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-4.webp","semPrint":false},{"titulo":"Estoque e preço de venda","texto":"Informe quanto tem em estoque, o estoque mínimo (para o sistema avisar quando estiver acabando) e o preço de venda.","dica":"Se você informar o Preço de custo e a Margem (%), o preço de venda é calculado sozinho.","atencao":"","img":"img-web/cadastrar-produto/passo-5.webp","semPrint":false},{"titulo":"Dados fiscais (se você emite nota)","texto":"Na aba \"Fiscal\", preencha o NCM, o CFOP e a origem. Na dúvida, pergunte ao seu contador.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-6.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira e clique em \"Cadastrar\". O produto já pode ser vendido no PDV.","dica":"Para criar um produto parecido, use o botão \"Clonar produto\" na linha dele: copia tudo e você só muda o que precisa.","atencao":"","img":"img-web/cadastrar-produto/passo-7.webp","semPrint":false}]},{"id":"cadastrar-fornecedor","grupo":"Cadastros","titulo":"Cadastrar um fornecedor","resumo":"Cadastre quem vende mercadoria para a sua loja.","antes":"","destaque":false,"passos":[{"titulo":"Clique em \"Novo fornecedor\"","texto":"No menu, clique em Cadastros › Fornecedores e depois em \"Novo fornecedor\".","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Digite o CNPJ e clique na lupa: nome e endereço são preenchidos sozinhos com os dados da Receita.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-2.webp","semPrint":false},{"titulo":"Confira o nome e o contato","texto":"O Nome é obrigatório. Preencha também telefone, WhatsApp e e-mail do vendedor.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Clique em \"Cadastrar\". O fornecedor já pode ser usado nas entradas de mercadoria e no contas a pagar.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-4.webp","semPrint":false}]},{"id":"cadastrar-funcionario","grupo":"Cadastros","titulo":"Cadastrar funcionário e permissões","resumo":"Crie o acesso do funcionário e escolha o que ele pode ver e fazer.","antes":"Só o administrador da empresa consegue cadastrar usuários.","destaque":false,"passos":[{"titulo":"Clique em \"Novo usuário\"","texto":"No menu, clique em Cadastros › Usuários e depois em \"Novo usuário\".","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Escolha o perfil","texto":"Em \"Perfil de acesso\", escolha o que a pessoa faz: Vendedor, Caixa, Gerente, Técnico, Estoquista, Financeiro... O sistema já libera as telas certas para cada perfil.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Nome e forma de entrar","texto":"Digite o nome. Em \"Como o funcionário vai entrar?\", escolha \"Por usuário e senha\" se ele não tem e-mail: você mesmo define o usuário e a senha.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-3.webp","semPrint":false},{"titulo":"Comissão (opcional)","texto":"Se o funcionário ganha comissão, informe a porcentagem sobre serviços e sobre produtos. Ela aparece no relatório de comissões.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-4.webp","semPrint":false},{"titulo":"Ajuste as permissões","texto":"Na aba \"Permissões\", marque as telas que ele pode abrir e o que ele pode fazer (dar desconto, excluir venda...).","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-5.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Clique em \"Cadastrar\". Passe para o funcionário o código da empresa, o usuário e a senha (veja o tutorial \"Entrar como funcionário\").","dica":"","atencao":"Funcionário saiu da empresa? Edite o usuário e desligue \"Ativo\" para bloquear o acesso.","img":"img-web/cadastrar-funcionario/passo-6.webp","semPrint":false}]},{"id":"vender-no-pdv","grupo":"Comercial","titulo":"Fazer uma venda no PDV (caixa)","resumo":"Abra o caixa, lance os produtos e receba o pagamento.","antes":"Ter pelo menos um produto cadastrado. O PDV abre numa aba nova do navegador.","destaque":false,"passos":[{"titulo":"Abra o PDV","texto":"No menu, clique em Comercial › PDV. Ele abre numa aba nova, com os atalhos do caixa.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-1.webp","semPrint":false},{"titulo":"Abra o caixa (início do dia)","texto":"No começo do dia, clique em \"Abrir caixa\", digite o valor do troco que tem na gaveta e confirme em \"Abrir caixa\". Com o caixa aberto, esse mesmo botão vira \"Fechar caixa\".","dica":"Atalho: Ctrl+6. Se o caixa já estiver aberto, pule este passo.","atencao":"","img":"img-web/vender-no-pdv/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Nova venda\"","texto":"Clique em \"Nova venda\" (ou aperte Enter).","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-3.webp","semPrint":false},{"titulo":"Lance os produtos","texto":"Passe o leitor de código de barras ou digite o nome/código do produto e aperte Enter. Repita para cada produto.","dica":"Para lançar várias unidades, digite a quantidade e um asterisco antes: 3*123 lança 3 unidades do produto 123.","atencao":"","img":"img-web/vender-no-pdv/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Finalizar venda\" (F9)","texto":"Com todos os produtos lançados, clique em \"Finalizar venda\" ou aperte F9.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-5.webp","semPrint":false},{"titulo":"Escolha a forma de pagamento e confirme","texto":"Na janela \"Formas de pagamento\", clique na forma (Dinheiro, Pix, Cartão...), digite quanto recebeu e aperte Enter. Quando \"Falta pagar\" zerar, aperte Enter de novo para concluir. O troco aparece na tela.","dica":"Atalhos do caixa: F1 Recebimentos · F2 Orçamentos · F3 Produtos · F4 Vendas · F6 Desconto · F7 Em espera · F8 Devolução · F10 Cliente.","atencao":"Se errar um pagamento, aperte Delete para desfazer antes de confirmar.","img":"img-web/vender-no-pdv/passo-6.webp","semPrint":false}]},{"id":"consultar-vendas","grupo":"Comercial","titulo":"Consultar, imprimir e enviar uma venda","resumo":"Encontre vendas feitas, reimprima o comprovante ou envie pelo WhatsApp.","antes":"","destaque":false,"passos":[{"titulo":"Abra a tela de Vendas","texto":"No menu, clique em Comercial › Vendas. Aparecem as vendas do período.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-1.webp","semPrint":false},{"titulo":"Filtre pelo cliente","texto":"Digite o nome do cliente para ver só as vendas dele. Você também pode mudar o período, a forma de pagamento e o status.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-2.webp","semPrint":false},{"titulo":"Clique nos três pontinhos da venda","texto":"Na linha da venda, clique no botão \"...\" (Ações).","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-3.webp","semPrint":false},{"titulo":"Escolha o que fazer","texto":"Clique em \"Detalhes\" para ver os produtos, \"Imprimir / PDF\" para reimprimir o comprovante ou \"Enviar no WhatsApp\" para mandar para o cliente.","dica":"","atencao":"\"Excluir\" manda a venda para a lixeira e devolve os produtos ao estoque. Use só se a venda foi feita errada.","img":"img-web/consultar-vendas/passo-4.webp","semPrint":false}]},{"id":"fazer-orcamento","grupo":"Comercial","titulo":"Fazer um orçamento","resumo":"Monte o orçamento, envie pelo WhatsApp e depois transforme em venda.","antes":"Ter o cliente e os produtos cadastrados (o cliente também pode ser cadastrado na hora).","destaque":false,"passos":[{"titulo":"Abra a tela de Orçamentos","texto":"No menu, clique em Comercial › Orçamentos.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo orçamento\"","texto":"Clique no botão \"Novo orçamento\".","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-2.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Digite o nome ou CPF/CNPJ do cliente e clique nele na lista. Se ele ainda não existe, clique em \"Cadastrar cliente\".","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-3.webp","semPrint":false},{"titulo":"Adicione os produtos","texto":"Digite o nome ou código do produto e clique nele para incluir. Repita para cada item. Se quiser, dê desconto no item ou no total.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-4.webp","semPrint":false},{"titulo":"Validade","texto":"Confira até quando o orçamento vale.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-5.webp","semPrint":false},{"titulo":"Salve, imprima ou envie","texto":"Clique em \"Salvar\". Você pode imprimir (A4, 80mm ou PDF) ou enviar pelo WhatsApp: o cliente recebe um link para ver e aprovar.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-6.webp","semPrint":false},{"titulo":"Cliente aprovou? Fature no PDV","texto":"Na lista de orçamentos, clique no botão \"Faturar no PDV\" da linha. O orçamento vira uma venda no caixa, já com os produtos.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-7.webp","semPrint":false}]},{"id":"ordem-de-servico","grupo":"Comercial","titulo":"Abrir uma ordem de serviço (OS)","resumo":"Registre o conserto: cliente, veículo/equipamento, serviços, peças e fotos.","antes":"Ter os serviços cadastrados (Cadastros › Serviços e Status) e os mecânicos/técnicos cadastrados como usuários. Os nomes dos campos mudam conforme o ramo: oficina mostra \"Veículo/Placa/Mecânico\"; assistência técnica mostra \"Equipamento/Técnico\".","destaque":false,"passos":[{"titulo":"Clique em \"Nova ordem\"","texto":"No menu, clique em Comercial › Ordens de Serviço e depois em \"Nova ordem\".","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Comece a digitar o nome do cliente e clique nele. Se for cliente novo, clique em \"+ Cadastrar cliente\".","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-2.webp","semPrint":false},{"titulo":"Veículo (ou equipamento) e o defeito","texto":"Preencha o veículo (ou equipamento) e a placa. Escreva o que o cliente reclamou e, depois de olhar, o laudo técnico.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-3.webp","semPrint":false},{"titulo":"Adicione os serviços","texto":"Clique em \"Adicionar serviço\", busque o serviço pelo nome ou código, escolha o mecânico/técnico responsável e confira o valor.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-4.webp","semPrint":false},{"titulo":"Adicione as peças","texto":"Clique em \"Adicionar produto\" para incluir as peças usadas, com a quantidade. Elas saem do estoque.","dica":"Use \"+ Adicionar fotos\" para guardar fotos de antes, durante e depois do serviço.","atencao":"","img":"img-web/ordem-de-servico/passo-5.webp","semPrint":false},{"titulo":"Salve ou gere o orçamento","texto":"Clique em \"Salvar ordem\". Se o cliente ainda vai aprovar, clique em \"Gerar orçamento\" e envie pelo WhatsApp ou imprima.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-6.webp","semPrint":false},{"titulo":"Serviço pronto? Receba no caixa","texto":"Na lista de ordens, clique em \"Receber OS no caixa\" na linha da OS. Ela vai para o PDV para receber o pagamento.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-7.webp","semPrint":false}]},{"id":"condicional","grupo":"Comercial","titulo":"Condicional (cliente leva para provar)","resumo":"O cliente leva os produtos para casa; depois você dá baixa no que voltou e vende o resto.","antes":"","destaque":false,"passos":[{"titulo":"Clique em \"Nova condicional\"","texto":"No menu, clique em Comercial › Condicional e depois em \"Nova condicional\".","dica":"","atencao":"","img":"img-web/condicional/passo-1.webp","semPrint":false},{"titulo":"Cliente e validade","texto":"Digite o nome do cliente e escolha até quando ele pode ficar com os produtos (Validade).","dica":"","atencao":"","img":"img-web/condicional/passo-2.webp","semPrint":false},{"titulo":"Bipe os produtos","texto":"Passe o leitor no código de barras de cada peça (ou digite e aperte Enter).","dica":"","atencao":"","img":"img-web/condicional/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar condicional\"","texto":"Clique em \"Salvar condicional\". Os produtos saem do estoque e você pode imprimir (80mm ou A4) para o cliente assinar.","dica":"","atencao":"","img":"img-web/condicional/passo-4.webp","semPrint":false},{"titulo":"Cliente voltou? Abra a condicional","texto":"Clique na condicional na lista. Use \"Devolver itens\" para bipar o que voltou e depois \"Transformar em venda (ir ao PDV)\" para cobrar o que ele ficou.","dica":"Os filtros \"Para a rua\" e \"Expirado\" mostram quem está com produtos e quem passou do prazo.","atencao":"","img":"img-web/condicional/passo-5.webp","semPrint":false}]},{"id":"caixa-sangria-fechamento","grupo":"Comercial","titulo":"Sangria, suprimento e fechar o caixa","resumo":"Tire ou coloque dinheiro na gaveta e feche o caixa no fim do dia.","antes":"","destaque":false,"passos":[{"titulo":"Sangria: tirar dinheiro da gaveta","texto":"Na tela inicial do PDV, clique em \"Sangria\" (Ctrl+3). Digite o valor, uma descrição e escolha \"Cofre\" ou a despesa (ex.: pagamento de fornecedor). Clique em \"Confirmar\".","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-1.webp","semPrint":false},{"titulo":"Suprimento: colocar troco","texto":"Precisou colocar mais troco? Clique em \"Suprimento\" (Ctrl+4), digite o valor e confirme.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-2.webp","semPrint":false},{"titulo":"Confira o resumo","texto":"Antes de fechar, clique em \"Resumo do caixa\" (Ctrl+5) para ver quanto vendeu em cada forma e quanto deve ter na gaveta.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-3.webp","semPrint":false},{"titulo":"Feche o caixa","texto":"Clique em \"Fechar caixa\" (Ctrl+6). Conte o dinheiro, informe quanto vai retirar (se for levar para o cofre) e clique em \"Fechar caixa\".","dica":"Marque \"Conferir cédulas e moedas\" para contar nota por nota: o sistema soma para você.","atencao":"Feche o caixa todo dia. No dia seguinte, abra de novo com o valor do troco.","img":"img-web/caixa-sangria-fechamento/passo-4.webp","semPrint":false},{"titulo":"Confira os fechamentos","texto":"O dono/gerente vê todos os caixas fechados, com sobras e faltas, em Relatórios › Caixas › Fechamento de Caixa.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-5.webp","semPrint":false}]},{"id":"contas-a-receber","grupo":"Financeiro","titulo":"Contas a receber: lançar e dar baixa","resumo":"Lance o que o cliente vai te pagar e registre quando ele pagar.","antes":"","destaque":false,"passos":[{"titulo":"Abra Contas a Receber","texto":"No menu, clique em Financeiro › Contas a Receber. Os quadros no alto mostram o total recebido, o saldo a receber e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-1.webp","semPrint":false},{"titulo":"Veja as contas em aberto","texto":"Use as abas para ver as contas \"Em aberto/atraso\", as \"Pagas\" ou \"Todas\". Para achar um cliente, digite o nome no filtro.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Nova conta\"","texto":"Para lançar uma conta, clique em \"Nova conta\".","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-3.webp","semPrint":false},{"titulo":"Preencha a conta","texto":"Escolha o cliente, escreva uma descrição, o plano de contas, quantas parcelas, o valor total e o vencimento. Depois clique em \"Salvar\".","dica":"Se o cliente já pagou agora, ligue \"Já foi recebido agora\" e informe a data e a forma de pagamento.","atencao":"","img":"img-web/contas-a-receber/passo-4.webp","semPrint":false},{"titulo":"O cliente pagou? Dê baixa","texto":"Na linha da conta, clique em \"Receber no caixa (PDV)\" ou \"Receber com Pix\". Confira o valor e confirme.","dica":"O botão \"Copiar mensagem de cobrança (WhatsApp)\" já monta a mensagem para você mandar ao cliente.","atencao":"","img":"","semPrint":true}]},{"id":"contas-a-pagar","grupo":"Financeiro","titulo":"Contas a pagar: lançar e pagar","resumo":"Registre suas despesas e boletos e marque quando pagar.","antes":"","destaque":false,"passos":[{"titulo":"Abra Contas a Pagar","texto":"No menu, clique em Financeiro › Contas a Pagar. Os quadros mostram o que já foi pago, o saldo a pagar e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Nova conta\"","texto":"Clique em \"Nova conta\" para lançar uma despesa ou boleto.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-2.webp","semPrint":false},{"titulo":"Diga de quem é a despesa","texto":"Em \"Vínculo da despesa\", escolha Fornecedor, Funcionário ou Despesa geral (luz, aluguel, internet...).","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-3.webp","semPrint":false},{"titulo":"Preencha e salve","texto":"Coloque a descrição, o plano de contas, as parcelas, o valor e o vencimento. Clique em \"Salvar\".","dica":"Conta que se repete todo mês (aluguel, internet)? Cadastre em Financeiro › Recorrências e ela é lançada sozinha.","atencao":"","img":"img-web/contas-a-pagar/passo-4.webp","semPrint":false},{"titulo":"Pagou? Clique em \"Pagar\"","texto":"Na linha da conta, clique em \"Pagar\", confira o valor, a forma e de qual conta saiu o dinheiro, e confirme.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-5.webp","semPrint":false}]},{"id":"formas-de-pagamento","grupo":"Financeiro","titulo":"Configurar formas de pagamento e maquininha","resumo":"Cadastre Pix, cartões e as taxas da maquininha, e diga em que conta cai o dinheiro.","antes":"","destaque":false,"passos":[{"titulo":"Abra \"Formas de pagamento\"","texto":"No menu, clique em Financeiro › Formas de pagamento. São as opções que aparecem no caixa na hora de receber.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Nova forma\"","texto":"Clique em \"Nova forma\".","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-2.webp","semPrint":false},{"titulo":"Nome, tipo e atalho","texto":"Dê o nome que vai aparecer no caixa (ex.: \"Pix C6\"), escolha o tipo (Dinheiro, Pix, Crédito, Débito...) e uma tecla de atalho para usar no PDV.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-3.webp","semPrint":false},{"titulo":"Conta de destino e salvar","texto":"Em \"Conta de destino\", escolha em qual conta o dinheiro cai (ex.: conta do banco). Clique em \"Salvar\".","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-4.webp","semPrint":false},{"titulo":"Taxas da maquininha","texto":"Na aba \"Adquirentes\", cadastre sua maquininha com as taxas de débito, Pix e crédito. Assim o sistema mostra quanto você recebe de verdade e quando o dinheiro cai.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-5.webp","semPrint":false}]},{"id":"recorrencias","grupo":"Financeiro","titulo":"Contas que se repetem todo mês","resumo":"Aluguel, salário, internet: cadastre uma vez e o sistema lança os próximos 12 meses.","antes":"","destaque":false,"passos":[{"titulo":"Clique em \"Nova recorrência\"","texto":"No menu, clique em Financeiro › Recorrências. Para uma conta a pagar, clique em \"Nova recorrência\". Para algo que você recebe todo mês, clique em \"A receber\".","dica":"","atencao":"","img":"img-web/recorrencias/passo-1.webp","semPrint":false},{"titulo":"Nome e plano de contas","texto":"Dê um nome (ex.: Aluguel). O plano de contas é sugerido sozinho pelo nome; confira.","dica":"","atencao":"","img":"img-web/recorrencias/passo-2.webp","semPrint":false},{"titulo":"Para quem","texto":"Escolha se é para um funcionário, um fornecedor ou outros (ex.: Cemig, condomínio).","dica":"","atencao":"","img":"img-web/recorrencias/passo-3.webp","semPrint":false},{"titulo":"Valor e dia do vencimento","texto":"Informe o valor por mês e o dia que vence. O quadro azul mostra quantas contas vão ser lançadas.","dica":"","atencao":"","img":"img-web/recorrencias/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Criar e lançar\"","texto":"Clique em \"Criar e lançar\". As contas aparecem em Contas a Pagar (ou a Receber), uma por mês.","dica":"O valor mudou? Use \"Alterar\": vale de hoje para frente, sem mexer nas contas já pagas.","atencao":"","img":"img-web/recorrencias/passo-5.webp","semPrint":false}]},{"id":"central-de-cobranca","grupo":"Financeiro","titulo":"Cobrar clientes atrasados (Central de cobrança)","resumo":"Veja quem está devendo e mande cobrança pelo WhatsApp para vários de uma vez.","antes":"","destaque":false,"passos":[{"titulo":"Abra a Central de cobrança","texto":"No menu, clique em Financeiro › Central de cobrança. No alto aparece o total vencido e quantos clientes estão atrasados.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-1.webp","semPrint":false},{"titulo":"Escolha a faixa de atraso","texto":"Clique numa faixa (1 a 15 dias, 16 a 30 dias...) para ver só esses clientes.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-2.webp","semPrint":false},{"titulo":"Marque os clientes","texto":"Marque os clientes que você quer cobrar (ou \"Marcar todos\").","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Enviar cobrança\"","texto":"Clique em \"Enviar cobrança\". Confira a mensagem, deixe marcado o link de Pix (o cliente paga e a conta baixa sozinha) e clique em \"Enviar\".","dica":"Clique em \"Ver\" num cliente para anotar \"Prometeu pagar\" com a data. Assim você não cobra de novo antes da hora.","atencao":"","img":"","semPrint":true}]},{"id":"emitir-nota","grupo":"Fiscal","titulo":"Emitir nota fiscal de uma venda","resumo":"Transforme uma venda em NF-e ou NFC-e (cupom fiscal).","antes":"A empresa precisa ter o fiscal configurado (certificado digital) e o produto com NCM preenchido.","destaque":false,"passos":[{"titulo":"Veja as vendas sem nota","texto":"No menu, clique em Fiscal › Notas a emitir. Aparecem as vendas que ainda não viraram nota fiscal. Use \"Hoje\", \"Este mês\" ou \"Todo o período\" para escolher as datas.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-1.webp","semPrint":false},{"titulo":"Abra a venda em Vendas","texto":"Para emitir, vá em Comercial › Vendas e encontre a venda (digite o nome do cliente para achar mais rápido).","dica":"","atencao":"","img":"img-web/emitir-nota/passo-2.webp","semPrint":false},{"titulo":"Clique em \"NF-e\" ou \"NFC-e\"","texto":"Na linha da venda, clique em \"NF-e\" (nota para empresa ou entrega) ou \"NFC-e\" (cupom fiscal para consumidor).","dica":"Na dúvida entre NF-e e NFC-e, pergunte ao seu contador qual usar.","atencao":"","img":"img-web/emitir-nota/passo-3.webp","semPrint":false},{"titulo":"Confira e clique em \"Continuar emissão\"","texto":"Confira os dados do cliente e dos produtos na janela e clique em \"Continuar emissão\". Em alguns segundos a nota é autorizada.","dica":"","atencao":"Nota emitida vale para a Receita. Confira o cliente e os valores antes de continuar.","img":"img-web/emitir-nota/passo-4.webp","semPrint":false},{"titulo":"Veja as notas emitidas","texto":"As notas autorizadas ficam em Fiscal › Notas emitidas. Lá você imprime, baixa o XML ou envia para o cliente pelo botão \"Ações\".","dica":"Se a nota voltar com erro, ela vai para Fiscal › Corrigir pendências. Veja o tutorial \"Corrigir nota com erro\".","atencao":"","img":"img-web/emitir-nota/passo-5.webp","semPrint":false}]},{"id":"corrigir-pendencias","grupo":"Fiscal","titulo":"Corrigir nota com erro (rejeitada)","resumo":"A nota voltou com erro? Veja o motivo, corrija e transmita de novo.","antes":"","destaque":false,"passos":[{"titulo":"Abra \"Corrigir pendências\"","texto":"No menu, clique em Fiscal › Corrigir pendências. Cada cartão é uma venda cuja nota não foi autorizada.","dica":"","atencao":"","img":"img-web/corrigir-pendencias/passo-1.webp","semPrint":false},{"titulo":"Leia o motivo do erro","texto":"Clique em \"Detalhes da pendência\" para ver o que a Receita (SEFAZ) recusou. Normalmente é um dado do cliente ou do produto (CPF, endereço, NCM).","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Corrija o cadastro","texto":"Clique no botão de cadastro do cartão (por exemplo \"Conferir cadastro\") e arrume o dado que estava errado.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Clique em \"Corrigir e transmitir novamente\"","texto":"Depois de corrigir, clique em \"Corrigir e transmitir novamente\". Escolha se é cupom (NFC-e) ou nota (NF-e) e clique em \"Emitir nota\".","dica":"Use \"Conferir dados sem emitir\" para checar se ainda tem algum erro antes de enviar.","atencao":"","img":"","semPrint":true}]},{"id":"arquivos-contador","grupo":"Fiscal","titulo":"Mandar os arquivos do mês para o contador","resumo":"Baixe o pacote com todos os XMLs do mês ou envie o acesso ao contador.","antes":"","destaque":false,"passos":[{"titulo":"Abra \"Arquivos para contador\"","texto":"No menu, clique em Fiscal › Arquivos para contador.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-1.webp","semPrint":false},{"titulo":"Escolha o mês","texto":"Clique em \"Mês passado\" (o mais comum: o contador fecha o mês anterior) ou escolha as datas em Início e Fim.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-2.webp","semPrint":false},{"titulo":"Baixe o pacote ZIP","texto":"Confira os totais e clique em \"Baixar pacote contábil ZIP\". Depois é só mandar esse arquivo para o contador.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-3.webp","semPrint":false},{"titulo":"Ou envie o acesso pelo WhatsApp","texto":"Prefere que o contador baixe sozinho? Clique em \"Enviar acesso ao contador pelo WhatsApp\". Ele entra no Portal do Contador e pega os arquivos.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-4.webp","semPrint":false}]},{"id":"entrada-nfe","grupo":"Estoque","titulo":"Dar entrada na nota do fornecedor (NF-e)","resumo":"As notas de compra chegam sozinhas da SEFAZ: confira e importe no estoque.","antes":"Precisa do certificado digital cadastrado. Sem ele, use o botão \"Importar XML\" com o arquivo que o fornecedor mandou.","destaque":false,"passos":[{"titulo":"Abra \"Entrada de NF-e\"","texto":"No menu, clique em Estoque › Entrada de NF-e. Aparecem as notas que os fornecedores emitiram para o CNPJ da sua loja.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-1.webp","semPrint":false},{"titulo":"Busque novas notas","texto":"Clique em \"Atualizar agora\" para buscar as notas mais recentes na SEFAZ.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-2.webp","semPrint":false},{"titulo":"Encontre a nota","texto":"Digite o nome do fornecedor, o CNPJ ou o número da nota no campo de busca.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Importar\"","texto":"Na linha da nota, clique em \"Importar\". Confira os produtos (o sistema liga cada item ao seu cadastro) e clique em \"Confirmar e importar\". O estoque e o contas a pagar são atualizados.","dica":"Use o ícone \"Visualizar\" para ver a nota antes de importar.","atencao":"","img":"","semPrint":true},{"titulo":"Recebeu o XML por e-mail? Importe o arquivo","texto":"Se a nota não apareceu na lista, clique em \"Importar XML\" e escolha o arquivo .xml que o fornecedor mandou.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-5.webp","semPrint":false}]},{"id":"entrada-manual","grupo":"Estoque","titulo":"Entrada manual de mercadoria (sem nota)","resumo":"Lance uma compra à mão: produtos, pagamento e preço de venda.","antes":"O fornecedor e os produtos podem ser cadastrados na hora, dentro da própria entrada.","destaque":false,"passos":[{"titulo":"Clique em \"Nova entrada\"","texto":"No menu, clique em Estoque › Entrada Manual e depois em \"Nova entrada\" (atalho F1).","dica":"","atencao":"","img":"img-web/entrada-manual/passo-1.webp","semPrint":false},{"titulo":"Escolha o fornecedor","texto":"Digite o nome do fornecedor, use a seta para baixo e aperte Enter. Se ele não existe, clique em \"+ Cadastrar\".","dica":"","atencao":"","img":"img-web/entrada-manual/passo-2.webp","semPrint":false},{"titulo":"Lance os produtos","texto":"Digite o nome, código ou passe o código de barras e aperte Enter. Para cada produto, informe a quantidade e o custo unitário.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-3.webp","semPrint":false},{"titulo":"Informe o pagamento","texto":"Clique em \"2. Pagamento\", escolha a forma (à vista, boleto, a prazo) e as parcelas. As parcelas viram contas a pagar.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-4.webp","semPrint":false},{"titulo":"Confira os preços de venda","texto":"Em \"3. Custos\", veja o novo custo de cada produto. Você pode aplicar uma margem para todos ou manter os preços atuais.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-5.webp","semPrint":false},{"titulo":"Clique em \"Gerar entrada\"","texto":"Tudo certo? Clique em \"Gerar entrada\" (F1). O estoque sobe na hora. Se ainda não terminou, use \"Salvar em aberto\" (F2) e continue depois.","dica":"Depois de gerar, use \"Imprimir etiquetas\" para etiquetar os produtos que chegaram.","atencao":"","img":"img-web/entrada-manual/passo-6.webp","semPrint":false}]},{"id":"ajuste-estoque","grupo":"Estoque","titulo":"Corrigir estoque e preços (ajuste)","resumo":"Acerte a quantidade em estoque e os preços de vários produtos de uma vez.","antes":"","destaque":false,"passos":[{"titulo":"Abra \"Ajuste de Estoque\"","texto":"No menu, clique em Estoque › Ajuste de Estoque.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-1.webp","semPrint":false},{"titulo":"Ache o produto","texto":"Digite o nome ou código do produto. Os botões \"Estoque negativo\" e \"Estoque zerado\" mostram só os produtos com problema.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-2.webp","semPrint":false},{"titulo":"Digite o novo estoque","texto":"Na coluna \"Novo estoque\", digite a quantidade certa (a que você contou na prateleira). Se quiser, mude também o custo e o preço de venda.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar alterações\"","texto":"Clique em \"Salvar alterações\". O número entre parênteses mostra quantos produtos você mudou. O valor antigo fica guardado no histórico.","dica":"Errou? Clique em \"Desfazer alterações não salvas\" antes de salvar.","atencao":"","img":"img-web/ajuste-estoque/passo-4.webp","semPrint":false}]},{"id":"etiquetas","grupo":"Estoque","titulo":"Imprimir etiquetas de preço","resumo":"Escolha o modelo, marque os produtos e imprima.","antes":"","destaque":false,"passos":[{"titulo":"Escolha o tipo de etiqueta","texto":"No menu, clique em Estoque › Etiquetas. Escolha: etiqueta de código (código de barras), de produto ou de gôndola (prateleira).","dica":"","atencao":"","img":"img-web/etiquetas/passo-1.webp","semPrint":false},{"titulo":"Escolha o modelo","texto":"Clique no modelo do papel de etiqueta que você usa (o tamanho aparece em milímetros).","dica":"","atencao":"","img":"img-web/etiquetas/passo-2.webp","semPrint":false},{"titulo":"Busque os produtos","texto":"Digite o nome ou código, ou passe o leitor no código de barras. Para etiquetar o que mudou de preço, use o filtro \"Preço alterado por data\".","dica":"","atencao":"","img":"img-web/etiquetas/passo-3.webp","semPrint":false},{"titulo":"Marque e diga quantas etiquetas","texto":"Marque cada produto e digite quantas etiquetas quer dele. Depois clique em \"Conferir etiquetas\".","dica":"","atencao":"","img":"img-web/etiquetas/passo-4.webp","semPrint":false},{"titulo":"Imprima","texto":"Confira a prévia. Na primeira vez, use \"Imprimir uma de teste\" para ver se ficou alinhado. Depois clique em \"Imprimir etiquetas\".","dica":"Já usou parte da folha? Marque \"Pular posições já usadas na primeira folha\" para não desperdiçar etiqueta.","atencao":"","img":"img-web/etiquetas/passo-5.webp","semPrint":false}]},{"id":"relatorio-caixas-dre","grupo":"Relatórios","titulo":"Ver o lucro do mês (DRE) e o relatório de caixas","resumo":"Descubra se a loja deu lucro e confira o dinheiro de cada caixa.","antes":"","destaque":false,"passos":[{"titulo":"Abra o DRE","texto":"No menu, clique em Relatórios › Financeiro › DRE. Ele mostra vendas, custo das mercadorias, despesas e o lucro líquido.","dica":"","atencao":"","img":"img-web/relatorio-caixas-dre/passo-1.webp","semPrint":false},{"titulo":"Escolha o mês","texto":"Clique em \"Mês atual\" ou \"Mês anterior\". O quadro \"Lucro líquido\" diz quanto sobrou de verdade.","dica":"Para o DRE ficar certo, os produtos precisam ter preço de custo e as despesas precisam estar com o plano de contas preenchido.","atencao":"","img":"img-web/relatorio-caixas-dre/passo-2.webp","semPrint":false},{"titulo":"Relatório de Caixas","texto":"Em Relatórios › Caixas › Relatório de Caixa você vê o que entrou, saiu e o dinheiro que deveria estar na gaveta. Clique num caixa para ver os detalhes.","dica":"","atencao":"","img":"img-web/relatorio-caixas-dre/passo-3.webp","semPrint":false}]},{"id":"dados-da-empresa","grupo":"Configurações","titulo":"Dados da empresa e logo","resumo":"Preencha CNPJ, endereço, contatos e o logo que saem nos comprovantes.","antes":"","destaque":false,"passos":[{"titulo":"Abra \"Dados da Empresa\"","texto":"No menu, clique em Configurações › Dados da Empresa.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Digite o CNPJ e clique em \"Buscar CNPJ\": razão social e endereço são preenchidos sozinhos.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-2.webp","semPrint":false},{"titulo":"Coloque o logo","texto":"Em \"Logo da empresa\", envie a imagem do seu logo. Ele aparece nos comprovantes, orçamentos e PDFs.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar configurações\"","texto":"Confira telefone, WhatsApp e e-mail e clique em \"Salvar configurações\".","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-4.webp","semPrint":false}]},{"id":"impressoras","grupo":"Configurações","titulo":"Configurar a impressora de cupom","resumo":"Cadastre a impressora (cupom 80mm ou A4) e escolha se imprime sozinho.","antes":"A impressora precisa estar instalada e compartilhada no Windows.","destaque":false,"passos":[{"titulo":"Clique em \"Nova impressora\"","texto":"No menu, clique em Configurações › Impressoras e depois em \"Nova impressora\".","dica":"","atencao":"","img":"img-web/impressoras/passo-1.webp","semPrint":false},{"titulo":"Apelido e impressora","texto":"Dê um apelido (ex.: Cupom Balcão) e escolha a impressora. No aplicativo TH Gestor, o botão \"Listar\" mostra as impressoras do computador.","dica":"","atencao":"","img":"img-web/impressoras/passo-2.webp","semPrint":false},{"titulo":"Formato e comportamento","texto":"Escolha \"Bobina (cupom 80mm)\" ou \"Folha A4\", e se nas vendas o sistema deve perguntar, imprimir direto ou não imprimir.","dica":"","atencao":"","img":"img-web/impressoras/passo-3.webp","semPrint":false},{"titulo":"Salve e teste","texto":"Ligue \"Impressora padrão\" e clique em \"Salvar\". Depois use o botão \"Imprimir teste\" na lista para conferir.","dica":"","atencao":"","img":"img-web/impressoras/passo-4.webp","semPrint":false}]},{"id":"whatsapp","grupo":"Configurações","titulo":"Conectar o WhatsApp e editar as mensagens","resumo":"Ligue o WhatsApp da loja ao sistema e personalize as mensagens enviadas.","antes":"Tenha em mãos o celular com o WhatsApp da empresa.","destaque":false,"passos":[{"titulo":"Abra as configurações do WhatsApp","texto":"No menu, clique em WhatsApp › Configurações e mensagens.","dica":"","atencao":"","img":"img-web/whatsapp/passo-1.webp","semPrint":false},{"titulo":"Conecte pelo QR Code","texto":"Clique em \"Conectar WhatsApp\". No celular, abra o WhatsApp › Aparelhos conectados › Conectar aparelho e aponte a câmera para o QR Code.","dica":"","atencao":"","img":"img-web/whatsapp/passo-2.webp","semPrint":false},{"titulo":"Escolha o que sai automático","texto":"Em \"Envio automático\", diga se o comprovante de venda, a OS e o orçamento vão sozinhos para o cliente ou só quando você clicar.","dica":"","atencao":"","img":"img-web/whatsapp/passo-3.webp","semPrint":false},{"titulo":"Edite as mensagens","texto":"Clique na aba do assunto (Comercial, Ordens de serviço, Cobranças, Relacionamento), mude o texto e clique em \"Salvar mensagens\".","dica":"Abra \"Campos disponíveis\" para colocar o nome do cliente, valor e outros dados automáticos na mensagem.","atencao":"","img":"img-web/whatsapp/passo-4.webp","semPrint":false}]}];
const DESTAQUES = ["vender-no-pdv","cadastrar-cliente","cadastrar-produto","emitir-nota","contas-a-receber","caixa-sangria-fechamento"];
const ICONES = {"Primeiros passos":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4\"/><path d=\"m10 17 5-5-5-5\"/><path d=\"M15 12H3\"/></svg>","Cadastros":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M9 12h6M9 16h6\"/></svg>","Comercial":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"20\" r=\"1.5\"/><circle cx=\"18\" cy=\"20\" r=\"1.5\"/><path d=\"M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6\"/></svg>","Financeiro":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5\"/></svg>","Fiscal":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M8 13h8M8 17h5\"/></svg>","Estoque":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>","Relatórios":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M8 17v-5M13 17V8M18 17v-9\"/></svg>","Configurações":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/></svg>","WhatsApp":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z\"/></svg>","Outros":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v4l3 2\"/></svg>"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ic = g => ICONES[g] || ICONES.Outros;
const grupos = [...new Set(TUTORIAIS.map(t => t.grupo))];
const SVG_DICA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>';
const SVG_ATEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>';
const SVG_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function menu(atual){
  $('#menu').innerHTML = '<a href="#" class="inicio '+(atual?'':'ativo')+'">Início</a>' + grupos.map(g =>
    '<h3>'+ic(g)+esc(g)+'</h3>' + TUTORIAIS.filter(t=>t.grupo===g).map(t =>
      '<a href="#'+t.id+'" class="'+(t.id===atual?'ativo':'')+'">'+esc(t.titulo)+'</a>').join('')).join('');
}
const passosCom = t => t.passos.length + ' passo' + (t.passos.length > 1 ? 's' : '');
function cartoes(lista, comIcone){
  if(!lista.length) return '<p class="vazio">Nenhum tutorial encontrado. Tente outra palavra, como "venda", "cliente" ou "nota".</p>';
  return '<div class="grade">'+lista.map(t =>
    '<a class="cartao" href="#'+t.id+'">'+(comIcone?'<div class="ic">'+ic(t.grupo)+'</div>':'')+'<b>'+esc(t.titulo)+'</b><span>'+esc(t.resumo)+'</span><em><i>'+passosCom(t)+'</i>Ver tutorial →</em></a>').join('')+'</div>';
}
function inicio(filtro){
  document.body.classList.remove('lendo');
  menu('');
  const q = norm(filtro||'').split(/\s+/).filter(Boolean);
  if (q.length) {
    const lista = TUTORIAIS.filter(t => { const txt = norm([t.titulo,t.resumo,t.grupo,...t.passos.map(p=>p.titulo+' '+p.texto)].join(' ')); return q.every(w=>txt.includes(w)); });
    $('#conteudo').innerHTML = '<section class="secao"><h2 class="secao-titulo">Resultados para “'+esc(filtro)+'”</h2>'+cartoes(lista, true)+'</section>';
    return;
  }
  const dest = DESTAQUES.map(id => TUTORIAIS.find(t => t.id === id)).filter(Boolean);
  $('#conteudo').innerHTML =
    (dest.length ? '<section class="secao destaques"><h2 class="secao-titulo">Mais procurados</h2>'+cartoes(dest, true)+'</section>' : '') +
    grupos.map(g => '<section class="secao"><h2 class="secao-titulo"><span class="ic">'+ic(g)+'</span>'+esc(g)+'</h2>'+cartoes(TUTORIAIS.filter(t=>t.grupo===g))+'</section>').join('');
}
function tutorial(t){
  document.body.classList.add('lendo');
  menu(t.id);
  const i = TUTORIAIS.indexOf(t), ant = TUTORIAIS[i-1], prox = TUTORIAIS[i+1];
  $('#conteudo').innerHTML = '<article class="tutorial">'
   + '<a class="voltar" href="#">← Todos os tutoriais</a>'
   + '<div class="cab-tut"><div class="ic">'+ic(t.grupo)+'</div><div><small>'+esc(t.grupo)+' · '+passosCom(t)+'</small><h2>'+esc(t.titulo)+'</h2><p class="resumo">'+esc(t.resumo)+'</p></div></div>'
   + (t.antes ? '<div class="antes"><b>Antes de começar:</b> '+esc(t.antes)+'</div>' : '')
   + '<div class="indice"><b>Neste tutorial</b><ol>'+t.passos.map((p,n)=>'<li><a href="#'+t.id+'/'+(n+1)+'">'+esc(p.titulo)+'</a></li>').join('')+'</ol></div>'
   + t.passos.map((p,n) => '<section class="passo" id="p'+(n+1)+'"><div class="passo-topo"><div class="num">'+(n+1)+'</div><div>'
      + '<h3>'+esc(p.titulo)+'</h3><p>'+esc(p.texto)+'</p></div></div>'
      + (p.img ? '<img loading="lazy" src="'+p.img+'" alt="Passo '+(n+1)+': '+esc(p.titulo)+'">' : p.semPrint ? '' : '<div class="sem-img">Imagem deste passo ainda não capturada.</div>')
      + (p.atencao ? '<div class="caixa aten">'+SVG_ATEN+'<div><b>Atenção:</b> '+esc(p.atencao)+'</div></div>' : '')
      + (p.dica ? '<div class="caixa dica">'+SVG_DICA+'<div><b>Dica:</b> '+esc(p.dica)+'</div></div>' : '')
      + '</section>').join('')
   + '<div class="fim"><div class="ok">'+SVG_OK+'</div><b>Pronto!</b><span>Ficou com dúvida? Fale com o suporte da Thiago Informática.</span></div>'
   + '<div class="nav-tut">'+(ant?'<a href="#'+ant.id+'">← '+esc(ant.titulo)+'</a>':'<span></span>')+(prox?'<a href="#'+prox.id+'">'+esc(prox.titulo)+' →</a>':'')+'</div>'
   + '</article>';
}
function rota(){
  const [id, passo] = location.hash.slice(1).split('/');
  const t = TUTORIAIS.find(x => x.id === id);
  if (t) { tutorial(t); const alvo = passo && document.getElementById('p'+passo); alvo ? alvo.scrollIntoView() : scrollTo(0,0); }
  else inicio($('#busca').value);
}
$('#busca').addEventListener('input', e => { if (location.hash) history.replaceState(null,'',location.pathname); inicio(e.target.value); });
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => { $('#busca').value = b.dataset.q; if (location.hash) history.replaceState(null,'',location.pathname); inicio(b.dataset.q); $('#conteudo').scrollIntoView(); }));
$('#conteudo').addEventListener('click', e => { if (e.target.matches('.passo img')) { $('#zoom img').src = e.target.src; $('#zoom').style.display = 'flex'; } });
$('#zoom').addEventListener('click', () => $('#zoom').style.display = 'none');
addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoom').style.display = 'none'; });
addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
