o cliente recebe um agradecimento e pode dar uma nota de 0 a 10 para a loja.","dica":"","atencao":"","img":"img-web/whatsapp-automatico/passo-3.webp","semPrint":false},{"titulo":"Aniversários: parabéns automático","texto":"Em WhatsApp › Aniversários, ligue a régua e o cliente recebe os parabéns no dia do aniversário.","dica":"O aniversário precisa estar no cadastro do cliente.","atencao":"","img":"img-web/whatsapp-automatico/passo-4.webp","semPrint":false}]},{"id":"configurar-avaliacoes","grupo":"WhatsApp","titulo":"Configurar as avaliações dos clientes","resumo":"Como e quando pedir a opinião do cliente, o que fazer com quem ficou insatisfeito e a avaliação no Google.","antes":"","destaque":false,"video":"videos-web/configurar-avaliacoes.mp4","capa":"","passos":[{"titulo":"Abra Configurar avaliações","texto":"Em WhatsApp, Configurar avaliações. Primeiro você escolhe qual nota vale no painel e como mandar o pedido de avaliação.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Cliente insatisfeito","texto":"Quem dá nota até seis cai aqui: você recebe o aviso e pode ligar pro cliente antes que ele fale mal da loja.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Avaliação no Google","texto":"E aqui você coloca o link do Google da sua loja, conecta pra trazer as avaliações pro painel, e ajusta a mensagem que o cliente recebe.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"os-retirada","grupo":"WhatsApp","titulo":"OS prontas que o cliente não buscou","resumo":"Veja as OS concluídas que o cliente ainda não veio buscar e avise pelo WhatsApp com o link da OS.","antes":"","destaque":false,"video":"","capa":"","passos":[{"titulo":"Abra as OS prontas não retiradas","texto":"No menu, clica em Relatórios, Serviços, OS prontas não retiradas. Lá em cima você vê quantas OS estão paradas, o valor parado e a média de dias.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Há quantos dias","texto":"Escolhe há quantos dias está pronta: cinco, dez, quinze, trinta dias, até um ano, ou Todas. Dá pra buscar o cliente, filtrar pelo técnico e pela data.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A mensagem pronta","texto":"Clica em Mensagem e você vê o texto que vai pro cliente, com o link da OS. Dali mesmo é só clicar em Abrir no WhatsApp.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Avisar várias de uma vez","texto":"Pra avisar várias, marca as OS, e aparece o botão Avisar marcadas pelo WhatsApp. Com o WhatsApp da empresa conectado, ele manda sozinho, uma por uma.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Aviso automático","texto":"E aqui em cima você liga o aviso automático: depois de tantos dias, no horário que você escolher, o sistema avisa sozinho.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"whatsapp-ordem-servico","grupo":"WhatsApp","titulo":"Avisar o cliente da OS pelo WhatsApp","resumo":"Escolha se o cliente recebe mensagem quando a OS muda de status e edite o texto.","antes":"","destaque":false,"video":"videos-web/whatsapp-ordem-servico.mp4","capa":"videos-web/whatsapp-ordem-servico.jpg","passos":[{"titulo":"Quando a OS muda de status","texto":"Em WhatsApp › Ordem de serviço, escolha \"Enviar automático\" (o cliente recebe sozinho), \"Abrir telinha para enviar\" ou \"Não avisar\". Depois marque em quais status avisar (ex.: Pronto para retirar) e clique em \"Salvar status\".","dica":"","atencao":"","img":"img-web/whatsapp-ordem-servico/passo-1.webp","semPrint":false},{"titulo":"Edite as mensagens","texto":"Em \"3. Mensagens da OS\", mude o texto. Use os campos entre chaves, como {nome}, {numero} e {status}, que o sistema troca sozinho. Clique em \"Salvar mensagens\".","dica":"","atencao":"","img":"img-web/whatsapp-ordem-servico/passo-2.webp","semPrint":false}]},{"id":"avaliacoes","grupo":"WhatsApp","titulo":"Avaliações dos clientes (pesquisa de satisfação)","resumo":"Veja a nota que os clientes dão à loja e chame quem ficou insatisfeito.","antes":"Ligue a \"Pesquisa de satisfação\" em Configurações › Recursos inteligentes.","destaque":false,"video":"videos-web/avaliacoes.mp4","capa":"videos-web/avaliacoes.jpg","passos":[{"titulo":"Veja a nota da loja","texto":"Em WhatsApp › Avaliações, escolha o período. O NPS mostra quantos clientes recomendariam a loja; aparecem também a nota média e o que mais incomoda.","dica":"","atencao":"","img":"img-web/avaliacoes/passo-1.webp","semPrint":false},{"titulo":"Recupere quem ficou insatisfeito","texto":"Em \"Recuperar clientes\", clique em \"Chamar\" para falar com o cliente pelo WhatsApp. Resolveu? Clique em \"Resolvido\".","dica":"Cliente bem atendido depois de uma reclamação costuma virar fã da loja.","atencao":"","img":"img-web/avaliacoes/passo-2.webp","semPrint":false}]},{"id":"configuracoes-ordem-servico","grupo":"Configurações","titulo":"Configurar a Ordem de Serviço","resumo":"Numeração, garantia, impressão, etiqueta e WhatsApp automático para técnico e cliente.","antes":"","destaque":false,"video":"videos-web/configuracoes-ordem-servico.mp4","capa":"videos-web/configuracoes-ordem-servico.jpg","passos":[{"titulo":"Escolha o assunto no menu","texto":"Em Configurações › Ordem de Serviço, o menu de cima separa os assuntos: Geral, Impressão, Etiqueta, WhatsApp, Agenda, Atrasos e Dias.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-1.webp","semPrint":false},{"titulo":"Geral: número, garantia e equipamento","texto":"Em \"Geral\" você define o próximo número de OS, o termo de garantia que sai no PDF e se o equipamento é obrigatório ou opcional na OS.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-2.webp","semPrint":false},{"titulo":"Impressão e etiqueta","texto":"Em \"Impressão\" escolha A4 ou bobina e se a OS imprime sozinha ao salvar. Em \"Etiqueta\" escolha se a etiqueta da OS sai junto, sozinha ou só pelo ícone.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-3.web const DESTAQUES = ["vender-no-pdv","cadastrar-cliente","cadastrar-produto","emitir-nota","contas-a-receber","caixa-sangria-fechamento"];
const ICONES = {"Primeiros passos":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4\"/><path d=\"m10 17 5-5-5-5\"/><path d=\"M15 12H3\"/></svg>","Cadastros":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M9 12h6M9 16h6\"/></svg>","Comercial":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"20\" r=\"1.5\"/><circle cx=\"18\" cy=\"20\" r=\"1.5\"/><path d=\"M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6\"/></svg>","Financeiro":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5\"/></svg>","Fiscal":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M8 13h8M8 17h5\"/></svg>","Estoque":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>","Relatórios":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M8 17v-5M13 17V8M18 17v-9\"/></svg>","Configurações":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/></svg>","WhatsApp":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z\"/></svg>","Outros":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v4l3 2\"/></svg>"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ic = g => ICONES[g] || ICONES.Outros;
const grupos = [...new Set(TUTORIAIS.map(t => t.grupo))];
const SVG_DICA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>';
const SVG_ATEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>';
const SVG_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function menu(atual){
  $('#menu').innerHTML = '<a href="#" class="inicio '+(atual?'':'ativo')+'">Início</a>' + grupos.map(g =>
    '<h3>'+ic(g)+esc(g)+'</h3>' + TUTORIAIS.filter(t=>t.grupo===g).map(t =>
      '<a href="#'+t.id+'" class="'+(t.id===atual?'ativo':'')+'">'+esc(t.titulo)+'</a>').join('')).join('');
}
const passosCom = t => t.passos.length + ' passo' + (t.passos.length > 1 ? 's' : '');
function cartoes(lista, comIcone){
  if(!lista.length) return '<p class="vazio">Nenhum tutorial encontrado. Tente outra palavra, como "venda", "cliente" ou "nota".</p>';
  return '<div class="grade">'+lista.map(t =>
    '<a class="cartao" href="#'+t.id+'">'+(comIcone?'<div class="ic">'+ic(t.grupo)+'</div>':'')+'<b>'+esc(t.titulo)+'</b><span>'+esc(t.resumo)+'</span><em><i>'+passosCom(t)+'</i>'+(t.video?'<i class="v">▶ vídeo</i>':'')+'Ver tutorial →</em></a>').join('')+'</div>';
}
function inicio(filtro){
  document.body.classList.remove('lendo');
  menu('');
  const q = norm(filtro||'').split(/\s+/).filter(Boolean);
  if (q.length) {
    const lista = TUTORIAIS.filter(t => { const txt = norm([t.titulo,t.resumo,t.grupo,...t.passos.map(p=>p.titulo+' '+p.texto)].join(' ')); return q.every(w=>txt.includes(w)); });
    $('#conteudo').innerHTML = '<section class="secao"><h2 class="secao-titulo">Resultados para “'+esc(filtro)+'”</h2>'+cartoes(lista, true)+'</section>';
    return;
  }
  const dest = DESTAQUES.map(id => TUTORIAIS.find(t => t.id === id)).filter(Boolean);
  $('#conteudo').innerHTML =
    (dest.length ? '<section class="secao destaques"><h2 class="secao-titulo">Mais procurados</h2>'+cartoes(dest, true)+'</section>' : '') +
    grupos.map(g => '<section class="secao"><h2 class="secao-titulo"><span class="ic">'+ic(g)+'</span>'+esc(g)+'</h2>'+cartoes(TUTORIAIS.filter(t=>t.grupo===g))+'</section>').join('');
}
function tutorial(t){
  document.body.classList.add('lendo');
  menu(t.id);
  const i = TUTORIAIS.indexOf(t), ant = TUTORIAIS[i-1], prox = TUTORIAIS[i+1];
  $('#conteudo').innerHTML = '<article class="tutorial">'
   + '<a class="voltar" href="#">← Todos os tutoriais</a>'
   + '<div class="cab-tut"><div class="ic">'+ic(t.grupo)+'</div><div><small>'+esc(t.grupo)+' · '+passosCom(t)+'</small><h2>'+esc(t.titulo)+'</h2><p class="resumo">'+esc(t.resumo)+'</p></div></div>'
   + (t.video ? '<div class="video"><video controls preload="none" playsinline'+(t.capa?' poster="'+t.capa+'"':'')+' src="'+t.video+'"></video><small>Assista ao vídeo com narração ou siga os passos com imagens logo abaixo.</small></div>' : '')
   + (t.antes ? '<div class="antes"><b>Antes de começar:</b> '+esc(t.antes)+'</div>' : '')
   + '<div class="indice"><b>Neste tutorial</b><ol>'+t.passos.map((p,n)=>'<li><a href="#'+t.id+'/'+(n+1)+'">'+esc(p.titulo)+'</a></li>').join('')+'</ol></div>'
   + t.passos.map((p,n) => '<section class="passo" id="p'+(n+1)+'"><div class="passo-topo"><div class="num">'+(n+1)+'</div><div>'
      + '<h3>'+esc(p.titulo)+'</h3><p>'+esc(p.texto)+'</p></div></div>'
      + (p.img ? '<img loading="lazy" src="'+p.img+'" alt="Passo '+(n+1)+': '+esc(p.titulo)+'">' : p.semPrint ? '' : '<div class="sem-img">Imagem deste passo ainda não capturada.</div>')
      + (p.atencao ? '<div class="caixa aten">'+SVG_ATEN+'<div><b>Atenção:</b> '+esc(p.atencao)+'</div></div>' : '')
      + (p.dica ? '<div class="caixa dica">'+SVG_DICA+'<div><b>Dica:</b> '+esc(p.dica)+'</div></div>' : '')
      + '</section>').join('')
   + '<div class="fim"><div class="ok">'+SVG_OK+'</div><b>Pronto!</b><span>Ficou com dúvida? Fale com o suporte da Thiago Informática.</span></div>'
   + '<div class="nav-tut">'+(ant?'<a href="#'+ant.id+'">← '+esc(ant.titulo)+'</a>':'<span></span>')+(prox?'<a href="#'+prox.id+'">'+esc(prox.titulo)+' →</a>':'')+'</div>'
   + '</article>';
}
function rota(){
  const [id, passo] = location.hash.slice(1).split('/');
  const t = TUTORIAIS.find(x => x.id === id);
  if (t) { tutorial(t); const alvo = passo && document.getElementById('p'+passo); alvo ? alvo.scrollIntoView() : scrollTo(0,0); }
  else inicio($('#busca').value);
}
$('#busca').addEventListener('input', e => { if (location.hash) history.replaceState(null,'',location.pathname); inicio(e.target.value); });
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => { $('#busca').value = b.dataset.q; if (location.hash) history.replaceState(null,'',location.pathname); inicio(b.dataset.q); $('#conteudo').scrollIntoView(); }));
$('#conteudo').addEventListener('click', e => { if (e.target.matches('.passo img')) { $('#zoom img').src = e.target.src; $('#zoom').style.display = 'flex'; } });
$('#zoom').addEventListener('click', () => $('#zoom').style.display = 'none');
addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoom').style.display = 'none'; });
addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
