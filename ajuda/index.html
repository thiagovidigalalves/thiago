<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Ajuda</title>
<style>
:root{--azul:#0b1a4a;--azul2:#1d3a8a;--vermelho:#ef4444;--fundo:#f4f6fb;--card:#fff;--texto:#1f2937;--suave:#6b7280;--borda:#e5e7eb;--dica:#ecfdf5;--dica-b:#10b981;--aten:#fff7ed;--aten-b:#f97316}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);font-size:17px;line-height:1.55}
a{color:inherit}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:22px 20px 26px}
header .wrap{max-width:1180px;margin:0 auto}
header h1{margin:0 0 4px;font-size:26px}
header p{margin:0 0 14px;opacity:.85}
#busca{width:100%;max-width:560px;padding:13px 16px;border-radius:12px;border:0;font-size:17px;outline:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px 20px 60px}
nav{position:sticky;top:16px;align-self:start;background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px;max-height:calc(100vh - 32px);overflow:auto}
nav h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:14px 8px 6px}
nav h3:first-child{margin-top:4px}
nav a{display:block;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:15px}
nav a:hover{background:#eef2ff}
nav a.ativo{background:var(--azul);color:#fff;font-weight:600}
main{min-width:0}
.inicio h2{margin-top:0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cartao{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;text-decoration:none;display:block;transition:.15s}
.cartao:hover{border-color:var(--azul2);box-shadow:0 6px 18px rgba(29,58,138,.12);transform:translateY(-2px)}
.cartao small{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.cartao b{display:block;margin:4px 0;font-size:17px}
.cartao span{color:var(--suave);font-size:15px}
.cartao em{display:inline-block;margin-top:8px;font-style:normal;font-size:13px;color:var(--azul2);font-weight:600}
.tutorial h2{margin:0 0 4px;font-size:28px}
.tutorial .resumo{color:var(--suave);margin:0 0 18px}
.voltar{display:inline-block;margin-bottom:12px;font-size:15px;color:var(--azul2);text-decoration:none}
.indice{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px 18px;margin-bottom:22px}
.indice ol{margin:6px 0 0;padding-left:22px}
.indice li{margin:3px 0}
.indice a{text-decoration:none;color:var(--azul2)}
.passo{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:20px;margin-bottom:20px;scroll-margin-top:14px}
.passo-topo{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--vermelho);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(239,68,68,.45)}
.passo h3{margin:6px 0 4px;font-size:20px}
.passo p{margin:0}
.passo img{display:block;width:100%;margin-top:14px;border-radius:12px;border:1px solid var(--borda);cursor:zoom-in;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.caixa{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:16px}
.caixa.dica{background:var(--dica);border-left:5px solid var(--dica-b)}
.caixa.aten{background:var(--aten);border-left:5px solid var(--aten-b)}
.antes{background:#eff6ff;border-left:5px solid #3b82f6;padding:11px 14px;border-radius:10px;margin-bottom:18px}
.sem-img{margin-top:14px;padding:22px;border:2px dashed var(--borda);border-radius:12px;color:var(--suave);text-align:center;font-size:15px}
.fim{text-align:center;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:22px}
.fim b{font-size:20px}
.nav-tut{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav-tut a{background:var(--azul);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.vazio{color:var(--suave)}
@media (max-width:860px){.layout{grid-template-columns:1fr;padding:16px}nav{position:static;max-height:none}body.lendo nav{display:none}.passo{padding:14px}.tutorial h2{font-size:23px}}
@media print{header,nav,.nav-tut,.voltar{display:none}.layout{display:block}.passo{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Central de Ajuda</h1>
  <p>Tutoriais passo a passo, com imagens. Siga os números vermelhos na tela.</p>
  <input id="busca" type="search" placeholder="O que você quer fazer? Ex.: cadastrar cliente, fazer venda...">
</div></header>
<div class="layout">
  <nav id="menu"></nav>
  <main id="conteudo"></main>
</div>
<div id="zoom"><img alt=""></div>
<script>
const TUTORIAIS = [{"id":"entrar-no-sistema","grupo":"Primeiros passos","titulo":"Como entrar no sistema","resumo":"Acesse o sistema com seu e-mail e senha, ou com sua conta Google/Microsoft.","antes":"","passos":[{"titulo":"Digite seu e-mail","texto":"Abra o endereço do sistema no navegador. Na tela \"Bem-vindo!\", clique no campo E-mail e digite o e-mail que você usa no sistema.","dica":"","atencao":"","img":"img/entrar-no-sistema/passo-1.png"},{"titulo":"Digite sua senha","texto":"Clique no campo Senha e digite a sua senha. Ela aparece com bolinhas para ninguém ver.","dica":"","atencao":"","img":"img/entrar-no-sistema/passo-2.png"},{"titulo":"Clique em Entrar","texto":"Confira o e-mail e clique no botão Entrar. Pronto: o sistema abre no Dashboard.","dica":"Se o sistema pedir um código de verificação, abra o aplicativo autenticador ou o seu e-mail e digite o código que chegou.","atencao":"","img":"img/entrar-no-sistema/passo-3.png"},{"titulo":"Ou entre com Google ou Microsoft","texto":"Se o seu e-mail é Gmail ou Hotmail/Outlook, você pode clicar em \"Continuar com Google\" ou \"Continuar com Microsoft\" e entrar sem digitar senha.","dica":"","atencao":"","img":"img/entrar-no-sistema/passo-4.png"}]},{"id":"esqueci-a-senha","grupo":"Primeiros passos","titulo":"Esqueci minha senha","resumo":"Receba no seu e-mail um link para criar uma senha nova.","antes":"","passos":[{"titulo":"Clique em \"Esqueceu a senha?\"","texto":"Na tela de entrada, clique no link \"Esqueceu a senha?\", que fica ao lado do campo Senha.","dica":"","atencao":"","img":"img/esqueci-a-senha/passo-1.png"},{"titulo":"Digite seu e-mail","texto":"Na tela \"Recuperar senha\", digite o mesmo e-mail que você usa para entrar no sistema.","dica":"","atencao":"","img":"img/esqueci-a-senha/passo-2.png"},{"titulo":"Clique em \"Enviar link de recuperação\"","texto":"Clique no botão. Em alguns minutos chega um e-mail com o link para criar sua senha nova. Abra o e-mail, clique no link e cadastre a nova senha.","dica":"Não chegou? Olhe a caixa de Spam/Lixo eletrônico. Se mesmo assim não aparecer, fale com o suporte.","atencao":"","img":"img/esqueci-a-senha/passo-3.png"}]},{"id":"criar-conta","grupo":"Primeiros passos","titulo":"Criar minha conta (primeiro acesso)","resumo":"Recebeu um convite? Crie sua senha e comece a usar.","antes":"","passos":[{"titulo":"Clique em \"Criar conta\"","texto":"Na tela de entrada, desça até o final e clique em \"Criar conta\".","dica":"","atencao":"","img":"img/criar-conta/passo-1.png"},{"titulo":"Preencha seus dados","texto":"Use o MESMO e-mail que recebeu o convite. Depois digite seu nome, crie uma senha e repita a senha no último campo.","dica":"","atencao":"","img":"img/criar-conta/passo-2.png"},{"titulo":"Clique em \"Criar conta\"","texto":"Clique no botão \"Criar conta\". Pronto! Agora é só entrar com seu e-mail e a senha que você criou.","dica":"Só funciona com e-mails autorizados pela sua empresa. Se aparecer aviso de e-mail não autorizado, peça ao responsável da empresa para liberar seu e-mail.","atencao":"","img":"img/criar-conta/passo-3.png"}]},{"id":"entrar-funcionario","grupo":"Primeiros passos","titulo":"Entrar como funcionário (sem e-mail)","resumo":"Funcionário entra com o código da empresa, usuário e senha.","antes":"O administrador da empresa precisa ter cadastrado o seu usuário e senha.","passos":[{"titulo":"Clique em \"Sou funcionário\"","texto":"Na tela de entrada, desça até o final e clique em \"Sou funcionário · entrar com usuário e senha\".","dica":"","atencao":"","img":"img/entrar-funcionario/passo-1.png"},{"titulo":"Preencha empresa, usuário e senha","texto":"Digite o código ou o CNPJ da empresa, o seu usuário (ex.: joao.silva) e a sua senha. Quem passa esses dados é o administrador da empresa.","dica":"","atencao":"","img":"img/entrar-funcionario/passo-2.png"},{"titulo":"Clique em \"Entrar\"","texto":"Clique em \"Entrar\". Você verá só as telas que o administrador liberou para você.","dica":"Esqueceu a senha de funcionário? Peça ao administrador da empresa para criar uma nova em Cadastros › Usuários.","atencao":"","img":"img/entrar-funcionario/passo-3.png"}]},{"id":"conhecendo-o-menu","grupo":"Primeiros passos","titulo":"Conhecendo o menu","resumo":"Ache qualquer tela rápido: menu lateral, busca e favoritos.","antes":"","passos":[{"titulo":"O menu fica do lado esquerdo","texto":"Todas as telas do sistema estão no menu azul à esquerda, separadas por assunto: Comercial, Cadastros, Estoque, Financeiro, Fiscal, Relatórios e Configurações.","dica":"","atencao":"","img":""},{"titulo":"Clique num grupo para abrir","texto":"Clique no nome do grupo (por exemplo \"Cadastros\") para ver as telas dele. Clique de novo para fechar.","dica":"","atencao":"","img":""},{"titulo":"Marque suas telas favoritas","texto":"Clique na estrelinha ao lado de uma tela que você usa muito. Ela vai aparecer lá em cima, em \"Favoritos\".","dica":"","atencao":"","img":""},{"titulo":"Não achou? Pesquise","texto":"Digite o que procura no campo \"Buscar no sistema...\" (por exemplo \"contas\") e clique no resultado.","dica":"","atencao":"","img":""},{"titulo":"Clique no resultado","texto":"Aparece a lista das telas encontradas. É só clicar na que você quer.","dica":"Aperte Enter para abrir o primeiro resultado da lista.","atencao":"","img":""}]},{"id":"cadastrar-cliente","grupo":"Cadastros","titulo":"Cadastrar um cliente","resumo":"Cadastre clientes com nome, CPF/CNPJ, WhatsApp e endereço.","antes":"","passos":[{"titulo":"Abra a tela de Clientes","texto":"No menu, clique em Cadastros › Clientes. Aqui ficam todos os seus clientes.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Novo cliente\"","texto":"Clique no botão \"Novo cliente\", no alto da tela.","dica":"","atencao":"","img":""},{"titulo":"Digite o nome (obrigatório)","texto":"O único campo obrigatório é o Nome. O Código é criado sozinho quando você salva.","dica":"","atencao":"","img":""},{"titulo":"CPF ou CNPJ","texto":"Digite o CPF ou CNPJ. Se for CNPJ, clique na lupa ao lado: o sistema busca e preenche os dados da empresa sozinho.","dica":"","atencao":"","img":""},{"titulo":"WhatsApp e e-mail","texto":"Preencha o WhatsApp do cliente. Ele é usado para enviar comprovantes, cobranças e mensagens de aniversário.","dica":"Preencha também o Aniversário: o sistema avisa quando chegar o dia.","atencao":"","img":""},{"titulo":"Endereço pelo CEP","texto":"Digite o CEP e clique no botão de consultar: rua, bairro, cidade e estado são preenchidos sozinhos. Depois complete o número.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira os dados e clique em \"Cadastrar\". Pronto: o cliente já aparece na lista e pode ser usado nas vendas.","dica":"Para alterar depois, clique no lápis (Editar) na linha do cliente.","atencao":"","img":""}]},{"id":"cadastrar-produto","grupo":"Cadastros","titulo":"Cadastrar um produto","resumo":"Cadastre produtos com código, preço, estoque e código de barras.","antes":"","passos":[{"titulo":"Abra a tela de Produtos","texto":"No menu, clique em Cadastros › Produtos.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Novo produto\"","texto":"Clique no botão \"Novo produto\".","dica":"","atencao":"","img":""},{"titulo":"Código interno e nome","texto":"Preencha o Código interno e o Nome do produto. Esses dois são obrigatórios.","dica":"","atencao":"","img":""},{"titulo":"Código de barras","texto":"Passe o leitor no código de barras do produto ou digite o número. Se o produto não tiver, clique em \"Gerar EAN\".","dica":"","atencao":"","img":""},{"titulo":"Estoque e preço de venda","texto":"Informe quanto tem em estoque, o estoque mínimo (para o sistema avisar quando estiver acabando) e o preço de venda.","dica":"Se você informar o Preço de custo e a Margem (%), o preço de venda é calculado sozinho.","atencao":"","img":""},{"titulo":"Dados fiscais (se você emite nota)","texto":"Na aba \"Fiscal\", preencha o NCM, o CFOP e a origem. Na dúvida, pergunte ao seu contador.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira e clique em \"Cadastrar\". O produto já pode ser vendido no PDV.","dica":"Para criar um produto parecido, use o botão \"Clonar produto\" na linha dele: copia tudo e você só muda o que precisa.","atencao":"","img":""}]},{"id":"vender-no-pdv","grupo":"Comercial","titulo":"Fazer uma venda no PDV (caixa)","resumo":"Abra o caixa, lance os produtos e receba o pagamento.","antes":"Ter pelo menos um produto cadastrado. O PDV abre numa aba nova do navegador.","passos":[{"titulo":"Abra o PDV","texto":"No menu, clique em Comercial › PDV. Ele abre numa aba nova, com os atalhos do caixa.","dica":"","atencao":"","img":""},{"titulo":"Abra o caixa (início do dia)","texto":"No começo do dia, clique em \"Abrir caixa\", digite o valor do troco que tem na gaveta e confirme em \"Abrir caixa\".","dica":"Atalho: Ctrl+6. Se o caixa já estiver aberto, pule este passo.","atencao":"","img":""},{"titulo":"Clique em \"Nova venda\"","texto":"Clique em \"Nova venda\" (ou aperte Enter).","dica":"","atencao":"","img":""},{"titulo":"Lance os produtos","texto":"Passe o leitor de código de barras ou digite o nome/código do produto e aperte Enter. Repita para cada produto.","dica":"Para lançar várias unidades, digite a quantidade e um asterisco antes: 3*123 lança 3 unidades do produto 123.","atencao":"","img":""},{"titulo":"Clique em \"Finalizar venda\" (F9)","texto":"Com todos os produtos lançados, clique em \"Finalizar venda\" ou aperte F9.","dica":"","atencao":"","img":""},{"titulo":"Escolha a forma de pagamento e confirme","texto":"Na janela \"Formas de pagamento\", clique na forma (Dinheiro, Pix, Cartão...), digite quanto recebeu e aperte Enter. Quando \"Falta pagar\" zerar, aperte Enter de novo para concluir. O troco aparece na tela.","dica":"Atalhos do caixa: F1 Recebimentos · F2 Orçamentos · F3 Produtos · F4 Vendas · F6 Desconto · F7 Em espera · F8 Devolução · F10 Cliente.","atencao":"Se errar um pagamento, aperte Delete para desfazer antes de confirmar.","img":""}]},{"id":"consultar-vendas","grupo":"Comercial","titulo":"Consultar, imprimir e enviar uma venda","resumo":"Encontre vendas feitas, reimprima o comprovante ou envie pelo WhatsApp.","antes":"","passos":[{"titulo":"Abra a tela de Vendas","texto":"No menu, clique em Comercial › Vendas. Aparecem as vendas do período.","dica":"","atencao":"","img":""},{"titulo":"Filtre pelo cliente","texto":"Digite o nome do cliente para ver só as vendas dele. Você também pode mudar o período, a forma de pagamento e o status.","dica":"","atencao":"","img":""},{"titulo":"Clique nos três pontinhos da venda","texto":"Na linha da venda, clique no botão \"...\" (Ações).","dica":"","atencao":"","img":""},{"titulo":"Escolha o que fazer","texto":"Clique em \"Detalhes\" para ver os produtos, \"Imprimir / PDF\" para reimprimir o comprovante ou \"Enviar no WhatsApp\" para mandar para o cliente.","dica":"","atencao":"\"Excluir\" manda a venda para a lixeira e devolve os produtos ao estoque. Use só se a venda foi feita errada.","img":""}]},{"id":"fazer-orcamento","grupo":"Comercial","titulo":"Fazer um orçamento","resumo":"Monte o orçamento, envie pelo WhatsApp e depois transforme em venda.","antes":"Ter o cliente e os produtos cadastrados (o cliente também pode ser cadastrado na hora).","passos":[{"titulo":"Abra a tela de Orçamentos","texto":"No menu, clique em Comercial › Orçamentos.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Novo orçamento\"","texto":"Clique no botão \"Novo orçamento\".","dica":"","atencao":"","img":""},{"titulo":"Escolha o cliente","texto":"Digite o nome ou CPF/CNPJ do cliente e clique nele na lista. Se ele ainda não existe, clique em \"Cadastrar cliente\".","dica":"","atencao":"","img":""},{"titulo":"Adicione os produtos","texto":"Digite o nome ou código do produto e clique nele para incluir. Repita para cada item. Se quiser, dê desconto no item ou no total.","dica":"","atencao":"","img":""},{"titulo":"Validade","texto":"Confira até quando o orçamento vale.","dica":"","atencao":"","img":""},{"titulo":"Salve, imprima ou envie","texto":"Clique em \"Salvar\". Você pode imprimir (A4, 80mm ou PDF) ou enviar pelo WhatsApp: o cliente recebe um link para ver e aprovar.","dica":"","atencao":"","img":""},{"titulo":"Cliente aprovou? Fature no PDV","texto":"Na lista de orçamentos, clique no botão \"Faturar no PDV\" da linha. O orçamento vira uma venda no caixa, já com os produtos.","dica":"","atencao":"","img":""}]},{"id":"contas-a-receber","grupo":"Financeiro","titulo":"Contas a receber: lançar e dar baixa","resumo":"Lance o que o cliente vai te pagar e registre quando ele pagar.","antes":"","passos":[{"titulo":"Abra Contas a Receber","texto":"No menu, clique em Financeiro › Contas a Receber. Os quadros no alto mostram o total recebido, o saldo a receber e o que está atrasado.","dica":"","atencao":"","img":""},{"titulo":"Veja as contas em aberto","texto":"Use as abas para ver as contas \"Em aberto/atraso\", as \"Pagas\" ou \"Todas\". Para achar um cliente, digite o nome no filtro.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Nova conta\"","texto":"Para lançar uma conta, clique em \"Nova conta\".","dica":"","atencao":"","img":""},{"titulo":"Preencha a conta","texto":"Escolha o cliente, escreva uma descrição, o plano de contas, quantas parcelas, o valor total e o vencimento. Depois clique em \"Salvar\".","dica":"Se o cliente já pagou agora, ligue \"Já foi recebido agora\" e informe a data e a forma de pagamento.","atencao":"","img":""},{"titulo":"O cliente pagou? Dê baixa","texto":"Na linha da conta, clique em \"Receber no caixa (PDV)\" ou \"Receber com Pix\". Confira o valor e confirme.","dica":"O botão \"Copiar mensagem de cobrança (WhatsApp)\" já monta a mensagem para você mandar ao cliente.","atencao":"","img":""}]},{"id":"contas-a-pagar","grupo":"Financeiro","titulo":"Contas a pagar: lançar e pagar","resumo":"Registre suas despesas e boletos e marque quando pagar.","antes":"","passos":[{"titulo":"Abra Contas a Pagar","texto":"No menu, clique em Financeiro › Contas a Pagar. Os quadros mostram o que já foi pago, o saldo a pagar e o que está atrasado.","dica":"","atencao":"","img":""},{"titulo":"Clique em \"Nova conta\"","texto":"Clique em \"Nova conta\" para lançar uma despesa ou boleto.","dica":"","atencao":"","img":""},{"titulo":"Diga de quem é a despesa","texto":"Em \"Vínculo da despesa\", escolha Fornecedor, Funcionário ou Despesa geral (luz, aluguel, internet...).","dica":"","atencao":"","img":""},{"titulo":"Preencha e salve","texto":"Coloque a descrição, o plano de contas, as parcelas, o valor e o vencimento. Clique em \"Salvar\".","dica":"Conta que se repete todo mês (aluguel, internet)? Cadastre em Financeiro › Recorrências e ela é lançada sozinha.","atencao":"","img":""},{"titulo":"Pagou? Clique em \"Pagar\"","texto":"Na linha da conta, clique em \"Pagar\", confira o valor, a forma e de qual conta saiu o dinheiro, e confirme.","dica":"","atencao":"","img":""}]}];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const grupos = [...new Set(TUTORIAIS.map(t => t.grupo))];

function menu(atual){
  $('#menu').innerHTML = '<a href="#" class="'+(atual?'':'ativo')+'">🏠 Início</a>' + grupos.map(g =>
    '<h3>'+esc(g)+'</h3>' + TUTORIAIS.filter(t=>t.grupo===g).map(t =>
      '<a href="#'+t.id+'" class="'+(t.id===atual?'ativo':'')+'">'+esc(t.titulo)+'</a>').join('')).join('');
}
function cartoes(lista){
  if(!lista.length) return '<p class="vazio">Nenhum tutorial encontrado. Tente outra palavra.</p>';
  return '<div class="grade">'+lista.map(t =>
    '<a class="cartao" href="#'+t.id+'"><small>'+esc(t.grupo)+'</small><b>'+esc(t.titulo)+'</b><span>'+esc(t.resumo)+'</span><br><em>'+t.passos.length+' passos →</em></a>').join('')+'</div>';
}
function inicio(filtro){
  document.body.classList.remove('lendo');
  menu('');
  const q = norm(filtro||'').split(/\s+/).filter(Boolean);
  const lista = q.length ? TUTORIAIS.filter(t => { const txt = norm([t.titulo,t.resumo,t.grupo,...t.passos.map(p=>p.titulo+' '+p.texto)].join(' ')); return q.every(w=>txt.includes(w)); }) : TUTORIAIS;
  $('#conteudo').innerHTML = '<section class="inicio">' + (q.length ? '<h2>Resultados</h2>'+cartoes(lista)
    : grupos.map(g => '<h2>'+esc(g)+'</h2>'+cartoes(TUTORIAIS.filter(t=>t.grupo===g))).join('')) + '</section>';
}
function tutorial(t){
  document.body.classList.add('lendo');
  menu(t.id);
  const i = TUTORIAIS.indexOf(t), ant = TUTORIAIS[i-1], prox = TUTORIAIS[i+1];
  $('#conteudo').innerHTML = '<article class="tutorial">'
   + '<a class="voltar" href="#">← Todos os tutoriais</a>'
   + '<h2>'+esc(t.titulo)+'</h2><p class="resumo">'+esc(t.resumo)+'</p>'
   + (t.antes ? '<div class="antes"><b>Antes de começar:</b> '+esc(t.antes)+'</div>' : '')
   + '<div class="indice"><b>Neste tutorial:</b><ol>'+t.passos.map((p,n)=>'<li><a href="#'+t.id+'/'+(n+1)+'">'+esc(p.titulo)+'</a></li>').join('')+'</ol></div>'
   + t.passos.map((p,n) => '<section class="passo" id="p'+(n+1)+'"><div class="passo-topo"><div class="num">'+(n+1)+'</div><div>'
      + '<h3>'+esc(p.titulo)+'</h3><p>'+esc(p.texto)+'</p></div></div>'
      + (p.img ? '<img loading="lazy" src="'+p.img+'" alt="Passo '+(n+1)+': '+esc(p.titulo)+'">' : '<div class="sem-img">Imagem deste passo ainda não capturada.</div>')
      + (p.atencao ? '<div class="caixa aten">⚠️ <b>Atenção:</b> '+esc(p.atencao)+'</div>' : '')
      + (p.dica ? '<div class="caixa dica">💡 <b>Dica:</b> '+esc(p.dica)+'</div>' : '')
      + '</section>').join('')
   + '<div class="fim"><b>✅ Pronto!</b><br>Ficou com dúvida? Fale com o suporte.</div>'
   + '<div class="nav-tut">'+(ant?'<a href="#'+ant.id+'">← '+esc(ant.titulo)+'</a>':'<span></span>')+(prox?'<a href="#'+prox.id+'">'+esc(prox.titulo)+' →</a>':'')+'</div>'
   + '</article>';
}
function rota(){
  const [id, passo] = location.hash.slice(1).split('/');
  const t = TUTORIAIS.find(x => x.id === id);
  if (t) { tutorial(t); const alvo = passo && document.getElementById('p'+passo); alvo ? alvo.scrollIntoView() : scrollTo(0,0); }
  else inicio($('#busca').value);
}
$('#busca').addEventListener('input', e => { if (location.hash) history.replaceState(null,'',' '); inicio(e.target.value); });
$('#conteudo').addEventListener('click', e => { if (e.target.matches('.passo img')) { $('#zoom img').src = e.target.src; $('#zoom').style.display = 'flex'; } });
$('#zoom').addEventListener('click', () => $('#zoom').style.display = 'none');
addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
