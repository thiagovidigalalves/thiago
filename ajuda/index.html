<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Ajuda</title>
<style>
:root{--azul:#0b1a4a;--azul2:#1d3a8a;--vermelho:#ef4444;--fundo:#f4f6fb;--card:#fff;--texto:#1f2937;--suave:#6b7280;--borda:#e5e7eb;--dica:#ecfdf5;--dica-b:#10b981;--aten:#fff7ed;--aten-b:#f97316}
:root{--nav-hover:#eef2ff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fundo:#0f172a;--card:#1e293b;--texto:#e5e7eb;--suave:#94a3b8;--borda:#334155;--dica:#052e2b;--aten:#3b2412;--nav-hover:#273449;color-scheme:dark}:root:not([data-theme="light"]) .antes{background:#172554}:root:not([data-theme="light"]) .indice a,:root:not([data-theme="light"]) .voltar,:root:not([data-theme="light"]) .cartao em{color:#93c5fd}}
:root[data-theme="dark"]{--fundo:#0f172a;--card:#1e293b;--texto:#e5e7eb;--suave:#94a3b8;--borda:#334155;--dica:#052e2b;--aten:#3b2412;--nav-hover:#273449;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--fundo);color:var(--texto);font-size:17px;line-height:1.55}
a{color:inherit}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:22px 20px 26px}
header .wrap{max-width:1180px;margin:0 auto}
header h1{margin:0 0 4px;font-size:26px}
header p{margin:0 0 14px;opacity:.85}
#busca{width:100%;max-width:560px;padding:13px 16px;border-radius:12px;border:0;font-size:17px;outline:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px 20px 60px}
nav{position:sticky;top:16px;align-self:start;background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px;max-height:calc(100vh - 32px);overflow:auto}
nav h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);margin:14px 8px 6px}
nav h3:first-child{margin-top:4px}
nav a{display:block;text-decoration:none;padding:8px 10px;border-radius:9px;font-size:15px}
nav a:hover{background:var(--nav-hover)}
nav a.ativo{background:var(--azul);color:#fff;font-weight:600}
main{min-width:0}
.inicio h2{margin-top:0}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.cartao{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;text-decoration:none;display:block;transition:.15s}
.cartao:hover{border-color:var(--azul2);box-shadow:0 6px 18px rgba(29,58,138,.12);transform:translateY(-2px)}
.cartao small{color:var(--suave);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.cartao b{display:block;margin:4px 0;font-size:17px}
.cartao span{color:var(--suave);font-size:15px}
.cartao em{display:inline-block;margin-top:8px;font-style:normal;font-size:13px;color:var(--azul2);font-weight:600}
.tutorial h2{margin:0 0 4px;font-size:28px}
.tutorial .resumo{color:var(--suave);margin:0 0 18px}
.voltar{display:inline-block;margin-bottom:12px;font-size:15px;color:var(--azul2);text-decoration:none}
.indice{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:14px 18px;margin-bottom:22px}
.indice ol{margin:6px 0 0;padding-left:22px}
.indice li{margin:3px 0}
.indice a{text-decoration:none;color:var(--azul2)}
.passo{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:20px;margin-bottom:20px;scroll-margin-top:14px}
.passo-topo{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--vermelho);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(239,68,68,.45)}
.passo h3{margin:6px 0 4px;font-size:20px}
.passo p{margin:0}
.passo img{display:block;width:100%;margin-top:14px;border-radius:12px;border:1px solid var(--borda);cursor:zoom-in;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.caixa{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:16px}
.caixa.dica{background:var(--dica);border-left:5px solid var(--dica-b)}
.caixa.aten{background:var(--aten);border-left:5px solid var(--aten-b)}
.antes{background:#eff6ff;border-left:5px solid #3b82f6;padding:11px 14px;border-radius:10px;margin-bottom:18px}
.sem-img{margin-top:14px;padding:22px;border:2px dashed var(--borda);border-radius:12px;color:var(--suave);text-align:center;font-size:15px}
.fim{text-align:center;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:22px}
.fim b{font-size:20px}
.nav-tut{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav-tut a{background:var(--azul);color:#fff;text-decoration:none;padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:16px;z-index:10;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.vazio{color:var(--suave)}
@media (max-width:860px){.layout{grid-template-columns:1fr;padding:16px}nav{position:static;max-height:none}body.lendo nav{display:none}.passo{padding:14px}.tutorial h2{font-size:23px}}
@media print{header,nav,.nav-tut,.voltar{display:none}.layout{display:block}.passo{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Central de Ajuda</h1>
  <p>Tutoriais passo a passo, com imagens. Siga os números vermelhos na tela.</p>
  <input id="busca" type="search" placeholder="O que você quer fazer? Ex.: cadastrar cliente, fazer venda...">
</div></header>
<div class="layout">
  <nav id="menu"></nav>
  <main id="conteudo"></main>
</div>
<div id="zoom"><img alt=""></div>
<script>
const TUTORIAIS = [{"id":"entrar-no-sistema","grupo":"Primeiros passos","titulo":"Como entrar no sistema","resumo":"Acesse o sistema com seu e-mail e senha, ou com sua conta Google/Microsoft.","antes":"","passos":[{"titulo":"Digite seu e-mail","texto":"Abra o endereço do sistema no navegador. Na tela \"Bem-vindo!\", clique no campo E-mail e digite o e-mail que você usa no sistema.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-1.webp","semPrint":false},{"titulo":"Digite sua senha","texto":"Clique no campo Senha e digite a sua senha. Ela aparece com bolinhas para ninguém ver.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-2.webp","semPrint":false},{"titulo":"Clique em Entrar","texto":"Confira o e-mail e clique no botão Entrar. Pronto: o sistema abre no Dashboard.","dica":"Se o sistema pedir um código de verificação, abra o aplicativo autenticador ou o seu e-mail e digite o código que chegou.","atencao":"","img":"img-web/entrar-no-sistema/passo-3.webp","semPrint":false},{"titulo":"Ou entre com Google ou Microsoft","texto":"Se o seu e-mail é Gmail ou Hotmail/Outlook, você pode clicar em \"Continuar com Google\" ou \"Continuar com Microsoft\" e entrar sem digitar senha.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-4.webp","semPrint":false}]},{"id":"esqueci-a-senha","grupo":"Primeiros passos","titulo":"Esqueci minha senha","resumo":"Receba no seu e-mail um link para criar uma senha nova.","antes":"","passos":[{"titulo":"Clique em \"Esqueceu a senha?\"","texto":"Na tela de entrada, clique no link \"Esqueceu a senha?\", que fica ao lado do campo Senha.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-1.webp","semPrint":false},{"titulo":"Digite seu e-mail","texto":"Na tela \"Recuperar senha\", digite o mesmo e-mail que você usa para entrar no sistema.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Enviar link de recuperação\"","texto":"Clique no botão. Em alguns minutos chega um e-mail com o link para criar sua senha nova. Abra o e-mail, clique no link e cadastre a nova senha.","dica":"Não chegou? Olhe a caixa de Spam/Lixo eletrônico. Se mesmo assim não aparecer, fale com o suporte.","atencao":"","img":"img-web/esqueci-a-senha/passo-3.webp","semPrint":false}]},{"id":"criar-conta","grupo":"Primeiros passos","titulo":"Criar minha conta (primeiro acesso)","resumo":"Recebeu um convite? Crie sua senha e comece a usar.","antes":"","passos":[{"titulo":"Clique em \"Criar conta\"","texto":"Na tela de entrada, desça até o final e clique em \"Criar conta\".","dica":"","atencao":"","img":"img-web/criar-conta/passo-1.webp","semPrint":false},{"titulo":"Preencha seus dados","texto":"Use o MESMO e-mail que recebeu o convite. Depois digite seu nome, crie uma senha e repita a senha no último campo.","dica":"","atencao":"","img":"img-web/criar-conta/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Criar conta\"","texto":"Clique no botão \"Criar conta\". Pronto! Agora é só entrar com seu e-mail e a senha que você criou.","dica":"Só funciona com e-mails autorizados pela sua empresa. Se aparecer aviso de e-mail não autorizado, peça ao responsável da empresa para liberar seu e-mail.","atencao":"","img":"img-web/criar-conta/passo-3.webp","semPrint":false}]},{"id":"entrar-funcionario","grupo":"Primeiros passos","titulo":"Entrar como funcionário (sem e-mail)","resumo":"Funcionário entra com o código da empresa, usuário e senha.","antes":"O administrador da empresa precisa ter cadastrado o seu usuário e senha.","passos":[{"titulo":"Clique em \"Sou funcionário\"","texto":"Na tela de entrada, desça até o final e clique em \"Sou funcionário · entrar com usuário e senha\".","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Preencha empresa, usuário e senha","texto":"Digite o código ou o CNPJ da empresa, o seu usuário (ex.: joao.silva) e a sua senha. Quem passa esses dados é o administrador da empresa.","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Entrar\"","texto":"Clique em \"Entrar\". Você verá só as telas que o administrador liberou para você.","dica":"Esqueceu a senha de funcionário? Peça ao administrador da empresa para criar uma nova em Cadastros › Usuários.","atencao":"","img":"img-web/entrar-funcionario/passo-3.webp","semPrint":false}]},{"id":"portal-do-contador","grupo":"Primeiros passos","titulo":"Acesso do contador","resumo":"Seu contador entra no Portal do Contador para pegar as notas e os arquivos fiscais.","antes":"A empresa precisa ter cadastrado o e-mail do contador no sistema.","passos":[{"titulo":"Clique em \"Sou contador\"","texto":"Na tela de entrada, desça até o final e clique em \"Sou contador · entrar com usuário e senha\".","dica":"","atencao":"","img":"img-web/portal-do-contador/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Entrar com e-mail\"","texto":"No Portal do Contador, clique em \"Entrar com e-mail\" e use o e-mail que a empresa cadastrou para você. Dá para entrar com Google, Microsoft ou e-mail e senha.","dica":"Se aparecer que o e-mail não está cadastrado, peça para a empresa (ou para o suporte) incluir o seu e-mail.","atencao":"","img":"img-web/portal-do-contador/passo-2.webp","semPrint":false}]},{"id":"conhecendo-o-menu","grupo":"Primeiros passos","titulo":"Conhecendo o menu","resumo":"Ache qualquer tela rápido: menu lateral, busca e favoritos.","antes":"","passos":[{"titulo":"O menu fica do lado esquerdo","texto":"Todas as telas do sistema estão no menu azul à esquerda, separadas por assunto: Comercial, Cadastros, Estoque, Financeiro, Fiscal, Relatórios e Configurações.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-1.webp","semPrint":false},{"titulo":"Clique num grupo para abrir","texto":"Clique no nome do grupo (por exemplo \"Cadastros\") para ver as telas dele. Clique de novo para fechar.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-2.webp","semPrint":false},{"titulo":"Marque suas telas favoritas","texto":"Clique na estrelinha ao lado de uma tela que você usa muito. Ela vai aparecer lá em cima, em \"Favoritos\".","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-3.webp","semPrint":false},{"titulo":"Não achou? Pesquise","texto":"Digite o que procura no campo \"Buscar no sistema...\" (por exemplo \"contas\") e clique no resultado.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-4.webp","semPrint":false},{"titulo":"Clique no resultado","texto":"Aparece a lista das telas encontradas. É só clicar na que você quer.","dica":"Aperte Enter para abrir o primeiro resultado da lista.","atencao":"","img":"img-web/conhecendo-o-menu/passo-5.webp","semPrint":false}]},{"id":"cadastrar-cliente","grupo":"Cadastros","titulo":"Cadastrar um cliente","resumo":"Cadastre clientes com nome, CPF/CNPJ, WhatsApp e endereço.","antes":"","passos":[{"titulo":"Abra a tela de Clientes","texto":"No menu, clique em Cadastros › Clientes. Aqui ficam todos os seus clientes.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo cliente\"","texto":"Clique no botão \"Novo cliente\", no alto da tela.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-2.webp","semPrint":false},{"titulo":"Digite o nome (obrigatório)","texto":"O único campo obrigatório é o Nome. O Código é criado sozinho quando você salva.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-3.webp","semPrint":false},{"titulo":"CPF ou CNPJ","texto":"Digite o CPF ou CNPJ. Se for CNPJ, clique na lupa ao lado: o sistema busca e preenche os dados da empresa sozinho.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-4.webp","semPrint":false},{"titulo":"WhatsApp e e-mail","texto":"Preencha o WhatsApp do cliente. Ele é usado para enviar comprovantes, cobranças e mensagens de aniversário.","dica":"Preencha também o Aniversário: o sistema avisa quando chegar o dia.","atencao":"","img":"img-web/cadastrar-cliente/passo-5.webp","semPrint":false},{"titulo":"Endereço pelo CEP","texto":"Digite o CEP e clique no botão de consultar: rua, bairro, cidade e estado são preenchidos sozinhos. Depois complete o número.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-6.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira os dados e clique em \"Cadastrar\". Pronto: o cliente já aparece na lista e pode ser usado nas vendas.","dica":"Para alterar depois, clique no lápis (Editar) na linha do cliente.","atencao":"","img":"img-web/cadastrar-cliente/passo-7.webp","semPrint":false}]},{"id":"cadastrar-produto","grupo":"Cadastros","titulo":"Cadastrar um produto","resumo":"Cadastre produtos com código, preço, estoque e código de barras.","antes":"","passos":[{"titulo":"Abra a tela de Produtos","texto":"No menu, clique em Cadastros › Produtos.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo produto\"","texto":"Clique no botão \"Novo produto\".","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-2.webp","semPrint":false},{"titulo":"Código interno e nome","texto":"Preencha o Código interno e o Nome do produto. Esses dois são obrigatórios.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-3.webp","semPrint":false},{"titulo":"Código de barras","texto":"Passe o leitor no código de barras do produto ou digite o número. Se o produto não tiver, clique em \"Gerar EAN\".","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-4.webp","semPrint":false},{"titulo":"Estoque e preço de venda","texto":"Informe quanto tem em estoque, o estoque mínimo (para o sistema avisar quando estiver acabando) e o preço de venda.","dica":"Se você informar o Preço de custo e a Margem (%), o preço de venda é calculado sozinho.","atencao":"","img":"img-web/cadastrar-produto/passo-5.webp","semPrint":false},{"titulo":"Dados fiscais (se você emite nota)","texto":"Na aba \"Fiscal\", preencha o NCM, o CFOP e a origem. Na dúvida, pergunte ao seu contador.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-6.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira e clique em \"Cadastrar\". O produto já pode ser vendido no PDV.","dica":"Para criar um produto parecido, use o botão \"Clonar produto\" na linha dele: copia tudo e você só muda o que precisa.","atencao":"","img":"img-web/cadastrar-produto/passo-7.webp","semPrint":false}]},{"id":"cadastrar-fornecedor","grupo":"Cadastros","titulo":"Cadastrar um fornecedor","resumo":"Cadastre quem vende mercadoria para a sua loja.","antes":"","passos":[{"titulo":"Clique em \"Novo fornecedor\"","texto":"No menu, clique em Cadastros › Fornecedores e depois em \"Novo fornecedor\".","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Digite o CNPJ e clique na lupa: nome e endereço são preenchidos sozinhos com os dados da Receita.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-2.webp","semPrint":false},{"titulo":"Confira o nome e o contato","texto":"O Nome é obrigatório. Preencha também telefone, WhatsApp e e-mail do vendedor.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Clique em \"Cadastrar\". O fornecedor já pode ser usado nas entradas de mercadoria e no contas a pagar.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-4.webp","semPrint":false}]},{"id":"cadastrar-funcionario","grupo":"Cadastros","titulo":"Cadastrar funcionário e permissões","resumo":"Crie o acesso do funcionário e escolha o que ele pode ver e fazer.","antes":"Só o administrador da empresa consegue cadastrar usuários.","passos":[{"titulo":"Clique em \"Novo usuário\"","texto":"No menu, clique em Cadastros › Usuários e depois em \"Novo usuário\".","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Escolha o perfil","texto":"Em \"Perfil de acesso\", escolha o que a pessoa faz: Vendedor, Caixa, Gerente, Técnico, Estoquista, Financeiro... O sistema já libera as telas certas para cada perfil.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Nome e forma de entrar","texto":"Digite o nome. Em \"Como o funcionário vai entrar?\", escolha \"Por usuário e senha\" se ele não tem e-mail: você mesmo define o usuário e a senha.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-3.webp","semPrint":false},{"titulo":"Comissão (opcional)","texto":"Se o funcionário ganha comissão, informe a porcentagem sobre serviços e sobre produtos. Ela aparece no relatório de comissões.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-4.webp","semPrint":false},{"titulo":"Ajuste as permissões","texto":"Na aba \"Permissões\", marque as telas que ele pode abrir e o que ele pode fazer (dar desconto, excluir venda...).","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-5.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Clique em \"Cadastrar\". Passe para o funcionário o código da empresa, o usuário e a senha (veja o tutorial \"Entrar como funcionário\").","dica":"","atencao":"Funcionário saiu da empresa? Edite o usuário e desligue \"Ativo\" para bloquear o acesso.","img":"img-web/cadastrar-funcionario/passo-6.webp","semPrint":false}]},{"id":"vender-no-pdv","grupo":"Comercial","titulo":"Fazer uma venda no PDV (caixa)","resumo":"Abra o caixa, lance os produtos e receba o pagamento.","antes":"Ter pelo menos um produto cadastrado. O PDV abre numa aba nova do navegador.","passos":[{"titulo":"Abra o PDV","texto":"No menu, clique em Comercial › PDV. Ele abre numa aba nova, com os atalhos do caixa.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-1.webp","semPrint":false},{"titulo":"Abra o caixa (início do dia)","texto":"No começo do dia, clique em \"Abrir caixa\", digite o valor do troco que tem na gaveta e confirme em \"Abrir caixa\". Com o caixa aberto, esse mesmo botão vira \"Fechar caixa\".","dica":"Atalho: Ctrl+6. Se o caixa já estiver aberto, pule este passo.","atencao":"","img":"img-web/vender-no-pdv/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Nova venda\"","texto":"Clique em \"Nova venda\" (ou aperte Enter).","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-3.webp","semPrint":false},{"titulo":"Lance os produtos","texto":"Passe o leitor de código de barras ou digite o nome/código do produto e aperte Enter. Repita para cada produto.","dica":"Para lançar várias unidades, digite a quantidade e um asterisco antes: 3*123 lança 3 unidades do produto 123.","atencao":"","img":"img-web/vender-no-pdv/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Finalizar venda\" (F9)","texto":"Com todos os produtos lançados, clique em \"Finalizar venda\" ou aperte F9.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-5.webp","semPrint":false},{"titulo":"Escolha a forma de pagamento e confirme","texto":"Na janela \"Formas de pagamento\", clique na forma (Dinheiro, Pix, Cartão...), digite quanto recebeu e aperte Enter. Quando \"Falta pagar\" zerar, aperte Enter de novo para concluir. O troco aparece na tela.","dica":"Atalhos do caixa: F1 Recebimentos · F2 Orçamentos · F3 Produtos · F4 Vendas · F6 Desconto · F7 Em espera · F8 Devolução · F10 Cliente.","atencao":"Se errar um pagamento, aperte Delete para desfazer antes de confirmar.","img":"img-web/vender-no-pdv/passo-6.webp","semPrint":false}]},{"id":"consultar-vendas","grupo":"Comercial","titulo":"Consultar, imprimir e enviar uma venda","resumo":"Encontre vendas feitas, reimprima o comprovante ou envie pelo WhatsApp.","antes":"","passos":[{"titulo":"Abra a tela de Vendas","texto":"No menu, clique em Comercial › Vendas. Aparecem as vendas do período.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-1.webp","semPrint":false},{"titulo":"Filtre pelo cliente","texto":"Digite o nome do cliente para ver só as vendas dele. Você também pode mudar o período, a forma de pagamento e o status.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-2.webp","semPrint":false},{"titulo":"Clique nos três pontinhos da venda","texto":"Na linha da venda, clique no botão \"...\" (Ações).","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-3.webp","semPrint":false},{"titulo":"Escolha o que fazer","texto":"Clique em \"Detalhes\" para ver os produtos, \"Imprimir / PDF\" para reimprimir o comprovante ou \"Enviar no WhatsApp\" para mandar para o cliente.","dica":"","atencao":"\"Excluir\" manda a venda para a lixeira e devolve os produtos ao estoque. Use só se a venda foi feita errada.","img":"img-web/consultar-vendas/passo-4.webp","semPrint":false}]},{"id":"fazer-orcamento","grupo":"Comercial","titulo":"Fazer um orçamento","resumo":"Monte o orçamento, envie pelo WhatsApp e depois transforme em venda.","antes":"Ter o cliente e os produtos cadastrados (o cliente também pode ser cadastrado na hora).","passos":[{"titulo":"Abra a tela de Orçamentos","texto":"No menu, clique em Comercial › Orçamentos.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo orçamento\"","texto":"Clique no botão \"Novo orçamento\".","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-2.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Digite o nome ou CPF/CNPJ do cliente e clique nele na lista. Se ele ainda não existe, clique em \"Cadastrar cliente\".","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-3.webp","semPrint":false},{"titulo":"Adicione os produtos","texto":"Digite o nome ou código do produto e clique nele para incluir. Repita para cada item. Se quiser, dê desconto no item ou no total.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-4.webp","semPrint":false},{"titulo":"Validade","texto":"Confira até quando o orçamento vale.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-5.webp","semPrint":false},{"titulo":"Salve, imprima ou envie","texto":"Clique em \"Salvar\". Você pode imprimir (A4, 80mm ou PDF) ou enviar pelo WhatsApp: o cliente recebe um link para ver e aprovar.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-6.webp","semPrint":false},{"titulo":"Cliente aprovou? Fature no PDV","texto":"Na lista de orçamentos, clique no botão \"Faturar no PDV\" da linha. O orçamento vira uma venda no caixa, já com os produtos.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-7.webp","semPrint":false}]},{"id":"ordem-de-servico","grupo":"Comercial","titulo":"Abrir uma ordem de serviço (OS)","resumo":"Registre o conserto: cliente, veículo/equipamento, serviços, peças e fotos.","antes":"Ter os serviços cadastrados (Cadastros › Serviços e Status) e os mecânicos/técnicos cadastrados como usuários. Os nomes dos campos mudam conforme o ramo: oficina mostra \"Veículo/Placa/Mecânico\"; assistência técnica mostra \"Equipamento/Técnico\".","passos":[{"titulo":"Clique em \"Nova ordem\"","texto":"No menu, clique em Comercial › Ordens de Serviço e depois em \"Nova ordem\".","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Comece a digitar o nome do cliente e clique nele. Se for cliente novo, clique em \"+ Cadastrar cliente\".","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-2.webp","semPrint":false},{"titulo":"Veículo (ou equipamento) e o defeito","texto":"Preencha o veículo (ou equipamento) e a placa. Escreva o que o cliente reclamou e, depois de olhar, o laudo técnico.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-3.webp","semPrint":false},{"titulo":"Adicione os serviços","texto":"Clique em \"Adicionar serviço\", busque o serviço pelo nome ou código, escolha o mecânico/técnico responsável e confira o valor.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-4.webp","semPrint":false},{"titulo":"Adicione as peças","texto":"Clique em \"Adicionar produto\" para incluir as peças usadas, com a quantidade. Elas saem do estoque.","dica":"Use \"+ Adicionar fotos\" para guardar fotos de antes, durante e depois do serviço.","atencao":"","img":"img-web/ordem-de-servico/passo-5.webp","semPrint":false},{"titulo":"Salve ou gere o orçamento","texto":"Clique em \"Salvar ordem\". Se o cliente ainda vai aprovar, clique em \"Gerar orçamento\" e envie pelo WhatsApp ou imprima.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-6.webp","semPrint":false},{"titulo":"Serviço pronto? Receba no caixa","texto":"Na lista de ordens, clique em \"Receber OS no caixa\" na linha da OS. Ela vai para o PDV para receber o pagamento.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-7.webp","semPrint":false}]},{"id":"condicional","grupo":"Comercial","titulo":"Condicional (cliente leva para provar)","resumo":"O cliente leva os produtos para casa; depois você dá baixa no que voltou e vende o resto.","antes":"","passos":[{"titulo":"Clique em \"Nova condicional\"","texto":"No menu, clique em Comercial › Condicional e depois em \"Nova condicional\".","dica":"","atencao":"","img":"img-web/condicional/passo-1.webp","semPrint":false},{"titulo":"Cliente e validade","texto":"Digite o nome do cliente e escolha até quando ele pode ficar com os produtos (Validade).","dica":"","atencao":"","img":"img-web/condicional/passo-2.webp","semPrint":false},{"titulo":"Bipe os produtos","texto":"Passe o leitor no código de barras de cada peça (ou digite e aperte Enter).","dica":"","atencao":"","img":"img-web/condicional/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar condicional\"","texto":"Clique em \"Salvar condicional\". Os produtos saem do estoque e você pode imprimir (80mm ou A4) para o cliente assinar.","dica":"","atencao":"","img":"img-web/condicional/passo-4.webp","semPrint":false},{"titulo":"Cliente voltou? Abra a condicional","texto":"Clique na condicional na lista. Use \"Devolver itens\" para bipar o que voltou e depois \"Transformar em venda (ir ao PDV)\" para cobrar o que ele ficou.","dica":"Os filtros \"Para a rua\" e \"Expirado\" mostram quem está com produtos e quem passou do prazo.","atencao":"","img":"img-web/condicional/passo-5.webp","semPrint":false}]},{"id":"caixa-sangria-fechamento","grupo":"Comercial","titulo":"Sangria, suprimento e fechar o caixa","resumo":"Tire ou coloque dinheiro na gaveta e feche o caixa no fim do dia.","antes":"","passos":[{"titulo":"Sangria: tirar dinheiro da gaveta","texto":"Na tela inicial do PDV, clique em \"Sangria\" (Ctrl+3). Digite o valor, uma descrição e escolha \"Cofre\" ou a despesa (ex.: pagamento de fornecedor). Clique em \"Confirmar\".","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-1.webp","semPrint":false},{"titulo":"Suprimento: colocar troco","texto":"Precisou colocar mais troco? Clique em \"Suprimento\" (Ctrl+4), digite o valor e confirme.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-2.webp","semPrint":false},{"titulo":"Confira o resumo","texto":"Antes de fechar, clique em \"Resumo do caixa\" (Ctrl+5) para ver quanto vendeu em cada forma e quanto deve ter na gaveta.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-3.webp","semPrint":false},{"titulo":"Feche o caixa","texto":"Clique em \"Fechar caixa\" (Ctrl+6). Conte o dinheiro, informe quanto vai retirar (se for levar para o cofre) e clique em \"Fechar caixa\".","dica":"Marque \"Conferir cédulas e moedas\" para contar nota por nota: o sistema soma para você.","atencao":"Feche o caixa todo dia. No dia seguinte, abra de novo com o valor do troco.","img":"img-web/caixa-sangria-fechamento/passo-4.webp","semPrint":false},{"titulo":"Confira os fechamentos","texto":"O dono/gerente vê todos os caixas fechados, com sobras e faltas, em Relatórios › Caixas › Fechamento de Caixa.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-5.webp","semPrint":false}]},{"id":"contas-a-receber","grupo":"Financeiro","titulo":"Contas a receber: lançar e dar baixa","resumo":"Lance o que o cliente vai te pagar e registre quando ele pagar.","antes":"","passos":[{"titulo":"Abra Contas a Receber","texto":"No menu, clique em Financeiro › Contas a Receber. Os quadros no alto mostram o total recebido, o saldo a receber e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-1.webp","semPrint":false},{"titulo":"Veja as contas em aberto","texto":"Use as abas para ver as contas \"Em aberto/atraso\", as \"Pagas\" ou \"Todas\". Para achar um cliente, digite o nome no filtro.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Nova conta\"","texto":"Para lançar uma conta, clique em \"Nova conta\".","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-3.webp","semPrint":false},{"titulo":"Preencha a conta","texto":"Escolha o cliente, escreva uma descrição, o plano de contas, quantas parcelas, o valor total e o vencimento. Depois clique em \"Salvar\".","dica":"Se o cliente já pagou agora, ligue \"Já foi recebido agora\" e informe a data e a forma de pagamento.","atencao":"","img":"img-web/contas-a-receber/passo-4.webp","semPrint":false},{"titulo":"O cliente pagou? Dê baixa","texto":"Na linha da conta, clique em \"Receber no caixa (PDV)\" ou \"Receber com Pix\". Confira o valor e confirme.","dica":"O botão \"Copiar mensagem de cobrança (WhatsApp)\" já monta a mensagem para você mandar ao cliente.","atencao":"","img":"","semPrint":true}]},{"id":"contas-a-pagar","grupo":"Financeiro","titulo":"Contas a pagar: lançar e pagar","resumo":"Registre suas despesas e boletos e marque quando pagar.","antes":"","passos":[{"titulo":"Abra Contas a Pagar","texto":"No menu, clique em Financeiro › Contas a Pagar. Os quadros mostram o que já foi pago, o saldo a pagar e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Nova conta\"","texto":"Clique em \"Nova conta\" para lançar uma despesa ou boleto.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-2.webp","semPrint":false},{"titulo":"Diga de quem é a despesa","texto":"Em \"Vínculo da despesa\", escolha Fornecedor, Funcionário ou Despesa geral (luz, aluguel, internet...).","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-3.webp","semPrint":false},{"titulo":"Preencha e salve","texto":"Coloque a descrição, o plano de contas, as parcelas, o valor e o vencimento. Clique em \"Salvar\".","dica":"Conta que se repete todo mês (aluguel, internet)? Cadastre em Financeiro › Recorrências e ela é lançada sozinha.","atencao":"","img":"img-web/contas-a-pagar/passo-4.webp","semPrint":false},{"titulo":"Pagou? Clique em \"Pagar\"","texto":"Na linha da conta, clique em \"Pagar\", confira o valor, a forma e de qual conta saiu o dinheiro, e confirme.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-5.webp","semPrint":false}]},{"id":"formas-de-pagamento","grupo":"Financeiro","titulo":"Configurar formas de pagamento e maquininha","resumo":"Cadastre Pix, cartões e as taxas da maquininha, e diga em que conta cai o dinheiro.","antes":"","passos":[{"titulo":"Abra \"Formas de pagamento\"","texto":"No menu, clique em Financeiro › Formas de pagamento. São as opções que aparecem no caixa na hora de receber.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Nova forma\"","texto":"Clique em \"Nova forma\".","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-2.webp","semPrint":false},{"titulo":"Nome, tipo e atalho","texto":"Dê o nome que vai aparecer no caixa (ex.: \"Pix C6\"), escolha o tipo (Dinheiro, Pix, Crédito, Débito...) e uma tecla de atalho para usar no PDV.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-3.webp","semPrint":false},{"titulo":"Conta de destino e salvar","texto":"Em \"Conta de destino\", escolha em qual conta o dinheiro cai (ex.: conta do banco). Clique em \"Salvar\".","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-4.webp","semPrint":false},{"titulo":"Taxas da maquininha","texto":"Na aba \"Adquirentes\", cadastre sua maquininha com as taxas de débito, Pix e crédito. Assim o sistema mostra quanto você recebe de verdade e quando o dinheiro cai.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-5.webp","semPrint":false}]},{"id":"recorrencias","grupo":"Financeiro","titulo":"Contas que se repetem todo mês","resumo":"Aluguel, salário, internet: cadastre uma vez e o sistema lança os próximos 12 meses.","antes":"","passos":[{"titulo":"Clique em \"Nova recorrência\"","texto":"No menu, clique em Financeiro › Recorrências. Para uma conta a pagar, clique em \"Nova recorrência\". Para algo que você recebe todo mês, clique em \"A receber\".","dica":"","atencao":"","img":"img-web/recorrencias/passo-1.webp","semPrint":false},{"titulo":"Nome e plano de contas","texto":"Dê um nome (ex.: Aluguel). O plano de contas é sugerido sozinho pelo nome; confira.","dica":"","atencao":"","img":"img-web/recorrencias/passo-2.webp","semPrint":false},{"titulo":"Para quem","texto":"Escolha se é para um funcionário, um fornecedor ou outros (ex.: Cemig, condomínio).","dica":"","atencao":"","img":"img-web/recorrencias/passo-3.webp","semPrint":false},{"titulo":"Valor e dia do vencimento","texto":"Informe o valor por mês e o dia que vence. O quadro azul mostra quantas contas vão ser lançadas.","dica":"","atencao":"","img":"img-web/recorrencias/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Criar e lançar\"","texto":"Clique em \"Criar e lançar\". As contas aparecem em Contas a Pagar (ou a Receber), uma por mês.","dica":"O valor mudou? Use \"Alterar\": vale de hoje para frente, sem mexer nas contas já pagas.","atencao":"","img":"img-web/recorrencias/passo-5.webp","semPrint":false}]},{"id":"central-de-cobranca","grupo":"Financeiro","titulo":"Cobrar clientes atrasados (Central de cobrança)","resumo":"Veja quem está devendo e mande cobrança pelo WhatsApp para vários de uma vez.","antes":"","passos":[{"titulo":"Abra a Central de cobrança","texto":"No menu, clique em Financeiro › Central de cobrança. No alto aparece o total vencido e quantos clientes estão atrasados.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-1.webp","semPrint":false},{"titulo":"Escolha a faixa de atraso","texto":"Clique numa faixa (1 a 15 dias, 16 a 30 dias...) para ver só esses clientes.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-2.webp","semPrint":false},{"titulo":"Marque os clientes","texto":"Marque os clientes que você quer cobrar (ou \"Marcar todos\").","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Enviar cobrança\"","texto":"Clique em \"Enviar cobrança\". Confira a mensagem, deixe marcado o link de Pix (o cliente paga e a conta baixa sozinha) e clique em \"Enviar\".","dica":"Clique em \"Ver\" num cliente para anotar \"Prometeu pagar\" com a data. Assim você não cobra de novo antes da hora.","atencao":"","img":"","semPrint":true}]},{"id":"emitir-nota","grupo":"Fiscal","titulo":"Emitir nota fiscal de uma venda","resumo":"Transforme uma venda em NF-e ou NFC-e (cupom fiscal).","antes":"A empresa precisa ter o fiscal configurado (certificado digital) e o produto com NCM preenchido.","passos":[{"titulo":"Veja as vendas sem nota","texto":"No menu, clique em Fiscal › Notas a emitir. Aparecem as vendas que ainda não viraram nota fiscal. Use \"Hoje\", \"Este mês\" ou \"Todo o período\" para escolher as datas.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-1.webp","semPrint":false},{"titulo":"Abra a venda em Vendas","texto":"Para emitir, vá em Comercial › Vendas e encontre a venda (digite o nome do cliente para a const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const grupos = [...new Set(TUTORIAIS.map(t => t.grupo))];

function menu(atual){
  $('#menu').innerHTML = '<a href="#" class="'+(atual?'':'ativo')+'">🏠 Início</a>' + grupos.map(g =>
    '<h3>'+esc(g)+'</h3>' + TUTORIAIS.filter(t=>t.grupo===g).map(t =>
      '<a href="#'+t.id+'" class="'+(t.id===atual?'ativo':'')+'">'+esc(t.titulo)+'</a>').join('')).join('');
}
function cartoes(lista){
  if(!lista.length) return '<p class="vazio">Nenhum tutorial encontrado. Tente outra palavra.</p>';
  return '<div class="grade">'+lista.map(t =>
    '<a class="cartao" href="#'+t.id+'"><small>'+esc(t.grupo)+'</small><b>'+esc(t.titulo)+'</b><span>'+esc(t.resumo)+'</span><br><em>'+t.passos.length+' passos →</em></a>').join('')+'</div>';
}
function inicio(filtro){
  document.body.classList.remove('lendo');
  menu('');
  const q = norm(filtro||'').split(/\s+/).filter(Boolean);
  const lista = q.length ? TUTORIAIS.filter(t => { const txt = norm([t.titulo,t.resumo,t.grupo,...t.passos.map(p=>p.titulo+' '+p.texto)].join(' ')); return q.every(w=>txt.includes(w)); }) : TUTORIAIS;
  $('#conteudo').innerHTML = '<section class="inicio">' + (q.length ? '<h2>Resultados</h2>'+cartoes(lista)
    : grupos.map(g => '<h2>'+esc(g)+'</h2>'+cartoes(TUTORIAIS.filter(t=>t.grupo===g))).join('')) + '</section>';
}
function tutorial(t){
  document.body.classList.add('lendo');
  menu(t.id);
  const i = TUTORIAIS.indexOf(t), ant = TUTORIAIS[i-1], prox = TUTORIAIS[i+1];
  $('#conteudo').innerHTML = '<article class="tutorial">'
   + '<a class="voltar" href="#">← Todos os tutoriais</a>'
   + '<h2>'+esc(t.titulo)+'</h2><p class="resumo">'+esc(t.resumo)+'</p>'
   + (t.antes ? '<div class="antes"><b>Antes de começar:</b> '+esc(t.antes)+'</div>' : '')
   + '<div class="indice"><b>Neste tutorial:</b><ol>'+t.passos.map((p,n)=>'<li><a href="#'+t.id+'/'+(n+1)+'">'+esc(p.titulo)+'</a></li>').join('')+'</ol></div>'
   + t.passos.map((p,n) => '<section class="passo" id="p'+(n+1)+'"><div class="passo-topo"><div class="num">'+(n+1)+'</div><div>'
      + '<h3>'+esc(p.titulo)+'</h3><p>'+esc(p.texto)+'</p></div></div>'
      + (p.img ? '<img loading="lazy" src="'+p.img+'" alt="Passo '+(n+1)+': '+esc(p.titulo)+'">' : p.semPrint ? '' : '<div class="sem-img">Imagem deste passo ainda não capturada.</div>')
      + (p.atencao ? '<div class="caixa aten">⚠️ <b>Atenção:</b> '+esc(p.atencao)+'</div>' : '')
      + (p.dica ? '<div class="caixa dica">💡 <b>Dica:</b> '+esc(p.dica)+'</div>' : '')
      + '</section>').join('')
   + '<div class="fim"><b>✅ Pronto!</b><br>Ficou com dúvida? Fale com o suporte.</div>'
   + '<div class="nav-tut">'+(ant?'<a href="#'+ant.id+'">← '+esc(ant.titulo)+'</a>':'<span></span>')+(prox?'<a href="#'+prox.id+'">'+esc(prox.titulo)+' →</a>':'')+'</div>'
   + '</article>';
}
function rota(){
  const [id, passo] = location.hash.slice(1).split('/');
  const t = TUTORIAIS.find(x => x.id === id);
  if (t) { tutorial(t); const alvo = passo && document.getElementById('p'+passo); alvo ? alvo.scrollIntoView() : scrollTo(0,0); }
  else inicio($('#busca').value);
}
