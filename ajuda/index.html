<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Ajuda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: faixa clara com a logo no canto, busca grande; menu lateral por grupo + conteúdo.
   Cores tiradas da logo da Thiago Informática (azul-marinho e vermelho). */
:root{
  --marinho:#0c1f5c; --marinho-2:#1c3a96; --vermelho:#d7262e; --vermelho-suave:#fde8e8;
  --fundo:#f3f5fa; --card:#ffffff; --texto:#1b2235; --suave:#5d6680; --borda:#e1e6f0;
  --tinta-icone:#e8edfa; --hover:#eef2fb; --dica:#e9f8f1; --dica-b:#14986a; --aten:#fff3e6; --aten-b:#e0730d;
  --antes:#edf3ff; --antes-b:#3d6fe0; --faixa:#ffffff; --sombra:0 10px 30px rgba(12,31,92,.08);
  --f-titulo:"Sora","Segoe UI",system-ui,sans-serif; --f-texto:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --marinho:#9db4ff; --marinho-2:#7d9bff; --vermelho:#ff5a61; --vermelho-suave:#3a1719;
  --fundo:#0b1020; --card:#141b30; --texto:#e6e9f2; --suave:#99a3bd; --borda:#26304b;
  --tinta-icone:#1d2847; --hover:#1b2440; --dica:#0d2a22; --dica-b:#33c793; --aten:#2e1e0d; --aten-b:#f5a04d;
  --antes:#14213f; --antes-b:#7d9bff; --faixa:#121a2e; --sombra:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --marinho:#9db4ff; --marinho-2:#7d9bff; --vermelho:#ff5a61; --vermelho-suave:#3a1719;
  --fundo:#0b1020; --card:#141b30; --texto:#e6e9f2; --suave:#99a3bd; --borda:#26304b;
  --tinta-icone:#1d2847; --hover:#1b2440; --dica:#0d2a22; --dica-b:#33c793; --aten:#2e1e0d; --aten-b:#f5a04d;
  --antes:#14213f; --antes-b:#7d9bff; --faixa:#121a2e; --sombra:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;font-family:var(--f-texto);background:var(--fundo);color:var(--texto);font-size:17px;line-height:1.6}
a{color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}

/* Faixa do topo: logo no canto esquerdo */
header{background:var(--faixa);border-bottom:1px solid var(--borda);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--marinho) 0 70%,var(--vermelho) 70% 100%)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:68px;width:auto;display:block}
.logo span{font:600 13px/1.2 var(--f-texto);color:var(--suave);border-left:1px solid var(--borda);padding-left:12px}
.topo .suporte{font-size:14px;color:var(--suave)}
.hero{padding-block:18px 30px}
.hero h1{font:800 clamp(28px,4.2vw,44px)/1.1 var(--f-titulo);margin:0 0 6px;color:var(--marinho);text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0 0 18px;color:var(--suave);max-width:60ch}
.busca{position:relative;max-width:640px}
.busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--suave)}
#busca{width:100%;padding:16px 18px 16px 50px;border-radius:14px;border:2px solid var(--borda);background:var(--card);color:var(--texto);font:500 17px var(--f-texto);outline:none;box-shadow:var(--sombra)}
#busca:focus{border-color:var(--marinho-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--borda);background:var(--card);color:var(--texto);border-radius:999px;padding:6px 12px;font:500 14px var(--f-texto);cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--marinho-2);outline:none}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-block:26px 64px}
nav{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:10px;max-height:calc(100vh - 32px);overflow:auto}
nav h3{display:flex;align-items:center;gap:8px;font:700 12px var(--f-texto);text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:14px 8px 4px}
nav h3 svg{width:16px;height:16px}
nav a{display:block;text-decoration:none;padding:7px 10px 7px 32px;border-radius:9px;font-size:15px;line-height:1.35}
nav a.inicio{padding-left:10px;font-weight:600}
nav a:hover,nav a:focus-visible{background:var(--hover);outline:none}
nav a.ativo{background:var(--marinho);color:var(--card);font-weight:600}
main{min-width:0}

/* Início */
.secao{display:grid;gap:14px;margin-bottom:34px}
.secao-titulo{display:flex;align-items:center;gap:10px;font:700 22px var(--f-titulo);margin:0;color:var(--texto)}
.secao-titulo .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--tinta-icone);color:var(--marinho)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cartao{display:grid;grid-template-rows:auto 1fr auto;gap:6px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.cartao:hover,.cartao:focus-visible{transform:translateY(-2px);box-shadow:var(--sombra);border-color:var(--marinho-2);outline:none}
.cartao b{font:700 17px/1.3 var(--f-titulo)}
.cartao span{color:var(--suave);font-size:15px;line-height:1.45}
.cartao em{font-style:normal;font-size:13px;font-weight:600;color:var(--marinho-2);display:flex;align-items:center;gap:6px}
.cartao em i{font-style:normal;background:var(--vermelho-suave);color:var(--vermelho);border-radius:999px;padding:1px 8px}
.destaques .cartao{border-top:4px solid var(--vermelho)}
.destaques .cartao .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tinta-icone);color:var(--marinho);margin-bottom:6px}
.vazio{color:var(--suave)}

/* Tutorial */
.voltar{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-size:15px;font-weight:600;color:var(--marinho-2);text-decoration:none}
.cab-tut{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.cab-tut .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--marinho);color:var(--card)}
.cab-tut .ic svg{width:26px;height:26px}
.cab-tut small{font:700 12px var(--f-texto);text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.tutorial h2{font:800 clamp(24px,3vw,32px)/1.2 var(--f-titulo);margin:2px 0 4px;text-wrap:balance}
.tutorial .resumo{color:var(--suave);margin:0}
.video{display:grid;gap:6px;margin-bottom:18px}
.video video{width:100%;aspect-ratio:16/9;border-radius:16px;background:#000;box-shadow:var(--sombra)}
.video small{color:var(--suave);font-size:14px}
.cartao em .v{background:var(--marinho);color:var(--card)}
.antes{background:var(--antes);border-left:5px solid var(--antes-b);padding:12px 16px;border-radius:12px;margin-bottom:18px}
.indice{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.indice ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:p}
.indice li{counter-increment:p;display:flex;gap:10px;align-items:baseline}
.indice li::before{content:counter(p);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--vermelho);color:#fff;font:700 13px/24px var(--f-texto);text-align:center}
.indice a{text-decoration:none;color:var(--marinho-2);font-weight:500}
.passo{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:20px;margin-bottom:18px;scroll-margin-top:16px;display:grid;gap:14px}
.passo-topo{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--vermelho);color:#fff;font:800 20px var(--f-titulo);display:grid;place-items:center;border:3px solid var(--card);box-shadow:0 3px 10px rgba(215,38,46,.4)}
.passo h3{margin:6px 0 4px;font:700 20px/1.3 var(--f-titulo)}
.passo p{margin:0;max-width:70ch}
.passo img{display:block;width:100%;border-radius:12px;border:1px solid var(--borda);cursor:zoom-in;box-shadow:var(--sombra)}
.caixa{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:16px}
.caixa svg{margin-top:2px;width:20px;height:20px}
.caixa.dica{background:var(--dica);border-left:5px solid var(--dica-b)} .caixa.dica svg{color:var(--dica-b)}
.caixa.aten{background:var(--aten);border-left:5px solid var(--aten-b)} .caixa.aten svg{color:var(--aten-b)}
.sem-img{padding:22px;border:2px dashed var(--borda);border-radius:12px;color:var(--suave);text-align:center;font-size:15px}
.fim{display:grid;justify-items:center;gap:4px;text-align:center;background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:24px}
.fim b{font:800 22px var(--f-titulo);color:var(--marinho)}
.fim .ok{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--dica);color:var(--dica-b)}
.nav-tut{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:16px}
.nav-tut a{background:var(--marinho);color:var(--card);text-decoration:none;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px}
.nav-tut a:focus-visible{outline:3px solid var(--vermelho);outline-offset:2px}
#zoom{position:fixed;inset:0;background:rgba(5,10,25,.88);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
footer{border-top:1px solid var(--borda);padding-block:20px;color:var(--suave);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
footer img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;padding-block:18px 48px}
  nav{position:static;max-height:none} body.lendo nav{display:none}
  .passo{padding:14px} .topo .suporte{display:none} .logo img{height:52px}
}
</style>
</head>
<body>
<header>
  <div class="wrap gutter">
    <div class="topo">
      <a class="logo" href="#"><img src="logo.webp" alt="Thiago Informática Sistemas"><span>Central de Ajuda<br>THGestor</span></a>
      <div class="suporte">Dúvida? Fale com o suporte da Thiago Informática.</div>
    </div>
    <div class="hero">
      <h1>Como podemos ajudar?</h1>
      <p>Tutoriais passo a passo, com a imagem de cada tela. É só seguir as bolinhas vermelhas numeradas.</p>
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" aria-label="Buscar tutorial" placeholder="O que você quer fazer? Ex.: fazer venda, emitir nota...">
      </div>
      <div class="chips" aria-label="Buscas rápidas">
        <button type="button" data-q="venda">Fazer venda</button><button type="button" data-q="cliente">Cadastrar cliente</button><button type="button" data-q="nota">Nota fiscal</button><button type="button" data-q="caixa">Caixa</button><button type="button" data-q="estoque">Estoque</button>
      </div>
    </div>
  </div>
</header>
<div class="wrap gutter">
  <div class="layout">
    <nav id="menu" aria-label="Tutoriais por assunto"></nav>
    <main id="conteudo"></main>
  </div>
</div>
<footer><div class="wrap gutter"><img src="logo.webp" alt=""><span>Central de Ajuda do THGestor · Thiago Informática Sistemas</span></div></footer>
<div id="zoom" role="dialog" aria-label="Imagem ampliada"><img alt=""></div>
<script>
const TUTORIAIS = [{"id":"entrar-no-sistema","grupo":"Primeiros passos","titulo":"Como entrar no sistema","resumo":"Acesse o sistema com seu e-mail e senha, ou com sua conta Google/Microsoft.","antes":"","destaque":false,"video":"videos-web/entrar-no-sistema.mp4","capa":"videos-web/entrar-no-sistema.jpg","passos":[{"titulo":"Digite seu e-mail","texto":"Abra o endereço do sistema no navegador. Na tela \"Bem-vindo!\", clique no campo E-mail e digite o e-mail que você usa no sistema. (Funcionário sem e-mail? Veja o tutorial \"Entrar com usuário e senha\".)","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-1.webp","semPrint":false},{"titulo":"Digite sua senha","texto":"Clique no campo Senha e digite a sua senha. Ela aparece com bolinhas para ninguém ver.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Entrar com e-mail\"","texto":"Confira o e-mail e clique no botão \"Entrar com e-mail\". Pronto: o sistema abre no Dashboard.","dica":"Se o sistema pedir um código de verificação, abra o aplicativo autenticador ou o seu e-mail e digite o código que chegou.","atencao":"","img":"img-web/entrar-no-sistema/passo-3.webp","semPrint":false},{"titulo":"Ou entre com Google ou Microsoft","texto":"Se o seu e-mail é Gmail ou Hotmail/Outlook, você pode clicar em \"Continuar com Google\" ou \"Continuar com Microsoft\" e entrar sem digitar senha.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-4.webp","semPrint":false}]},{"id":"esqueci-a-senha","grupo":"Primeiros passos","titulo":"Esqueci minha senha","resumo":"Receba no seu e-mail um link para criar uma senha nova.","antes":"","destaque":false,"video":"videos-web/esqueci-a-senha.mp4","capa":"videos-web/esqueci-a-senha.jpg","passos":[{"titulo":"Clique em \"Esqueceu a senha?\"","texto":"Na tela de entrada, clique no link \"Esqueceu a senha?\", que fica ao lado do campo Senha.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-1.webp","semPrint":false},{"titulo":"Digite seu e-mail","texto":"Na tela \"Recuperar senha\", digite o mesmo e-mail que você usa para entrar no sistema.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Enviar link de recuperação\"","texto":"Clique no botão. Em alguns minutos chega um e-mail com o link para criar sua senha nova. Abra o e-mail, clique no link e cadastre a nova senha.","dica":"Não chegou? Olhe a caixa de Spam/Lixo eletrônico. Se mesmo assim não aparecer, fale com o suporte.","atencao":"","img":"img-web/esqueci-a-senha/passo-3.webp","semPrint":false}]},{"id":"criar-conta","grupo":"Primeiros passos","titulo":"Criar minha conta (primeiro acesso)","resumo":"Recebeu um convite? Crie sua senha e comece a usar.","antes":"","destaque":false,"video":"videos-web/criar-conta.mp4","capa":"videos-web/criar-conta.jpg","passos":[{"titulo":"Abra o link do convite","texto":"Abra o link que chegou no seu e-mail de convite. Ele abre a tela \"Criar Conta\". Só funciona com e-mails autorizados pela sua empresa.","dica":"","atencao":"","img":"img-web/criar-conta/passo-1.webp","semPrint":false},{"titulo":"Preencha seus dados","texto":"Use o MESMO e-mail que recebeu o convite. Depois digite seu nome, crie uma senha e repita a senha no último campo.","dica":"","atencao":"","img":"img-web/criar-conta/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Criar conta\"","texto":"Clique no botão \"Criar conta\". Pronto! Agora é só entrar com seu e-mail e a senha que você criou.","dica":"Só funciona com e-mails autorizados pela sua empresa. Se aparecer aviso de e-mail não autorizado, peça ao responsável da empresa para liberar seu e-mail.","atencao":"","img":"img-web/criar-conta/passo-3.webp","semPrint":false}]},{"id":"entrar-funcionario","grupo":"Primeiros passos","titulo":"Entrar com usuário e senha (funcionário sem e-mail)","resumo":"Funcionário entra com o código da empresa, usuário e senha.","antes":"O administrador da empresa precisa ter cadastrado o seu usuário e senha.","destaque":false,"video":"videos-web/entrar-funcionario.mp4","capa":"videos-web/entrar-funcionario.jpg","passos":[{"titulo":"Clique em \"Entrar com usuário e senha\"","texto":"Na tela de entrada, clique no botão \"Entrar com usuário e senha\", no final da caixa.","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Preencha empresa, usuário e senha","texto":"Digite o código ou o CNPJ da empresa, o seu usuário (ex.: joao.silva) e a sua senha. Quem passa esses dados é o administrador da empresa.","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Entrar\"","texto":"Clique em \"Entrar\". Você verá só as telas que o administrador liberou para você.","dica":"Esqueceu a senha de funcionário? Peça ao administrador da empresa para criar uma nova em Cadastros › Pessoas › Usuários.","atencao":"","img":"img-web/entrar-funcionario/passo-3.webp","semPrint":false}]},{"id":"portal-do-contador","grupo":"Primeiros passos","titulo":"Acesso do contador","resumo":"Seu contador entra no Portal do Contador para pegar as notas e os arquivos fiscais.","antes":"A empresa precisa ter cadastrado o e-mail do contador no sistema.","destaque":false,"video":"videos-web/portal-do-contador.mp4","capa":"videos-web/portal-do-contador.jpg","passos":[{"titulo":"Abra o Portal do Contador","texto":"O contador entra pelo endereço do sistema terminado em /entrar-contador. A empresa manda esse link pelo botão \"Enviar acesso ao contador pelo WhatsApp\", em Fiscal › Arquivos para contador.","dica":"","atencao":"","img":"img-web/portal-do-contador/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Entrar com e-mail\"","texto":"No Portal do Contador, clique em \"Entrar com e-mail\" e use o e-mail que a empresa cadastrou para você. Dá para entrar com Google, Microsoft ou e-mail e senha.","dica":"Se aparecer que o e-mail não está cadastrado, peça para a empresa (ou para o suporte) incluir o seu e-mail.","atencao":"","img":"img-web/portal-do-contador/passo-2.webp","semPrint":false}]},{"id":"conhecendo-o-menu","grupo":"Primeiros passos","titulo":"Conhecendo o menu","resumo":"Ache qualquer tela rápido: menu lateral, busca e favoritos.","antes":"","destaque":false,"video":"videos-web/conhecendo-o-menu.mp4","capa":"videos-web/conhecendo-o-menu.jpg","passos":[{"titulo":"O menu fica do lado esquerdo","texto":"Todas as telas do sistema estão no menu azul à esquerda, separadas por assunto: Comercial, Cadastros, Estoque, Financeiro, Fiscal, WhatsApp, Relatórios, Configurações e Utilitários.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-1.webp","semPrint":false},{"titulo":"Clique num grupo para abrir","texto":"Clique no nome do grupo (por exemplo \"Cadastros\") para ver as telas dele. Clique de novo para fechar.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-2.webp","semPrint":false},{"titulo":"Marque suas telas favoritas","texto":"Clique na estrelinha ao lado de uma tela que você usa muito. Ela vai aparecer lá em cima, em \"Favoritos\".","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-3.webp","semPrint":false},{"titulo":"Não achou? Pesquise","texto":"Digite o que procura no campo \"Buscar no sistema...\" (por exemplo \"contas\") e clique no resultado.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-4.webp","semPrint":false},{"titulo":"Clique no resultado","texto":"Aparece a lista das telas encontradas. É só clicar na que você quer.","dica":"Aperte Enter para abrir o primeiro resultado da lista.","atencao":"","img":"img-web/conhecendo-o-menu/passo-5.webp","semPrint":false},{"titulo":"Modo escuro","texto":"Prefere a tela escura (cansa menos a vista à noite)? Clique em \"Modo escuro\", no rodapé do menu, logo acima de \"Sair\". Para voltar, clique em \"Modo claro\".","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-6.webp","semPrint":false}]},{"id":"cadastrar-cliente","grupo":"Cadastros","titulo":"Cadastrar um cliente","resumo":"Cadastre clientes com nome, CPF/CNPJ, WhatsApp e endereço.","antes":"","destaque":false,"video":"videos-web/cadastrar-cliente.mp4","capa":"videos-web/cadastrar-cliente.jpg","passos":[{"titulo":"Abra a tela de Clientes","texto":"No menu, clica em Cadastros, Pessoas, Clientes. Aqui ficam todos os seus clientes. Pra cadastrar um novo, é no botão Novo cliente.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-1.webp","semPrint":false},{"titulo":"Digite o nome","texto":"O único campo obrigatório é o nome. O código é criado sozinho quando você salva.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-2.webp","semPrint":false},{"titulo":"CPF, WhatsApp e e-mail","texto":"Coloca o CPF ou CNPJ: se for CNPJ, a lupa busca e preenche os dados da empresa sozinha. O e-mail. E o WhatsApp do cliente, que é por onde vão os comprovantes, as cobranças e o parabéns no aniversário.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-3.webp","semPrint":false},{"titulo":"Endereço","texto":"Agora o endereço: o CEP, a rua, o número, o bairro e a cidade. Com o CEP, a lupa do lado já preenche a rua e a cidade sozinha.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-4.webp","semPrint":false},{"titulo":"Clique em Cadastrar","texto":"Confere e clica em Cadastrar. Pronto, a cliente está salva.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-5.webp","semPrint":false},{"titulo":"A cliente já está na lista","texto":"E ela já aparece na lista, pronta pra usar nas vendas, nas ordens de serviço e no crediário.","dica":"Para alterar depois, clique no lápis (Editar) na linha do cliente.","atencao":"","img":"img-web/cadastrar-cliente/passo-6.webp","semPrint":false}]},{"id":"cadastrar-produto","grupo":"Cadastros","titulo":"Cadastrar um produto","resumo":"Cadastre um produto completo: nome, código de barras, grupo, estoque, custo, preço de venda e a tributação pela Tributação IA.","antes":"","destaque":false,"video":"videos-web/cadastrar-produto.mp4","capa":"videos-web/cadastrar-produto.jpg","passos":[{"titulo":"Abra a tela de Produtos","texto":"No menu, clica em Cadastros, Produtos. Aqui ficam todos os seus produtos. Pra cadastrar um novo, é no botão Novo produto.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-1.webp","semPrint":false},{"titulo":"Digite o nome","texto":"Clicou em Novo produto, digita o nome do produto. O código interno não precisa: o sistema cria sozinho quando você salva.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-2.webp","semPrint":false},{"titulo":"Código de barras","texto":"O código de barras: passa o leitor na etiqueta do produto, ou digita o número. Se o produto não tem, clica no mais, Gerar EAN, que o sistema cria um pra você.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-3.webp","semPrint":false},{"titulo":"Grupo e marca","texto":"Em Grupo e em Marca é só começar a digitar e dar Enter. Se ainda não existe, aparece Cadastrar embaixo e ele cria na hora.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-4.webp","semPrint":false},{"titulo":"Fornecedor","texto":"No Fornecedor, digita o nome de quem te vende e clica nele. Assim você sabe de quem comprar de novo.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-5.webp","semPrint":false},{"titulo":"Estoque atual e mínimo","texto":"Agora o estoque: quantos você tem hoje, aqui vinte, e o estoque mínimo, cinco. Quando chegar no mínimo, o sistema te avisa que está acabando.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-6.webp","semPrint":false},{"titulo":"Custo, margem e preço de venda","texto":"Coloca o preço de custo, quanto você pagou, e o preço de venda. A margem aparece sozinha. Ou, se preferir, digita a margem e o preço de venda é calculado.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-7.webp","semPrint":false},{"titulo":"Tributação IA","texto":"Agora a parte fiscal, sem complicação. Clica em Tributação IA: o sistema pesquisa pelo nome do produto e sugere o NCM, o CEST, o CSOSN e o CFOP. Lê com calma e clica em Aplicar no produto.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Confira na aba Fiscal","texto":"Depois, confere na aba Fiscal: o NCM, o CEST e os CFOPs já estão preenchidos.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Não achou? Preencha à mão","texto":"Se a busca não achar, digita o NCM de oito números, que vem na nota do fornecedor, ou clica na lupa do lado pra pesquisar. Na dúvida, confirma com o seu contador.","dica":"O NCM certo está na nota fiscal de compra do fornecedor: copie de lá.","atencao":"","img":"","semPrint":false},{"titulo":"Clique em Cadastrar","texto":"Tudo certo? Clica em Cadastrar. Pronto, o produto está salvo e já pode ser vendido no caixa.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O produto já está na lista","texto":"E olha ele aqui na lista, com o código, o estoque e o preço. Pra mudar alguma coisa depois, é no lápis, Editar produto.","dica":"Para criar um produto parecido, use \"Clonar produto\" na linha dele: copia tudo e você só muda o que precisa.","atencao":"","img":"","semPrint":false}]},{"id":"cadastrar-fornecedor","grupo":"Cadastros","titulo":"Cadastrar um fornecedor","resumo":"Cadastre quem vende mercadoria para a sua loja.","antes":"","destaque":false,"video":"videos-web/cadastrar-fornecedor.mp4","capa":"videos-web/cadastrar-fornecedor.jpg","passos":[{"titulo":"Abra Fornecedores","texto":"No menu, clica em Cadastros, Pessoas, Fornecedores. Pra cadastrar, é no botão Novo fornecedor.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Se tiver o CNPJ, digita e clica na lupa: o nome e o endereço vêm sozinhos, direto da Receita.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-2.webp","semPrint":false},{"titulo":"O nome e o contato","texto":"O nome é o único obrigatório. Aqui eu digitei Atacado Exemplo Sul. Dá pra colocar também o telefone, o WhatsApp e o e-mail do vendedor.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-3.webp","semPrint":false},{"titulo":"Clique em Cadastrar","texto":"Clica em Cadastrar e pronto.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-4.webp","semPrint":false},{"titulo":"O fornecedor já está na lista","texto":"Ele já aparece na lista, pronto pra usar na entrada de mercadoria e no contas a pagar.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-5.webp","semPrint":false}]},{"id":"grade-de-produtos","grupo":"Cadastros","titulo":"Grade de produtos (cor e numeração)","resumo":"Venda roupas e calçados por cor e número: cada combinação tem estoque e código de barras próprios.","antes":"A grade precisa estar liberada para a sua empresa. Se não aparecer \"Grades\" no menu, fale com o suporte da Thiago Informática.","destaque":false,"video":"videos-web/grade-de-produtos.mp4","capa":"videos-web/grade-de-produtos.jpg","passos":[{"titulo":"Abra as Grades","texto":"No menu, clica em Cadastros, Produtos, Grades. Aqui ficam as cores e as numerações. As mais usadas já vêm prontas: preto, branco, nude, jeans e muitas outras.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-1.webp","semPrint":false},{"titulo":"Cadastre uma cor nova","texto":"Faltou uma cor da sua marca? Digita o nome, escolhe a cor na paleta do lado e clica em mais Cor.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-2.webp","semPrint":false},{"titulo":"Numeração nova e Salvar","texto":"As numerações também vêm prontas: calçado, roupa de PP a XGG, jeans e tamanho único. Pra criar a sua, digita o nome, os tamanhos separados por vírgula e clica em mais Grade. No fim, clica em Salvar.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-3.webp","semPrint":false},{"titulo":"Novo produto \"Com Grade\"","texto":"Agora em Cadastros, Produtos, clica em Novo produto, digita o nome da referência e, em Tipo do produto, escolhe Com Grade. Repara: o estoque não fica mais no produto, fica em cada cor e numeração.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-4.webp","semPrint":false},{"titulo":"Grupo e preços da referência","texto":"Coloca o grupo, o preço de custo e o preço de venda. Esses dados vão pra todas as cores e numerações de uma vez.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-5.webp","semPrint":false},{"titulo":"Clique em Cadastrar","texto":"Clica em Cadastrar. Na hora, o sistema já abre a montagem da grade.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-6.webp","semPrint":false},{"titulo":"1. Numeração","texto":"Primeiro a numeração: escolhe a grade, aqui Roupa, e clica nos tamanhos que você vende: P, M e G.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-7.webp","semPrint":false},{"titulo":"2. Cores","texto":"Depois as cores: é só clicar nas que você tem. Preto, Branco, e o Verde Água, que a gente acabou de cadastrar.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-8.webp","semPrint":false},{"titulo":"3. Estoque de cada cor e número","texto":"Na tabela, digita quantas peças você tem de cada cor e tamanho. Se o fornecedor manda código de barras, marca essa opção e digita; se não, o sistema cria um código pra cada peça.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-9.webp","semPrint":false},{"titulo":"Clique em Gerar","texto":"Agora clica em Gerar: cada cor e tamanho vira um item, com estoque e código de barras próprios. No caixa é só passar o código, e o estoque baixa da peça certinha.","dica":"Pra aumentar a grade depois (cor ou número novo), abra o produto no lápis e clique em \"Cores e numerações da grade\". O que já tem estoque fica travado.","atencao":"","img":"img-web/grade-de-produtos/passo-10.webp","semPrint":false},{"titulo":"A grade na lista de Produtos","texto":"Na lista aparece a referência, com a etiqueta Grade, e cada cor e tamanho como um item, com o seu estoque.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-11.webp","semPrint":false},{"titulo":"Estoque, Consulta de Grade","texto":"E pra ver tudo de uma vez, vai em Estoque, Consulta de Grade, e busca a referência. Aparece a tabela de cor por tamanho com o saldo de cada um, o total por cor e o total por tamanho.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-12.webp","semPrint":false},{"titulo":"Última peça e reposição","texto":"Olha que inteligente: a última peça, o Verde Água M, aparece em amarelo, e embaixo vem a reposição sugerida, com o que está zerado e o que está acabando.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-13.webp","semPrint":false},{"titulo":"Filtros, Excel e impressão","texto":"Dá ainda pra filtrar por cor e por tamanho, esconder a grade zerada, exportar pro Excel e imprimir.","dica":"Na lista de Produtos, a etiqueta \"▦ Grade\" na linha do produto também abre essa consulta.","atencao":"","img":"","semPrint":false}]},{"id":"cadastrar-funcionario","grupo":"Cadastros","titulo":"Cadastrar funcionário, permissões, salário e comissão","resumo":"Crie o acesso do funcionário, escolha o que ele pode ver e fazer, e coloque o salário e a comissão.","antes":"Só o administrador da empresa consegue cadastrar usuários.","destaque":false,"video":"videos-web/cadastrar-funcionario.mp4","capa":"videos-web/cadastrar-funcionario.jpg","passos":[{"titulo":"Abra Usuários","texto":"No menu, clica em Cadastros, Pessoas, Usuários. Aqui ficam todos que usam o sistema. Pra cadastrar, é no botão Novo usuário.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Escolha o perfil","texto":"Clicou em Novo usuário, a primeira coisa é o Perfil de acesso. Escolhe o que a pessoa faz: vendedor, caixa, gerente, técnico. Aqui eu escolhi Vendedor, e o sistema já libera as telas certas.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Nome e como ele vai entrar","texto":"Digita o nome. Em Como o funcionário vai entrar, se ele não tem e-mail, escolhe Por usuário e senha: você mesmo cria o usuário e a senha dele.","dica":"Escolheu \"Por e-mail\"? Ele recebe um convite no e-mail e cria a própria senha.","atencao":"","img":"img-web/cadastrar-funcionario/passo-3.webp","semPrint":false},{"titulo":"Usuário e senha","texto":"Coloca o usuário, sem espaço, e uma senha. Logo embaixo aparece certinho como ele vai entrar no sistema.","dica":"","atencao":"Não coloque o WhatsApp de ninguém aqui só pra testar: é por ele que vai a agenda do dia.","img":"img-web/cadastrar-funcionario/passo-4.webp","semPrint":false},{"titulo":"Confira as permissões","texto":"Agora clica na aba Permissões. Em cima ficam as telas que ele pode abrir, e embaixo o que ele pode fazer, como dar desconto ou excluir venda. Ligado pode, desligado não pode.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-5.webp","semPrint":false},{"titulo":"Clique em Cadastrar","texto":"Tudo certo? Clica em Cadastrar. Pronto, o funcionário já pode entrar.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-6.webp","semPrint":false},{"titulo":"Ele já está na lista","texto":"Olha ele aqui na lista, com o perfil Vendedor e o usuário pra entrar. Agora vamos colocar o salário e a comissão: clica no lápis de editar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Salário e dia de pagamento","texto":"Na aba Funcionário, marca: É funcionário. Coloca o salário da carteira e o dia de pagamento. O salário já vai sozinho pro Contas a pagar, todo mês.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Comissão","texto":"Descendo um pouco, em Comissão dele: coloca a porcentagem sobre os produtos, aqui três por cento, e escolhe Salário mais comissão. A comissão soma sozinha pelas vendas dele.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Salve","texto":"Agora é só clicar em Salvar. Pronto: o Carlos já entra no sistema, aparece no menu Funcionários e o salário cai no Contas a pagar.","dica":"Passe pra ele o usuário e a senha (veja o tutorial \"Entrar como funcionário\").","atencao":"Funcionário saiu da empresa? Edite o usuário e desligue \"Ativo\" para bloquear o acesso.","img":"","semPrint":false}]},{"id":"grupos-marcas-unidades","grupo":"Cadastros","titulo":"Grupos, marcas, unidades e plano de contas","resumo":"Organize seus produtos em grupos, marcas e unidades, e crie as categorias de receitas e despesas.","antes":"","destaque":false,"video":"videos-web/grupos-marcas-unidades.mp4","capa":"videos-web/grupos-marcas-unidades.jpg","passos":[{"titulo":"Novo grupo","texto":"No menu, clica em Cadastros, Produtos, Grupos e Subgrupos. Clica em Novo grupo e digita o nome, por exemplo, Capinhas e Películas.","dica":"","atencao":"","img":"img-web/grupos-marcas-unidades/passo-1.webp","semPrint":false},{"titulo":"Salve o grupo","texto":"Clica em Salvar, e o grupo já aparece na lista.","dica":"","atencao":"","img":"img-web/grupos-marcas-unidades/passo-2.webp","semPrint":false},{"titulo":"Subgrupo dentro do grupo","texto":"Agora clica no nome do grupo, Capinhas e Películas, e depois em Novo subgrupo. Digita Película 3D e salva. Assim você filtra os produtos e vê os relatórios por grupo.","dica":"","atencao":"","img":"img-web/grupos-marcas-unidades/passo-3.webp","semPrint":false},{"titulo":"Grupo e subgrupo prontos","texto":"Pronto: do lado esquerdo o grupo, e do lado direito o subgrupo dele.","dica":"","atencao":"","img":"img-web/grupos-marcas-unidades/passo-4.webp","semPrint":false},{"titulo":"Marcas","texto":"Agora as marcas. No menu, clica em Cadastros, Produtos, Marcas. Clica em Nova marca, digita o nome e clica em Salvar.","dica":"Também dá para criar a marca na hora, dentro do cadastro do produto: comece a digitar e clique em \"+ Cadastrar\".","atencao":"","img":"","semPrint":false},{"titulo":"Unidades de medida","texto":"As unidades ficam em Cadastros, Produtos, Unidades. Clica em Nova unidade, coloca o nome e a sigla, aqui Fardo, FD, e clica em Salvar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A unidade já está na lista","texto":"Pronto, o Fardo já aparece na lista e já dá pra usar no cadastro dos produtos.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Plano de contas: nova conta","texto":"Agora o plano de contas, em Cadastros, Plano de contas. Ele já vem pronto, com as receitas e as despesas que alimentam o DRE. Pra criar uma nova, clica em Nova conta e dá o nome, aqui Sistema de alarme. O tipo é Despesa.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Escolha a categoria pai","texto":"Em Categoria pai, escolhe onde ela fica: aqui em Despesas Operacionais. Depois clica em Salvar.","dica":"Use nomes simples, como \"Energia\", \"Aluguel\", \"Internet\". Assim o DRE fica fácil de ler.","atencao":"","img":"","semPrint":false},{"titulo":"A conta já está no plano","texto":"Abrindo Despesas Operacionais, a conta Sistema de alarme já está lá. Agora ela aparece no Contas a pagar e no DRE.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"servicos-e-equipamentos","grupo":"Cadastros","titulo":"Serviços, status e equipamentos (para a OS)","resumo":"Cadastre os serviços com preço e comissão, os status da OS e os equipamentos dos clientes.","antes":"","destaque":false,"video":"videos-web/servicos-e-equipamentos.mp4","capa":"videos-web/servicos-e-equipamentos.jpg","passos":[{"titulo":"Abra Serviços e Status","texto":"No menu, clica em Cadastros, Serviços, Serviços e Status. Aqui ficam os serviços que você faz, com o preço e a comissão do técnico.","dica":"","atencao":"","img":"img-web/servicos-e-equipamentos/passo-1.webp","semPrint":false},{"titulo":"Nome, preço e comissão","texto":"Digita o nome do serviço, o preço, se ele tem preço fixo, e a comissão do técnico. Depois clica em Cadastrar.","dica":"Sem preço, o valor é digitado na hora, em cada OS.","atencao":"","img":"img-web/servicos-e-equipamentos/passo-2.webp","semPrint":false},{"titulo":"O serviço já está na lista","texto":"Pronto, o serviço já aparece na lista com o preço. A comissão dá pra mudar aqui mesmo, direto na linha.","dica":"","atencao":"","img":"img-web/servicos-e-equipamentos/passo-3.webp","semPrint":false},{"titulo":"Status da OS","texto":"Agora clica em Status. São as etapas que a OS passa. Digita o nome, aqui Aguardando aprovação, e clica em Cadastrar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O status já está na lista","texto":"Pronto, o status novo já aparece aqui, e na OS ele já fica pra escolher.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Equipamentos dos clientes","texto":"Agora os equipamentos. No menu, clica em Cadastros, Serviços, Equipamentos. Digita o equipamento e o modelo, uma observação, como o número de série, e escolhe o cliente.","dica":"Na oficina, aqui aparece Veículo e Placa no lugar de Equipamento e Observação.","atencao":"","img":"","semPrint":false},{"titulo":"Clique em Cadastrar","texto":"Clica em Cadastrar. Pronto: quando a Joana chegar pra abrir uma OS, o notebook dela já aparece pra escolher.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O equipamento já está na lista","texto":"E na lista já está o notebook, ligado à cliente.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"vender-no-pdv","grupo":"Comercial","titulo":"Fazer uma venda no PDV (caixa)","resumo":"Lance os produtos e receba de todos os jeitos: dinheiro com troco, cartão parcelado, Pix, pagamento dividido e crediário.","antes":"Ter os produtos cadastrados e o caixa aberto. Para vender no crediário, o cliente precisa estar cadastrado.","destaque":false,"video":"videos-web/vender-no-pdv.mp4","capa":"videos-web/vender-no-pdv.jpg","passos":[{"titulo":"Abra o PDV","texto":"No menu, clica em Comercial, PDV. Esse é o caixa. Lá em cima mostra que o caixa está aberto. Pra vender, é no Nova venda.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-1.webp","semPrint":false},{"titulo":"Bipe o produto","texto":"Clica em Nova venda e bipa o código de barras do produto, ou digita o código e aperta Enter. Pronto, ele já entrou na venda.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-2.webp","semPrint":false},{"titulo":"Mais de uma unidade","texto":"Pra lançar várias unidades, digita a quantidade, um asterisco e o código. Aqui foram duas. O total já aparece aqui do lado.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-3.webp","semPrint":false},{"titulo":"Dinheiro com troco","texto":"Agora aperta F9 pra receber. O cliente me deu cem reais: digito cem e clico em Dinheiro. Olha aí o troco de dez reais. É só apertar Enter.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-4.webp","semPrint":false},{"titulo":"Sem nota e sem papel","texto":"Venda gravada! Agora ele pergunta o documento: cupom fiscal, nota fiscal, ou venda normal, sem nota. A nota tem um vídeo só dela. Aqui eu aperto três. Depois vem o comprovante: Não imprimir.","dica":"","atencao":"As teclas 1 e 2 emitem a nota fiscal na hora. Para venda sem nota, é a 3.","img":"img-web/vender-no-pdv/passo-5.webp","semPrint":false},{"titulo":"Cartão parcelado","texto":"Agora uma venda no cartão. Bipa o produto e aperta F9. Clica em Cartão Crédito. Clicando de novo, ele parcela: aqui ficou em duas vezes. E Enter.","dica":"Cada forma tem uma letra de atalho (aparece no botão): no cartão de crédito, cada toque na letra soma uma parcela.","atencao":"","img":"","semPrint":false},{"titulo":"Dividir: dinheiro e Pix","texto":"Dá pra dividir o pagamento. Nessa venda o cliente pagou trinta reais em Dinheiro, e o resto no Pix. Os pagamentos aparecem aqui do lado. Enter, e pronto.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A prazo: escolha o cliente (F10)","texto":"Agora uma venda a prazo, no crediário. Pra isso tem que ter o cliente: bipa o produto, aperta F10 e escolhe o cliente.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Crediário em parcelas","texto":"Aperta F9 e clica em Crediário. Cada clique é mais uma parcela: aqui ficou em três vezes, com o vencimento de cada uma, todo mês. Dá pra mudar a data e o valor aqui. Enter, três, e Não imprimir.","dica":"As parcelas do crediário vão sozinhas para Financeiro › Contas a Receber, no nome do cliente.","atencao":"","img":"","semPrint":false},{"titulo":"Vendas feitas (F4)","texto":"Pronto! Todas as vendas ficam no F4, Vendas. Olha aqui as vendas que eu acabei de fazer, com a forma de pagamento de cada uma.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"modo-treino-pdv","grupo":"Comercial","titulo":"Modo treino no PDV","resumo":"Funcionário novo pratica vendas no caixa sem medo: no treino nada é gravado.","antes":"","destaque":false,"video":"videos-web/modo-treino-pdv.mp4","capa":"","passos":[{"titulo":"Abra o PDV","texto":"Abre o PDV pelo menu. Aqui no canto de baixo tem o botão laranja Modo treino.","dica":"","atencao":"","img":"img-web/modo-treino-pdv/passo-1.webp","semPrint":false},{"titulo":"Ligue o treino","texto":"Clica nele e confirma. Pronto: aparece essa faixa listrada lá em cima, Modo treino, nada é gravado. Assim todo mundo sabe que é só treino.","dica":"","atencao":"","img":"img-web/modo-treino-pdv/passo-2.webp","semPrint":false},{"titulo":"Faça uma venda de treino","texto":"Agora é vender igualzinho: bipa o produto ou digita o código, e ele entra na venda.","dica":"","atencao":"","img":"img-web/modo-treino-pdv/passo-3.webp","semPrint":false},{"titulo":"Receba e veja o troco","texto":"Aperta F9, coloca quanto o cliente deu, escolhe Dinheiro, e o sistema já mostra o troco. Depois é só confirmar.","dica":"","atencao":"","img":"img-web/modo-treino-pdv/passo-4.webp","semPrint":false},{"titulo":"Venda de treino concluída","texto":"Olha o recibo: venda de treino concluída. No treino não entra no caixa, não baixa o estoque, não gera conta, nem Pix, boleto ou nota.","dica":"","atencao":"","img":"img-web/modo-treino-pdv/passo-5.webp","semPrint":false},{"titulo":"Sair do treino","texto":"Terminou de treinar? Clica em Sair do treino e o caixa volta ao normal. Pra liberar o Modo treino na sua loja, é só pedir pro suporte.","dica":"","atencao":"","img":"img-web/modo-treino-pdv/passo-6.webp","semPrint":false}]},{"id":"consultar-vendas","grupo":"Comercial","titulo":"Consultar, imprimir e enviar uma venda","resumo":"Encontre vendas feitas, reimprima o comprovante ou envie pelo WhatsApp.","antes":"","destaque":false,"video":"videos-web/consultar-vendas.mp4","capa":"videos-web/consultar-vendas.jpg","passos":[{"titulo":"Abra a tela de Vendas","texto":"No menu, clique em Comercial › Vendas. Aparecem as vendas do período.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-1.webp","semPrint":false},{"titulo":"Filtre pelo cliente","texto":"Digite o nome do cliente para ver só as vendas dele. Você também pode mudar o período, a forma de pagamento e o status.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-2.webp","semPrint":false},{"titulo":"Clique nos três pontinhos da venda","texto":"Na linha da venda, clique no botão \"...\" (Ações).","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-3.webp","semPrint":false},{"titulo":"Escolha o que fazer","texto":"Clique em \"Detalhes\" para ver os produtos, \"Imprimir / PDF\" para reimprimir o comprovante ou \"Enviar no WhatsApp\" para mandar para o cliente.","dica":"","atencao":"\"Excluir\" desfaz a venda: devolve os produtos ao estoque e estorna o caixa e o financeiro. Ela não vai para a Lixeira e não dá para restaurar, então use só se a venda foi feita errada.","img":"img-web/consultar-vendas/passo-4.webp","semPrint":false}]},{"id":"fazer-orcamento","grupo":"Comercial","titulo":"Fazer um orçamento e transformar em venda","resumo":"Monte o orçamento, salve, mande pro cliente e, quando ele aprovar, transforme em venda no caixa.","antes":"Ter os produtos cadastrados. O cliente pode ser cadastrado na hora, dentro do orçamento.","destaque":false,"video":"videos-web/fazer-orcamento.mp4","capa":"videos-web/fazer-orcamento.jpg","passos":[{"titulo":"Abra Orçamentos","texto":"No menu, clica em Comercial, Orçamentos. Aqui ficam todos os orçamentos. Pra fazer um novo, é no Novo orçamento.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Clica em Novo orçamento. Primeiro o cliente: digita o nome e clica nele. Se ainda não tem cadastro, aparece o Cadastrar cliente, e você cadastra ali mesmo.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-2.webp","semPrint":false},{"titulo":"Adicione os produtos","texto":"Agora os produtos. Digita o nome ou o código e clica nele. Repete pra cada produto: aqui foram o fone e a emenda de rede. O total já vai somando embaixo.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-3.webp","semPrint":false},{"titulo":"Desconto, serviço e validade","texto":"Se quiser, dá desconto no item ou no total. Nos botões Serviço e Mensalidade você coloca um serviço no orçamento. E confere a validade: até quando o orçamento vale.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-4.webp","semPrint":false},{"titulo":"Salve o orçamento","texto":"Tudo certo? Clica em Salvar. Aqui também dá pra imprimir em A4, oitenta milímetros ou PDF, ou mandar no WhatsApp: o cliente recebe um link pra ver e aprovar.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-5.webp","semPrint":false},{"titulo":"Orçamento salvo","texto":"Pronto, o orçamento está salvo, aqui na lista, em aberto. Na linha dele tem o botão de imprimir e o de mandar no WhatsApp com o link pro cliente assinar.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-6.webp","semPrint":false},{"titulo":"Cliente aprovou? Vá ao caixa","texto":"O cliente aprovou? Agora vira venda. No menu, clica em Comercial, PDV, e depois em Nova venda.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-7.webp","semPrint":false},{"titulo":"Orçamentos no caixa (F2)","texto":"Aperta F2, Orçamentos, e procura o cliente. Na linha do orçamento, clica em Transferir.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Os produtos já vieram","texto":"Pronto: os produtos do orçamento já vieram pra venda, com o cliente. Agora é só receber.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Receba e finalize","texto":"Aperta F9, escolhe a forma, aqui foi Pix, e Enter. Venda sem nota: tecla três, e Não imprimir.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Virou venda","texto":"E voltando em Orçamentos, escolhendo Todos status, o orçamento já não está mais em aberto: virou venda.","dica":"Fora do caixa, o botão \"Faturar no PDV\" da linha também leva o orçamento para o caixa.","atencao":"","img":"","semPrint":false}]},{"id":"ordem-de-servico","grupo":"Comercial","titulo":"Ordem de serviço: abrir, concluir e receber","resumo":"Abra a OS com cliente, equipamento, defeito, serviço e peça; conclua quando ficar pronta e receba no caixa.","antes":"Ter os produtos (peças) cadastrados. Os serviços podem ser escritos na hora ou cadastrados antes em Cadastros › Serviços. Os nomes dos campos mudam conforme o ramo: oficina mostra \"Veículo/Placa/Mecânico\"; assistência técnica mostra \"Equipamento/Técnico\".","destaque":false,"video":"videos-web/ordem-de-servico.mp4","capa":"videos-web/ordem-de-servico.jpg","passos":[{"titulo":"Abra Ordens de Serviço","texto":"No menu, clica em Comercial, Ordens de Serviço. Aqui ficam todas as ordens. Pra abrir uma, é no Nova ordem.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Clica em Nova ordem. Digita o nome do cliente e clica nele. Se for cliente novo, aparece o Cadastrar cliente ali mesmo.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-2.webp","semPrint":false},{"titulo":"Equipamento, defeito e laudo","texto":"Agora o equipamento, ou o veículo, com o modelo. É o único campo obrigatório, por isso tem o asterisco. Embaixo, o defeito que o cliente falou e, depois de olhar, o laudo técnico.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-3.webp","semPrint":false},{"titulo":"Adicione o serviço","texto":"Clica em Adicionar serviço. Escreve o serviço, ou busca um que já tem cadastro, e coloca o valor. O técnico do serviço é opcional: escolhe ele se ganha comissão.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-4.webp","semPrint":false},{"titulo":"Adicione as peças","texto":"Agora as peças. Clica em Adicionar produto, bipa ou digita o código e aperta Enter. A peça sai do estoque quando a OS é recebida no caixa.","dica":"Use \"+ Adicionar fotos\" para guardar fotos de antes, durante e depois do serviço.","atencao":"","img":"img-web/ordem-de-servico/passo-5.webp","semPrint":false},{"titulo":"Salve a ordem","texto":"Tudo certo? Clica em Salvar ordem. Se o cliente ainda vai aprovar o preço, é no Gerar orçamento, que você manda no WhatsApp ou imprime.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-6.webp","semPrint":false},{"titulo":"A OS está aberta","texto":"Pronto, a OS está salva, aqui na lista. Quando o serviço ficar pronto, clica no lápis pra editar.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-7.webp","semPrint":false},{"titulo":"Serviço pronto: Concluída","texto":"Serviço pronto? Abre a OS, muda o Status pra Concluída, e clica em Salvar ordem.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Receba no caixa","texto":"Agora o cliente veio buscar. No menu, clica em Comercial, PDV, e na tela do caixa clica em Ordens de serviço. Na linha da OS, é o botão de receber.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A OS vem para a venda","texto":"Pronto: o serviço e a peça da OS já vieram pra venda, com o cliente. É só receber.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Receba e finalize","texto":"Aperta F9, escolhe a forma, aqui foi Dinheiro, e Enter. Sem nota: tecla três, OS sem documento fiscal, e Não imprimir.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"OS recebida","texto":"E lá em Ordens de Serviço, a OS já aparece recebida no caixa, ligada à venda.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"condicional","grupo":"Comercial","titulo":"Condicional: cliente leva para provar, devolve e compra","resumo":"O cliente leva os produtos para provar; depois você dá baixa no que voltou e vende o resto no caixa.","antes":"Ter os produtos cadastrados. O cliente pode ser cadastrado na hora.","destaque":false,"video":"videos-web/condicional.mp4","capa":"videos-web/condicional.jpg","passos":[{"titulo":"Abra a Condicional","texto":"No menu, clica em Comercial, Condicional. Aqui fica o que os clientes levaram pra provar: quantas estão na rua e quantas venceram. Pra lançar, é no Nova condicional.","dica":"","atencao":"","img":"img-web/condicional/passo-1.webp","semPrint":false},{"titulo":"Cliente e validade","texto":"Clica em Nova condicional e escolhe o cliente: digita o nome e clica nele. Do lado, se quiser, o vendedor e a validade: até quando ele pode ficar com as peças.","dica":"","atencao":"","img":"img-web/condicional/passo-2.webp","semPrint":false},{"titulo":"Bipe as peças","texto":"Agora bipa cada peça que ele vai levar, ou digita o código e aperta Enter. Pra levar mais de uma, muda a quantidade antes de bipar. Aqui ele levou o fone e duas emendas.","dica":"","atencao":"","img":"img-web/condicional/passo-3.webp","semPrint":false},{"titulo":"Salve a condicional","texto":"Clica em Salvar condicional. As peças saem do estoque na hora.","dica":"","atencao":"","img":"img-web/condicional/passo-4.webp","semPrint":false},{"titulo":"Imprima ou mande o link","texto":"Pronto, a condicional está salva. Aqui do lado dá pra imprimir em oitenta milímetros ou A4 pro cliente assinar, ou mandar o link pra ele assinar no celular.","dica":"","atencao":"","img":"img-web/condicional/passo-5.webp","semPrint":false},{"titulo":"O cliente voltou: devolva","texto":"O cliente voltou e devolveu uma emenda. Clica em Devolver itens, e no mais um de cada peça que voltou. Depois, Confirmar devolução.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"O resto vira venda no caixa","texto":"O resto ele ficou. Pra cobrar, no menu, clica em Comercial, PDV, e na tela do caixa clica em Condicional. Abre a condicional do cliente.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Transformar em venda","texto":"Aqui aparece o que voltou e o que ficou. Clica em Transformar em venda.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Receba e finalize","texto":"As peças que ficaram com ele já vieram pra venda. Aperta F9, escolhe a forma, aqui foi Dinheiro, e Enter. Sem nota: tecla três, e Não imprimir.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Situação atualizada","texto":"E lá em Condicional, no filtro Viraram venda, ela aparece certinho. Os outros filtros mostram quem ainda está com peças na rua e quem passou do prazo.","dica":"Os filtros \"Na rua\" e \"Vencidas\" mostram quem está com produtos e quem passou do prazo.","atencao":"","img":"","semPrint":false}]},{"id":"caixa-sangria-fechamento","grupo":"Comercial","titulo":"Sangria, suprimento, fechar e abrir o caixa","resumo":"Tire ou coloque dinheiro na gaveta, confira o resumo, feche o caixa no fim do dia e abra de novo com o troco.","antes":"","destaque":false,"video":"videos-web/caixa-sangria-fechamento.mp4","capa":"videos-web/caixa-sangria-fechamento.jpg","passos":[{"titulo":"A tela do caixa","texto":"No menu, clica em Comercial, PDV. Aqui na tela inicial do caixa ficam a Sangria, o Suprimento, o Resumo do caixa e o Fechar caixa.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-1.webp","semPrint":false},{"titulo":"Sangria: tirar dinheiro da gaveta","texto":"A sangria é pra tirar dinheiro da gaveta. Clica em Sangria, digita o valor, cinquenta reais, e do que é. Deixando Cofre, só sai do caixa. Se for pagar uma despesa, escolhe ela aqui no plano de contas. E Confirmar.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-2.webp","semPrint":false},{"titulo":"Suprimento: colocar troco","texto":"Faltou troco? É o suprimento. Clica em Suprimento, coloca o valor, vinte reais, e Confirmar.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-3.webp","semPrint":false},{"titulo":"Confira o resumo","texto":"No Resumo do caixa aparece quanto vendeu em cada forma, e a sangria e o suprimento que eu acabei de fazer. Aqui você sabe quanto tem que ter na gaveta.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-4.webp","semPrint":false},{"titulo":"Feche o caixa","texto":"No fim do dia, clica em Fechar caixa. Ele mostra quanto tem que ter de dinheiro. Pra contar nota por nota, o Contar cédulas e moedas soma pra você. Se for levar dinheiro pro cofre, coloca o valor a retirar. E clica em Fechar caixa.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-5.webp","semPrint":false},{"titulo":"Caixa fechado","texto":"Caixa fechado! Dá pra imprimir o fechamento em A4, na bobina, ou mandar no WhatsApp. Aqui eu clico em Não fazer nada.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Abra o caixa com o troco","texto":"No outro dia, é só clicar em Abrir caixa, colocar o troco que ficou na gaveta, aqui cem reais, e clicar em Abrir caixa de novo. Pronto, caixa aberto pra vender.","dica":"","atencao":"Feche o caixa todo dia. No dia seguinte, abra de novo com o valor do troco.","img":"","semPrint":false},{"titulo":"Confira os fechamentos","texto":"E o dono vê todos os caixas fechados, com as sobras e as faltas, em Relatórios, Caixas, Fechamento de caixa. O que eu acabei de fechar já está aqui.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"lembrete-de-revisao","grupo":"Comercial","titulo":"Lembrete de revisão (chamar o cliente de volta)","resumo":"Veja quem fez serviço há 3, 6 ou 12 meses e não voltou, e mande o convite de revisão.","antes":"Ter ordens de serviço antigas (de 3 meses ou mais).","destaque":false,"video":"videos-web/lembrete-de-revisao.mp4","capa":"videos-web/lembrete-de-revisao.jpg","passos":[{"titulo":"Escolha há quanto tempo","texto":"No menu, clica em Comercial, Lembrete de revisão. Escolhe há quanto tempo foi o último serviço: três, seis ou doze meses. Aparecem os clientes que fizeram serviço nesse tempo e não voltaram.","dica":"","atencao":"","img":"img-web/lembrete-de-revisao/passo-1.webp","semPrint":false},{"titulo":"A mensagem do convite","texto":"Clica em Mensagem pra ver o convite que vai pro cliente. Dá pra mudar o texto do seu jeito, e os campos entre chaves viram o nome do cliente e o equipamento. Depois clica em Salvar mensagem.","dica":"","atencao":"","img":"img-web/lembrete-de-revisao/passo-2.webp","semPrint":false},{"titulo":"Mande o convite","texto":"Na linha do cliente, o botão WhatsApp abre a conversa com o convite pronto. Pra vários de uma vez, marca os clientes, ou Marcar todos, e clica em Enviar para marcados.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Já falou com ele? Avisei","texto":"Já falou com o cliente por telefone ou no balcão? Clica em Avisei, e ele sai da lista.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Quem já foi avisado","texto":"E em Já avisados ficam os clientes que você já chamou, pra não mandar duas vezes.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"balanco","grupo":"Estoque","titulo":"Balanço do estoque","resumo":"Conte o estoque bipando, digitando ou pela foto com IA, com a equipe toda junto, e no final gere o ajuste de uma vez.","antes":"","destaque":false,"video":"videos-web/balanco.mp4","capa":"","passos":[{"titulo":"Abra o Balanço","texto":"No menu, clica em Estoque, Balanço. Aqui ficam os balanços: os que estão em contagem e os que já foram gerados. Pra começar um, é em Novo balanço.","dica":"","atencao":"","img":"img-web/balanco/passo-1.webp","semPrint":false},{"titulo":"Nome e o que vai contar","texto":"Dá um nome pro balanço e escolhe o que vai contar: o estoque todo, um grupo, uma marca ou um fornecedor. Depois clica em Começar a contar.","dica":"","atencao":"","img":"img-web/balanco/passo-2.webp","semPrint":false},{"titulo":"Bipe o código","texto":"Na contagem, é só bipar o código de barras: cada bip soma um. Sem leitor, digita o código e aperta Enter.","dica":"","atencao":"","img":"img-web/balanco/passo-3.webp","semPrint":false},{"titulo":"Muitos iguais? Quantidade do lado","texto":"Tem muitos iguais? Põe a quantidade do lado, aqui nove, bipa e clica em Somar. Agora já são dez fones. Ou digita nove x e o código, que soma nove direto.","dica":"","atencao":"","img":"img-web/balanco/passo-4.webp","semPrint":false},{"titulo":"Ou digite direto na lista","texto":"Também dá pra buscar o produto na lista e digitar a quantidade contada direto na linha. Aqui, vinte e cinco emendas.","dica":"","atencao":"","img":"img-web/balanco/passo-5.webp","semPrint":false},{"titulo":"A equipe contando junto","texto":"Aqui aparece quem está contando, ao vivo, e as últimas contagens. Vários celulares contam ao mesmo tempo, e um não apaga o do outro: tudo vai somando. E salva sozinho a cada contagem.","dica":"","atencao":"","img":"img-web/balanco/passo-6.webp","semPrint":false},{"titulo":"Foto com IA","texto":"O botão roxo é a Foto com IA: você tira a foto da prateleira, confere o produto e a quantidade que ela achou e toca em Somar ao balanço. Ele aparece quando os Recursos inteligentes estão ligados.","dica":"","atencao":"","img":"img-web/balanco/passo-7.webp","semPrint":false},{"titulo":"Revisar e gerar","texto":"Terminou? Clica em Revisar e gerar. Aqui aparecem as maiores diferenças, pra recontar antes. Escolhe se os produtos não contados ficam como estão, ou vão pra zero, e o motivo da quebra.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Clique em Gerar balanço","texto":"Tudo conferido? Clica em Gerar balanço e confirma. O estoque de cada produto contado é ajustado de uma vez.","dica":"","atencao":"Escolheu \"Zerar o estoque\"? Todos os produtos que não foram contados vão para zero.","img":"","semPrint":false},{"titulo":"Balanço gerado","texto":"Pronto, balanço gerado! A tela mostra a data e as diferenças. Dá pra baixar tudo no Excel.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Na lista e no celular","texto":"De volta à lista, o balanço aparece como Gerado. E pra contar andando pela loja, abre o Balanço no celular: cada pessoa conta com o próprio celular e tudo cai no mesmo balanço.","dica":"Gerou errado? A lixeira no cartão do balanço exclui e desfaz o ajuste do estoque.","atencao":"","img":"","semPrint":false}]},{"id":"agenda","grupo":"Comercial","titulo":"Agenda: serviços, visitas e compromissos","resumo":"Veja no calendário as OS e os compromissos do mês, da semana ou do dia, e agende com um clique.","antes":"","destaque":false,"video":"videos-web/agenda.mp4","capa":"videos-web/agenda.jpg","passos":[{"titulo":"Abra a Agenda","texto":"No menu, clica em Comercial, Agenda. Aqui fica o calendário com as ordens de serviço agendadas e os seus compromissos. Em cima você escolhe ver por Mês, Semana ou Dia.","dica":"","atencao":"","img":"img-web/agenda/passo-1.webp","semPrint":false},{"titulo":"Novo agendamento","texto":"Clica em Novo agendamento, ou direto num dia do calendário. Aí você escolhe: um Compromisso, como visita, reunião ou ligação, ou uma Ordem de serviço. Primeiro o compromisso.","dica":"","atencao":"","img":"img-web/agenda/passo-2.webp","semPrint":false},{"titulo":"Preencha o compromisso","texto":"Escolhe o tipo, aqui Visita. Escreve o assunto, o horário de início e de fim, e com quem é. Em Responsável dá pra escolher quem vai.","dica":"","atencao":"","img":"img-web/agenda/passo-3.webp","semPrint":false},{"titulo":"Salve","texto":"Tudo certo? Clica em Salvar.","dica":"","atencao":"","img":"img-web/agenda/passo-4.webp","semPrint":false},{"titulo":"O compromisso já está na agenda","texto":"Pronto! A visita já aparece no dia de hoje, em roxo, que é a cor dos compromissos. Azul é ordem de serviço, e verde é o que já foi feito.","dica":"","atencao":"","img":"img-web/agenda/passo-5.webp","semPrint":false},{"titulo":"Já foi? Marque como feito","texto":"Fez a visita? Clica no compromisso, marca Já foi feito e salva. Aqui também dá pra mudar o horário ou excluir.","dica":"","atencao":"","img":"img-web/agenda/passo-6.webp","semPrint":false},{"titulo":"Ficou verde: feito","texto":"Agora ele aparece como Feito, em verde.","dica":"","atencao":"","img":"img-web/agenda/passo-7.webp","semPrint":false},{"titulo":"A semana e o dia","texto":"Na Semana, cada dia vira uma coluna com tudo que está marcado, e embaixo tem o botão Agendar. No Dia, aparecem os horários: clicou num horário livre, já abre o agendamento naquela hora.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Agendar uma ordem de serviço","texto":"E pra agendar um serviço, clica em Novo agendamento e escolhe Ordem de serviço. Clicando em Abrir nova OS, ela abre já agendada nesse dia, e aí você preenche o cliente, o técnico e o serviço.","dica":"Escolha o técnico no filtro \"Técnico\" para ver só a agenda dele. Cada técnico recebe a agenda do dia no WhatsApp às 8h, se estiver ligado em Configurações › Ordem de Serviço.","atencao":"","img":"","semPrint":false}]},{"id":"a-comprar-chegou","grupo":"Estoque","titulo":"A comprar: chegou e dar entrada","resumo":"Quando a mercadoria chega, confira o que veio e dê entrada sem nota, pela nota ou só marque que chegou.","antes":"","destaque":false,"video":"","capa":"","passos":[{"titulo":"Abra A comprar","texto":"No menu, clica em Estoque, A comprar. Clica em Comprados: aqui fica o que você já comprou e está esperando chegar.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-1.webp","semPrint":false},{"titulo":"Marque o que chegou","texto":"Chegou a mercadoria? Marca os itens e clica em Chegaram, dar entrada. Dá pra fazer com um item só no botão Chegou da linha, até mesmo sem ter marcado que comprou.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-2.webp","semPrint":false},{"titulo":"Chegou tudo ou só uma parte","texto":"Na janela Chegou, o que veio, clica em Chegou tudo. Veio menos? É só mudar a quantidade. Aqui chegaram trinta emendas das cinquenta, e as vinte que faltam continuam na lista.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-3.webp","semPrint":false},{"titulo":"Três jeitos de dar entrada","texto":"Agora, três caminhos: dar entrada sem nota, tenho a nota fiscal, que abre a entrada pelo XML, ou só marcar que chegou, sem mexer no estoque nem no financeiro.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-4.webp","semPrint":false},{"titulo":"Entrada manual já preenchida","texto":"Clicando em dar entrada sem nota, abre a Entrada manual já com o fornecedor, os produtos, as quantidades e os preços. Você não digita nada de novo.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-5.webp","semPrint":false},{"titulo":"Conferência: da lista A comprar","texto":"Escolhe como pagou e vai pra conferência. Esse quadro verde mostra os itens da lista A comprar: quando você gerar a entrada, eles passam pra Chegou sozinhos.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-6.webp","semPrint":false},{"titulo":"Aba Chegou: de onde veio","texto":"E de volta em A comprar, na aba Chegou, dá pra filtrar pela nota fiscal, pela entrada manual ou só marcado. E cada item mostra a etiqueta de onde veio a entrada.","dica":"","atencao":"","img":"img-web/a-comprar-chegou/passo-7.webp","semPrint":false}]},{"id":"contas-a-receber","grupo":"Financeiro","titulo":"Contas a receber: lançar, parcelar e dar baixa","resumo":"Lance o que o cliente vai te pagar e dê baixa no caixa quando ele pagar.","antes":"","destaque":false,"video":"videos-web/contas-a-receber.mp4","capa":"videos-web/contas-a-receber.jpg","passos":[{"titulo":"Abra Contas a Receber","texto":"No menu, clica em Financeiro, Contas a Receber. Aqui em cima você vê o que já recebeu, o que falta receber e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Clica em Nova conta e digita o nome do cliente. Ele aparece na lista, é só clicar. Se ainda não tiver cadastro, dá pra cadastrar ali mesmo.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-2.webp","semPrint":false},{"titulo":"Descrição, valor e vencimento","texto":"Escreve do que é, coloca o valor e o vencimento. Se for parcelado, é só mudar a quantidade de parcelas que ele divide sozinho. Depois clica em Salvar.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-3.webp","semPrint":false},{"titulo":"A conta já está lançada","texto":"Pronto, a conta está aqui, em aberto. Quando o cliente vier pagar, a baixa é feita no caixa. Mas antes, olha os outros jeitos de lançar.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-4.webp","semPrint":false},{"titulo":"Conta parcelada","texto":"Agora uma parcelada: Nova conta, a cliente, a descrição, e em Quantidade de parcelas coloca três. Coloca o valor total e o vencimento da primeira. Ele divide sozinho: três de trezentos, uma por mês.","dica":"Boleto, crediário ou carnê: informe o valor total e o sistema divide nas parcelas.","atencao":"","img":"img-web/contas-a-receber/passo-5.webp","semPrint":false},{"titulo":"As três parcelas","texto":"Pronto: três contas, uma pra cada mês. A primeira já venceu, por isso fica vermelha, e já aparece na Central de cobrança.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-6.webp","semPrint":false},{"titulo":"Já recebeu na hora?","texto":"E se a cliente já pagou na hora? Lança a conta e liga Já foi recebido agora. Escolhe a forma de pagamento, aqui dinheiro, e salva. A conta já entra paga.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-7.webp","semPrint":false},{"titulo":"Receber no caixa ou no Pix","texto":"Na linha da conta em aberto tem dois botões: o verde, Receber no caixa, e o do QR Code, Receber com Pix, que manda o Pix pro cliente e dá baixa sozinho quando ele paga. O Pix precisa do banco ligado ao sistema.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-8.webp","semPrint":false},{"titulo":"Recebimentos no caixa","texto":"Agora a baixa. No caixa, aperta F1, Recebimentos, e busca o cliente. Aparece tudo o que ele deve.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Marque e envie ao caixa","texto":"Marca a parcela que ele está pagando e clica em Enviar ao caixa.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Receba e confirme","texto":"Aperta F9, escolhe a forma, aqui foi dinheiro, e confirma. Pronto: baixa dada.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"A conta ficou paga","texto":"E voltando em Contas a Receber, na aba Pagas, as duas contas da Mariana já aparecem pagas, e o dinheiro entrou no caixa do dia.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"contas-a-pagar","grupo":"Financeiro","titulo":"Contas a pagar: lançar, parcelar e pagar","resumo":"Lance suas despesas e boletos e marque quando pagar.","antes":"","destaque":false,"video":"videos-web/contas-a-pagar.mp4","capa":"videos-web/contas-a-pagar.jpg","passos":[{"titulo":"Abra Contas a Pagar","texto":"No menu, clica em Financeiro, Contas a Pagar. Aqui em cima você vê o que já pagou, o que falta pagar e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-1.webp","semPrint":false},{"titulo":"De quem é a conta","texto":"Clica em Nova conta e escolhe de quem é: um fornecedor, um funcionário, ou uma despesa geral, como a conta de luz. Aqui eu coloquei a companhia de energia.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-2.webp","semPrint":false},{"titulo":"Descrição, valor e vencimento","texto":"Escreve do que é. Como eu ainda vou pagar, desligo o Já foi pago agora. Aí coloca o valor e o vencimento, e clica em Salvar.","dica":"Conta que se repete todo mês, como aluguel e internet? Cadastre em Financeiro › Recorrências e ela é lançada sozinha.","atencao":"","img":"img-web/contas-a-pagar/passo-3.webp","semPrint":false},{"titulo":"A conta já está lançada","texto":"Pronto, a conta está aqui, esperando o pagamento. Ela também já entra no fluxo de caixa e no DRE.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-4.webp","semPrint":false},{"titulo":"Pagou? Clique em Pagar","texto":"Quando pagar, clica em Pagar na linha da conta. Confere o valor, a forma de pagamento e de qual conta saiu o dinheiro, e confirma.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-5.webp","semPrint":false},{"titulo":"A conta ficou paga","texto":"E na aba Pagas a conta de luz já aparece paga, com a data. O dinheiro saiu da conta que você escolheu.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-6.webp","semPrint":false},{"titulo":"Boleto parcelado do fornecedor","texto":"Agora um boleto parcelado. Nova conta, escolhe Fornecedor e busca o nome dele. Desliga o Já foi pago agora, coloca três parcelas e o valor total. Ele divide sozinho: três boletos de quatrocentos, um por mês.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Os três boletos lançados","texto":"Pronto: os três boletos estão aqui, cada um no seu mês. Pagou um? É só clicar em Pagar na linha dele.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Pagou na hora? Já lança pago","texto":"E o que você já pagou na hora, como o café da loja, é o mais rápido: deixa o Já foi pago agora ligado. Ele já vem com o Pix; troca a forma se pagou de outro jeito, e salva.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Já entrou paga","texto":"Olha ela aqui, direto nas Pagas, e o dinheiro já saiu da conta. Tudo isso entra no fluxo de caixa e no DRE.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"formas-de-pagamento","grupo":"Financeiro","titulo":"Configurar formas de pagamento e maquininha","resumo":"Cadastre a maquininha com as taxas, as formas de pagamento do caixa e em que conta cai o dinheiro.","antes":"","destaque":false,"video":"videos-web/formas-de-pagamento.mp4","capa":"videos-web/formas-de-pagamento.jpg","passos":[{"titulo":"Abra Formas de pagamento","texto":"No menu, clica em Financeiro, Banco e organização, Formas de pagamento. São as opções que aparecem no caixa na hora de receber. Tem três abas: Formas de pagamento, Adquirentes e Contas.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-1.webp","semPrint":false},{"titulo":"Cadastre a maquininha","texto":"Começa pela maquininha: clica em Adquirentes e depois em Nova adquirente. Coloca o nome da sua maquininha.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-2.webp","semPrint":false},{"titulo":"As taxas","texto":"Agora as taxas que a maquininha cobra: débito, Pix, e o crédito por parcela, à vista, em duas vezes, e assim por diante. Assim o sistema mostra quanto você recebe de verdade.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-3.webp","semPrint":false},{"titulo":"Salve a maquininha","texto":"Em Como registrar o recebimento, o automático já é o recomendado. Clica em Salvar.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-4.webp","semPrint":false},{"titulo":"Forma de crédito na maquininha","texto":"Agora volta em Formas de pagamento e clica em Nova forma. Dá o nome que vai aparecer no caixa, escolhe o tipo, Cartão de crédito, uma tecla de atalho pro PDV, e a adquirente, que é a maquininha que a gente acabou de cadastrar.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-5.webp","semPrint":false},{"titulo":"Salve a forma","texto":"O dinheiro cai na conta da maquininha. Clica em Salvar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Forma de Pix","texto":"Agora uma de Pix. Clica em Nova forma, coloca o nome e o tipo Pix. Essa caixinha, Pix automático pelo banco, mostra o QR Code no caixa e confirma sozinha, mas precisa do banco ligado ao sistema.","dica":"Para ligar o Pix automático, o banco da empresa precisa estar vinculado ao sistema. Fale com o suporte.","atencao":"","img":"","semPrint":false},{"titulo":"Em que conta cai o dinheiro","texto":"Em Conta de destino, você diz em qual conta o dinheiro do Pix cai. Digita o nome do banco. Se ela ainda não existe, clica em Cadastrar conta e salva ali mesmo.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"Salve a forma de Pix","texto":"A conta já ficou escolhida. Agora é só clicar em Salvar.","dica":"","atencao":"","img":"","semPrint":false},{"titulo":"As formas já aparecem no caixa","texto":"Pronto! As duas formas já estão aqui, cada uma com a conta onde o dinheiro cai e a maquininha. No caixa elas já aparecem pra receber.","dica":"","atencao":"","img":"","semPrint":false}]},{"id":"recorrencias","grupo":"Financeiro","titulo":"Contas que se repetem todo mês","resumo":"Aluguel, salário, internet, mensalidade: cadastre uma vez e o sistema lança os próximos 12 meses.","antes":"","destaque":false,"video":"videos-web/recorrencias.mp4","capa":"videos-web/recorrencias.jpg","passos":[{"titulo":"Clique em \"Nova recorrência\"","texto":"No menu, clica em Financeiro, Banco e organização, Recorrências. Pra uma conta que você paga todo mês, é Nova recorrência. Pra algo que você recebe todo mês, é A receber. Começando pela que eu pago.","dica":"","atencao":"","img":"img-web/recorrencias/passo-1.webp","semPrint":false},{"titulo":"Nome e plano de contas","texto":"Dá um nome, como Aluguel da loja. O plano de contas já vem sugerido pelo nome, é só conferir.","dica":"","atencao":"","img":"img-web/recor
