<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central de Ajuda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout: faixa clara com a logo no canto, busca grande; menu lateral por grupo + conteúdo.
   Cores tiradas da logo da Thiago Informática (azul-marinho e vermelho). */
:root{
  --marinho:#0c1f5c; --marinho-2:#1c3a96; --vermelho:#d7262e; --vermelho-suave:#fde8e8;
  --fundo:#f3f5fa; --card:#ffffff; --texto:#1b2235; --suave:#5d6680; --borda:#e1e6f0;
  --tinta-icone:#e8edfa; --hover:#eef2fb; --dica:#e9f8f1; --dica-b:#14986a; --aten:#fff3e6; --aten-b:#e0730d;
  --antes:#edf3ff; --antes-b:#3d6fe0; --faixa:#ffffff; --sombra:0 10px 30px rgba(12,31,92,.08);
  --f-titulo:"Sora","Segoe UI",system-ui,sans-serif; --f-texto:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --marinho:#9db4ff; --marinho-2:#7d9bff; --vermelho:#ff5a61; --vermelho-suave:#3a1719;
  --fundo:#0b1020; --card:#141b30; --texto:#e6e9f2; --suave:#99a3bd; --borda:#26304b;
  --tinta-icone:#1d2847; --hover:#1b2440; --dica:#0d2a22; --dica-b:#33c793; --aten:#2e1e0d; --aten-b:#f5a04d;
  --antes:#14213f; --antes-b:#7d9bff; --faixa:#121a2e; --sombra:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --marinho:#9db4ff; --marinho-2:#7d9bff; --vermelho:#ff5a61; --vermelho-suave:#3a1719;
  --fundo:#0b1020; --card:#141b30; --texto:#e6e9f2; --suave:#99a3bd; --borda:#26304b;
  --tinta-icone:#1d2847; --hover:#1b2440; --dica:#0d2a22; --dica-b:#33c793; --aten:#2e1e0d; --aten-b:#f5a04d;
  --antes:#14213f; --antes-b:#7d9bff; --faixa:#121a2e; --sombra:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;font-family:var(--f-texto);background:var(--fundo);color:var(--texto);font-size:17px;line-height:1.6}
a{color:inherit}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}

/* Faixa do topo: logo no canto esquerdo */
header{background:var(--faixa);border-bottom:1px solid var(--borda);position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:4px;background:linear-gradient(90deg,var(--marinho) 0 70%,var(--vermelho) 70% 100%)}
.topo{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo img{height:68px;width:auto;display:block}
.logo span{font:600 13px/1.2 var(--f-texto);color:var(--suave);border-left:1px solid var(--borda);padding-left:12px}
.topo .suporte{font-size:14px;color:var(--suave)}
.hero{padding-block:18px 30px}
.hero h1{font:800 clamp(28px,4.2vw,44px)/1.1 var(--f-titulo);margin:0 0 6px;color:var(--marinho);text-wrap:balance;letter-spacing:-.01em}
.hero p{margin:0 0 18px;color:var(--suave);max-width:60ch}
.busca{position:relative;max-width:640px}
.busca svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--suave)}
#busca{width:100%;padding:16px 18px 16px 50px;border-radius:14px;border:2px solid var(--borda);background:var(--card);color:var(--texto);font:500 17px var(--f-texto);outline:none;box-shadow:var(--sombra)}
#busca:focus{border-color:var(--marinho-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{border:1px solid var(--borda);background:var(--card);color:var(--texto);border-radius:999px;padding:6px 12px;font:500 14px var(--f-texto);cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--marinho-2);outline:none}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-block:26px 64px}
nav{position:sticky;top:max(16px,env(safe-area-inset-top,0px));align-self:start;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:10px;max-height:calc(100vh - 32px);overflow:auto}
nav h3{display:flex;align-items:center;gap:8px;font:700 12px var(--f-texto);text-transform:uppercase;letter-spacing:.07em;color:var(--suave);margin:14px 8px 4px}
nav h3 svg{width:16px;height:16px}
nav a{display:block;text-decoration:none;padding:7px 10px 7px 32px;border-radius:9px;font-size:15px;line-height:1.35}
nav a.inicio{padding-left:10px;font-weight:600}
nav a:hover,nav a:focus-visible{background:var(--hover);outline:none}
nav a.ativo{background:var(--marinho);color:var(--card);font-weight:600}
main{min-width:0}

/* Início */
.secao{display:grid;gap:14px;margin-bottom:34px}
.secao-titulo{display:flex;align-items:center;gap:10px;font:700 22px var(--f-titulo);margin:0;color:var(--texto)}
.secao-titulo .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--tinta-icone);color:var(--marinho)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.cartao{display:grid;grid-template-rows:auto 1fr auto;gap:6px;background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px;text-decoration:none;transition:transform .15s,box-shadow .15s,border-color .15s}
.cartao:hover,.cartao:focus-visible{transform:translateY(-2px);box-shadow:var(--sombra);border-color:var(--marinho-2);outline:none}
.cartao b{font:700 17px/1.3 var(--f-titulo)}
.cartao span{color:var(--suave);font-size:15px;line-height:1.45}
.cartao em{font-style:normal;font-size:13px;font-weight:600;color:var(--marinho-2);display:flex;align-items:center;gap:6px}
.cartao em i{font-style:normal;background:var(--vermelho-suave);color:var(--vermelho);border-radius:999px;padding:1px 8px}
.destaques .cartao{border-top:4px solid var(--vermelho)}
.destaques .cartao .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tinta-icone);color:var(--marinho);margin-bottom:6px}
.vazio{color:var(--suave)}

/* Tutorial */
.voltar{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-size:15px;font-weight:600;color:var(--marinho-2);text-decoration:none}
.cab-tut{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.cab-tut .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--marinho);color:var(--card)}
.cab-tut .ic svg{width:26px;height:26px}
.cab-tut small{font:700 12px var(--f-texto);text-transform:uppercase;letter-spacing:.07em;color:var(--suave)}
.tutorial h2{font:800 clamp(24px,3vw,32px)/1.2 var(--f-titulo);margin:2px 0 4px;text-wrap:balance}
.tutorial .resumo{color:var(--suave);margin:0}
.video{display:grid;gap:6px;margin-bottom:18px}
.video video{width:100%;aspect-ratio:16/9;border-radius:16px;background:#000;box-shadow:var(--sombra)}
.video small{color:var(--suave);font-size:14px}
.cartao em .v{background:var(--marinho);color:var(--card)}
.antes{background:var(--antes);border-left:5px solid var(--antes-b);padding:12px 16px;border-radius:12px;margin-bottom:18px}
.indice{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px 18px;margin-bottom:22px}
.indice ol{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:p}
.indice li{counter-increment:p;display:flex;gap:10px;align-items:baseline}
.indice li::before{content:counter(p);flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--vermelho);color:#fff;font:700 13px/24px var(--f-texto);text-align:center}
.indice a{text-decoration:none;color:var(--marinho-2);font-weight:500}
.passo{background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:20px;margin-bottom:18px;scroll-margin-top:16px;display:grid;gap:14px}
.passo-topo{display:flex;gap:14px;align-items:flex-start}
.num{flex:0 0 auto;width:44px;height:44px;border-radius:50%;background:var(--vermelho);color:#fff;font:800 20px var(--f-titulo);display:grid;place-items:center;border:3px solid var(--card);box-shadow:0 3px 10px rgba(215,38,46,.4)}
.passo h3{margin:6px 0 4px;font:700 20px/1.3 var(--f-titulo)}
.passo p{margin:0;max-width:70ch}
.passo img{display:block;width:100%;border-radius:12px;border:1px solid var(--borda);cursor:zoom-in;box-shadow:var(--sombra)}
.caixa{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:16px}
.caixa svg{margin-top:2px;width:20px;height:20px}
.caixa.dica{background:var(--dica);border-left:5px solid var(--dica-b)} .caixa.dica svg{color:var(--dica-b)}
.caixa.aten{background:var(--aten);border-left:5px solid var(--aten-b)} .caixa.aten svg{color:var(--aten-b)}
.sem-img{padding:22px;border:2px dashed var(--borda);border-radius:12px;color:var(--suave);text-align:center;font-size:15px}
.fim{display:grid;justify-items:center;gap:4px;text-align:center;background:var(--card);border:1px solid var(--borda);border-radius:18px;padding:24px}
.fim b{font:800 22px var(--f-titulo);color:var(--marinho)}
.fim .ok{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--dica);color:var(--dica-b)}
.nav-tut{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:16px}
.nav-tut a{background:var(--marinho);color:var(--card);text-decoration:none;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px}
.nav-tut a:focus-visible{outline:3px solid var(--vermelho);outline-offset:2px}
#zoom{position:fixed;inset:0;background:rgba(5,10,25,.88);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
footer{border-top:1px solid var(--borda);padding-block:20px;color:var(--suave);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
footer img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
@media (max-width:880px){
  .layout{grid-template-columns:1fr;padding-block:18px 48px}
  nav{position:static;max-height:none} body.lendo nav{display:none}
  .passo{padding:14px} .topo .suporte{display:none} .logo img{height:52px}
}
</style>
</head>
<body>
<header>
  <div class="wrap gutter">
    <div class="topo">
      <a class="logo" href="#"><img src="logo.webp" alt="Thiago Informática Sistemas"><span>Central de Ajuda<br>THGestor</span></a>
      <div class="suporte">Dúvida? Fale com o suporte da Thiago Informática.</div>
    </div>
    <div class="hero">
      <h1>Como podemos ajudar?</h1>
      <p>Tutoriais passo a passo, com a imagem de cada tela. É só seguir as bolinhas vermelhas numeradas.</p>
      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="busca" type="search" aria-label="Buscar tutorial" placeholder="O que você quer fazer? Ex.: fazer venda, emitir nota...">
      </div>
      <div class="chips" aria-label="Buscas rápidas">
        <button type="button" data-q="venda">Fazer venda</button><button type="button" data-q="cliente">Cadastrar cliente</button><button type="button" data-q="nota">Nota fiscal</button><button type="button" data-q="caixa">Caixa</button><button type="button" data-q="estoque">Estoque</button>
      </div>
    </div>
  </div>
</header>
<div class="wrap gutter">
  <div class="layout">
    <nav id="menu" aria-label="Tutoriais por assunto"></nav>
    <main id="conteudo"></main>
  </div>
</div>
<footer><div class="wrap gutter"><img src="logo.webp" alt=""><span>Central de Ajuda do THGestor · Thiago Informática Sistemas</span></div></footer>
<div id="zoom" role="dialog" aria-label="Imagem ampliada"><img alt=""></div>
<script>
const TUTORIAIS = [{"id":"entrar-no-sistema","grupo":"Primeiros passos","titulo":"Como entrar no sistema","resumo":"Acesse o sistema com seu e-mail e senha, ou com sua conta Google/Microsoft.","antes":"","destaque":false,"video":"videos-web/entrar-no-sistema.mp4","capa":"videos-web/entrar-no-sistema.jpg","passos":[{"titulo":"Digite seu e-mail","texto":"Abra o endereço do sistema no navegador. Na tela \"Bem-vindo!\", clique no campo E-mail e digite o e-mail que você usa no sistema. (Funcionário sem e-mail? Veja o tutorial \"Entrar com usuário e senha\".)","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-1.webp","semPrint":false},{"titulo":"Digite sua senha","texto":"Clique no campo Senha e digite a sua senha. Ela aparece com bolinhas para ninguém ver.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Entrar com e-mail\"","texto":"Confira o e-mail e clique no botão \"Entrar com e-mail\". Pronto: o sistema abre no Dashboard.","dica":"Se o sistema pedir um código de verificação, abra o aplicativo autenticador ou o seu e-mail e digite o código que chegou.","atencao":"","img":"img-web/entrar-no-sistema/passo-3.webp","semPrint":false},{"titulo":"Ou entre com Google ou Microsoft","texto":"Se o seu e-mail é Gmail ou Hotmail/Outlook, você pode clicar em \"Continuar com Google\" ou \"Continuar com Microsoft\" e entrar sem digitar senha.","dica":"","atencao":"","img":"img-web/entrar-no-sistema/passo-4.webp","semPrint":false}]},{"id":"esqueci-a-senha","grupo":"Primeiros passos","titulo":"Esqueci minha senha","resumo":"Receba no seu e-mail um link para criar uma senha nova.","antes":"","destaque":false,"video":"videos-web/esqueci-a-senha.mp4","capa":"videos-web/esqueci-a-senha.jpg","passos":[{"titulo":"Clique em \"Esqueceu a senha?\"","texto":"Na tela de entrada, clique no link \"Esqueceu a senha?\", que fica ao lado do campo Senha.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-1.webp","semPrint":false},{"titulo":"Digite seu e-mail","texto":"Na tela \"Recuperar senha\", digite o mesmo e-mail que você usa para entrar no sistema.","dica":"","atencao":"","img":"img-web/esqueci-a-senha/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Enviar link de recuperação\"","texto":"Clique no botão. Em alguns minutos chega um e-mail com o link para criar sua senha nova. Abra o e-mail, clique no link e cadastre a nova senha.","dica":"Não chegou? Olhe a caixa de Spam/Lixo eletrônico. Se mesmo assim não aparecer, fale com o suporte.","atencao":"","img":"img-web/esqueci-a-senha/passo-3.webp","semPrint":false}]},{"id":"criar-conta","grupo":"Primeiros passos","titulo":"Criar minha conta (primeiro acesso)","resumo":"Recebeu um convite? Crie sua senha e comece a usar.","antes":"","destaque":false,"video":"videos-web/criar-conta.mp4","capa":"videos-web/criar-conta.jpg","passos":[{"titulo":"Abra o link do convite","texto":"Abra o link que chegou no seu e-mail de convite. Ele abre a tela \"Criar Conta\". Só funciona com e-mails autorizados pela sua empresa.","dica":"","atencao":"","img":"img-web/criar-conta/passo-1.webp","semPrint":false},{"titulo":"Preencha seus dados","texto":"Use o MESMO e-mail que recebeu o convite. Depois digite seu nome, crie uma senha e repita a senha no último campo.","dica":"","atencao":"","img":"img-web/criar-conta/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Criar conta\"","texto":"Clique no botão \"Criar conta\". Pronto! Agora é só entrar com seu e-mail e a senha que você criou.","dica":"Só funciona com e-mails autorizados pela sua empresa. Se aparecer aviso de e-mail não autorizado, peça ao responsável da empresa para liberar seu e-mail.","atencao":"","img":"img-web/criar-conta/passo-3.webp","semPrint":false}]},{"id":"entrar-funcionario","grupo":"Primeiros passos","titulo":"Entrar com usuário e senha (funcionário sem e-mail)","resumo":"Funcionário entra com o código da empresa, usuário e senha.","antes":"O administrador da empresa precisa ter cadastrado o seu usuário e senha.","destaque":false,"video":"videos-web/entrar-funcionario.mp4","capa":"videos-web/entrar-funcionario.jpg","passos":[{"titulo":"Clique em \"Entrar com usuário e senha\"","texto":"Na tela de entrada, clique no botão \"Entrar com usuário e senha\", no final da caixa.","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Preencha empresa, usuário e senha","texto":"Digite o código ou o CNPJ da empresa, o seu usuário (ex.: joao.silva) e a sua senha. Quem passa esses dados é o administrador da empresa.","dica":"","atencao":"","img":"img-web/entrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Entrar\"","texto":"Clique em \"Entrar\". Você verá só as telas que o administrador liberou para você.","dica":"Esqueceu a senha de funcionário? Peça ao administrador da empresa para criar uma nova em Cadastros › Pessoas › Usuários.","atencao":"","img":"img-web/entrar-funcionario/passo-3.webp","semPrint":false}]},{"id":"portal-do-contador","grupo":"Primeiros passos","titulo":"Acesso do contador","resumo":"Seu contador entra no Portal do Contador para pegar as notas e os arquivos fiscais.","antes":"A empresa precisa ter cadastrado o e-mail do contador no sistema.","destaque":false,"video":"videos-web/portal-do-contador.mp4","capa":"videos-web/portal-do-contador.jpg","passos":[{"titulo":"Abra o Portal do Contador","texto":"O contador entra pelo endereço do sistema terminado em /entrar-contador. A empresa manda esse link pelo botão \"Enviar acesso ao contador pelo WhatsApp\", em Fiscal › Arquivos para contador.","dica":"","atencao":"","img":"img-web/portal-do-contador/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Entrar com e-mail\"","texto":"No Portal do Contador, clique em \"Entrar com e-mail\" e use o e-mail que a empresa cadastrou para você. Dá para entrar com Google, Microsoft ou e-mail e senha.","dica":"Se aparecer que o e-mail não está cadastrado, peça para a empresa (ou para o suporte) incluir o seu e-mail.","atencao":"","img":"img-web/portal-do-contador/passo-2.webp","semPrint":false}]},{"id":"conhecendo-o-menu","grupo":"Primeiros passos","titulo":"Conhecendo o menu","resumo":"Ache qualquer tela rápido: menu lateral, busca e favoritos.","antes":"","destaque":false,"video":"videos-web/conhecendo-o-menu.mp4","capa":"videos-web/conhecendo-o-menu.jpg","passos":[{"titulo":"O menu fica do lado esquerdo","texto":"Todas as telas do sistema estão no menu azul à esquerda, separadas por assunto: Comercial, Cadastros, Estoque, Financeiro, Fiscal, WhatsApp, Relatórios, Configurações e Utilitários.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-1.webp","semPrint":false},{"titulo":"Clique num grupo para abrir","texto":"Clique no nome do grupo (por exemplo \"Cadastros\") para ver as telas dele. Clique de novo para fechar.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-2.webp","semPrint":false},{"titulo":"Marque suas telas favoritas","texto":"Clique na estrelinha ao lado de uma tela que você usa muito. Ela vai aparecer lá em cima, em \"Favoritos\".","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-3.webp","semPrint":false},{"titulo":"Não achou? Pesquise","texto":"Digite o que procura no campo \"Buscar no sistema...\" (por exemplo \"contas\") e clique no resultado.","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-4.webp","semPrint":false},{"titulo":"Clique no resultado","texto":"Aparece a lista das telas encontradas. É só clicar na que você quer.","dica":"Aperte Enter para abrir o primeiro resultado da lista.","atencao":"","img":"img-web/conhecendo-o-menu/passo-5.webp","semPrint":false},{"titulo":"Modo escuro","texto":"Prefere a tela escura (cansa menos a vista à noite)? Clique em \"Modo escuro\", no rodapé do menu, logo acima de \"Sair\". Para voltar, clique em \"Modo claro\".","dica":"","atencao":"","img":"img-web/conhecendo-o-menu/passo-6.webp","semPrint":false}]},{"id":"cadastrar-cliente","grupo":"Cadastros","titulo":"Cadastrar um cliente","resumo":"Cadastre clientes com nome, CPF/CNPJ, WhatsApp e endereço.","antes":"","destaque":false,"video":"videos-web/cadastrar-cliente.mp4","capa":"videos-web/cadastrar-cliente.jpg","passos":[{"titulo":"Abra a tela de Clientes","texto":"No menu, clique em Cadastros › Pessoas › Clientes. Aqui ficam todos os seus clientes.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo cliente\"","texto":"Clique no botão \"Novo cliente\", no alto da tela.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-2.webp","semPrint":false},{"titulo":"Digite o nome (obrigatório)","texto":"O único campo obrigatório é o Nome. O Código é criado sozinho quando você salva.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-3.webp","semPrint":false},{"titulo":"CPF ou CNPJ","texto":"Digite o CPF ou CNPJ. Se for CNPJ, clique na lupa ao lado: o sistema busca e preenche os dados da empresa sozinho.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-4.webp","semPrint":false},{"titulo":"WhatsApp e e-mail","texto":"Preencha o WhatsApp do cliente. Ele é usado para enviar comprovantes, cobranças e mensagens de aniversário.","dica":"Preencha também o Aniversário: o sistema avisa quando chegar o dia.","atencao":"","img":"img-web/cadastrar-cliente/passo-5.webp","semPrint":false},{"titulo":"Endereço pelo CEP","texto":"Digite o CEP e clique no botão de consultar: rua, bairro, cidade e estado são preenchidos sozinhos. Depois complete o número.","dica":"","atencao":"","img":"img-web/cadastrar-cliente/passo-6.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira os dados e clique em \"Cadastrar\". Pronto: o cliente já aparece na lista e pode ser usado nas vendas.","dica":"Para alterar depois, clique no lápis (Editar) na linha do cliente.","atencao":"","img":"img-web/cadastrar-cliente/passo-7.webp","semPrint":false}]},{"id":"cadastrar-produto","grupo":"Cadastros","titulo":"Cadastrar um produto","resumo":"Cadastre produtos com código, preço, estoque e código de barras.","antes":"","destaque":false,"video":"videos-web/cadastrar-produto.mp4","capa":"videos-web/cadastrar-produto.jpg","passos":[{"titulo":"Abra a tela de Produtos","texto":"No menu, clique em Cadastros › Produtos › Produtos.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo produto\"","texto":"Clique no botão \"Novo produto\".","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-2.webp","semPrint":false},{"titulo":"Digite o nome do produto","texto":"Digite o Nome do produto. O Código interno você não precisa preencher: o sistema gera sozinho quando você salva.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-3.webp","semPrint":false},{"titulo":"Código de barras","texto":"Passe o leitor no código de barras do produto ou digite o número. Se o produto não tiver, clique em \"Gerar EAN\".","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-4.webp","semPrint":false},{"titulo":"Estoque e preço de venda","texto":"Informe quanto tem em estoque, o estoque mínimo (para o sistema avisar quando estiver acabando) e o preço de venda.","dica":"Se você informar o Preço de custo e a Margem (%), o preço de venda é calculado sozinho. Em Grupo, Subgrupo e Marca é só começar a digitar; se não existir, clique em \"+ Cadastrar\".","atencao":"","img":"img-web/cadastrar-produto/passo-5.webp","semPrint":false},{"titulo":"Dados fiscais (se você emite nota)","texto":"Na aba \"Fiscal\", preencha o NCM, o CFOP e a origem. Na dúvida, pergunte ao seu contador.","dica":"","atencao":"","img":"img-web/cadastrar-produto/passo-6.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Confira e clique em \"Cadastrar\". O produto já pode ser vendido no PDV.","dica":"Para criar um produto parecido, use o botão \"Clonar produto\" na linha dele: copia tudo e você só muda o que precisa.","atencao":"","img":"img-web/cadastrar-produto/passo-7.webp","semPrint":false}]},{"id":"cadastrar-fornecedor","grupo":"Cadastros","titulo":"Cadastrar um fornecedor","resumo":"Cadastre quem vende mercadoria para a sua loja.","antes":"","destaque":false,"video":"videos-web/cadastrar-fornecedor.mp4","capa":"videos-web/cadastrar-fornecedor.jpg","passos":[{"titulo":"Clique em \"Novo fornecedor\"","texto":"No menu, clique em Cadastros › Pessoas › Fornecedores e depois em \"Novo fornecedor\".","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Digite o CNPJ e clique na lupa: nome e endereço são preenchidos sozinhos com os dados da Receita.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-2.webp","semPrint":false},{"titulo":"Confira o nome e o contato","texto":"O Nome é obrigatório. Preencha também telefone, WhatsApp e e-mail do vendedor.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Clique em \"Cadastrar\". O fornecedor já pode ser usado nas entradas de mercadoria e no contas a pagar.","dica":"","atencao":"","img":"img-web/cadastrar-fornecedor/passo-4.webp","semPrint":false}]},{"id":"grade-de-produtos","grupo":"Cadastros","titulo":"Grade de produtos (cor e numeração)","resumo":"Venda roupas e calçados por cor e número: cada combinação tem estoque e código de barras próprios.","antes":"A grade precisa estar liberada para a sua empresa. Se não aparecer \"Grades\" no menu, fale com o suporte da Thiago Informática.","destaque":false,"video":"videos-web/grade-de-produtos.mp4","capa":"videos-web/grade-de-produtos.jpg","passos":[{"titulo":"Abra Cadastros › Produtos › Grades","texto":"No menu, clique em Cadastros › Produtos › Grades. Aqui ficam as cores e as numerações que você vai usar nos produtos.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-1.webp","semPrint":false},{"titulo":"As cores","texto":"As cores mais usadas já vêm prontas: preto, branco, nude, jeans e muitas outras. Faltou uma cor da sua marca? Digite o nome, escolha a cor na paleta e clique no botão de mais Cor.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-2.webp","semPrint":false},{"titulo":"As numerações","texto":"As numerações também já vêm prontas: calçado adulto de 33 a 44, calçado infantil, roupa de PP a XGG, jeans e tamanho único. Se precisar, crie a sua, por exemplo Feminino 34 a 40, e clique em Salvar.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-3.webp","semPrint":false},{"titulo":"Novo produto do tipo \"Com Grade\"","texto":"Agora em Produtos, clique em Novo produto e, em Tipo do produto, escolha Com Grade. Repara que o estoque não fica mais no produto: ele fica em cada cor e numeração.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-4.webp","semPrint":false},{"titulo":"Nome da referência e \"Cadastrar\"","texto":"Preencha o nome da referência, como Tênis Esportivo Run, o preço de venda e clique em Cadastrar. Na hora, o sistema já abre a montagem da grade.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-5.webp","semPrint":false},{"titulo":"Montar ou aumentar a grade","texto":"Pra montar ou aumentar a grade de um produto que já existe, abra o produto e clique em Cores e numerações da grade.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-6.webp","semPrint":false},{"titulo":"1. Numeração","texto":"Primeiro a numeração: escolha a grade e marque os números que você vende. Eu marquei o 43. Os números que já têm estoque ficam travados, pra você não apagar nada sem querer.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-7.webp","semPrint":false},{"titulo":"2. Cores","texto":"Depois as cores: é só clicar nas que você tem. Eu acrescentei o Vermelho.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-8.webp","semPrint":false},{"titulo":"3. Estoque de cada cor e número","texto":"Na tabela, digite quantas peças você tem de cada cor e número. O que já existe aparece em verde, com o saldo. Se o fornecedor manda código de barras, marque a opção e digite; se não, o sistema cria um código pra cada peça.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-9.webp","semPrint":false},{"titulo":"Clique em \"Gerar\"","texto":"Agora é só clicar em Gerar: cada cor e número vira um item, com estoque e código de barras próprios. No caixa é só passar o código, e o estoque baixa da peça certinha.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-10.webp","semPrint":false},{"titulo":"Estoque › Consulta de Grade","texto":"E pra ver tudo de uma vez, vá em Estoque, depois em Consulta de Grade, e busque a referência. Aparece a tabela de cor por número com o saldo de cada um, o total por cor e o total por numeração.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-11.webp","semPrint":false},{"titulo":"Última peça e reposição","texto":"Olha que inteligente: a última peça aparece em amarelo, e embaixo vem a reposição sugerida, com o que está zerado e o que está acabando. Assim você sabe na hora o que comprar.","dica":"","atencao":"","img":"img-web/grade-de-produtos/passo-12.webp","semPrint":false},{"titulo":"Totais, filtros, Excel e impressão","texto":"Você ainda vê as peças em estoque, o valor em estoque e quantas numerações repor. Dá pra filtrar por cor, por número, esconder a grade zerada, exportar pro Excel e imprimir.","dica":"Na lista de Produtos, o ícone de grade na linha do produto também abre essa consulta.","atencao":"","img":"img-web/grade-de-produtos/passo-13.webp","semPrint":false}]},{"id":"cadastrar-funcionario","grupo":"Cadastros","titulo":"Cadastrar funcionário e permissões","resumo":"Crie o acesso do funcionário e escolha o que ele pode ver e fazer.","antes":"Só o administrador da empresa consegue cadastrar usuários.","destaque":false,"video":"videos-web/cadastrar-funcionario.mp4","capa":"videos-web/cadastrar-funcionario.jpg","passos":[{"titulo":"Clique em \"Novo usuário\"","texto":"No menu, clique em Cadastros › Pessoas › Usuários e depois em \"Novo usuário\".","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-1.webp","semPrint":false},{"titulo":"Escolha o perfil","texto":"Em \"Perfil de acesso\", escolha o que a pessoa faz: Vendedor, Caixa, Gerente, Técnico, Estoquista, Financeiro... O sistema já libera as telas certas para cada perfil.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-2.webp","semPrint":false},{"titulo":"Nome e forma de entrar","texto":"Digite o nome. Em \"Como o funcionário vai entrar?\", escolha \"Por usuário e senha\" se ele não tem e-mail: você mesmo define o usuário e a senha.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-3.webp","semPrint":false},{"titulo":"Comissão (opcional)","texto":"Se o funcionário ganha comissão, informe a porcentagem sobre serviços e sobre produtos. Ela aparece no relatório de comissões.","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-4.webp","semPrint":false},{"titulo":"Ajuste as permissões","texto":"Na aba \"Permissões\", marque as telas que ele pode abrir e o que ele pode fazer (dar desconto, excluir venda...).","dica":"","atencao":"","img":"img-web/cadastrar-funcionario/passo-5.webp","semPrint":false},{"titulo":"Clique em \"Cadastrar\"","texto":"Clique em \"Cadastrar\". Passe para o funcionário o código da empresa, o usuário e a senha (veja o tutorial \"Entrar como funcionário\").","dica":"","atencao":"Funcionário saiu da empresa? Edite o usuário e desligue \"Ativo\" para bloquear o acesso.","img":"img-web/cadastrar-funcionario/passo-6.webp","semPrint":false}]},{"id":"grupos-marcas-unidades","grupo":"Cadastros","titulo":"Grupos, marcas, unidades e plano de contas","resumo":"Organize seus produtos e as categorias de receitas e despesas.","antes":"","destaque":false,"video":"videos-web/grupos-marcas-unidades.mp4","capa":"videos-web/grupos-marcas-unidades.jpg","passos":[{"titulo":"Grupos e subgrupos","texto":"Em Cadastros › Produtos › Grupos e Subgrupos, clique em \"Novo grupo\" (ex.: Informática). Depois clique no nome do grupo e em \"Novo subgrupo\" (ex.: Mouses). Serve para filtrar produtos e ver relatórios por grupo.","dica":"","atencao":"","img":"img-web/grupos-marcas-unidades/passo-1.webp","semPrint":false},{"titulo":"Marcas","texto":"Em Cadastros › Produtos › Marcas, clique em \"Nova marca\", digite o nome e clique em \"Salvar\".","dica":"Também dá para criar a marca na hora, dentro do cadastro do produto: comece a digitar e clique em \"+ Cadastrar\".","atencao":"","img":"img-web/grupos-marcas-unidades/passo-2.webp","semPrint":false},{"titulo":"Unidades de medida","texto":"Em Cadastros › Produtos › Unidades, clique em \"Nova unidade\" e informe o nome e a sigla (ex.: Caixa, CX).","dica":"","atencao":"","img":"img-web/grupos-marcas-unidades/passo-3.webp","semPrint":false},{"titulo":"Plano de contas","texto":"O plano de contas já vem pronto, com as categorias de receitas e despesas que alimentam o DRE. Para criar uma nova, clique em \"Nova conta\", dê o nome, o tipo e escolha a categoria pai.","dica":"Use nomes simples, como \"Energia\", \"Aluguel\", \"Internet\". Assim o DRE fica fácil de ler.","atencao":"","img":"img-web/grupos-marcas-unidades/passo-4.webp","semPrint":false}]},{"id":"servicos-e-equipamentos","grupo":"Cadastros","titulo":"Serviços, status e equipamentos (para a OS)","resumo":"Cadastre os serviços com preço e comissão, os status da OS e os equipamentos dos clientes.","antes":"","destaque":false,"video":"videos-web/servicos-e-equipamentos.mp4","capa":"videos-web/servicos-e-equipamentos.jpg","passos":[{"titulo":"Cadastre os serviços","texto":"Em Cadastros › Serviços › Serviços e Status, digite o nome do serviço (ex.: Formatação), o preço (se tiver preço fixo) e a comissão do técnico. Clique em \"Cadastrar\".","dica":"Sem preço, o valor é digitado na hora, em cada OS.","atencao":"","img":"img-web/servicos-e-equipamentos/passo-1.webp","semPrint":false},{"titulo":"Status da OS","texto":"Clique em \"Status\" para criar as etapas que a OS passa (ex.: Aguardando peça, Pronto para retirar).","dica":"","atencao":"","img":"img-web/servicos-e-equipamentos/passo-2.webp","semPrint":false},{"titulo":"Equipamentos (ou veículos) dos clientes","texto":"Em Cadastros › Serviços › Equipamentos, digite o equipamento e modelo, uma observação (nº de série, senha...), escolha o cliente e clique em \"Cadastrar\". Ele aparece na hora de abrir a OS.","dica":"","atencao":"","img":"img-web/servicos-e-equipamentos/passo-3.webp","semPrint":false}]},{"id":"vender-no-pdv","grupo":"Comercial","titulo":"Fazer uma venda no PDV (caixa)","resumo":"Abra o caixa, lance os produtos e receba o pagamento.","antes":"Ter pelo menos um produto cadastrado. O PDV abre numa aba nova do navegador.","destaque":false,"video":"videos-web/vender-no-pdv.mp4","capa":"videos-web/vender-no-pdv.jpg","passos":[{"titulo":"Abra o PDV","texto":"No menu, clique em Comercial › PDV. Ele abre numa aba nova, com os atalhos do caixa.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-1.webp","semPrint":false},{"titulo":"Abra o caixa (início do dia)","texto":"No começo do dia, clique em \"Abrir caixa\", digite o valor do troco que tem na gaveta e confirme em \"Abrir caixa\". Com o caixa aberto, esse mesmo botão vira \"Fechar caixa\".","dica":"Atalho: Ctrl+6. Se o caixa já estiver aberto, pule este passo.","atencao":"","img":"img-web/vender-no-pdv/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Nova venda\"","texto":"Clique em \"Nova venda\" (ou aperte Enter).","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-3.webp","semPrint":false},{"titulo":"Lance os produtos","texto":"Passe o leitor de código de barras ou digite o nome/código do produto e aperte Enter. Repita para cada produto.","dica":"Para lançar várias unidades, digite a quantidade e um asterisco antes: 3*123 lança 3 unidades do produto 123.","atencao":"","img":"img-web/vender-no-pdv/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Finalizar venda\" (F9)","texto":"Com todos os produtos lançados, clique em \"Finalizar venda\" ou aperte F9.","dica":"","atencao":"","img":"img-web/vender-no-pdv/passo-5.webp","semPrint":false},{"titulo":"Escolha a forma de pagamento e confirme","texto":"Na janela \"Formas de pagamento\", clique na forma (Dinheiro, Pix, Cartão...), digite quanto recebeu e aperte Enter. Quando \"Falta pagar\" zerar, aperte Enter de novo para concluir. O troco aparece na tela.","dica":"Atalhos do caixa: F1 Recebimentos · F2 Orçamentos · F3 Produtos · F4 Vendas · F6 Desconto · F7 Em espera · F8 Devolução · F10 Cliente.","atencao":"Se errar um pagamento, aperte Delete para desfazer antes de confirmar.","img":"img-web/vender-no-pdv/passo-6.webp","semPrint":false}]},{"id":"consultar-vendas","grupo":"Comercial","titulo":"Consultar, imprimir e enviar uma venda","resumo":"Encontre vendas feitas, reimprima o comprovante ou envie pelo WhatsApp.","antes":"","destaque":false,"video":"videos-web/consultar-vendas.mp4","capa":"videos-web/consultar-vendas.jpg","passos":[{"titulo":"Abra a tela de Vendas","texto":"No menu, clique em Comercial › Vendas. Aparecem as vendas do período.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-1.webp","semPrint":false},{"titulo":"Filtre pelo cliente","texto":"Digite o nome do cliente para ver só as vendas dele. Você também pode mudar o período, a forma de pagamento e o status.","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-2.webp","semPrint":false},{"titulo":"Clique nos três pontinhos da venda","texto":"Na linha da venda, clique no botão \"...\" (Ações).","dica":"","atencao":"","img":"img-web/consultar-vendas/passo-3.webp","semPrint":false},{"titulo":"Escolha o que fazer","texto":"Clique em \"Detalhes\" para ver os produtos, \"Imprimir / PDF\" para reimprimir o comprovante ou \"Enviar no WhatsApp\" para mandar para o cliente.","dica":"","atencao":"\"Excluir\" desfaz a venda: devolve os produtos ao estoque e estorna o caixa e o financeiro. Ela não vai para a Lixeira e não dá para restaurar, então use só se a venda foi feita errada.","img":"img-web/consultar-vendas/passo-4.webp","semPrint":false}]},{"id":"fazer-orcamento","grupo":"Comercial","titulo":"Fazer um orçamento","resumo":"Monte o orçamento, envie pelo WhatsApp e depois transforme em venda.","antes":"Ter o cliente e os produtos cadastrados (o cliente também pode ser cadastrado na hora).","destaque":false,"video":"videos-web/fazer-orcamento.mp4","capa":"videos-web/fazer-orcamento.jpg","passos":[{"titulo":"Abra a tela de Orçamentos","texto":"No menu, clique em Comercial › Orçamentos.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Novo orçamento\"","texto":"Clique no botão \"Novo orçamento\".","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-2.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Digite o nome ou CPF/CNPJ do cliente e clique nele na lista. Se ele ainda não existe, clique em \"Cadastrar cliente\".","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-3.webp","semPrint":false},{"titulo":"Adicione os produtos","texto":"Digite o nome ou código do produto e clique nele para incluir. Repita para cada item. Se quiser, dê desconto no item ou no total.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-4.webp","semPrint":false},{"titulo":"Validade","texto":"Confira até quando o orçamento vale.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-5.webp","semPrint":false},{"titulo":"Salve, imprima ou envie","texto":"Clique em \"Salvar\". Você pode imprimir (A4, 80mm ou PDF) ou enviar pelo WhatsApp: o cliente recebe um link para ver e aprovar.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-6.webp","semPrint":false},{"titulo":"Cliente aprovou? Fature no PDV","texto":"Na lista de orçamentos, clique no botão \"Faturar no PDV\" da linha. O orçamento vira uma venda no caixa, já com os produtos.","dica":"","atencao":"","img":"img-web/fazer-orcamento/passo-7.webp","semPrint":false}]},{"id":"ordem-de-servico","grupo":"Comercial","titulo":"Abrir uma ordem de serviço (OS)","resumo":"Registre o conserto: cliente, veículo/equipamento, serviços, peças e fotos.","antes":"Ter os serviços cadastrados (Cadastros › Serviços › Serviços e Status) e os mecânicos/técnicos cadastrados como usuários. Os nomes dos campos mudam conforme o ramo: oficina mostra \"Veículo/Placa/Mecânico\"; assistência técnica mostra \"Equipamento/Técnico\".","destaque":false,"video":"videos-web/ordem-de-servico.mp4","capa":"videos-web/ordem-de-servico.jpg","passos":[{"titulo":"Clique em \"Nova ordem\"","texto":"No menu, clique em Comercial › Ordens de Serviço e depois em \"Nova ordem\".","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-1.webp","semPrint":false},{"titulo":"Escolha o cliente","texto":"Comece a digitar o nome do cliente e clique nele. Se for cliente novo, clique em \"+ Cadastrar cliente\".","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-2.webp","semPrint":false},{"titulo":"Equipamento (obrigatório) e o defeito","texto":"Preencha o equipamento (ou veículo) e modelo: junto com o cliente, é o que precisa pra salvar, por isso tem o asterisco. Ao lado vai a observação (ou placa). Escreva o defeito que o cliente relatou e, depois de olhar, o laudo técnico.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-3.webp","semPrint":false},{"titulo":"Adicione os serviços","texto":"Clique em \"Adicionar serviço\", busque o serviço pelo nome ou código e confira o valor. O técnico de cada serviço é opcional: escolha se ele ganha comissão.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-4.webp","semPrint":false},{"titulo":"Adicione as peças","texto":"Clique em \"Adicionar produto\" para incluir as peças usadas, com a quantidade. Elas saem do estoque quando você recebe a OS no caixa.","dica":"Use \"+ Adicionar fotos\" para guardar fotos de antes, durante e depois do serviço. O equipamento pode ser opcional: mude em Configurações › Ordem de Serviço › Geral.","atencao":"","img":"img-web/ordem-de-servico/passo-5.webp","semPrint":false},{"titulo":"Salve ou gere o orçamento","texto":"Clique em \"Salvar ordem\". Se o cliente ainda vai aprovar, clique em \"Gerar orçamento\" e envie pelo WhatsApp ou imprima.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-6.webp","semPrint":false},{"titulo":"Serviço pronto? Receba no caixa","texto":"Na lista de ordens, clique em \"Receber OS no caixa\" na linha da OS. Ela vai para o PDV para receber o pagamento.","dica":"","atencao":"","img":"img-web/ordem-de-servico/passo-7.webp","semPrint":false}]},{"id":"condicional","grupo":"Comercial","titulo":"Condicional (cliente leva para provar)","resumo":"O cliente leva os produtos para casa; depois você dá baixa no que voltou e vende o resto.","antes":"","destaque":false,"video":"videos-web/condicional.mp4","capa":"videos-web/condicional.jpg","passos":[{"titulo":"Clique em \"Nova condicional\"","texto":"No menu, clique em Comercial › Condicional e depois em \"Nova condicional\".","dica":"","atencao":"","img":"img-web/condicional/passo-1.webp","semPrint":false},{"titulo":"Cliente e validade","texto":"Digite o nome do cliente e escolha até quando ele pode ficar com os produtos (Validade).","dica":"","atencao":"","img":"img-web/condicional/passo-2.webp","semPrint":false},{"titulo":"Bipe os produtos","texto":"Passe o leitor no código de barras de cada peça (ou digite e aperte Enter).","dica":"","atencao":"","img":"img-web/condicional/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar condicional\"","texto":"Clique em \"Salvar condicional\". Os produtos saem do estoque e você pode imprimir (80mm ou A4) para o cliente assinar.","dica":"","atencao":"","img":"img-web/condicional/passo-4.webp","semPrint":false},{"titulo":"Cliente voltou? Abra a condicional","texto":"Clique na condicional na lista. Use \"Devolver itens\" para bipar o que voltou e depois \"Transformar em venda (ir ao PDV)\" para cobrar o que ele ficou.","dica":"Os filtros \"Para a rua\" e \"Expirado\" mostram quem está com produtos e quem passou do prazo.","atencao":"","img":"img-web/condicional/passo-5.webp","semPrint":false}]},{"id":"caixa-sangria-fechamento","grupo":"Comercial","titulo":"Sangria, suprimento e fechar o caixa","resumo":"Tire ou coloque dinheiro na gaveta e feche o caixa no fim do dia.","antes":"","destaque":false,"video":"videos-web/caixa-sangria-fechamento.mp4","capa":"videos-web/caixa-sangria-fechamento.jpg","passos":[{"titulo":"Sangria: tirar dinheiro da gaveta","texto":"Na tela inicial do PDV, clique em \"Sangria\" (Ctrl+3). Digite o valor, uma descrição e escolha \"Cofre\" ou a despesa (ex.: pagamento de fornecedor). Clique em \"Confirmar\".","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-1.webp","semPrint":false},{"titulo":"Suprimento: colocar troco","texto":"Precisou colocar mais troco? Clique em \"Suprimento\" (Ctrl+4), digite o valor e confirme.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-2.webp","semPrint":false},{"titulo":"Confira o resumo","texto":"Antes de fechar, clique em \"Resumo do caixa\" (Ctrl+5) para ver quanto vendeu em cada forma e quanto deve ter na gaveta.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-3.webp","semPrint":false},{"titulo":"Feche o caixa","texto":"Clique em \"Fechar caixa\" (Ctrl+6). Conte o dinheiro, informe quanto vai retirar (se for levar para o cofre) e clique em \"Fechar caixa\".","dica":"Clique em \"Contar cédulas e moedas\" para contar nota por nota: o sistema soma para você.","atencao":"Feche o caixa todo dia. No dia seguinte, abra de novo com o valor do troco.","img":"img-web/caixa-sangria-fechamento/passo-4.webp","semPrint":false},{"titulo":"Confira os fechamentos","texto":"O dono/gerente vê todos os caixas fechados, com sobras e faltas, em Relatórios › Caixas › Fechamento de Caixa.","dica":"","atencao":"","img":"img-web/caixa-sangria-fechamento/passo-5.webp","semPrint":false}]},{"id":"lembrete-de-revisao","grupo":"Comercial","titulo":"Lembrete de revisão (chamar o cliente de volta)","resumo":"Veja quem fez serviço há 3, 6 ou 12 meses e não voltou, e mande o convite de revisão.","antes":"","destaque":false,"video":"videos-web/lembrete-de-revisao.mp4","capa":"videos-web/lembrete-de-revisao.jpg","passos":[{"titulo":"Escolha há quanto tempo","texto":"Em Comercial › Lembrete de revisão, clique em \"3 meses\", \"6 meses\" ou \"12 meses\". Aparecem os clientes que fizeram serviço nesse tempo e não voltaram.","dica":"","atencao":"","img":"img-web/lembrete-de-revisao/passo-1.webp","semPrint":false},{"titulo":"Mande o convite","texto":"Clique em \"WhatsApp\" na linha do cliente para mandar o convite. Para vários de uma vez, marque os clientes e clique em \"Enviar para marcados\".","dica":"Já falou com o cliente por telefone? Clique em \"Avisei\" para ele sair da lista.","atencao":"","img":"img-web/lembrete-de-revisao/passo-2.webp","semPrint":false}]},{"id":"agenda","grupo":"Comercial","titulo":"Agenda: serviços, visitas e compromissos","resumo":"Veja no calendário as OS e os compromissos do mês, da semana ou do dia, e agende com um clique.","antes":"","destaque":false,"video":"videos-web/agenda.mp4","capa":"videos-web/agenda.jpg","passos":[{"titulo":"Abra a Agenda","texto":"No menu, clique em Comercial › Agenda. Aqui aparece o calendário com as ordens de serviço agendadas e os seus compromissos. O dia de hoje fica com o número destacado em azul.","dica":"","atencao":"","img":"img-web/agenda/passo-1.webp","semPrint":false},{"titulo":"Mês, Semana ou Dia","texto":"Aqui em cima você escolhe como quer ver: o mês inteiro, a semana ou só o dia. As setas andam pra frente e pra trás, e o botão Hoje volta pro dia de hoje.","dica":"","atencao":"","img":"img-web/agenda/passo-2.webp","semPrint":false},{"titulo":"A semana de uma vez","texto":"Na Semana, cada dia vira uma coluna com tudo que está marcado. Embaixo de cada dia tem o botão Agendar, pra marcar ali mesmo.","dica":"","atencao":"","img":"img-web/agenda/passo-3.webp","semPrint":false},{"titulo":"O dia, hora por hora","texto":"No Dia aparecem os horários, das sete da manhã às nove da noite. Horário livre? É só clicar nele que já abre o agendamento naquela hora.","dica":"","atencao":"","img":"img-web/agenda/passo-4.webp","semPrint":false},{"titulo":"Filtre pelo técnico","texto":"Escolha o técnico pra ver só a agenda dele. As cores ajudam: azul é ordem de serviço, roxo é compromisso e verde é o que já foi feito.","dica":"","atencao":"","img":"img-web/agenda/passo-5.webp","semPrint":false},{"titulo":"Novo agendamento","texto":"Clique em Novo agendamento, ou clique direto num dia vazio do calendário. Aí você escolhe: um compromisso, como reunião, visita ou ligação, sem precisar de OS, ou uma ordem de serviço, que já abre agendada naquele dia.","dica":"","atencao":"","img":"img-web/agenda/passo-6.webp","semPrint":false},{"titulo":"Preencha o compromisso","texto":"Escolha o tipo, escreva o assunto, o horário de início e de fim, com quem é e quem é o responsável. Depois é só clicar em Salvar, e ele aparece em roxo na agenda.","dica":"Clicou num compromisso já marcado? Abre pra editar, marcar \"Já foi feito\" ou excluir. Clicou numa OS? Abre a OS.","atencao":"","img":"img-web/agenda/passo-7.webp","semPrint":false}]},{"id":"contas-a-receber","grupo":"Financeiro","titulo":"Contas a receber: lançar e dar baixa","resumo":"Lance o que o cliente vai te pagar e registre quando ele pagar.","antes":"","destaque":false,"video":"videos-web/contas-a-receber.mp4","capa":"videos-web/contas-a-receber.jpg","passos":[{"titulo":"Abra Contas a Receber","texto":"No menu, clique em Financeiro › Contas a Receber. Os quadros no alto mostram o total recebido, o saldo a receber e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-1.webp","semPrint":false},{"titulo":"Veja as contas em aberto","texto":"Use as abas para ver as contas \"Em aberto/atraso\", as \"Pagas\" ou \"Todas\". Para achar um cliente, digite o nome no filtro.","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-2.webp","semPrint":false},{"titulo":"Clique em \"Nova conta\"","texto":"Para lançar uma conta, clique em \"Nova conta\".","dica":"","atencao":"","img":"img-web/contas-a-receber/passo-3.webp","semPrint":false},{"titulo":"Preencha a conta","texto":"Escolha o cliente, escreva uma descrição, o plano de contas, quantas parcelas, o valor total e o vencimento. Depois clique em \"Salvar\".","dica":"Se o cliente já pagou agora, ligue \"Já foi recebido agora\" e informe a data e a forma de pagamento.","atencao":"","img":"img-web/contas-a-receber/passo-4.webp","semPrint":false},{"titulo":"O cliente pagou? Dê baixa","texto":"Na linha da conta, clique em \"Receber no caixa (PDV)\" ou \"Receber com Pix\". Confira o valor e confirme.","dica":"O botão \"Copiar mensagem de cobrança (WhatsApp)\" já monta a mensagem para você mandar ao cliente.","atencao":"","img":"","semPrint":true}]},{"id":"contas-a-pagar","grupo":"Financeiro","titulo":"Contas a pagar: lançar e pagar","resumo":"Registre suas despesas e boletos e marque quando pagar.","antes":"","destaque":false,"video":"videos-web/contas-a-pagar.mp4","capa":"videos-web/contas-a-pagar.jpg","passos":[{"titulo":"Abra Contas a Pagar","texto":"No menu, clique em Financeiro › Contas a Pagar. Os quadros mostram o que já foi pago, o saldo a pagar e o que está atrasado.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Nova conta\"","texto":"Clique em \"Nova conta\" para lançar uma despesa ou boleto.","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-2.webp","semPrint":false},{"titulo":"Diga de quem é a despesa","texto":"Em \"Vínculo da despesa\", escolha Fornecedor, Funcionário ou Despesa geral (luz, aluguel, internet...).","dica":"","atencao":"","img":"img-web/contas-a-pagar/passo-3.webp","semPrint":false},{"titulo":"Preencha e salve","texto":"Coloque a descrição, o plano de contas, as parcelas, o valor e o vencimento. Clique em \"Salvar\".","dica":"Conta que se repete todo mês (aluguel, internet)? Cadastre em Financeiro › Recorrências e ela é lançada sozinha.","atencao":"","img":"img-web/contas-a-pagar/passo-4.webp","semPrint":false},{"titulo":"Pagou? Clique em \"Pagar\"","texto":"Na linha da conta, clique em \"Pagar\", confira o valor, a forma e de qual conta saiu o dinheiro, e confirme.","dica":"","atencao":"","img":"","semPrint":true}]},{"id":"formas-de-pagamento","grupo":"Financeiro","titulo":"Configurar formas de pagamento e maquininha","resumo":"Cadastre Pix, cartões e as taxas da maquininha, e diga em que conta cai o dinheiro.","antes":"","destaque":false,"video":"videos-web/formas-de-pagamento.mp4","capa":"videos-web/formas-de-pagamento.jpg","passos":[{"titulo":"Abra \"Formas de pagamento\"","texto":"No menu, clique em Financeiro › Formas de pagamento. São as opções que aparecem no caixa na hora de receber.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-1.webp","semPrint":false},{"titulo":"Clique em \"Nova forma\"","texto":"Clique em \"Nova forma\".","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-2.webp","semPrint":false},{"titulo":"Nome, tipo e atalho","texto":"Dê o nome que vai aparecer no caixa (ex.: \"Pix C6\"), escolha o tipo (Dinheiro, Pix, Crédito, Débito...) e uma tecla de atalho para usar no PDV.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-3.webp","semPrint":false},{"titulo":"Conta de destino e salvar","texto":"Em \"Conta de destino\", escolha em qual conta o dinheiro cai (ex.: conta do banco). Clique em \"Salvar\".","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-4.webp","semPrint":false},{"titulo":"Taxas da maquininha","texto":"Na aba \"Adquirentes\", cadastre sua maquininha com as taxas de débito, Pix e crédito. Assim o sistema mostra quanto você recebe de verdade e quando o dinheiro cai.","dica":"","atencao":"","img":"img-web/formas-de-pagamento/passo-5.webp","semPrint":false}]},{"id":"recorrencias","grupo":"Financeiro","titulo":"Contas que se repetem todo mês","resumo":"Aluguel, salário, internet: cadastre uma vez e o sistema lança os próximos 12 meses.","antes":"","destaque":false,"video":"videos-web/recorrencias.mp4","capa":"videos-web/recorrencias.jpg","passos":[{"titulo":"Clique em \"Nova recorrência\"","texto":"No menu, clique em Financeiro › Recorrências. Para uma conta a pagar, clique em \"Nova recorrência\". Para algo que você recebe todo mês, clique em \"A receber\".","dica":"","atencao":"","img":"img-web/recorrencias/passo-1.webp","semPrint":false},{"titulo":"Nome e plano de contas","texto":"Dê um nome (ex.: Aluguel). O plano de contas é sugerido sozinho pelo nome; confira.","dica":"","atencao":"","img":"img-web/recorrencias/passo-2.webp","semPrint":false},{"titulo":"Para quem","texto":"Escolha se é para um funcionário, um fornecedor ou outros (ex.: Cemig, condomínio).","dica":"","atencao":"","img":"img-web/recorrencias/passo-3.webp","semPrint":false},{"titulo":"Valor e dia do vencimento","texto":"Informe o valor por mês e o dia que vence. O quadro azul mostra quantas contas vão ser lançadas.","dica":"","atencao":"","img":"img-web/recorrencias/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Criar e lançar\"","texto":"Clique em \"Criar e lançar\". As contas aparecem em Contas a Pagar (ou a Receber), uma por mês.","dica":"O valor mudou? Use \"Alterar\": vale de hoje para frente, sem mexer nas contas já pagas.","atencao":"","img":"img-web/recorrencias/passo-5.webp","semPrint":false}]},{"id":"central-de-cobranca","grupo":"Financeiro","titulo":"Cobrar clientes atrasados (Central de cobrança)","resumo":"Veja quem está devendo e mande cobrança pelo WhatsApp para vários de uma vez.","antes":"","destaque":false,"video":"videos-web/central-de-cobranca.mp4","capa":"videos-web/central-de-cobranca.jpg","passos":[{"titulo":"Abra a Central de cobrança","texto":"No menu, clique em Financeiro › Central de cobrança. No alto aparece o total vencido e quantos clientes estão atrasados.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-1.webp","semPrint":false},{"titulo":"Escolha a faixa de atraso","texto":"Clique numa faixa (1 a 15 dias, 16 a 30 dias...) para ver só esses clientes.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-2.webp","semPrint":false},{"titulo":"Cobrar um cliente na hora","texto":"Na linha do cliente, o botão do WhatsApp manda a cobrança com as parcelas, e o botão do QR Code gera o Pix das parcelas e envia. O cliente paga e a conta baixa sozinha.","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-3.webp","semPrint":false},{"titulo":"Marque os clientes","texto":"Marque os clientes que você quer cobrar (ou \"Marcar todos\").","dica":"","atencao":"","img":"img-web/central-de-cobranca/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Enviar cobrança\"","texto":"Clique em \"Enviar cobrança\". Confira a mensagem, deixe marcado o link de Pix (o cliente paga e a conta baixa sozinha) e clique em \"Enviar\".","dica":"Clique em \"Ver\" num cliente para anotar \"Prometeu pagar\" com a data. Assim você não cobra de novo antes da hora.","atencao":"","img":"","semPrint":true}]},{"id":"contas-e-caixas","grupo":"Financeiro","titulo":"Saldo das contas e conferência dos caixas","resumo":"Veja o saldo de cada banco e caixa, transfira entre contas e confira os caixas fechados.","antes":"","destaque":false,"video":"videos-web/contas-e-caixas.mp4","capa":"videos-web/contas-e-caixas.jpg","passos":[{"titulo":"Saldo de cada conta","texto":"Em Financeiro › Contas aparece um cartão para cada conta (banco, caixa, cofre) com o saldo, as entradas e as saídas do período. Clique em \"Ver detalhes\" para ver cada movimento.","dica":"","atencao":"","img":"img-web/contas-e-caixas/passo-1.webp","semPrint":false},{"titulo":"Transferir ou ajustar","texto":"Clique em \"Movimentar\" para passar dinheiro de uma conta para outra (ex.: do caixa para o banco) ou ajustar o saldo, sempre com o motivo.","dica":"","atencao":"","img":"img-web/contas-e-caixas/passo-2.webp","semPrint":false},{"titulo":"Conferir os caixas fechados","texto":"Em Financeiro › Caixas e conferência, abra a aba \"A conferir\". Clique no caixa, confira o esperado e o contado em cada forma de pagamento e clique em \"Conferido\".","dica":"Se um Pix foi lançado como dinheiro, use \"Ajustar\" na forma e escreva o motivo.","atencao":"","img":"img-web/contas-e-caixas/passo-3.webp","semPrint":false}]},{"id":"boletos-remessa-retorno","grupo":"Financeiro","titulo":"Boletos: remessa e retorno do banco","resumo":"Gere o arquivo de remessa para o banco e leia o retorno para baixar os boletos pagos.","antes":"Só para bancos \"por arquivo\". Ative antes em Configurações › Boletos.","destaque":false,"video":"videos-web/boletos-remessa-retorno.mp4","capa":"videos-web/boletos-remessa-retorno.jpg","passos":[{"titulo":"Gere a remessa","texto":"Em Financeiro › Boletos (remessa e retorno), clique em \"Gerar remessa\" e envie o arquivo no internet banking da empresa.","dica":"","atencao":"","img":"img-web/boletos-remessa-retorno/passo-1.webp","semPrint":false},{"titulo":"Leia o retorno","texto":"Baixe o arquivo de retorno no banco e clique em \"Ler retorno do banco\". Confira a lista (pagos, confirmados, rejeitados) e clique em \"Confirmar e dar baixa\".","dica":"","atencao":"Nada é gravado antes de você confirmar. Confira os pagos antes.","img":"img-web/boletos-remessa-retorno/passo-2.webp","semPrint":false}]},{"id":"conciliacao-bancaria","grupo":"Financeiro","titulo":"Conciliação bancária (extrato × sistema)","resumo":"Confira se o extrato do banco bate com o que foi lançado no sistema.","antes":"A conta do banco precisa estar cadastrada em Financeiro › Contas.","destaque":false,"video":"videos-web/conciliacao-bancaria.mp4","capa":"videos-web/conciliacao-bancaria.jpg","passos":[{"titulo":"Escolha a conta e envie o extrato","texto":"Em Financeiro › Conciliação bancária, escolha a conta e clique em \"Enviar extrato\" (arquivo OFX, CSV, PDF ou até foto). Conta Sicoob automática: use \"Puxar do Sicoob\".","dica":"","atencao":"","img":"img-web/conciliacao-bancaria/passo-1.webp","semPrint":false},{"titulo":"Confira linha por linha","texto":"O sistema junta o que é igual. Em \"Confirme\", clique em \"Confirmar\" ou \"Não é\". Em \"Só no banco\", clique em \"Lançar\" para registrar o que faltou (ex.: tarifa) ou \"Ignorar\".","dica":"O cartão \"Diferença\" mostra \"Bateu\" quando o saldo do banco e o do sistema ficam iguais.","atencao":"","img":"img-web/conciliacao-bancaria/passo-2.webp","semPrint":false},{"titulo":"Maquininhas: caiu certo?","texto":"Clique em \"Cartões\" para ver, por dia, quanto as maquininhas deveriam depositar (já sem a taxa) e quanto caiu de verdade no banco.","dica":"","atencao":"","img":"img-web/conciliacao-bancaria/passo-3.webp","semPrint":false}]},{"id":"emitir-nota","grupo":"Fiscal","titulo":"Emitir nota fiscal de uma venda","resumo":"Transforme uma venda em NF-e ou NFC-e (cupom fiscal).","antes":"A empresa precisa ter o fiscal configurado (certificado digital) e o produto com NCM preenchido.","destaque":false,"video":"videos-web/emitir-nota.mp4","capa":"videos-web/emitir-nota.jpg","passos":[{"titulo":"Veja as vendas sem nota","texto":"No menu, clique em Fiscal › Notas a emitir. Aparecem as vendas que ainda não viraram nota fiscal. Use \"Hoje\", \"Este mês\" ou \"Todo o período\" para escolher as datas.","dica":"","atencao":"","img":"img-web/emitir-nota/passo-1.webp","semPrint":false},{"titulo":"Abra a venda em Vendas","texto":"Para emitir, vá em Comercial › Vendas e encontre a venda (digite o nome do cliente para achar mais rápido).","dica":"","atencao":"","img":"img-web/emitir-nota/passo-2.webp","semPrint":false},{"titulo":"Clique em \"NF-e\" ou \"NFC-e\"","texto":"Na linha da venda, clique em \"NF-e\" (nota para empresa ou entrega) ou \"NFC-e\" (cupom fiscal para consumidor).","dica":"Na dúvida entre NF-e e NFC-e, pergunte ao seu contador qual usar.","atencao":"","img":"img-web/emitir-nota/passo-3.webp","semPrint":false},{"titulo":"Confira e clique em \"Continuar emissão\"","texto":"Confira os dados do cliente e dos produtos na janela e clique em \"Continuar emissão\". Em alguns segundos a nota é autorizada.","dica":"","atencao":"Nota emitida vale para a Receita. Confira o cliente e os valores antes de continuar.","img":"img-web/emitir-nota/passo-4.webp","semPrint":false},{"titulo":"Veja as notas emitidas","texto":"As notas autorizadas ficam em Fiscal › Notas emitidas. Lá você imprime, baixa o XML ou envia para o cliente pelo botão \"Ações\".","dica":"Se a nota voltar com erro, ela vai para Fiscal › Corrigir pendências. Veja o tutorial \"Corrigir nota com erro\".","atencao":"","img":"img-web/emitir-nota/passo-5.webp","semPrint":false}]},{"id":"corrigir-pendencias","grupo":"Fiscal","titulo":"Corrigir nota com erro (rejeitada)","resumo":"A nota voltou com erro? Veja o motivo, corrija e transmita de novo.","antes":"","destaque":false,"video":"videos-web/corrigir-pendencias.mp4","capa":"videos-web/corrigir-pendencias.jpg","passos":[{"titulo":"Abra \"Corrigir pendências\"","texto":"No menu, clique em Fiscal › Corrigir pendências. Cada cartão é uma venda cuja nota não foi autorizada.","dica":"","atencao":"","img":"img-web/corrigir-pendencias/passo-1.webp","semPrint":false},{"titulo":"Leia o motivo do erro","texto":"Clique em \"Detalhes da pendência\" para ver o que a Receita (SEFAZ) recusou. Normalmente é um dado do cliente ou do produto (CPF, endereço, NCM).","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Corrija o cadastro","texto":"Clique no botão de cadastro do cartão (por exemplo \"Conferir cadastro\") e arrume o dado que estava errado.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Clique em \"Corrigir e transmitir novamente\"","texto":"Depois de corrigir, clique em \"Corrigir e transmitir novamente\". Escolha se é cupom (NFC-e) ou nota (NF-e) e clique em \"Emitir nota\".","dica":"Use \"Conferir dados sem emitir\" para checar se ainda tem algum erro antes de enviar.","atencao":"","img":"","semPrint":true}]},{"id":"arquivos-contador","grupo":"Fiscal","titulo":"Mandar os arquivos do mês para o contador","resumo":"Baixe o pacote com todos os XMLs do mês ou envie o acesso ao contador.","antes":"","destaque":false,"video":"videos-web/arquivos-contador.mp4","capa":"videos-web/arquivos-contador.jpg","passos":[{"titulo":"Abra \"Arquivos para contador\"","texto":"No menu, clique em Fiscal › Arquivos para contador.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-1.webp","semPrint":false},{"titulo":"Escolha o mês","texto":"Clique em \"Mês passado\" (o mais comum: o contador fecha o mês anterior) ou escolha as datas em Início e Fim.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-2.webp","semPrint":false},{"titulo":"Baixe o pacote ZIP","texto":"Confira os totais e clique em \"Baixar pacote contábil ZIP\". Depois é só mandar esse arquivo para o contador.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-3.webp","semPrint":false},{"titulo":"Ou envie o acesso pelo WhatsApp","texto":"Prefere que o contador baixe sozinho? Clique em \"Enviar acesso ao contador pelo WhatsApp\". Ele entra no Portal do Contador e pega os arquivos.","dica":"","atencao":"","img":"img-web/arquivos-contador/passo-4.webp","semPrint":false}]},{"id":"inutilizar-numeros","grupo":"Fiscal","titulo":"Inutilizar números de nota","resumo":"Avise a SEFAZ que um número de NF-e ou NFC-e com erro (ou pulado) não será usado.","antes":"Só o administrador da empresa pode inutilizar. Na dúvida, fale com o contador.","destaque":false,"video":"videos-web/inutilizar-numeros.mp4","capa":"videos-web/inutilizar-numeros.jpg","passos":[{"titulo":"Escreva o motivo","texto":"Em Fiscal › Inutilizar números, escreva o motivo com pelo menos 15 letras (ex.: \"Nota rejeitada por erro de cadastro\").","dica":"","atencao":"","img":"img-web/inutilizar-numeros/passo-1.webp","semPrint":false},{"titulo":"Escolha as notas e inutilize","texto":"Em \"Notas e cupons com erro\", marque as notas e clique em \"Inutilizar selecionados\". Para um número que não está na lista, use \"Inutilizar outro número\" com a série e o número.","dica":"","atencao":"Número inutilizado não pode mais ser usado. Confira antes de confirmar.","img":"img-web/inutilizar-numeros/passo-2.webp","semPrint":false}]},{"id":"devolucao-fornecedor","grupo":"Fiscal","titulo":"Devolver mercadoria ao fornecedor (NF-e de devolução)","resumo":"Escolha a nota de compra, marque o que vai voltar e emita a nota de devolução.","antes":"","destaque":false,"video":"videos-web/devolucao-fornecedor.mp4","capa":"videos-web/devolucao-fornecedor.jpg","passos":[{"titulo":"Clique em \"Nova devolução\"","texto":"Em Fiscal › Devolução fornecedor, clique em \"Nova devolução\". Também dá para começar direto pela nota de entrada, buscando pelo fornecedor, número ou chave.","dica":"","atencao":"","img":"img-web/devolucao-fornecedor/passo-1.webp","semPrint":false},{"titulo":"Fornecedor e nota original","texto":"No passo 1, escolha o fornecedor e informe a nota original (número e chave de 44 dígitos). Se tiver o XML da compra, use \"Anexar XML original\" que preenche tudo sozinho.","dica":"","atencao":"","img":"img-web/devolucao-fornecedor/passo-2.webp","semPrint":false},{"titulo":"Produtos e conferência fiscal","texto":"No passo 2, adicione os produtos e a quantidade que vai voltar. No passo 3, confira os impostos (o contador ajuda aqui). Depois clique em \"Conferir devolução\" e em \"Emitir NF-e de devolução\".","dica":"","atencao":"A nota de devolução vale para a Receita. Use \"Salvar rascunho\" se ainda for confirmar algo com o contador.","img":"img-web/devolucao-fornecedor/passo-3.webp","semPrint":false}]},{"id":"agente-fiscal-ia","grupo":"Fiscal","titulo":"Agente Fiscal IA (tirar dúvidas fiscais)","resumo":"Pergunte sobre CFOP, NCM, impostos e NF-e, e converta o CFOP das notas de compra.","antes":"","destaque":false,"video":"videos-web/agente-fiscal-ia.mp4","capa":"videos-web/agente-fiscal-ia.jpg","passos":[{"titulo":"Converter o CFOP de entrada","texto":"Em Fiscal › Agente Fiscal IA, digite o CFOP que veio na nota do fornecedor (ex.: 5102) e escolha a finalidade. O sistema mostra o CFOP de entrada certo.","dica":"","atencao":"","img":"img-web/agente-fiscal-ia/passo-1.webp","semPrint":false},{"titulo":"Pergunte o que quiser","texto":"Escreva sua dúvida (ex.: \"Qual CFOP uso para venda para outro estado?\") e aperte Enter. A resposta mostra as fontes.","dica":"","atencao":"A IA orienta, mas confirme com o seu contador antes de aplicar.","img":"img-web/agente-fiscal-ia/passo-2.webp","semPrint":false}]},{"id":"entrada-nfe","grupo":"Estoque","titulo":"Dar entrada na nota do fornecedor (NF-e)","resumo":"As notas de compra chegam sozinhas da SEFAZ: confira e importe no estoque.","antes":"Precisa do certificado digital cadastrado. Sem ele, use o botão \"Importar XML\" com o arquivo que o fornecedor mandou.","destaque":false,"video":"videos-web/entrada-nfe.mp4","capa":"videos-web/entrada-nfe.jpg","passos":[{"titulo":"Abra \"Entrada de NF-e\"","texto":"No menu, clique em Estoque › Entrada de NF-e. Aparecem as notas que os fornecedores emitiram para o CNPJ da sua loja.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-1.webp","semPrint":false},{"titulo":"Busque novas notas","texto":"Clique em \"Atualizar agora\" para buscar as notas mais recentes na SEFAZ. As notas novas aparecem na lista com o fornecedor, a data e o valor.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-2.webp","semPrint":false},{"titulo":"Encontre a nota","texto":"Digite o nome do fornecedor, o CNPJ ou o número da nota no campo de busca.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Importar\"","texto":"Na linha da nota, clique em \"Importar\" (se pedir, confirme em \"Confirmar e importar\"). Depois é só seguir as etapas: fornecedor, produtos e financeiro. No final, o estoque e o contas a pagar são atualizados.","dica":"Use o ícone \"Visualizar\" para ver a nota antes de importar.","atencao":"","img":"img-web/entrada-nfe/passo-4.webp","semPrint":false},{"titulo":"Recebeu o XML por e-mail? Importe o arquivo","texto":"Se a nota não apareceu na lista, clique em \"Importar XML\" e escolha o arquivo .xml que o fornecedor mandou.","dica":"","atencao":"","img":"img-web/entrada-nfe/passo-5.webp","semPrint":false}]},{"id":"entrada-manual","grupo":"Estoque","titulo":"Entrada manual de mercadoria (sem nota)","resumo":"Lance uma compra à mão: produtos, pagamento e preço de venda.","antes":"O fornecedor e os produtos podem ser cadastrados na hora, dentro da própria entrada.","destaque":false,"video":"videos-web/entrada-manual.mp4","capa":"videos-web/entrada-manual.jpg","passos":[{"titulo":"Clique em \"Nova entrada\"","texto":"No menu, clique em Estoque › Entrada Manual e depois em \"Nova entrada\" (atalho F1).","dica":"","atencao":"","img":"img-web/entrada-manual/passo-1.webp","semPrint":false},{"titulo":"Escolha o fornecedor","texto":"Digite o nome do fornecedor, use a seta para baixo e aperte Enter. Se ele não existe, clique em \"+ Cadastrar\".","dica":"","atencao":"","img":"img-web/entrada-manual/passo-2.webp","semPrint":false},{"titulo":"Lance os produtos","texto":"Digite o nome, código ou passe o código de barras e aperte Enter. Para cada produto, informe a quantidade e o custo unitário.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-3.webp","semPrint":false},{"titulo":"Informe o pagamento","texto":"Clique em \"2. Pagamento\", escolha a forma (à vista, boleto, a prazo) e as parcelas. As parcelas viram contas a pagar.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-4.webp","semPrint":false},{"titulo":"Confira os preços de venda","texto":"Em \"3. Custos\", veja o novo custo de cada produto. Você pode aplicar uma margem para todos ou manter os preços atuais.","dica":"","atencao":"","img":"img-web/entrada-manual/passo-5.webp","semPrint":false},{"titulo":"Clique em \"Gerar entrada\"","texto":"Tudo certo? Clique em \"Gerar entrada\" (F1). O estoque sobe na hora. Se ainda não terminou, use \"Salvar em aberto\" (F2) e continue depois.","dica":"Depois de gerar, use \"Imprimir etiquetas\" para etiquetar os produtos que chegaram.","atencao":"","img":"img-web/entrada-manual/passo-6.webp","semPrint":false}]},{"id":"ajuste-estoque","grupo":"Estoque","titulo":"Corrigir estoque e preços (ajuste)","resumo":"Acerte a quantidade em estoque e os preços de vários produtos de uma vez.","antes":"","destaque":false,"video":"videos-web/ajuste-estoque.mp4","capa":"videos-web/ajuste-estoque.jpg","passos":[{"titulo":"Abra \"Ajuste de Estoque\"","texto":"No menu, clique em Estoque › Ajuste de Estoque.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-1.webp","semPrint":false},{"titulo":"Ache o produto","texto":"Digite o nome ou código do produto. Os botões \"Estoque negativo\" e \"Estoque zerado\" mostram só os produtos com problema.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-2.webp","semPrint":false},{"titulo":"Digite o novo estoque","texto":"Na coluna \"Novo estoque\", digite a quantidade certa (a que você contou na prateleira). Se quiser, mude também o custo e o preço de venda.","dica":"","atencao":"","img":"img-web/ajuste-estoque/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar alterações\"","texto":"Clique em \"Salvar alterações\". O número entre parênteses mostra quantos produtos você mudou. O valor antigo fica guardado no histórico.","dica":"Errou? Clique em \"Desfazer alterações não salvas\" antes de salvar.","atencao":"","img":"img-web/ajuste-estoque/passo-4.webp","semPrint":false}]},{"id":"etiquetas","grupo":"Estoque","titulo":"Imprimir etiquetas de preço","resumo":"Escolha o modelo, marque os produtos e imprima.","antes":"","destaque":false,"video":"videos-web/etiquetas.mp4","capa":"videos-web/etiquetas.jpg","passos":[{"titulo":"Escolha o tipo de etiqueta","texto":"No menu, clique em Estoque › Etiquetas. Escolha: etiqueta de código (código de barras), de produto ou de gôndola (prateleira).","dica":"","atencao":"","img":"img-web/etiquetas/passo-1.webp","semPrint":false},{"titulo":"Escolha o modelo","texto":"Clique no modelo do papel de etiqueta que você usa (o tamanho aparece em milímetros).","dica":"","atencao":"","img":"img-web/etiquetas/passo-2.webp","semPrint":false},{"titulo":"Busque os produtos","texto":"Digite o nome ou código, ou passe o leitor no código de barras. Para etiquetar o que mudou de preço, use o filtro \"Preço alterado por data\".","dica":"","atencao":"","img":"img-web/etiquetas/passo-3.webp","semPrint":false},{"titulo":"Marque e diga quantas etiquetas","texto":"Marque cada produto e digite quantas etiquetas quer dele. Depois clique em \"Conferir etiquetas\".","dica":"","atencao":"","img":"img-web/etiquetas/passo-4.webp","semPrint":false},{"titulo":"Imprima","texto":"Confira a prévia. Na primeira vez, use \"Imprimir uma de teste\" para ver se ficou alinhado. Depois clique em \"Imprimir etiquetas\".","dica":"Já usou parte da folha? Marque \"Pular posições já usadas na primeira folha\" para não desperdiçar etiqueta.","atencao":"","img":"img-web/etiquetas/passo-5.webp","semPrint":false}]},{"id":"perdas-e-consumo","grupo":"Estoque","titulo":"Perdas e uso/consumo (baixa de estoque)","resumo":"Dê baixa em produto quebrado, vencido ou usado na própria loja.","antes":"","destaque":false,"video":"videos-web/perdas-e-consumo.mp4","capa":"videos-web/perdas-e-consumo.jpg","passos":[{"titulo":"Clique em \"Nova movimentação\"","texto":"Em Estoque › Perdas e Uso/Consumo, clique em \"Nova movimentação\".","dica":"","atencao":"","img":"img-web/perdas-e-consumo/passo-1.webp","semPrint":false},{"titulo":"Tipo, motivo e produtos","texto":"Escolha \"Perda\" (quebrou, venceu, sumiu) ou \"Uso e consumo\" (usado na loja). Escreva o motivo, busque os produtos e informe a quantidade.","dica":"","atencao":"","img":"img-web/perdas-e-consumo/passo-2.webp","semPrint":false},{"titulo":"Confira e confirme","texto":"Clique em \"Conferir movimentação\", veja o resumo e clique em \"Confirmar baixa pelo custo\". O estoque baixa e o custo entra no relatório.","dica":"Lançou errado? Clique em \"Excluir\" na linha da movimentação, escreva o motivo e confirme: o estoque volta e o custo sai do relatório.","atencao":"","img":"img-web/perdas-e-consumo/passo-3.webp","semPrint":false}]},{"id":"lista-a-comprar","grupo":"Estoque","titulo":"Lista \"A comprar\"","resumo":"A equipe anota o que está faltando; quem compra marca o que comprou e quando chegou.","antes":"","destaque":false,"video":"videos-web/lista-a-comprar.mp4","capa":"videos-web/lista-a-comprar.jpg","passos":[{"titulo":"Anote o que está faltando","texto":"Em Estoque › A comprar, digite o produto (do cadastro ou um novo), a quantidade e uma observação. Se for urgente, clique em \"Urgente\". Clique em \"Lançar\".","dica":"","atencao":"","img":"img-web/lista-a-comprar/passo-1.webp","semPrint":false},{"titulo":"Errou? Clique no lápis para editar","texto":"Para corrigir um item (nome, quantidade, observação ou urgente), clique no lápis \"Editar\" na linha dele, mude o que precisa e clique em \"Salvar\". Nos itens já comprados dá para corrigir também a quantidade comprada e os preços.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Comprou? Marque \"Comprei\"","texto":"Na aba \"Falta comprar\", clique em \"Comprei\" no item, escolha o fornecedor e confira quantidade e preços.","dica":"","atencao":"","img":"img-web/lista-a-comprar/passo-3.webp","semPrint":false},{"titulo":"Chegou? Vira entrada no estoque","texto":"Qua
