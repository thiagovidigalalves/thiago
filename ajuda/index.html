ndo a mercadoria chegar, clique em \"Chegou\". Os itens comprados também podem virar uma entrada manual já preenchida, com \"Transformar em entrada manual\".","dica":"Quando você lança a nota (XML) ou a entrada manual do produto, ele passa para \"Chegou\" sozinho.","atencao":"","img":"img-web/lista-a-comprar/passo-4.webp","semPrint":false}]},{"id":"preco-e-compra-inteligente","grupo":"Estoque","titulo":"Preço inteligente e compra inteligente","resumo":"Ache produtos vendidos no prejuízo e saiba o que comprar antes que acabe.","antes":"Ligue os recursos em Configurações › Recursos inteligentes.","destaque":false,"video":"videos-web/preco-e-compra-inteligente.mp4","capa":"videos-web/preco-e-compra-inteligente.jpg","passos":[{"titulo":"Preço inteligente: corrija o prejuízo","texto":"Em Estoque › Preço inteligente aparecem os produtos vendidos com prejuízo ou margem baixa. Confira o \"Preço novo\" sugerido, marque os produtos e clique em \"Aplicar\".","dica":"","atencao":"","img":"img-web/preco-e-compra-inteligente/passo-1.webp","semPrint":false},{"titulo":"Compra inteligente: o que vai faltar","texto":"Em Estoque › Compra inteligente, informe em quantos dias o fornecedor entrega e para quantos dias quer comprar. Clique em \"Calcular\".","dica":"","atencao":"","img":"img-web/preco-e-compra-inteligente/passo-2.webp","semPrint":false},{"titulo":"Mande o pedido ao fornecedor","texto":"O sistema separa os produtos por fornecedor, com a quantidade sugerida. Ajuste o que quiser e clique em \"Pedir no WhatsApp\" (ou \"Copiar\").","dica":"A conta usa o ritmo de vendas dos últimos 90 dias.","atencao":"","img":"img-web/preco-e-compra-inteligente/passo-3.webp","semPrint":false}]},{"id":"relatorio-caixas-dre","grupo":"Relatórios","titulo":"Ver o lucro do mês (DRE) e o relatório de caixas","resumo":"Descubra se a loja deu lucro e confira o dinheiro de cada caixa.","antes":"","destaque":false,"video":"videos-web/relatorio-caixas-dre.mp4","capa":"videos-web/relatorio-caixas-dre.jpg","passos":[{"titulo":"Abra o DRE","texto":"No menu, clique em Relatórios › Financeiro › DRE. Ele mostra vendas, custo das mercadorias, despesas e o lucro líquido.","dica":"","atencao":"","img":"img-web/relatorio-caixas-dre/passo-1.webp","semPrint":false},{"titulo":"Escolha o mês","texto":"Clique em \"Mês atual\" ou \"Mês anterior\". O quadro \"Lucro líquido\" diz quanto sobrou de verdade.","dica":"Para o DRE ficar certo, os produtos precisam ter preço de custo e as despesas precisam estar com o plano de contas preenchido.","atencao":"","img":"img-web/relatorio-caixas-dre/passo-2.webp","semPrint":false},{"titulo":"Relatório de Caixas","texto":"Em Relatórios › Caixas › Relatório de Caixa você vê o que entrou, saiu e o dinheiro que deveria estar na gaveta. Clique num caixa para ver os detalhes.","dica":"","atencao":"","img":"img-web/relatorio-caixas-dre/passo-3.webp","semPrint":false}]},{"id":"relatorios-de-vendas","grupo":"Relatórios","titulo":"Relatórios de vendas: BI, faturamento, comparativo e Curva ABC","resumo":"Veja quanto vendeu, quanto sobrou de verdade, se cresceu e quais produtos mais vendem.","antes":"","destaque":false,"video":"videos-web/relatorios-de-vendas.mp4","capa":"videos-web/relatorios-de-vendas.jpg","passos":[{"titulo":"BI Vendas: quanto vendeu e como pagaram","texto":"Em Relatórios › Vendas › BI Vendas escolha o período nos filtros do alto. Os gráficos mostram as vendas por forma de pagamento e por situação. Clique numa fatia para filtrar.","dica":"O botão \"Imprimir\" gera o relatório para guardar em PDF.","atencao":"","img":"img-web/relatorios-de-vendas/passo-1.webp","semPrint":false},{"titulo":"Faturamento: do bruto ao líquido","texto":"Em Relatórios › Vendas › Faturamento você vê o que vendeu, os descontos e taxas, e quanto ficou de verdade. Escolha o período nos botões do alto; ele compara sozinho com o período anterior.","dica":"","atencao":"","img":"img-web/relatorios-de-vendas/passo-2.webp","semPrint":false},{"titulo":"Comparativo: vendeu mais ou menos?","texto":"Em Comparativo de Vendas, clique em \"Mês × anterior\" (ou \"Semana × anterior\", \"Ano × anterior\"). Os cartões mostram faturamento, quantidade de vendas, ticket médio e o crescimento.","dica":"Use \"Personalizado\" para comparar quaisquer datas, por exemplo a Black Friday deste ano com a do ano passado.","atencao":"","img":"img-web/relatorios-de-vendas/passo-3.webp","semPrint":false},{"titulo":"Curva ABC: os produtos que mais trazem dinheiro","texto":"Em Curva ABC, os produtos \"A\" são os poucos que trazem a maior parte do faturamento; os \"C\" quase não vendem. Classifique por faturamento, quantidade ou lucro.","dica":"Nunca deixe faltar os produtos da classe A. Os da classe C são bons para promoção.","atencao":"","img":"img-web/relatorios-de-vendas/passo-4.webp","semPrint":false}]},{"id":"metas-por-vendedor","grupo":"Relatórios","titulo":"Metas do mês por vendedor","resumo":"Defina a meta de cada vendedor e acompanhe quanto falta por dia para bater.","antes":"Os vendedores precisam estar cadastrados em Cadastros › Pessoas › Usuários.","destaque":false,"video":"videos-web/metas-por-vendedor.mp4","capa":"videos-web/metas-por-vendedor.jpg","passos":[{"titulo":"Abra \"Metas por vendedor\"","texto":"No menu, clique em Relatórios › Vendas › Metas por vendedor. Aparece quanto cada um já vendeu no mês e o ritmo.","dica":"","atencao":"","img":"img-web/metas-por-vendedor/passo-1.webp","semPrint":false},{"titulo":"Digite a meta de cada vendedor","texto":"Na coluna \"Meta do mês\", digite o valor da meta do vendedor e aperte Enter para salvar.","dica":"No mês seguinte, use \"Copiar do mês anterior\" para repetir as metas sem digitar tudo de novo.","atencao":"","img":"img-web/metas-por-vendedor/passo-2.webp","semPrint":false},{"titulo":"Acompanhe a projeção e o \"falta por dia\"","texto":"\"Projeção do mês\" mostra quanto a loja vai vender se continuar no ritmo de hoje. \"Falta por dia\" diz quanto precisa vender por dia para bater a meta.","dica":"","atencao":"","img":"img-web/metas-por-vendedor/passo-3.webp","semPrint":false}]},{"id":"relatorios-financeiros","grupo":"Relatórios","titulo":"Relatórios financeiros: fluxo de caixa, gastos e comparativo","resumo":"Veja o dinheiro que entrou e saiu, o que pagou e se o mês foi melhor que o anterior.","antes":"","destaque":false,"video":"videos-web/relatorios-financeiros.mp4","capa":"videos-web/relatorios-financeiros.jpg","passos":[{"titulo":"Fluxo de Caixa: o que entrou e saiu de verdade","texto":"Em Relatórios › Financeiro › Fluxo de Caixa escolha as datas. Crediário e boleto só entram quando o cliente paga. Troque entre \"Detalhado\" e \"Resumo\".","dica":"O botão \"PDF\" gera o relatório para mandar ao contador.","atencao":"","img":"img-web/relatorios-financeiros/passo-1.webp","semPrint":false},{"titulo":"Relatório de Contas a Pagar: para onde foi o dinheiro","texto":"Veja os gastos pagos e a pagar por plano de contas, fornecedor ou funcionário. O botão \"Fixas\" mostra só as despesas que se repetem todo mês.","dica":"","atencao":"","img":"img-web/relatorios-financeiros/passo-2.webp","semPrint":false},{"titulo":"Comparativo Financeiro: este mês × mês passado","texto":"Clique em \"Este mês × mês passado\" (ou outro atalho). O sistema mostra se faturamento e entradas melhoraram ou pioraram.","dica":"","atencao":"","img":"img-web/relatorios-financeiros/passo-3.webp","semPrint":false}]},{"id":"relatorios-de-clientes","grupo":"Relatórios","titulo":"Conhecer seus clientes: resumo, CRM e aniversariantes","resumo":"Descubra os melhores clientes, quem sumiu, quem faz aniversário e chame pelo WhatsApp.","antes":"","destaque":false,"video":"videos-web/relatorios-de-clientes.mp4","capa":"videos-web/relatorios-de-clientes.jpg","passos":[{"titulo":"Resumo de Clientes","texto":"Em Relatórios › Clientes › Resumo de Clientes escolha o período (\"Mês\", \"Ano\"...). Aparecem os melhores clientes, os que compram pouco e os que mais atrasam pagamento.","dica":"","atencao":"","img":"img-web/relatorios-de-clientes/passo-1.webp","semPrint":false},{"titulo":"CRM: clientes para chamar de volta","texto":"No CRM de Clientes, a aba \"Oportunidades\" mostra quem já devia ter voltado a comprar e quanto isso vale. Marque os clientes e clique em \"Enviar WhatsApp\".","dica":"O link \"Personalizar mensagens\" deixa você mudar o texto que vai para o cliente.","atencao":"","img":"img-web/relatorios-de-clientes/passo-2.webp","semPrint":false},{"titulo":"Aniversariantes: mande os parabéns","texto":"Escolha \"Hoje\", \"Semana\" ou \"Mês\". Marque os clientes (ou \"Marcar todos\") e clique em \"Enviar para marcados\" para mandar os parabéns pelo WhatsApp.","dica":"","atencao":"","img":"img-web/relatorios-de-clientes/passo-3.webp","semPrint":false},{"titulo":"Mensagens enviadas: chegou ou não?","texto":"Em WhatsApp › Mensagens enviadas você vê cada mensagem que o sistema mandou (venda, cobrança, aniversário...) e se foi entregue ou lida.","dica":"","atencao":"","img":"img-web/relatorios-de-clientes/passo-4.webp","semPrint":false}]},{"id":"pos-venda-agradecer","grupo":"Relatórios","titulo":"Agradecer cada compra (Pós-Venda)","resumo":"Mande o \"obrigado pela compra\" no WhatsApp e veja quem ainda falta.","antes":"","destaque":false,"video":"videos-web/pos-venda-agradecer.mp4","capa":"videos-web/pos-venda-agradecer.jpg","passos":[{"titulo":"Escolha o período","texto":"Em Relatórios › Clientes › Pós-Venda, clique em \"Hoje\", \"Ontem\", \"7 dias\" ou \"30 dias\". Os cartões mostram quantas vendas já foram agradecidas e quantas faltam.","dica":"","atencao":"","img":"img-web/pos-venda-agradecer/passo-1.webp","semPrint":false},{"titulo":"Envie o agradecimento","texto":"Marque \"Só pendentes\" e clique no botão de WhatsApp em cada venda. A mensagem já vai pronta; depois ela aparece como \"Enviado\".","dica":"Para o sistema mandar sozinho, ligue a régua em WhatsApp › Pós-venda.","atencao":"","img":"img-web/pos-venda-agradecer/passo-2.webp","semPrint":false}]},{"id":"relatorios-de-estoque","grupo":"Relatórios","titulo":"Relatórios de estoque: movimentação e alertas","resumo":"Veja toda entrada e saída de um produto e o que precisa de atenção no estoque.","antes":"","destaque":false,"video":"videos-web/relatorios-de-estoque.mp4","capa":"videos-web/relatorios-de-estoque.jpg","passos":[{"titulo":"Movimentação: por que o estoque mudou?","texto":"Em Relatórios › Estoque › Movimentação, digite o produto e clique em \"Pesquisar\". Aparece cada entrada e saída, com a data e o documento (venda, nota, ajuste...).","dica":"","atencao":"","img":"img-web/relatorios-de-estoque/passo-1.webp","semPrint":false},{"titulo":"Alertas de estoque","texto":"Os cartões mostram produtos com estoque negativo, no mínimo, vendidos abaixo do custo ou com margem baixa. Clique em \"Ver produtos\" num cartão para ver a lista.","dica":"","atencao":"","img":"img-web/relatorios-de-estoque/passo-2.webp","semPrint":false},{"titulo":"Corrija na hora","texto":"Na lista \"Produtos que precisam de atenção\", clique em \"Ajustar\" no produto: abre o Ajuste de Estoque para você acertar a quantidade ou o preço.","dica":"","atencao":"","img":"img-web/relatorios-de-estoque/passo-3.webp","semPrint":false}]},{"id":"comissoes","grupo":"Relatórios","titulo":"Comissões dos funcionários","resumo":"Veja quanto cada vendedor e técnico vendeu e quanto ganhou de comissão.","antes":"A porcentagem de comissão é definida no cadastro de cada funcionário (Cadastros › Pessoas › Usuários).","destaque":false,"video":"videos-web/comissoes.mp4","capa":"videos-web/comissoes.jpg","passos":[{"titulo":"Escolha o período","texto":"Em Relatórios › Funcionários › Comissões, clique em \"Este mês\" ou \"Mês passado\" (o mais comum para pagar a comissão).","dica":"","atencao":"","img":"img-web/comissoes/passo-1.webp","semPrint":false},{"titulo":"Veja quanto cada um ganhou","texto":"Os blocos \"Vendedores\" e \"Técnicos/Mecânicos\" mostram o total de cada pessoa. Clique na pessoa para ver venda por venda.","dica":"O selo \"Bate com o Dashboard\" confirma que os números estão certos.","atencao":"","img":"img-web/comissoes/passo-2.webp","semPrint":false}]},{"id":"relatorios-de-servicos","grupo":"Relatórios","titulo":"Relatórios de serviços: OS por técnico, BI OS e comparativo","resumo":"Veja quanto cada técnico produziu e se a oficina está fazendo mais ou menos serviços.","antes":"","destaque":false,"video":"videos-web/relatorios-de-servicos.mp4","capa":"videos-web/relatorios-de-servicos.jpg","passos":[{"titulo":"OS por técnico","texto":"Em Relatórios › Serviços › OS por técnico, escolha o período e o técnico. Aparecem quantas OS, serviços e peças cada um fez.","dica":"","atencao":"","img":"img-web/relatorios-de-servicos/passo-1.webp","semPrint":false},{"titulo":"BI OS: a visão do gerente","texto":"O BI OS mostra o resultado das ordens de serviço: total, quanto foi peça e quanto foi serviço, e quanto cada profissional produziu. Escolha o período e clique em \"Aplicar filtros\".","dica":"\"Imprimir BI\" gera o relatório para guardar.","atencao":"","img":"img-web/relatorios-de-servicos/passo-2.webp","semPrint":false},{"titulo":"Comparativo de serviços","texto":"Clique em \"Este mês × mês passado\". O sistema compara os dois períodos por serviço, por técnico e por peça. Clique numa linha para ver o detalhe no BI OS.","dica":"","atencao":"","img":"img-web/relatorios-de-servicos/passo-3.webp","semPrint":false}]},{"id":"trocas-e-devolucoes","grupo":"Relatórios","titulo":"Trocas e devoluções","resumo":"Veja quais produtos mais voltam e quanto dinheiro voltou para os clientes.","antes":"","destaque":false,"video":"videos-web/trocas-e-devolucoes.mp4","capa":"videos-web/trocas-e-devolucoes.jpg","passos":[{"titulo":"Abra \"Trocas e devoluções\"","texto":"No menu, clique em Relatórios › Vendas › Trocas e devoluções. Escolha o período (\"Este mês\", \"3 meses\", \"12 meses\").","dica":"","atencao":"","img":"img-web/trocas-e-devolucoes/passo-1.webp","semPrint":false},{"titulo":"Veja o que mais volta","texto":"Os cartões mostram quantas trocas e devoluções teve, o valor que voltou e quanto isso pesa nas vendas. Embaixo aparecem os produtos que mais voltam.","dica":"Produto que volta muito pode ter defeito de fábrica: fale com o fornecedor.","atencao":"","img":"img-web/trocas-e-devolucoes/passo-2.webp","semPrint":false}]},{"id":"dados-da-empresa","grupo":"Configurações","titulo":"Dados da empresa e logo","resumo":"Preencha CNPJ, endereço, contatos e o logo que saem nos comprovantes.","antes":"","destaque":false,"video":"videos-web/dados-da-empresa.mp4","capa":"videos-web/dados-da-empresa.jpg","passos":[{"titulo":"Abra \"Dados da Empresa\"","texto":"No menu, clique em Configurações › Dados da Empresa.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-1.webp","semPrint":false},{"titulo":"Busque pelo CNPJ","texto":"Digite o CNPJ e clique em \"Buscar CNPJ\": razão social e endereço são preenchidos sozinhos.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-2.webp","semPrint":false},{"titulo":"Coloque o logo","texto":"Em \"Logo da empresa\", envie a imagem do seu logo. Ele aparece nos comprovantes, orçamentos e PDFs.","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar configurações\"","texto":"Confira telefone, WhatsApp e e-mail e clique em \"Salvar configurações\".","dica":"","atencao":"","img":"img-web/dados-da-empresa/passo-4.webp","semPrint":false}]},{"id":"impressoras","grupo":"Configurações","titulo":"Configurar a impressora de cupom","resumo":"Cadastre a impressora (cupom 80mm ou A4) e escolha se imprime sozinho.","antes":"A impressora precisa estar instalada e compartilhada no Windows.","destaque":false,"video":"videos-web/impressoras.mp4","capa":"videos-web/impressoras.jpg","passos":[{"titulo":"Clique em \"Nova impressora\"","texto":"No menu, clique em Configurações › Impressoras e depois em \"Nova impressora\".","dica":"","atencao":"","img":"img-web/impressoras/passo-1.webp","semPrint":false},{"titulo":"Apelido e impressora","texto":"Dê um apelido (ex.: Cupom Balcão) e escolha a impressora. No aplicativo TH Gestor, o botão \"Listar\" mostra as impressoras do computador.","dica":"","atencao":"","img":"img-web/impressoras/passo-2.webp","semPrint":false},{"titulo":"Formato e comportamento","texto":"Escolha \"Bobina (cupom 80mm)\" ou \"Folha A4\", e se nas vendas o sistema deve perguntar, imprimir direto ou não imprimir.","dica":"","atencao":"","img":"img-web/impressoras/passo-3.webp","semPrint":false},{"titulo":"Salve e teste","texto":"Ligue \"Impressora padrão\" e clique em \"Salvar\". Depois use o botão \"Imprimir teste\" na lista para conferir.","dica":"","atencao":"","img":"img-web/impressoras/passo-4.webp","semPrint":false}]},{"id":"temas","grupo":"Configurações","titulo":"Mudar as cores do sistema (temas)","resumo":"Escolha a paleta de cores do painel da sua empresa.","antes":"","destaque":false,"video":"videos-web/temas.mp4","capa":"videos-web/temas.jpg","passos":[{"titulo":"Escolha um tema","texto":"Em Configurações › Temas, clique no cartão do tema que preferir (Azul, Premium Slim, Thiago Elite ou Vermelho). Ele já é aplicado e salvo na hora; o tema ativo fica com o ✓.","dica":"O PDV mantém o visual dele. Para a tela escura, use o botão \"Modo escuro\" no rodapé do menu.","atencao":"","img":"img-web/temas/passo-1.webp","semPrint":false}]},{"id":"whatsapp","grupo":"WhatsApp","titulo":"Conectar o WhatsApp e editar as mensagens","resumo":"Ligue o WhatsApp da loja ao sistema e personalize as mensagens enviadas.","antes":"Tenha em mãos o celular com o WhatsApp da empresa.","destaque":false,"video":"videos-web/whatsapp.mp4","capa":"videos-web/whatsapp.jpg","passos":[{"titulo":"Abra as configurações do WhatsApp","texto":"No menu, clique em WhatsApp › Configurações e mensagens.","dica":"","atencao":"","img":"img-web/whatsapp/passo-1.webp","semPrint":false},{"titulo":"Conecte pelo QR Code","texto":"Clique em \"Conectar WhatsApp\". No celular, abra o WhatsApp › Aparelhos conectados › Conectar aparelho e aponte a câmera para o QR Code.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Escolha o que sai automático","texto":"Em \"Envio automático\", diga se o comprovante da venda e o orçamento vão sozinhos pro cliente ou só quando você clicar. O aviso da OS fica em WhatsApp › Ordem de serviço.","dica":"","atencao":"","img":"img-web/whatsapp/passo-3.webp","semPrint":false},{"titulo":"Edite as mensagens","texto":"Clique na aba do assunto (Fiscal e contador, Comercial e vendas, Cobranças, Relacionamento ou Pós-venda e avaliação), mude o texto e clique em \"Salvar mensagens\".","dica":"Abra \"Campos disponíveis\" para colocar o nome do cliente, valor e outros dados automáticos na mensagem.","atencao":"","img":"img-web/whatsapp/passo-4.webp","semPrint":false}]},{"id":"whatsapp-automatico","grupo":"WhatsApp","titulo":"Mensagens automáticas: cobrança, pós-venda e aniversário","resumo":"Ligue a régua e o sistema avisa vencimentos, agradece compras e manda parabéns sozinho.","antes":"Para enviar sozinho, conecte o WhatsApp da loja (veja \"Conectar o WhatsApp\").","destaque":false,"video":"videos-web/whatsapp-automatico.mp4","capa":"videos-web/whatsapp-automatico.jpg","passos":[{"titulo":"Cobranças: lembra antes e cobra depois","texto":"Em WhatsApp › Cobranças, ligue \"Régua ligada\" e escolha \"Enviar sozinho\". Aparece a lista \"Para hoje\" com quem vai receber mensagem.","dica":"Use \"Desta semana\" ou \"Tudo em atraso\" para cobrar mais gente de uma vez.","atencao":"","img":"img-web/whatsapp-automatico/passo-1.webp","semPrint":false},{"titulo":"Configure os dias e o texto","texto":"Clique em \"Configurar\" para escolher a hora do envio, quantos dias antes e depois do vencimento a mensagem sai e o texto de cada etapa.","dica":"","atencao":"","img":"img-web/whatsapp-automatico/passo-2.webp","semPrint":false},{"titulo":"Pós-venda: agradecer e pedir avaliação","texto":"Em WhatsApp › Pós-venda, ligue a régua. Alguns dias depois da compra o cliente recebe um agradecimento e pode dar uma nota de 0 a 10 para a loja.","dica":"","atencao":"","img":"img-web/whatsapp-automatico/passo-3.webp","semPrint":false},{"titulo":"Aniversários: parabéns automático","texto":"Em WhatsApp › Aniversários, ligue a régua e o cliente recebe os parabéns no dia do aniversário.","dica":"O aniversário precisa estar no cadastro do cliente.","atencao":"","img":"img-web/whatsapp-automatico/passo-4.webp","semPrint":false}]},{"id":"whatsapp-ordem-servico","grupo":"WhatsApp","titulo":"Avisar o cliente da OS pelo WhatsApp","resumo":"Escolha se o cliente recebe mensagem quando a OS muda de status e edite o texto.","antes":"","destaque":false,"video":"videos-web/whatsapp-ordem-servico.mp4","capa":"videos-web/whatsapp-ordem-servico.jpg","passos":[{"titulo":"Quando a OS muda de status","texto":"Em WhatsApp › Ordem de serviço, escolha \"Enviar automático\" (o cliente recebe sozinho), \"Abrir telinha para enviar\" ou \"Não avisar\". Depois marque em quais status avisar (ex.: Pronto para retirar) e clique em \"Salvar status\".","dica":"","atencao":"","img":"img-web/whatsapp-ordem-servico/passo-1.webp","semPrint":false},{"titulo":"Edite as mensagens","texto":"Em \"3. Mensagens da OS\", mude o texto. Use os campos entre chaves, como {nome}, {numero} e {status}, que o sistema troca sozinho. Clique em \"Salvar mensagens\".","dica":"","atencao":"","img":"img-web/whatsapp-ordem-servico/passo-2.webp","semPrint":false}]},{"id":"avaliacoes","grupo":"WhatsApp","titulo":"Avaliações dos clientes (pesquisa de satisfação)","resumo":"Veja a nota que os clientes dão à loja e chame quem ficou insatisfeito.","antes":"Ligue a \"Pesquisa de satisfação\" em Configurações › Recursos inteligentes.","destaque":false,"video":"videos-web/avaliacoes.mp4","capa":"videos-web/avaliacoes.jpg","passos":[{"titulo":"Veja a nota da loja","texto":"Em WhatsApp › Avaliações, escolha o período. O NPS mostra quantos clientes recomendariam a loja; aparecem também a nota média e o que mais incomoda.","dica":"","atencao":"","img":"img-web/avaliacoes/passo-1.webp","semPrint":false},{"titulo":"Recupere quem ficou insatisfeito","texto":"Em \"Recuperar clientes\", clique em \"Chamar\" para falar com o cliente pelo WhatsApp. Resolveu? Clique em \"Resolvido\".","dica":"Cliente bem atendido depois de uma reclamação costuma virar fã da loja.","atencao":"","img":"img-web/avaliacoes/passo-2.webp","semPrint":false}]},{"id":"configuracoes-ordem-servico","grupo":"Configurações","titulo":"Configurar a Ordem de Serviço","resumo":"Numeração, garantia, impressão, etiqueta e WhatsApp automático para técnico e cliente.","antes":"","destaque":false,"video":"videos-web/configuracoes-ordem-servico.mp4","capa":"videos-web/configuracoes-ordem-servico.jpg","passos":[{"titulo":"Escolha o assunto no menu","texto":"Em Configurações › Ordem de Serviço, o menu de cima separa os assuntos: Geral, Impressão, Etiqueta, WhatsApp, Agenda, Atrasos e Dias.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-1.webp","semPrint":false},{"titulo":"Geral: número, garantia e equipamento","texto":"Em \"Geral\" você define o próximo número de OS, o termo de garantia que sai no PDF e se o equipamento é obrigatório ou opcional na OS.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-2.webp","semPrint":false},{"titulo":"Impressão e etiqueta","texto":"Em \"Impressão\" escolha A4 ou bobina e se a OS imprime sozinha ao salvar. Em \"Etiqueta\" escolha se a etiqueta da OS sai junto, sozinha ou só pelo ícone.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-3.webp","semPrint":false},{"titulo":"WhatsApp, agenda e atrasos do técnico","texto":"Em \"WhatsApp\" escolha se o técnico e/ou o cliente recebem mensagem quando você salva uma OS nova. Em \"Agenda\" o técnico recebe a agenda do dia às 8h; em \"Atrasos\", um aviso quando a OS passar do horário.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-4.webp","semPrint":false},{"titulo":"Clique em \"Salvar configurações\"","texto":"Depois de ajustar, clique em \"Salvar configurações\" no rodapé. Vale para todas as abas.","dica":"","atencao":"","img":"img-web/configuracoes-ordem-servico/passo-5.webp","semPrint":false}]},{"id":"configuracoes-pdv","grupo":"Configurações","titulo":"Configurar o PDV (caixa)","resumo":"Caixa único ou por terminal, fechamento às cegas, vendedor na venda e impressões.","antes":"","destaque":false,"video":"videos-web/configuracoes-pdv.mp4","capa":"videos-web/configuracoes-pdv.jpg","passos":[{"titulo":"Tipo de caixa","texto":"Em Configurações › PDV, escolha \"Caixa único\" (todos os computadores somam no mesmo caixa) ou \"Caixas múltiplos\" (cada terminal tem o seu).","dica":"","atencao":"","img":"img-web/configuracoes-pdv/passo-1.webp","semPrint":false},{"titulo":"Fechamento de caixa","texto":"Escolha como o operador fecha o caixa: Simples, Conferência aberta (vê o esperado) ou Às cegas (conta sem ver o valor). Você também escolhe o que acontece depois de fechar: imprimir, mandar no WhatsApp ou nada.","dica":"\"Às cegas\" é o mais seguro: o operador informa o que contou e o sistema mostra a diferença para o gerente.","atencao":"","img":"img-web/configuracoes-pdv/passo-2.webp","semPrint":false},{"titulo":"Impressões","texto":"Em \"Impressões\" ajuste o comprovante da venda (formato e duas vias), o recibo de recebimento e quando perguntar sobre o cupom fiscal.","dica":"","atencao":"","img":"img-web/configuracoes-pdv/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar\"","texto":"Confira e clique em \"Salvar\". Os caixas abertos pegam a mudança na próxima venda.","dica":"","atencao":"","img":"img-web/configuracoes-pdv/passo-4.webp","semPrint":false}]},{"id":"configuracao-fiscal","grupo":"Configurações","titulo":"Configuração fiscal (para emitir notas)","resumo":"Certificado digital, regime de tributação, CFOP, série e numeração das notas.","antes":"Faça junto com o seu contador. Tenha o certificado digital A1 (arquivo e senha).","destaque":false,"video":"videos-web/configuracao-fiscal.mp4","capa":"videos-web/configuracao-fiscal.jpg","passos":[{"titulo":"Veja o que falta","texto":"Em Configurações › Fiscal, o quadro \"Pronto para emitir?\" mostra quantos passos faltam. Quando estiver tudo certo aparece \"Tudo pronto para emitir notas\".","dica":"","atencao":"","img":"img-web/configuracao-fiscal/passo-1.webp","semPrint":false},{"titulo":"Envie o certificado digital","texto":"Em \"Emissor fiscal integrado\", escolha o arquivo do certificado A1, digite a senha e clique em \"Enviar certificado\". Envie também o logo que sai na nota (DANFE).","dica":"","atencao":"","img":"img-web/configuracao-fiscal/passo-2.webp","semPrint":false},{"titulo":"Regime, CFOP, série e ambiente","texto":"Confira o regime tributário (Simples Nacional ou MEI), a tributação padrão (CSOSN, CFOP, PIS e COFINS), a série e o próximo número das notas. Comece em \"Homologação\" (teste) e passe para \"Produção\" quando o contador liberar.","dica":"","atencao":"Em \"Produção\" as notas valem de verdade para a Receita.","img":"img-web/configuracao-fiscal/passo-3.webp","semPrint":false},{"titulo":"Clique em \"Salvar configuração fiscal\"","texto":"Clique em \"Salvar configuração fiscal\" no final da página.","dica":"","atencao":"","img":"img-web/configuracao-fiscal/passo-4.webp","semPrint":false}]},{"id":"regras-de-venda-e-cobranca","grupo":"Configurações","titulo":"Regras: estoque na venda, cadastro de clientes, multa e juros","resumo":"Bloqueie venda sem estoque, evite cliente repetido e cobre multa e juros de atraso.","antes":"","destaque":false,"video":"videos-web/regras-de-venda-e-cobranca.mp4","capa":"videos-web/regras-de-venda-e-cobranca.jpg","passos":[{"titulo":"Bloquear venda sem estoque","texto":"Em Configurações › Vendas, ligue \"Bloquear vendas sem estoque\" para o sistema não deixar vender produto que não tem. Desligado, o estoque pode ficar negativo. Clique em \"Salvar configuração\".","dica":"","atencao":"","img":"img-web/regras-de-venda-e-cobranca/passo-1.webp","semPrint":false},{"titulo":"Cliente com nome ou CPF repetido","texto":"Em Configurações › Cadastros, escolha se pode cadastrar dois clientes com o mesmo nome ou o mesmo CPF/CNPJ. Clique em \"Salvar configurações\".","dica":"","atencao":"","img":"img-web/regras-de-venda-e-cobranca/passo-2.webp","semPrint":false},{"titulo":"Multa e juros de atraso","texto":"Em Configurações › Financeiro, aba \"Multa e juros\", ligue a cobrança, informe a multa (%), os juros ao mês (%) e os dias de carência. Na aba \"Avisos no caixa\", escolha se o caixa precisa da liberação do administrador para vender a quem está atrasado.","dica":"Só o administrador da empresa consegue mudar estas regras.","atencao":"","img":"img-web/regras-de-venda-e-cobranca/passo-3.webp","semPrint":false}]},{"id":"boletos","grupo":"Configurações","titulo":"Configurar boletos do banco","resumo":"Ligue a emissão de boletos com Pix pelo seu banco e defina juros, multa e desconto.","antes":"Peça ao seu banco os dados de integração da conta (o gerente sabe quais são).","destaque":false,"video":"videos-web/boletos.mp4","capa":"videos-web/boletos.jpg","passos":[{"titulo":"Escolha o banco","texto":"Em Configurações › Boletos, clique no cartão do seu banco. \"Na hora, automático\" registra o boleto na hora, sem arquivo de remessa.","dica":"","atencao":"","img":"img-web/boletos/passo-1.webp","semPrint":false},{"titulo":"Dados da conta e regras","texto":"Preencha os dados da conta (comece em \"Testes\"). Em \"Regras dos boletos\" informe juros ao mês, multa, desconto e se o boleto leva o QR Code do Pix.","dica":"","atencao":"","img":"","semPrint":true},{"titulo":"Teste e ative","texto":"Clique em \"Testar conexão\". Deu certo? Marque \"Ativar\" e clique em \"Salvar\". Depois troque para \"Produção\" para gerar boletos de verdade.","dica":"","atencao":"","img":"","semPrint":true}]},{"id":"recursos-inteligentes","grupo":"Configurações","titulo":"Recursos inteligentes (atendente IA, resumo do dia e mais)","resumo":"Ligue só as ferramentas automáticas que quiser usar.","antes":"","destaque":false,"video":"videos-web/recursos-inteligentes.mp4","capa":"videos-web/recursos-inteligentes.jpg","passos":[{"titulo":"Ligue o que quiser","texto":"Em Configurações › Recursos inteligentes, cada cartão é uma ferramenta: Atendente no WhatsApp, Orçamento pelo histórico, Cadastro pela câmera, Preço e Compra inteligente, Resumo do dia, Pesquisa de satisfação e Garantia com aviso. Use a chave para ligar ou desligar.","dica":"","atencao":"","img":"img-web/recursos-inteligentes/passo-1.webp","semPrint":false},{"titulo":"Resumo do dia no WhatsApp","texto":"Ligado o \"Resumo do dia\", informe até 5 números de WhatsApp que recebem às 19h o resumo das vendas e do caixa. Clique em \"Salvar\".","dica":"Recurso marcado \"Não liberado\"? Fale com o suporte da Thiago Informática.","atencao":"","img":"img-web/recursos-inteligentes/passo-2.webp","semPrint":false}]},{"id":"o-que-fazer-hoje","grupo":"Utilitários","titulo":"O que fazer hoje","resumo":"Um resumo do dia: OS atrasadas, contas vencendo, orçamentos e estoque acabando.","antes":"","destaque":false,"video":"videos-web/o-que-fazer-hoje.mp4","capa":"videos-web/o-que-fazer-hoje.jpg","passos":[{"titulo":"Abra \"O que fazer hoje\"","texto":"No menu, clique em Utilitários › O que fazer hoje. A tela mostra quantos assuntos precisam da sua atenção hoje.","dica":"","atencao":"","img":"img-web/o-que-fazer-hoje/passo-1.webp","semPrint":false},{"titulo":"Resolva pelos atalhos","texto":"Cada quadro tem um botão que leva direto para resolver: \"Cobrar no WhatsApp\", \"Abrir contas a pagar\", \"Mandar parabéns\", \"Ver produtos\"...","dica":"Comece o dia por esta tela: em 2 minutos você sabe tudo o que precisa fazer.","atencao":"","img":"img-web/o-que-fazer-hoje/passo-2.webp","semPrint":false}]},{"id":"lixeira-e-auditoria","grupo":"Utilit const DESTAQUES = ["vender-no-pdv","cadastrar-cliente","cadastrar-produto","emitir-nota","contas-a-receber","caixa-sangria-fechamento"];
const ICONES = {"Primeiros passos":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4\"/><path d=\"m10 17 5-5-5-5\"/><path d=\"M15 12H3\"/></svg>","Cadastros":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\"/><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/><path d=\"M9 12h6M9 16h6\"/></svg>","Comercial":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"20\" r=\"1.5\"/><circle cx=\"18\" cy=\"20\" r=\"1.5\"/><path d=\"M2 3h3l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6\"/></svg>","Financeiro":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3v3a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5\"/></svg>","Fiscal":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M8 13h8M8 17h5\"/></svg>","Estoque":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 8 12 3 3 8v8l9 5 9-5z\"/><path d=\"m3 8 9 5 9-5M12 13v8\"/></svg>","Relatórios":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 3v18h18\"/><path d=\"M8 17v-5M13 17V8M18 17v-9\"/></svg>","Configurações":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/></svg>","WhatsApp":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z\"/></svg>","Outros":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 8v4l3 2\"/></svg>"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ic = g => ICONES[g] || ICONES.Outros;
const grupos = [...new Set(TUTORIAIS.map(t => t.grupo))];
const SVG_DICA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>';
const SVG_ATEN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>';
const SVG_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

function menu(atual){
  $('#menu').innerHTML = '<a href="#" class="inicio '+(atual?'':'ativo')+'">Início</a>' + grupos.map(g =>
    '<h3>'+ic(g)+esc(g)+'</h3>' + TUTORIAIS.filter(t=>t.grupo===g).map(t =>
      '<a href="#'+t.id+'" class="'+(t.id===atual?'ativo':'')+'">'+esc(t.titulo)+'</a>').join('')).join('');
}
const passosCom = t => t.passos.length + ' passo' + (t.passos.length > 1 ? 's' : '');
function cartoes(lista, comIcone){
  if(!lista.length) return '<p class="vazio">Nenhum tutorial encontrado. Tente outra palavra, como "venda", "cliente" ou "nota".</p>';
  return '<div class="grade">'+lista.map(t =>
    '<a class="cartao" href="#'+t.id+'">'+(comIcone?'<div class="ic">'+ic(t.grupo)+'</div>':'')+'<b>'+esc(t.titulo)+'</b><span>'+esc(t.resumo)+'</span><em><i>'+passosCom(t)+'</i>'+(t.video?'<i class="v">▶ vídeo</i>':'')+'Ver tutorial →</em></a>').join('')+'</div>';
}
function inicio(filtro){
  document.body.classList.remove('lendo');
  menu('');
  const q = norm(filtro||'').split(/\s+/).filter(Boolean);
  if (q.length) {
    const lista = TUTORIAIS.filter(t => { const txt = norm([t.titulo,t.resumo,t.grupo,...t.passos.map(p=>p.titulo+' '+p.texto)].join(' ')); return q.every(w=>txt.includes(w)); });
    $('#conteudo').innerHTML = '<section class="secao"><h2 class="secao-titulo">Resultados para “'+esc(filtro)+'”</h2>'+cartoes(lista, true)+'</section>';
    return;
  }
  const dest = DESTAQUES.map(id => TUTORIAIS.find(t => t.id === id)).filter(Boolean);
  $('#conteudo').innerHTML =
    (dest.length ? '<section class="secao destaques"><h2 class="secao-titulo">Mais procurados</h2>'+cartoes(dest, true)+'</section>' : '') +
    grupos.map(g => '<section class="secao"><h2 class="secao-titulo"><span class="ic">'+ic(g)+'</span>'+esc(g)+'</h2>'+cartoes(TUTORIAIS.filter(t=>t.grupo===g))+'</section>').join('');
}
function tutorial(t){
  document.body.classList.add('lendo');
  menu(t.id);
  const i = TUTORIAIS.indexOf(t), ant = TUTORIAIS[i-1], prox = TUTORIAIS[i+1];
  $('#conteudo').innerHTML = '<article class="tutorial">'
   + '<a class="voltar" href="#">← Todos os tutoriais</a>'
   + '<div class="cab-tut"><div class="ic">'+ic(t.grupo)+'</div><div><small>'+esc(t.grupo)+' · '+passosCom(t)+'</small><h2>'+esc(t.titulo)+'</h2><p class="resumo">'+esc(t.resumo)+'</p></div></div>'
   + (t.video ? '<div class="video"><video controls preload="none" playsinline'+(t.capa?' poster="'+t.capa+'"':'')+' src="'+t.video+'"></video><small>Assista ao vídeo com narração ou siga os passos com imagens logo abaixo.</small></div>' : '')
   + (t.antes ? '<div class="antes"><b>Antes de começar:</b> '+esc(t.antes)+'</div>' : '')
   + '<div class="indice"><b>Neste tutorial</b><ol>'+t.passos.map((p,n)=>'<li><a href="#'+t.id+'/'+(n+1)+'">'+esc(p.titulo)+'</a></li>').join('')+'</ol></div>'
   + t.passos.map((p,n) => '<section class="passo" id="p'+(n+1)+'"><div class="passo-topo"><div class="num">'+(n+1)+'</div><div>'
      + '<h3>'+esc(p.titulo)+'</h3><p>'+esc(p.texto)+'</p></div></div>'
      + (p.img ? '<img loading="lazy" src="'+p.img+'" alt="Passo '+(n+1)+': '+esc(p.titulo)+'">' : p.semPrint ? '' : '<div class="sem-img">Imagem deste passo ainda não capturada.</div>')
      + (p.atencao ? '<div class="caixa aten">'+SVG_ATEN+'<div><b>Atenção:</b> '+esc(p.atencao)+'</div></div>' : '')
      + (p.dica ? '<div class="caixa dica">'+SVG_DICA+'<div><b>Dica:</b> '+esc(p.dica)+'</div></div>' : '')
      + '</section>').join('')
   + '<div class="fim"><div class="ok">'+SVG_OK+'</div><b>Pronto!</b><span>Ficou com dúvida? Fale com o suporte da Thiago Informática.</span></div>'
   + '<div class="nav-tut">'+(ant?'<a href="#'+ant.id+'">← '+esc(ant.titulo)+'</a>':'<span></span>')+(prox?'<a href="#'+prox.id+'">'+esc(prox.titulo)+' →</a>':'')+'</div>'
   + '</article>';
}
function rota(){
  const [id, passo] = location.hash.slice(1).split('/');
  const t = TUTORIAIS.find(x => x.id === id);
  if (t) { tutorial(t); const alvo = passo && document.getElementById('p'+passo); alvo ? alvo.scrollIntoView() : scrollTo(0,0); }
  else inicio($('#busca').value);
}
$('#busca').addEventListener('input', e => { if (location.hash) history.replaceState(null,'',location.pathname); inicio(e.target.value); });
document.querySelectorAll('.chips button').forEach(b => b.addEventListener('click', () => { $('#busca').value = b.dataset.q; if (location.hash) history.replaceState(null,'',location.pathname); inicio(b.dataset.q); $('#conteudo').scrollIntoView(); }));
$('#conteudo').addEventListener('click', e => { if (e.target.matches('.passo img')) { $('#zoom img').src = e.target.src; $('#zoom').style.display = 'flex'; } });
$('#zoom').addEventListener('click', () => $('#zoom').style.display = 'none');
addEventListener('keydown', e => { if (e.key === 'Escape') $('#zoom').style.display = 'none'; });
addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
